name: DSIR H-EFTCAMB designer-fR AP-zero audit v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eftcamb-fr-ap-zero-audit-v0-1.yml'
      - 'ci/eftcamb_ap_zero_audit_v0_1.py'
      - 'src/dsir/ap_operator.py'
      - 'experiments/038_eftcamb_fr_ap_zero_audit_v0_1.md'

permissions:
  contents: read
  actions: read

jobs:
  eftcamb-fr-ap-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DSIR and H-EFTCAMB toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y git gfortran gcc make liblapack-dev libblas-dev
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Download exact frozen C5 configuration artifact
        uses: actions/download-artifact@v4
        with:
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32759477319
          name: eftcamb-mgs1-hard-92350bb5087d17c874626c75b96779ae264dd1f6
          path: inputs/c5
      - name: Clone and build pinned H-EFTCAMB
        run: |
          git clone --recursive https://github.com/EFTCAMB/EFTCAMB.git eftcamb
          cd eftcamb
          git checkout 16d9c4e9f85751e30efd0a53b177941713078904
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../eftcamb_exp038_upstream_sha.txt
          cd fortran
          make camb
      - name: Restore exact frozen high-precision DSIR C5 configs
        run: |
          src=inputs/c5/eftcamb/fortran/eftcamb_test/parameters
          dst=eftcamb/fortran/eftcamb_test/parameters
          for tok in base gr b0 b1em7 b1em6 b1em5 b1em4 b1em3; do
            test -f "$src/dsir_mgs1_hp_${tok}.ini"
          done
          cp "$src"/dsir_mgs1_hp_*.ini "$dst"/
          grep -Eq '^EFTCAMB_write_background[[:space:]]*=[[:space:]]*T' "$dst/dsir_mgs1_hp_base.ini"
          grep -Eq '^EFTwDE[[:space:]]*=[[:space:]]*0' "$dst/dsir_mgs1_hp_b1em3.ini"
      - name: Run same-solver GR and frozen high-precision designer manifold
        working-directory: eftcamb/fortran
        run: |
          set -o pipefail
          mkdir -p eftcamb_test/results/spectra_results
          ./camb eftcamb_test/parameters/dsir_mgs1_hp_gr.ini 2>&1 | tee ../../exp038_gr.log
          for tok in b0 b1em7 b1em6 b1em5 b1em4 b1em3; do
            ./camb "eftcamb_test/parameters/dsir_mgs1_hp_${tok}.ini" 2>&1 | tee "../../exp038_${tok}.log"
          done
      - name: Require stable designer runs and background files
        run: |
          for tok in b0 b1em7 b1em6 b1em5 b1em4 b1em3; do
            grep -q 'EFTCAMB: theory stable' "exp038_${tok}.log"
            if grep -q 'ERROR STOP' "exp038_${tok}.log"; then
              echo "unexpected solver error for ${tok}"
              exit 2
            fi
          done
          root=eftcamb/fortran/eftcamb_test/results/spectra_results
          test -f "$root/dsir_mgs1_hp_gr_background.dat"
          for tok in b0 b1em7 b1em6 b1em5 b1em4 b1em3; do
            test -f "$root/dsir_mgs1_hp_${tok}_background.dat"
          done
      - name: Run Experiment 038 hard audit
        run: |
          python ci/eftcamb_ap_zero_audit_v0_1.py \
            --background-root eftcamb/fortran/eftcamb_test/results/spectra_results \
            --parameter-root eftcamb/fortran/eftcamb_test/parameters \
            --json eftcamb_fr_ap_zero_audit_v0_1.json
      - name: Upload Experiment 038 result and preserved backgrounds
        uses: actions/upload-artifact@v4
        with:
          name: eftcamb-fr-ap-zero-audit-v0-1-${{ github.sha }}
          path: |
            eftcamb_fr_ap_zero_audit_v0_1.json
            eftcamb_exp038_upstream_sha.txt
            exp038_*.log
            eftcamb/fortran/eftcamb_test/parameters/dsir_mgs1_hp_*.ini
            eftcamb/fortran/eftcamb_test/results/spectra_results/dsir_mgs1_hp_*background.dat
          if-no-files-found: error
