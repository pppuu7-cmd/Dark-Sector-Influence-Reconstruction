name: layerb-16385-32769-coarse-recovery-v0-1

on:
  push:
    branches: [main]
    paths:
      - 'docs/dsir4/launch/LAYERB_16385_32769_COARSE_RECOVERY_LAUNCH_V0_1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: layerb-16385-32769-coarse-recovery-v0-1
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CONTRACT: docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_1.json
  CONTRACT_BLOB: '480e5a76c66a7c0fcaa58564910150abea624899'
  FAILURE_AUTH: docs/dsir4/authority/LAYERB_16385_32769_INITIAL_PRODUCTION_INFRA_FAILURE_V0_1.json
  RESOURCE16385: docs/dsir4/authority/CLASSIV_HISTORY_SUPPRESSED_16385_DUAL_RESOURCE_PILOT_V0_1.json
  PRODUCTION_CONTRACT: docs/dsir4/contracts/LAYERB_16385_TO_32769_CHUNK_PRODUCTION_CONTRACT_V0_1.json
  TERMINAL_CONTRACT: docs/dsir4/contracts/LAYERB_16385_TO_32769_CHUNK_TERMINAL_RESULT_CONTRACT_V0_1.json
  V141: docs/dsir4/authority/LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_V0_3.json
  V142: docs/dsir4/authority/LAYERB_32769_EIGHT_CHUNK_RESPONSE_BLIND_RESOURCE_PILOT_V0_1.json
  V143: docs/dsir4/authority/LAYERB_32769_BLINDED_PARTITION_INVARIANCE_V0_1.json
  PARENT_REFINEMENT: docs/dsir4/authority/LAYERB_CANONICAL_8193_TO_16385_NOT_CONVERGED_V0_1.json
  REQUEST_PLAN_AUTH: docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json
  CANON32769_AUTH: docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_32769_V0_1.json
  MANIFEST: docs/dsir4/authority/EXP073IM_C2_REAL_INPUT_MANIFEST_V0_4.json
  COARSE_CANONICAL: docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt
  FINE_CANONICAL: docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt
  BASELINE: configs/dsir4/c2/ide0_reference_v0_1.ini
  PRECISION: configs/dsir4/c2/dsir_ide_p8_v0_1.pre
  CLASS_COMMIT: ac627d54e9ce196a08878d1ba33999819925d19c
  ORIGINAL_RUN_ID: '34695347893'
  ORIGINAL_AUTH_ARTIFACT: '10298499340'
  ORIGINAL_PLAN_ARTIFACT: '10298655751'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed static recovery audit and one-run authorization
        run: |
          set -euo pipefail
          mkdir -p safe/plan
          test "$(git hash-object "$CONTRACT")" = "$CONTRACT_BLOB"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          c=json.load(open('docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_1.json'))
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          assert c['schema']=='LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_1'
          assert blob(c['initial_failure_authority']['path'])==c['initial_failure_authority']['git_blob']
          f=json.load(open(c['initial_failure_authority']['path'])); assert f['terminal_scientific_classification_created'] is False and f['scientific_failure_established'] is False
          assert blob(c['history_suppressed_resource_authority']['path'])==c['history_suppressed_resource_authority']['git_blob']
          r=json.load(open(c['history_suppressed_resource_authority']['path'])); assert r['artifact_verified_independently'] is True and r['resource_feasibility_pass'] is True
          assert blob(c['history_suppression_patch']['path'])==c['history_suppression_patch']['git_blob']
          assert c['history_suppression_patch']['scientific_parameters_changed'] is False and c['history_suppression_patch']['k_output_values_still_inserted_into_solver_grid'] is True
          assert blob(c['recovery_classifier_wrapper']['path'])==c['recovery_classifier_wrapper']['git_blob']
          for s in c['frozen_original_sources'].values(): assert blob(s['path'])==s['git_blob'],s['path']
          sci=c['scientific_semantics']; assert sci['relative_tolerance']==0.001 and sci['strict_less_than'] is True and sci['h']==0.0001 and sci['native_k_per_decade_for_pk']==20.0 and sci['lookup_relative_tolerance']==1e-12
          assert sci['covariance_restriction_authorized'] is False and sci['Wm_S3_opened'] is False
          assert c['retained_fine_invariants']['fine_recompute_forbidden'] is True and c['provenance_rebind']['scientific_response_values_may_not_be_modified'] is True
          assert c['coarse_recompute']['parallel_jobs']==4 and c['coarse_recompute']['history_suppression_required'] is True
          PY
          python3 -m py_compile ci/layerb_16385_to_32769_canonical_chunk_recovery_v0_1.py ci/layerb_16385_32769_chunk_role_operand_v0_1.py ci/layerb_16385_to_32769_chunk_terminal_consumer_v0_1.py
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/layerb-16385-32769-coarse-recovery-v0-1.yml/runs?per_page=100" > safe/recovery_runs.json
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          run=int(os.environ['GITHUB_RUN_ID']); d=json.load(open('safe/recovery_runs.json')); rows=d['workflow_runs']
          current=[x for x in rows if int(x['id'])==run]
          others=[x for x in rows if int(x['id'])!=run]
          live=[x for x in others if x['status'] in ('queued','in_progress','waiting','pending')]
          assert len(current)==1 and len(live)==0 and len(others)==0, (len(current),len(live),len(others))
          guard={'schema':'LAYERB_32769_CHUNK_ONE_LIVE_GUARD_V0_1','effect':'+0/+0','classification':'LAYERB_32769_CHUNK_ONE_LIVE_GUARD_PASS_PLUS_0_PLUS_0','guard_pass':True,'errors':[],'current_run_id':run,'production_workflow_path':'.github/workflows/layerb-16385-to-32769-canonical-chunk-scientific-v0-1.yml','recovery_workflow_path':'.github/workflows/layerb-16385-32769-coarse-recovery-v0-1.yml','matching_current_runs':1,'matching_other_live_authoritative_runs':0,'matching_other_all_status_runs':0,'scientific_response_read':False,'scientific_execution_authorized':False,'scientific_authority_created':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'token':'LAYERB_32769_CHUNK_ONE_LIVE_GUARD_PASS_PLUS_0_PLUS_0'}
          Path('safe/guard.json').write_text(json.dumps(guard,indent=2,sort_keys=True)+'\n')
          v142=Path('docs/dsir4/authority/LAYERB_32769_EIGHT_CHUNK_RESPONSE_BLIND_RESOURCE_PILOT_V0_1.json').read_bytes()
          g=Path('safe/guard.json').read_bytes()
          auth={'schema':'LAYERB_16385_TO_32769_CHUNK_ONE_RUN_AUTHORIZATION_V0_1','effect':'+0/+0','classification':'LAYERB_16385_TO_32769_CHUNK_ONE_RUN_AUTHORIZED_PLUS_0_PLUS_0','execution_authorized':True,'authorized_canonical_run_count':1,'current_run_id':run,'production_workflow_path':'.github/workflows/layerb-16385-to-32769-canonical-chunk-scientific-v0-1.yml','recovery_workflow_path':'.github/workflows/layerb-16385-32769-coarse-recovery-v0-1.yml','scientific_response_persistence_authorized':True,'scientific_result_classification_authorized':True,'relative_tolerance':0.001,'strict_less_than':True,'h':0.0001,'native_k_per_decade_for_pk':20.0,'guard_json_sha256':hashlib.sha256(g).hexdigest(),'authority_bindings_observed':{'v142_resource':{'sha256':hashlib.sha256(v142).hexdigest()}},'errors':[],'scientific_authority_created':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'recovery_authorized':True,'fine_recompute_authorized':False,'coarse_recompute_authorized':True,'token':'LAYERB_16385_TO_32769_CHUNK_ONE_RUN_AUTHORIZED_PLUS_0_PLUS_0'}
          Path('safe/authorization.json').write_text(json.dumps(auth,indent=2,sort_keys=True)+'\n')
          PY
      - name: Recover exact original response-blind plan
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORIGINAL_PLAN_ARTIFACT}/zip" > safe/plan.zip
          test "$(sha256sum safe/plan.zip | awk '{print $1}')" = '9b8bdcf03cb05bc979e8c72135acac92232864a74dc1d510b579d8efb5cbb2a7'
          unzip -q safe/plan.zip -d safe/plan
          test "$(sha256sum safe/plan/plan.json | awk '{print $1}')" = 'c12bdb2a407de3f9e2c0c410719ae604d9b3516dabb76c9b1598340418ee8064'
          python3 - <<'PY'
          import json
          d=json.load(open('safe/plan/plan.json')); assert d['coarse_call_count']==441 and d['fine_call_count']==569 and d['scientific_response_read'] is False and d['class_solver_invoked'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-16385-32769-recovery-control-v0-1
          path: |
            safe/authorization.json
            safe/guard.json
            safe/plan/plan.json
          if-no-files-found: error
          retention-days: 90

  coarse-role:
    needs: [preflight]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: [reference, alpha_minus, beta_plus, beta_minus]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: layerb-16385-32769-recovery-control-v0-1
          path: inputs/control
      - name: Install isolated CLASS stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libgsl-dev >/dev/null
          python3 -m venv .venv_acq
          .venv_acq/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv_acq/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
      - name: Build exact 16385 envelope with proven history suppression
        run: |
          set -euo pipefail
          mkdir -p safe
          git clone -q https://github.com/kaeonikc/class_iv.git external_class
          git -C external_class checkout -q "$CLASS_COMMIT"
          .venv_acq/bin/python - <<'PY'
          from pathlib import Path
          p=Path('external_class/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 16385',1))
          q=Path('external_class/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 524288',1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv_acq/bin:$PATH" .venv_acq/bin/python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external_class
          PATH="$GITHUB_WORKSPACE/.venv_acq/bin:$PATH" .venv_acq/bin/python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external_class
          .venv_acq/bin/python scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py external_class safe/history_patch.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/history_patch.json')); assert d['post_sha256']=='4e9a419d46471ffab74df3d14239e000bf92f2e198edad4d2c7b82f1335f7a4b' and d['scientific_parameters_changed'] is False and d['k_output_values_still_inserted_into_solver_grid'] is True
          from pathlib import Path
          p=Path('external_class/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv_acq/bin:$PATH" make -C external_class -j2 all >/dev/null
      - name: Verify runtime binding and acquire coarse operand
        run: |
          set -euo pipefail
          CLASSY=$(.venv_acq/bin/python -c 'import classy; print(classy.__file__)')
          python3 - "$CLASSY" <<'PY' > safe/runtime_binding.json
          import hashlib,json,re,sys
          from pathlib import Path
          f=Path(sys.argv[1]).resolve(); root=Path.cwd().resolve()
          def macro(p,n):
              m=re.search(r'^\s*#define\s+'+re.escape(n)+r'\s+(\d+)\b',Path(p).read_text(),re.M); return int(m.group(1)) if m else None
          d={'schema':'LAYERB_COARSE_RECOVERY_RUNTIME_BINDING_V0_1','role':'${{ matrix.role }}','classy_sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'import_under_expected_venv':str(f).startswith(str(root/'.venv_acq')+'/'),'point_capacity':macro('external_class/include/perturbations.h','_MAX_NUMBER_OF_K_FILES_'),'parser_capacity':macro('external_class/include/parser.h','_ARGUMENT_LENGTH_MAX_'),'history_suppression':True}
          d['pass']=d['import_under_expected_venv'] and d['point_capacity']==16385 and d['parser_capacity']==524288
          print(json.dumps(d,sort_keys=True)); raise SystemExit(0 if d['pass'] else 73)
          PY
          /usr/bin/time -v -o safe/time.txt .venv_acq/bin/python ci/layerb_16385_32769_chunk_role_operand_v0_1.py --role '${{ matrix.role }}' --grid coarse --authorization inputs/control/authorization.json --current-run-id "$GITHUB_RUN_ID" --plan inputs/control/plan.json --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py --canonical "$COARSE_CANONICAL" --baseline "$BASELINE" --precision "$PRECISION" --out safe/operand.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/operand.json')); assert d['grid']=='coarse' and d['role']=='${{ matrix.role }}' and d['solver_constructions']==1 and d['convergence_metric_computed'] is False and d['scientific_classification_computed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-recovery-coarse-${{ matrix.role }}-v0-1
          path: safe/
          if-no-files-found: error
          retention-days: 90

  final-classifier:
    needs: [preflight, coarse-role]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: layerb-16385-32769-recovery-control-v0-1
          path: inputs/control
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-recovery-coarse-*-v0-1
          path: inputs/operands
      - name: Recover and provenance-rebind exact successful fine operands without modifying responses
        run: |
          set -euo pipefail
          mkdir -p inputs/original_fine
          python3 - <<'PY'
          import json
          c=json.load(open('docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_1.json'))
          for role,s in c['retained_fine_operands'].items(): print(role,s['artifact_id'],s['zip_sha256'],s['operand_json_sha256'])
          PY
          while read -r role id zsha osha; do
            mkdir -p "inputs/original_fine/$role" "inputs/operands/fine-$role"
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "inputs/original_fine/$role.zip"
            test "$(sha256sum "inputs/original_fine/$role.zip" | awk '{print $1}')" = "$zsha"
            unzip -q "inputs/original_fine/$role.zip" -d "inputs/original_fine/$role"
            test "$(sha256sum "inputs/original_fine/$role/operand.json" | awk '{print $1}')" = "$osha"
          done < <(python3 - <<'PY'
          import json
          c=json.load(open('docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_1.json'))
          for role,s in c['retained_fine_operands'].items(): print(role,s['artifact_id'],s['zip_sha256'],s['operand_json_sha256'])
          PY
          )
          python3 - <<'PY'
          import json,hashlib,os,copy
          from pathlib import Path
          c=json.load(open('docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_1.json'))
          authb=Path('inputs/control/authorization.json').read_bytes(); authsha=hashlib.sha256(authb).hexdigest(); run=int(os.environ['GITHUB_RUN_ID'])
          for role,s in c['retained_fine_operands'].items():
              p=Path('inputs/original_fine')/role/'operand.json'; raw=p.read_bytes(); d=json.loads(raw)
              assert hashlib.sha256(raw).hexdigest()==s['operand_json_sha256']
              assert d['role']==role and d['grid']=='fine' and d['current_run_id']==34695347893 and d['authorization_json_sha256']==c['retained_fine_invariants']['original_authorization_json_sha256']
              assert d['canonical_node_sha256']==c['retained_fine_invariants']['canonical_node_sha256'] and d['calls_digest']==c['retained_fine_invariants']['calls_digest']
              payload=json.dumps({'responses':d['responses_f8_b64'],'valids':d['valid_masks_packbits_b64']},separators=(',',':'),sort_keys=True).encode(); before=hashlib.sha256(payload).hexdigest()
              q=copy.deepcopy(d); q['current_run_id']=run; q['authorization_json_sha256']=authsha; q['recovery_provenance_rebind_only']=True; q['recovery_original_run_id']=34695347893; q['recovery_original_operand_sha256']=s['operand_json_sha256']; q['recovery_response_payload_sha256']=before
              payload2=json.dumps({'responses':q['responses_f8_b64'],'valids':q['valid_masks_packbits_b64']},separators=(',',':'),sort_keys=True).encode(); assert hashlib.sha256(payload2).hexdigest()==before
              out=Path('inputs/operands')/('fine-'+role)/'operand.json'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(q,separators=(',',':'),sort_keys=True)+'\n')
          PY
      - name: Install and prepare frozen replay inputs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libgsl-dev >/dev/null
          python3 -m venv .venv_final
          .venv_final/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv_final/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null
          PYTHON_BIN="$GITHUB_WORKSPACE/.venv_final/bin/python" bash scripts/dsir4/prepare_layerb_chunk_science_inputs_v0_1.sh
      - name: Run unchanged frozen science classifier with recovery provenance wrapper
        env:
          DSIR_CHUNK_OPERANDS_ROOT: '${{ github.workspace }}/inputs/operands'
          DSIR_CHUNK_PLAN: '${{ github.workspace }}/inputs/control/plan.json'
        run: |
          set -euo pipefail
          mkdir -p artifacts scratch_final
          .venv_final/bin/python ci/layerb_16385_to_32769_canonical_chunk_recovery_v0_1.py --current-run-id "$GITHUB_RUN_ID" --parent-refinement-authority "$PARENT_REFINEMENT" --class-build-authority "$V143" --canonical-32769-authority "$CANON32769_AUTH" --resource-authority "$V142" --one-live-guard inputs/control/guard.json --one-run-authorization inputs/control/authorization.json --recovered-jl-script ci/layerb_16385_32769_chunk_operand_adapter_v0_1.py --ir-script ci/exp073ir_article3_real_layerb_common_response_v0_1.py --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py --request-plan-script ci/recovered_exp073jl_response_blind_request_plan_audit_v0_1.py --request-plan-authority "$REQUEST_PLAN_AUTH" --parent-root inputs/parent --parent-authority docs/dsir4/authority/EXP073IQ_ARTICLE3_REAL_LAYERA_SUPPORT_PASS_V0_1.json --manifest "$MANIFEST" --angular-root inputs/angular --expim-root inputs/expim --boss-root external/exp073w_boss --source external/des_nz/source.fits --lens external/des_nz/lens.fits --camb-root external/camb --expz2-script ci/exp073z2_article3_des_radial_kernel_stable_direct_v0_2.py --exp073iq-script ci/exp073iq_article3_real_layera_support_v0_1.py --baseline "$BASELINE" --precision "$PRECISION" --coarse "$COARSE_CANONICAL" --fine "$FINE_CANONICAL" --capacity-patch-record "$PRODUCTION_CONTRACT" --scratch scratch_final --out artifacts/science_result.json
          .venv_final/bin/python ci/layerb_16385_to_32769_chunk_terminal_consumer_v0_1.py --result artifacts/science_result.json --contract "$TERMINAL_CONTRACT" --authorization inputs/control/authorization.json --v141-authority "$V141" --v142-authority "$V142" --v143-authority "$V143" --out artifacts/terminal_candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-16385-32769-coarse-recovery-terminal-v0-1
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce terminal result only after evidence upload
        run: |
          python3 - <<'PY'
          import json
          t=json.load(open('artifacts/terminal_candidate.json')); r=json.load(open('artifacts/science_result.json'))
          assert t['terminal_science_valid'] is True and t['errors']==[]
          assert r['classification'] in ('COMMON_GRID_NEXT_REFINEMENT_CONVERGED_PLUS_0_PLUS_0','COMMON_GRID_NEXT_REFINEMENT_NOT_CONVERGED_PLUS_0_PLUS_0')
          assert r['fine_operands_recomputed'] is False and r['coarse_history_suppression_scientific_parameters_changed'] is False
          PY

  independent-terminal-verifier:
    needs: [final-classifier]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: layerb-16385-32769-coarse-recovery-terminal-v0-1
          path: inputs/terminal
      - uses: actions/download-artifact@v4
        with:
          name: layerb-16385-32769-recovery-control-v0-1
          path: inputs/control
      - name: Independently reclassify frozen terminal science
        run: |
          set -euo pipefail
          mkdir -p independent
          python3 ci/layerb_16385_to_32769_chunk_terminal_consumer_v0_1.py --result inputs/terminal/science_result.json --contract "$TERMINAL_CONTRACT" --authorization inputs/control/authorization.json --v141-authority "$V141" --v142-authority "$V142" --v143-authority "$V143" --out independent/terminal_independent.json
          python3 - <<'PY'
          import json
          d=json.load(open('independent/terminal_independent.json')); assert d['terminal_science_valid'] is True and d['errors']==[] and d['scientific_authority_created'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-16385-32769-coarse-recovery-independent-terminal-v0-1
          path: independent/terminal_independent.json
          if-no-files-found: error
          retention-days: 90
