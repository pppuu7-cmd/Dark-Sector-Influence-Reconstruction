name: Exp073FU pruner namespace repair static audit v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exp073fu-pruner-namespace-repair-static-audit-v0-1.yml'
      - 'ci/exp073fu_verify_and_prune_replica_v0_2.py'
      - 'ci/audit_exp073fu_pruner_namespace_repair_v0_1.py'

permissions:
  contents: read

jobs:
  hosted-static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit infrastructure-only namespace repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/exp073fu_verify_and_prune_replica_v0_2.py ci/audit_exp073fu_pruner_namespace_repair_v0_1.py
          python3 ci/audit_exp073fu_pruner_namespace_repair_v0_1.py
