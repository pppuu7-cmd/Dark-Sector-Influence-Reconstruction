name: DSIR GDM density-velocity transfer exploration v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gdm-density-velocity-transfer-exploration-v0-1.yml'
      - 'ci/gdm_density_velocity_gauge_bridge_v0_2.py'
      - 'experiments/042_gdm_density_velocity_transfer_exploration_v0_1.md'
      - 'data/derived/observational_whitening/experiment_042_gdm_density_velocity_gauge_bridge_v0_2.json'
      - 'docs/SCIENTIFIC_FINDINGS_REGISTER.md'
      - 'docs/STATUS.md'
      - 'docs/RECOVERY_LATEST.md'
      - 'docs/RECOVERY_MANUAL.md'
      - 'docs/RESEARCH_LOG_OBSERVATIONAL_2026-08-25.md'

permissions:
  contents: read
  actions: read

jobs:
  gdm-density-velocity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc make
          python -m pip install --upgrade pip
          python -m pip install numpy
      - name: Download exact frozen C3 manifold artifact
        uses: actions/download-artifact@v4
        with:
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32759738560
          name: gdm-cv2-manifold-15c7128d4220b954783a8ba7cce7c06744f7f0ac
          path: inputs/c3
      - name: Clone and build pinned GDM_CLASS binary
        run: |
          git clone https://github.com/s-ilic/gdm_class_public.git gdm_class
          cd gdm_class
          git checkout 4c87916aab5ca124a68f1dd16f31846fc13d1829
          git rev-parse HEAD | tee ../exp042_upstream_sha.txt
          make -j2 class
          test -x class
          grep -Fq 'Nbody gauge transfer functions' source/input.c
          grep -Fq 'We need to compute the derivative of H_T_Nb_prime numerically' source/perturbations.c
      - name: Prepare exact frozen synchronous and Newtonian configs
        run: |
          mkdir -p exp042_sync/outputs exp042_newtonian/outputs
          cp inputs/c3/external_gdm/dsir_p8.pre exp042_sync/
          cp inputs/c3/external_gdm/dsir_p8.pre exp042_newtonian/
          for tok in gdm0 gdmcs2_1em8 gdmcs2_1em7 gdmcs2_1em6 gdmcv2_1em8 gdmcv2_1em7 gdmcv2_1em6 gdmcv2_1em5 gdmcv2_1em4; do
            test -f "inputs/c3/external_gdm/${tok}.ini"
            cp "inputs/c3/external_gdm/${tok}.ini" "exp042_sync/${tok}.ini"
            cp "inputs/c3/external_gdm/${tok}.ini" "exp042_newtonian/${tok}.ini"
          done
          python - <<'PY'
          from pathlib import Path
          tokens = [
              'gdm0','gdmcs2_1em8','gdmcs2_1em7','gdmcs2_1em6',
              'gdmcv2_1em8','gdmcv2_1em7','gdmcv2_1em6','gdmcv2_1em5','gdmcv2_1em4'
          ]
          for tok in tokens:
              for directory, gauge in [('exp042_sync','synchronous'), ('exp042_newtonian','newtonian')]:
                  p = Path(directory) / f'{tok}.ini'
                  s = p.read_text()
                  old_output = 'output = mPk'
                  old_root = f'root = cv2_outputs/{tok}_'
                  if s.count(old_output) != 1 or s.count(old_root) != 1:
                      raise SystemExit(f'unexpected frozen config structure for {directory}/{tok}')
                  s = s.replace(old_output, 'output = mPk,mTk,vTk')
                  s = s.replace(old_root, f'root = outputs/{tok}_')
                  if gauge == 'newtonian':
                      if s.count('gauge = synchronous') != 1:
                          raise SystemExit(f'missing frozen synchronous gauge line for {tok}')
                      s = s.replace('gauge = synchronous', 'gauge = newtonian')
                  p.write_text(s)
          PY
          grep -R '^gauge = synchronous$' exp042_sync/*.ini | wc -l | grep -qx '9'
          grep -R '^gauge = newtonian$' exp042_newtonian/*.ini | wc -l | grep -qx '9'
      - name: Run frozen synchronous transfer diagnostics
        working-directory: exp042_sync
        run: |
          set -o pipefail
          for tok in gdm0 gdmcs2_1em8 gdmcs2_1em7 gdmcs2_1em6 gdmcv2_1em8 gdmcv2_1em7 gdmcv2_1em6 gdmcv2_1em5 gdmcv2_1em4; do
            ../gdm_class/class "${tok}.ini" dsir_p8.pre 2>&1 | tee "../exp042_sync_${tok}.log"
          done
      - name: Run same frozen manifold in Newtonian gauge
        working-directory: exp042_newtonian
        run: |
          set -o pipefail
          for tok in gdm0 gdmcs2_1em8 gdmcs2_1em7 gdmcs2_1em6 gdmcv2_1em8 gdmcv2_1em7 gdmcv2_1em6 gdmcv2_1em5 gdmcv2_1em4; do
            ../gdm_class/class "${tok}.ini" dsir_p8.pre 2>&1 | tee "../exp042_newtonian_${tok}.log"
          done
      - name: Require complete synchronous and Newtonian outputs
        run: |
          for directory in exp042_sync exp042_newtonian; do
            root="$directory/outputs"
            for tok in gdm0 gdmcs2_1em8 gdmcs2_1em7 gdmcs2_1em6 gdmcv2_1em8 gdmcv2_1em7 gdmcv2_1em6 gdmcv2_1em5 gdmcv2_1em4; do
              test -f "$root/${tok}_background.dat"
              for zi in 1 2 3 4 5 6 7; do
                test -f "$root/${tok}_z${zi}_pk.dat"
                test -f "$root/${tok}_z${zi}_tk.dat"
              done
            done
          done
          head -n 12 exp042_sync/outputs/gdmcs2_1em6_z1_tk.dat | tee exp042_sync_header_sample.txt
          head -n 12 exp042_newtonian/outputs/gdmcs2_1em6_z1_tk.dat | tee exp042_newtonian_header_sample.txt
      - name: Run frozen gauge bridge and exploratory velocity analysis
        run: |
          python ci/gdm_density_velocity_gauge_bridge_v0_2.py \
            --sync-root exp042_sync/outputs \
            --newtonian-root exp042_newtonian/outputs \
            --json experiment_042_gdm_density_velocity_gauge_bridge_v0_2.json
      - name: Upload Experiment 042 gauge bridge and exploratory handoff
        uses: actions/upload-artifact@v4
        with:
          name: gdm-density-velocity-gauge-bridge-v0-2-${{ github.sha }}
          path: |
            experiment_042_gdm_density_velocity_gauge_bridge_v0_2.json
            exp042_upstream_sha.txt
            exp042_*.log
            exp042_sync_header_sample.txt
            exp042_newtonian_header_sample.txt
            exp042_sync/*.ini
            exp042_sync/dsir_p8.pre
            exp042_sync/outputs/*.dat
            exp042_newtonian/*.ini
            exp042_newtonian/dsir_p8.pre
            exp042_newtonian/outputs/*.dat
          if-no-files-found: error
