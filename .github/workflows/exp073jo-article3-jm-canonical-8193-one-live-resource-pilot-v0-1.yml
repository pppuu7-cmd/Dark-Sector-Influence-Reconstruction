name: exp073jo-article3-jm-canonical-8193-one-live-resource-pilot-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073jo-article3-jm-canonical-8193-one-live-resource-pilot-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp073jo-article3-jm-canonical-8193-one-live-resource-pilot-v0-1
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PREREG_BLOB: '75a9076573d5b168a4ad072c0a43d5d42a3d7642'
  HELPER_BLOB: 'c975a964805919cd61e3c028305ad3945773377f'
  JL_AUTH_BLOB: 'aca79d6596f49ced9fe9d965059a2352447f13b4'
  JM_STATIC_BLOB: '98e5d43686500ff8044f3197e646364afbf50006'
  CANON_AUTH_BLOB: 'ab25bdc60aa1538ffd5383ce8c43372b2e402406'
  CANON_FILE_BLOB: 'bc9a6e59fb27d7510796c1cb2d5470dfe8a5294b'
  STATIC_AUDIT_BLOB: '5ef079b37031cdd2b73982c45eb36ab705760355'
  JJ_BLOB: 'ee8fd0650a2a1322fab83a86bb06a219e84ca434'
  BUILD_COMPAT_BLOB: 'b7fe663154519b605699c1fd622d0079a5f76772'
  DM_PATCH_BLOB: 'e5afe14eccf531d3e5b9de09b19d34df431a08b9'

jobs:
  canonical-8193-one-live-resource-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce frozen Exp073JO identities and authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073JO_ARTICLE3_JM_CANONICAL_8193_ONE_LIVE_RESOURCE_PILOT_V0_1.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py)" = "$HELPER_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json)" = "$JL_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_V0_2.json)" = "$JM_STATIC_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json)" = "$CANON_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt)" = "$CANON_FILE_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JO_JM_CANONICAL_8193_RESOURCE_PILOT_STATIC_AUDIT_V0_1.json)" = "$STATIC_AUDIT_BLOB"
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = "$JJ_BLOB"
          test "$(git hash-object scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py)" = "$BUILD_COMPAT_BLOB"
          test "$(git hash-object scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py)" = "$DM_PATCH_BLOB"
          test "$(sha256sum configs/dsir4/c2/ide0_reference_v0_1.ini | awk '{print $1}')" = '0a68f4af6ead7ee69c75f1867f60914a40d4f7ff1219b965a0ae38186ca5c65c'
          python3 -m py_compile ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py
          python3 - <<'PY'
          import json
          jl=json.load(open('docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json'))
          assert jl['artifact_verified_independently'] is True
          assert jl['classification']=='COMMON_GRID_THIRD_REFINEMENT_NOT_CONVERGED_PLUS_0_PLUS_0'
          assert jl['jm_branch_activated'] is True and jl['jn_branch_activated'] is False
          jm=json.load(open('docs/dsir4/authority/EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_V0_2.json'))
          assert jm['artifact_verified_independently'] is True
          assert jm['classification']=='EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_PASS_PLUS_0_PLUS_0'
          assert jm['checks_all_pass'] is True and jm['resource_pilot_still_required'] is True
          ca=json.load(open('docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json'))
          assert ca['artifact_verified_independently'] is True
          assert ca['classification']=='CANONICAL_8193_ANCHOR_SELECTED_QUORUM_PASS_PLUS_0_PLUS_0'
          assert ca['requested_node_count']==8193
          assert ca['node_payload_sha256']=='6d35a9d79aa8826554e8e39315ab12a8be1675d32d25a86ec04c978c7723a515'
          assert ca['u64hex_sha256']=='90b9aee9e01784a4af89ab0aa1bd5cbf1e95061f2d412d7a0e1b8ee5332ba7d6'
          sa=json.load(open('docs/dsir4/authority/EXP073JO_JM_CANONICAL_8193_RESOURCE_PILOT_STATIC_AUDIT_V0_1.json'))
          assert sa['artifact_verified_independently'] is True
          assert sa['classification']=='EXP073JO_RESOURCE_PILOT_STATIC_AUDIT_PASS_PLUS_0_PLUS_0'
          assert sa['checks_all_pass'] is True and sa['check_count']==42
          assert sa['class_solver_invoked'] is False and sa['scientific_response_read'] is False
          assert sa['resource_pilot_launch_permitted'] is True
          PY

      - name: Install frozen numerical/build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null

      - name: Checkout, capacity-patch and build exact pinned CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 9216'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 262144'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          rec={'schema':'EXP073JO_CLASSIV_INPUT_CAPACITY_PATCH_V0_1','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','path':'include/perturbations.h','old_capacity':30,'new_capacity':9216,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_path':'include/parser.h','parser_old_argument_capacity':1024,'parser_new_argument_capacity':262144,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost}
          Path('artifacts/capacity_patch.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null

      - name: Execute frozen canonical-8193 resource pilot
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py \
            --jl-authority docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json \
            --jm-static-authority docs/dsir4/authority/EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_V0_2.json \
            --canonical-authority docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json \
            --fine docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --capacity-patch-record artifacts/capacity_patch.json \
            --out artifacts/result.json

      - name: Upload Exp073JO resource result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073jo-jm-canonical-8193-one-live-resource-pilot
          path: |
            artifacts/result.json
            artifacts/capacity_patch.json
          if-no-files-found: error
          retention-days: 90
