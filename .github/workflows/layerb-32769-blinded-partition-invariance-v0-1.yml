name: layerb-32769-blinded-partition-invariance-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-32769-blinded-partition-invariance-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  CONTRACT: docs/dsir4/contracts/LAYERB_32769_BLINDED_PARTITION_INVARIANCE_CONTRACT_V0_1.json
  RESOURCE_AUTHORITY: docs/dsir4/authority/LAYERB_32769_EIGHT_CHUNK_RESPONSE_BLIND_RESOURCE_PILOT_V0_1.json
  METHOD8193_AUTHORITY: docs/dsir4/authority/LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_V0_3.json
  CANONICAL: docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt
  BASELINE: configs/dsir4/c2/ide0_reference_v0_1.ini
  PRECISION: configs/dsir4/c2/dsir_ide_p8_v0_1.pre

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify prospective contract, prerequisite authorities and partition arithmetic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,json,struct
          from pathlib import Path
          c=json.load(open('docs/dsir4/contracts/LAYERB_32769_BLINDED_PARTITION_INVARIANCE_CONTRACT_V0_1.json'))
          r=json.load(open('docs/dsir4/authority/LAYERB_32769_EIGHT_CHUNK_RESPONSE_BLIND_RESOURCE_PILOT_V0_1.json'))
          m=json.load(open('docs/dsir4/authority/LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_V0_3.json'))
          assert r['classification']==c['prerequisites']['required_resource_classification']
          assert m['classification']==c['prerequisites']['required_8193_classification']
          assert c['effect']=='+0/+0' and c['scientific_authority'] is False and c['scientific_execution_authorized'] is False
          assert c['production_16385_to_32769_authorized'] is False and c['covariance_authorized'] is False and c['Wm_S3_authorized'] is False
          assert c['acceptance']['max_normalized_response_difference']==1e-12
          assert c['acceptance']['max_requested_node_coordinate_rel_mismatch']==1e-12
          assert c['acceptance']['post_result_tolerance_change_forbidden'] is True
          assert c['response_blinding']['response_vectors_must_not_be_uploaded'] is True
          assert c['response_blinding']['response_vectors_must_be_deleted_before_artifact_upload'] is True
          assert c['successor_authorized_even_on_pass'] is False
          raw=Path(c['canonical']['path']).read_bytes(); lines=raw.decode().splitlines()
          assert len(lines)==32769 and hashlib.sha256(raw).hexdigest()==c['canonical']['text_sha256']
          nodebytes=b''.join(struct.pack('<Q',int(x,16)) for x in lines)
          assert hashlib.sha256(nodebytes).hexdigest()==c['canonical']['node_payload_sha256']
          nodes=[struct.unpack('<d',struct.pack('<Q',int(x,16)))[0] for x in lines]
          def audit(part):
              slices=[tuple(x) for x in c[part]['slices']]
              cursor=0
              for lo,hi in slices:
                  assert lo==cursor and lo<hi<=32769
                  assert hi-lo<=c['frozen_runtime']['point_capacity']
                  payload=len(','.join(format(float(x),'.17g') for x in nodes[lo:hi]).encode())+1
                  assert payload<=c['frozen_runtime']['parser_capacity'],(part,lo,hi,payload)
                  cursor=hi
              assert cursor==32769
          audit('partition_A'); audit('partition_B')
          def git_blob(path):
              b=Path(path).read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert git_blob('ci/layerb_32769_partition_transient_response_dump_v0_1.py')=='d7f125e5eccc330bf519890256941488b131fc4a'
          assert git_blob('ci/layerb_32769_partition_invariance_compare_v0_1.py')=='e58a7d7ed144b110425bf497d4048e302e9927dd'
          tree=ast.parse(Path('ci/layerb_32769_partition_invariance_compare_v0_1.py').read_text())
          assert not any(isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=='get_transfer' for n in ast.walk(tree))
          print('LAYERB_32769_BLINDED_PARTITION_INVARIANCE_STATIC_PASS_PLUS_0_PLUS_0')
          PY

  role-partition-invariance:
    needs: [static-audit]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: [reference, alpha_minus, beta_plus, beta_minus]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libgsl-dev >/dev/null
          python3 -m venv .venv_partition32769
          .venv_partition32769/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv_partition32769/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
      - name: Build frozen low-capacity CLASS
        run: |
          set -euo pipefail
          git clone -q https://github.com/kaeonikc/class_iv.git external_partition32769
          git -C external_partition32769 checkout -q "$CLASS_COMMIT"
          .venv_partition32769/bin/python - <<'PY'
          from pathlib import Path
          p=Path('external_partition32769/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 4608',1))
          q=Path('external_partition32769/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 131072',1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv_partition32769/bin:$PATH" .venv_partition32769/bin/python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external_partition32769
          PATH="$GITHUB_WORKSPACE/.venv_partition32769/bin:$PATH" .venv_partition32769/bin/python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external_partition32769
          .venv_partition32769/bin/python - <<'PY'
          from pathlib import Path
          p=Path('external_partition32769/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv_partition32769/bin:$PATH" make -C external_partition32769 -j2 all >/dev/null
      - name: Verify binding and create safe receipt
        run: |
          set -euo pipefail
          mkdir -p safe transient/A transient/B
          CLASSY=$(.venv_partition32769/bin/python -c 'import classy; print(classy.__file__)')
          .venv_partition32769/bin/python - "$CLASSY" <<'PY'
          import hashlib,json,re,sys
          from pathlib import Path
          root=Path.cwd().resolve(); f=Path(sys.argv[1]).resolve()
          def macro(path,name):
              m=re.search(r'^\s*#define\s+'+re.escape(name)+r'\s+(\d+)\b',Path(path).read_text(),re.M)
              return int(m.group(1)) if m else None
          d={'schema':'LAYERB_32769_PARTITION_INVARIANCE_RUNTIME_BINDING_V0_1','effect':'+0/+0','role':'${{ matrix.role }}','classy_file':str(f),'import_under_expected_venv':str(f).startswith(str(root/'.venv_partition32769')+'/'),'point_capacity':macro('external_partition32769/include/perturbations.h','_MAX_NUMBER_OF_K_FILES_'),'parser_capacity':macro('external_partition32769/include/parser.h','_ARGUMENT_LENGTH_MAX_'),'classy_sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'scientific_authority':False,'scientific_execution_authorized':False,'production_16385_to_32769_authorized':False}
          d['pass']=d['import_under_expected_venv'] and d['point_capacity']==4608 and d['parser_capacity']==131072
          Path('safe/runtime_binding.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,sort_keys=True)); raise SystemExit(0 if d['pass'] else 73)
          PY
      - name: Compute transient partition A responses
        run: |
          set -euo pipefail
          i=0
          for spec in '0 4097' '4097 8193' '8193 12289' '12289 16385' '16385 20481' '20481 24577' '24577 28673' '28673 32769'; do
            set -- $spec
            .venv_partition32769/bin/python ci/layerb_32769_partition_transient_response_dump_v0_1.py --role '${{ matrix.role }}' --canonical "$CANONICAL" --baseline "$BASELINE" --precision "$PRECISION" --slice-start "$1" --slice-end "$2" --out "transient/A/$(printf '%02d' "$i").json"
            i=$((i+1))
          done
      - name: Compute transient partition B responses
        run: |
          set -euo pipefail
          i=0
          for spec in '0 3641' '3641 7282' '7282 10923' '10923 14564' '14564 18205' '18205 21846' '21846 25487' '25487 29128' '29128 32769'; do
            set -- $spec
            .venv_partition32769/bin/python ci/layerb_32769_partition_transient_response_dump_v0_1.py --role '${{ matrix.role }}' --canonical "$CANONICAL" --baseline "$BASELINE" --precision "$PRECISION" --slice-start "$1" --slice-end "$2" --out "transient/B/$(printf '%02d' "$i").json"
            i=$((i+1))
          done
      - name: Compare partitions under frozen 1e-12 gate
        id: compare
        continue-on-error: true
        run: |
          set +e
          .venv_partition32769/bin/python ci/layerb_32769_partition_invariance_compare_v0_1.py --contract "$CONTRACT" --role '${{ matrix.role }}' --partition-a-dir transient/A --partition-b-dir transient/B --out safe/comparison.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Destroy transient scientific responses before upload
        if: always()
        run: |
          rm -rf transient
          test ! -e transient
          if grep -R -n -E 'responses_u64hex|node_u64hex' safe; then
            echo 'forbidden transient response material found in safe artifacts' >&2
            exit 91
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-partition-invariance-${{ matrix.role }}-v0-1
          path: safe/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce frozen role result after safe evidence upload
        if: always()
        run: |
          test '${{ steps.compare.outputs.rc }}' = '0'
          python3 - <<'PY'
          import json
          d=json.load(open('safe/comparison.json'))
          assert d['classification']=='LAYERB_32769_BLINDED_PARTITION_INVARIANCE_ROLE_PASS_PLUS_0_PLUS_0'
          assert d['frozen_tolerance']==1e-12 and d['post_result_tolerance_change'] is False
          assert d['max_normalized_response_difference']<=1e-12
          assert d['coordinate_order_exact'] is True and d['all_response_values_finite'] is True
          assert d['response_vectors_persisted'] is False and d['response_vectors_uploaded'] is False
          assert d['scientific_authority'] is False and d['scientific_execution_authorized'] is False
          assert d['production_16385_to_32769_authorized'] is False and d['convergence_metric_computed'] is False
          assert d['successor_authorized'] is False
          PY

  independent-finalizer:
    if: always()
    needs: [static-audit, role-partition-invariance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-32769-partition-invariance-*-v0-1
          path: downloaded
      - name: Independently classify blinded role receipts
        run: |
          set -euo pipefail
          mkdir -p final
          python3 - <<'PY'
          import json
          from pathlib import Path
          roles={'reference','alpha_minus','beta_plus','beta_minus'}; seen=set(); rows=[]; failures=[]; method_fail=False
          for p in sorted(Path('downloaded').rglob('comparison.json')):
              d=json.load(open(p)); role=d.get('role')
              if role in seen: failures.append(f'duplicate role {role}')
              seen.add(role); rows.append(d)
              if d.get('classification')=='LAYERB_32769_BLINDED_PARTITION_INVARIANCE_NUMERICAL_METHOD_FAIL_PLUS_0_PLUS_0': method_fail=True
              checks=[d.get('classification')=='LAYERB_32769_BLINDED_PARTITION_INVARIANCE_ROLE_PASS_PLUS_0_PLUS_0',d.get('frozen_tolerance')==1e-12,d.get('post_result_tolerance_change') is False,d.get('coordinate_order_exact') is True,d.get('all_response_values_finite') is True,float(d.get('max_normalized_response_difference',1.0))<=1e-12,d.get('response_vectors_persisted') is False,d.get('response_vectors_uploaded') is False,d.get('scientific_authority') is False,d.get('scientific_execution_authorized') is False,d.get('production_16385_to_32769_authorized') is False,d.get('convergence_metric_computed') is False,d.get('successor_authorized') is False]
              if not all(checks): failures.append(f'role {role} failed frozen checks')
          missing=sorted(roles-seen)
          if missing: failures.append(f'missing roles {missing}')
          if not failures: classification='LAYERB_32769_BLINDED_PARTITION_INVARIANCE_ALL_ROLES_PASS_PLUS_0_PLUS_0'
          elif method_fail: classification='LAYERB_32769_BLINDED_PARTITION_INVARIANCE_NUMERICAL_METHOD_FAIL_PLUS_0_PLUS_0'
          else: classification='LAYERB_32769_BLINDED_PARTITION_INVARIANCE_INFRASTRUCTURE_FAIL_PLUS_0_PLUS_0'
          out={'schema':'LAYERB_32769_BLINDED_PARTITION_INVARIANCE_AGGREGATE_V0_1','effect':'+0/+0','classification':classification,'roles_seen':sorted(seen),'missing_roles':missing,'failures':failures,'max_normalized_response_difference_across_roles':max((float(x['max_normalized_response_difference']) for x in rows),default=None),'minimum_exact_binary64_fraction_across_roles_z':min((float(x['minimum_exact_binary64_fraction_across_z']) for x in rows),default=None),'response_vectors_persisted':False,'response_vectors_uploaded':False,'scientific_authority':False,'scientific_execution_authorized':False,'production_16385_to_32769_authorized':False,'convergence_metric_computed':False,'covariance_read':False,'Wm_S3_opened':False,'successor_authorized':False}
          Path('final/aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          raise SystemExit(0 if not failures else 79)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-blinded-partition-invariance-aggregate-v0-1
          path: final/
          if-no-files-found: error
          retention-days: 90
