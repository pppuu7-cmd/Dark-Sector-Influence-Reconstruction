name: layerb-beta-v026-r1-contract-audit-v0-1

on:
  push:
    branches:
      - research/v026-r1-freeze
    paths:
      - '.github/workflows/layerb-beta-v026-r1-contract-audit-v0-1.yml'
      - 'ci/layerb_beta_v026_r1_contract_audit_v0_1.py'
      - 'docs/dsir4/contracts/LAYERB_BETA_FORCED_BASELINE_EXACT_TARGET_UNION_FULL_LAYERB_NUMERICAL_REPLAY_V0_26_R1.json'
      - 'prereg/LAYERB_BETA_FORCED_BASELINE_EXACT_TARGET_UNION_FULL_LAYERB_NUMERICAL_REPLAY_V0_26_R1.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-r1-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact R1 candidate head
        uses: actions/checkout@v4

      - name: Pin audit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Pin response-blind numerical dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==1.26.4

      - name: Fetch and verify exact frozen request-plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT_ID: '10298655751'
        run: |
          set -euo pipefail
          mkdir -p _v026_r1_audit
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PLAN_ARTIFACT_ID}/zip" > _v026_r1_audit/plan.zip
          printf '%s  %s\n' '9b8bdcf03cb05bc979e8c72135acac92232864a74dc1d510b579d8efb5cbb2a7' '_v026_r1_audit/plan.zip' | sha256sum -c -
          unzip -q _v026_r1_audit/plan.zip -d _v026_r1_audit/unpacked
          test -f _v026_r1_audit/unpacked/plan.json
          test "$(wc -c < _v026_r1_audit/unpacked/plan.json)" = '3953984'
          printf '%s  %s\n' 'c12bdb2a407de3f9e2c0c410719ae604d9b3516dabb76c9b1598340418ee8064' '_v026_r1_audit/unpacked/plan.json' | sha256sum -c -

      - name: Verify frozen R1 file/code identities before audit
        run: |
          set -euo pipefail
          test "$(git hash-object prereg/LAYERB_BETA_FORCED_BASELINE_EXACT_TARGET_UNION_FULL_LAYERB_NUMERICAL_REPLAY_V0_26_R1.md)" = '545e5be589e0f8029d23db2edb4e2faad116c3a0'
          test "$(git hash-object docs/dsir4/contracts/LAYERB_BETA_FORCED_BASELINE_EXACT_TARGET_UNION_FULL_LAYERB_NUMERICAL_REPLAY_V0_26_R1.json)" = 'b510d8e97baf1c0b7b216c0605d83cdd029254e9'
          test "$(git hash-object ci/layerb_beta_v026_r1_contract_audit_v0_1.py)" = '9109f2e2bcc6146fa62e423e145ad09a67b70b0c'
          test "$(git hash-object ci/layerb_beta_v026_r1_static_identity_probe_v0_1.py)" = '5fffa2fd926eaf3d775213959039577b20b312bd'
          test "$(git hash-object .github/workflows/layerb-beta-v026-r1-static-identity-probe-v0-1.yml)" = '0a2f42f70c3d4e8cbe2776f26dc9c5fb3a68bc23'

      - name: Execute independent response-blind R1 contract/code/input/provenance audit
        run: |
          set -euo pipefail
          python ci/layerb_beta_v026_r1_contract_audit_v0_1.py \
            --contract docs/dsir4/contracts/LAYERB_BETA_FORCED_BASELINE_EXACT_TARGET_UNION_FULL_LAYERB_NUMERICAL_REPLAY_V0_26_R1.json \
            --prereg prereg/LAYERB_BETA_FORCED_BASELINE_EXACT_TARGET_UNION_FULL_LAYERB_NUMERICAL_REPLAY_V0_26_R1.md \
            --plan _v026_r1_audit/unpacked/plan.json \
            --parent docs/dsir4/authority/LAYERB_BETA_V0_25_PROVENANCE_CORRECTION_V0_1.json \
            --qualification docs/dsir4/authority/LAYERB_BETA_V0_26_RESPONSE_BLIND_STATIC_AUDIT_QUALIFICATION_V0_1.json \
            --exp073ir ci/exp073ir_article3_real_layerb_common_response_v0_1.py \
            --jj ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --localization docs/dsir4/authority/LAYERB_OPERAND_LOCALIZATION_DIAGNOSTIC_V0_2.json \
            --alpha-resource docs/dsir4/authority/LAYERB_32769_EIGHT_CHUNK_RESPONSE_BLIND_RESOURCE_PILOT_V0_1.json \
            --alpha-partition docs/dsir4/authority/LAYERB_32769_BLINDED_PARTITION_INVARIANCE_V0_1.json \
            --request-authority docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json \
            --out _v026_r1_audit/r1_contract_audit.json
          python - <<'PY'
          import json
          p='_v026_r1_audit/r1_contract_audit.json'
          d=json.load(open(p))
          assert d['token']=='PASS_LAYERB_BETA_V0_26_R1_CONTRACT_AUDIT_PLUS_0_PLUS_0'
          assert d['effect']=='+0/+0'
          assert d['class_solver_invoked'] is False
          assert d['scientific_response_read'] is False
          assert d['covariance_read'] is False
          assert d['grid896_node_payload_sha256']=='8499eb0f240b85581e0dcb804b841ba911c4b3a58e8fe15702aea134e40bd65d'
          assert d['mixed_payload_manifest_sha256']=='6b0f08b196f6afa2086a4275ec364d527c50786921ef0ca1d77a30edbed91ce6'
          assert d['mixed_max_payload']=={'batch_id':'M013','bytes':25063}
          assert d['direct_payload_manifest_sha256']=='99a6e4c48d353b05bea5000fc27417731d1c347071254232ed807554ee569da6'
          assert d['solver_constructions_full_replay']==738
          assert d['sentinel_execution_authorized'] is False
          assert d['full_107_row_execution_authorized'] is False
          print(d['token'])
          PY
          sha256sum _v026_r1_audit/r1_contract_audit.json > _v026_r1_audit/r1_contract_audit.sha256

      - name: Persist immutable R1 contract-audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-v026-r1-contract-audit-v0-1
          path: |
            _v026_r1_audit/r1_contract_audit.json
            _v026_r1_audit/r1_contract_audit.sha256
          if-no-files-found: error
          retention-days: 90
