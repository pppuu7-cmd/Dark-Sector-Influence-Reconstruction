name: ACT x unWISE exact shot-noise template v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/act-unwise-exact-shot-noise-template-v0-1.yml'
      - 'ci/act_unwise_exact_shot_noise_template_v0_1.py'
      - 'experiments/066c_act_unwise_exact_shot_noise_template_v0_1.md'

jobs:
  exact-shot-noise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: python3 -m pip install --user numpy pyyaml
      - name: Fetch pinned official likelihood source
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/ACTCollaboration/unWISExLens_lklh.git external/unWISExLens_lklh
          git -C external/unWISExLens_lklh checkout 6302c30d9e70f8e4ff2d4a84a9977b4471705179
          test "$(git -C external/unWISExLens_lklh rev-parse HEAD)" = "6302c30d9e70f8e4ff2d4a84a9977b4471705179"
      - name: Fetch exact official data archive
        run: |
          set -euxo pipefail
          mkdir -p external/unwise_data
          PRIMARY='https://portal.nersc.gov/project/act/act_x_unWISE_xcorr+3x2pt/data_unWISExLens.tar.gz'
          NASA_MIRROR='https://lambda.gsfc.nasa.gov/data/suborbital/ACT/act_x_unWISE/data_unWISExLens.tar.gz'
          if ! curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
            "$PRIMARY" -o external/data_unWISExLens.tar.gz; then
            rm -f external/data_unWISExLens.tar.gz
            curl --fail --location --retry 4 --retry-delay 3 \
              "$NASA_MIRROR" -o external/data_unWISExLens.tar.gz
          fi
          echo '1b2d1563c5eb548ca6488ed8d60c5260d9e110b743a2e3a84620cfe46fbb6570  external/data_unWISExLens.tar.gz' | sha256sum -c -
          tar -xzf external/data_unWISExLens.tar.gz -C external/unwise_data
      - name: Run frozen Exp066C exact corrective audit
        run: |
          set -euxo pipefail
          python3 ci/act_unwise_exact_shot_noise_template_v0_1.py \
            --external-repo external/unWISExLens_lklh \
            --extracted-root external/unwise_data \
            --archive external/data_unWISExLens.tar.gz \
            --output data/derived/g7/exp066c_act_unwise_exact_shot_noise_template_v0_1.json
      - name: Preserve frozen scientific outcome
        run: |
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp066c_act_unwise_exact_shot_noise_template_v0_1.json'
          d=json.load(open(p))
          assert d['status'] in {
              'PASS_ACT_UNWISE_EXACT_SHOT_NOISE_TEMPLATE_V0_1',
              'FAIL_ACT_UNWISE_EXACT_SHOT_NOISE_TEMPLATE_V0_1',
          }
          assert d['frozen_criteria']['C1_relative_solve_tolerance'] == 5e-11
          assert d['frozen_criteria']['C2_relative_equivalence_factor'] == 5e-12
          assert d['frozen_criteria']['C3_min_nonconstant_delta'] == 1e-6
          assert d['immutable_lineage']['Exp066B'] == 'FAIL_ACT_UNWISE_SELECTED_BANDPOWER_CLOSURE_V0_1'
          assert d['gate_state'] == {'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP066C_RESULT', d['status'])
          for k,v in d['checks'].items(): print(k, v['pass'])
          PY
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: exp066c-act-unwise-exact-shot-noise-${{ github.sha }}
          path: data/derived/g7/exp066c_act_unwise_exact_shot_noise_template_v0_1.json
          if-no-files-found: error
