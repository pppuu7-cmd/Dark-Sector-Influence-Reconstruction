name: dsir-v026-r1-first-attempt-failure-funnel-post-run-history-v0-4

on:
  workflow_run:
    workflows:
      - dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-4
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  TARGET_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-4.yml
  GH_TOKEN: ${{ github.token }}

jobs:
  terminal-dispatch-history-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require exact completed authorized first dispatch and fresh terminal history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          e=json.loads(os.environ['WORKFLOW_RUN_EVENT']) if 'WORKFLOW_RUN_EVENT' in os.environ else json.loads('''${{ toJSON(github.event.workflow_run) }}''')
          assert e['event']=='workflow_dispatch'
          assert e['path']==os.environ['TARGET_WORKFLOW_PATH']
          assert int(e['run_number'])==1
          assert int(e['run_attempt'])==1
          assert e['head_branch']=='main'
          assert e['status']=='completed'
          assert e['conclusion']=='success'
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; path=os.environ['TARGET_WORKFLOW_PATH']
          runs=[]; url=f'https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=100'
          while url:
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r:
                  page=json.load(r); runs.extend(page.get('workflow_runs',[])); link=r.headers.get('Link','')
              url=next((p.split(';',1)[0].strip()[1:-1] for p in link.split(',') if 'rel="next"' in p),None)
          exact=[x for x in runs if x.get('path')==path]
          assert len(exact)==1, [(x.get('id'),x.get('run_number'),x.get('run_attempt'),x.get('status'),x.get('conclusion')) for x in exact]
          only=exact[0]
          assert int(only['id'])==int(e['id'])
          assert int(only['run_number'])==1
          assert int(only['run_attempt'])==1
          assert only['head_branch']=='main'
          assert only['event']=='workflow_dispatch'
          assert only['status']=='completed'
          assert only['conclusion']=='success'
          out={
            'schema':'LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_POST_RUN_HISTORY_AUDIT_V0_4',
            'effect':'+0/+0',
            'verdict':'CONFIRMED_SCOPED',
            'classification':'V0_4_SINGLE_AUTHORIZED_RUN_NUMBER_1_ATTEMPT_1_TERMINAL_HISTORY_CONFIRMED',
            'target_run_id':int(e['id']),
            'target_run_number':1,
            'target_run_attempt':1,
            'target_conclusion':'success',
            'exact_visible_dispatch_count':1,
            'late_duplicate_dispatch_detected':False,
            'rerun_authorized':False,
            'same_nonce_second_attempt_authorized':False,
            'successor_sentinel_science_authorized':False,
            'full_107_row_execution_authorized':False,
            'failure_funnel_result_promotion_authorized_by_this_receipt':False,
            'next_gate':'INDEPENDENTLY_PERSIST_TERMINAL_POST_RUN_HISTORY_AUTHORITY_BEFORE_ANY_RESULT_PROMOTION',
            'token':'CONFIRMED_LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_POST_RUN_HISTORY_V0_4_PLUS_0_PLUS_0'
          }
          open('post_run_history_receipt.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token'])
          PY

      - name: Persist terminal dispatch-history evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-first-attempt-failure-funnel-post-run-history-v0-4
          path: post_run_history_receipt.json
          if-no-files-found: error
          retention-days: 90
