name: Exp073P aggregate prerequisite join v0.3 selftest

on:
  push:
    branches: [main]
    paths:
      - 'ci/exp073p_aggregate_prerequisite_join_v0_3.py'
      - 'ci/exp073p_actions_metadata_bundle_v0_3.py'
      - 'ci/exp073p_v07_r1_payload_bundle_v0_3.py'
      - '.github/workflows/exp073p-aggregate-prerequisite-join-actual-v0-3.yml'
      - '.github/workflows/exp073p-aggregate-prerequisite-join-v0-3-selftest.yml'
      - 'experiments/073p_aggregate_prerequisite_join_v07_r1_authority_prereg_v0_3.md'
  pull_request:
    paths:
      - 'ci/exp073p_aggregate_prerequisite_join_v0_3.py'
      - 'ci/exp073p_actions_metadata_bundle_v0_3.py'
      - 'ci/exp073p_v07_r1_payload_bundle_v0_3.py'
      - '.github/workflows/exp073p-aggregate-prerequisite-join-actual-v0-3.yml'
      - '.github/workflows/exp073p-aggregate-prerequisite-join-v0-3-selftest.yml'
      - 'experiments/073p_aggregate_prerequisite_join_v07_r1_authority_prereg_v0_3.md'

permissions:
  contents: read

jobs:
  synthetic-v03-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen v0.3 implementation lineage
        shell: bash
        run: |
          set -euxo pipefail
          test "$(sha256sum ci/exp073p_aggregate_prerequisite_join_v0_1.py | cut -d' ' -f1)" = '9dc0b5a0ea82b8fb69d82e06b566b08d61c1982bd5e13ecd8db6752253bc0e46'
          test "$(sha256sum ci/exp073p_actions_metadata_bundle_v0_1.py | cut -d' ' -f1)" = 'cda5cb20c2d4f9be8a3068dacfead4db25e5dfbd867815005b754ab8cde955f3'
          test "$(sha256sum ci/exp073p_aggregate_prerequisite_join_v0_3.py | cut -d' ' -f1)" = 'd5953f447ea1b189599bf26a3f7ffe0c9b879439b5af2ffa1b702b83f27e8d41'
          test "$(sha256sum ci/exp073p_actions_metadata_bundle_v0_3.py | cut -d' ' -f1)" = 'fc74c64c096528eac5179202f32ad1de275416b754b76ed19ba5d7be9da8bb43'
          test "$(sha256sum ci/exp073p_v07_r1_payload_bundle_v0_3.py | cut -d' ' -f1)" = 'a1825a45c9683797e0faf5f232eafad2f81cf12b69bd758f0a2c8768c0b28a3c'
          test "$(sha256sum experiments/073p_aggregate_prerequisite_join_v07_r1_authority_prereg_v0_3.md | cut -d' ' -f1)" = 'f33b4d761173e43809b209d4bc1f2059ba022f9d4dc71e8b21b84b40fe4a6a25'
          test "$(sha256sum .github/workflows/exp073p-aggregate-prerequisite-join-actual-v0-3.yml | cut -d' ' -f1)" = '4afd3b990f4741156e3dda853c704d62e7cc6224dbe51f514b7eaf60de369a87'
          test "$(sha256sum .github/workflows/exp073r1-desy1-transport-stabilized-replay-v0-7.yml | cut -d' ' -f1)" = '8ef3fb2305fe2789e6198547f5095969cfc107df1f0e17853b20a7aa5c601328'
          python3 -m py_compile \
            ci/exp073p_aggregate_prerequisite_join_v0_1.py \
            ci/exp073p_aggregate_prerequisite_join_v0_3.py \
            ci/exp073p_actions_metadata_bundle_v0_1.py \
            ci/exp073p_actions_metadata_bundle_v0_3.py \
            ci/exp073p_v07_r1_payload_bundle_v0_3.py

      - name: Execute attempt-specific aggregate evaluator mutation suite
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_aggregate_prerequisite_join_v0_3.py \
            --selftest \
            --out data/derived/g7/exp073p_aggregate_prerequisite_join_synthetic_selftest_v0_3.json

      - name: Execute attempt-specific live-metadata route mutation suite
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_actions_metadata_bundle_v0_3.py \
            --selftest \
            --workflow .github/workflows/exp073p-aggregate-prerequisite-join-actual-v0-3.yml \
            --out data/derived/g7/exp073p_actions_metadata_route_synthetic_selftest_v0_3.json

      - name: Execute complete-payload byte and multiplicity mutation suite
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_v07_r1_payload_bundle_v0_3.py \
            --selftest \
            --manifest-out data/derived/g7/exp073p_v07_r1_payload_synthetic_selftest_v0_3.json

      - name: Assert synthetic-only v0.3 receipts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/derived/g7')
          evaluator=json.loads((root/'exp073p_aggregate_prerequisite_join_synthetic_selftest_v0_3.json').read_text())
          route=json.loads((root/'exp073p_actions_metadata_route_synthetic_selftest_v0_3.json').read_text())
          payload=json.loads((root/'exp073p_v07_r1_payload_synthetic_selftest_v0_3.json').read_text())
          assert evaluator['status']=='PASS_EXP073P_AGGREGATE_JOIN_SYNTHETIC_SELFTEST_V0_3'
          assert route['status']=='PASS_EXP073P_ACTIONS_METADATA_ROUTE_SYNTHETIC_SELFTEST_V0_3'
          assert payload['status']=='PASS_EXP073P_V07_R1_PAYLOAD_SYNTHETIC_SELFTEST_V0_3'
          assert evaluator['v03_failclosed_mutations']==19
          assert route['v03_attempt_failclosed_mutations']==5
          assert payload['failclosed_mutations']==4
          assert evaluator['r1_authority']['run_id']==route['r1_authority']['run_id']==33240490287
          assert evaluator['r1_authority']['run_attempt']==route['r1_authority']['run_attempt']==2
          assert evaluator['r1_authority']['job_id']==route['r1_authority']['job_id']==99080934021
          for data in (evaluator,route,payload):
              assert data['synthetic'] is True
              assert data['support_executor_authorized'] is False
              for key in (
                  'support_fraction_evaluated','f_invalid_computed','retained_dimension_evaluated',
                  'covariance_read','whitening_read','nuisance_svd_read','relation_null_read',
                  'heldout_read','G8_read',
              ):
                  assert data[key] is False,key
              assert data['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('PASS_EXP073P_AGGREGATE_JOIN_ROUTE_PAYLOAD_SYNTHETIC_SELFTEST_V0_3')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp073p-aggregate-join-v0-3-synthetic-selftest-${{ github.sha }}
          path: |
            data/derived/g7/exp073p_aggregate_prerequisite_join_synthetic_selftest_v0_3.json
            data/derived/g7/exp073p_actions_metadata_route_synthetic_selftest_v0_3.json
            data/derived/g7/exp073p_v07_r1_payload_synthetic_selftest_v0_3.json
          if-no-files-found: error
          retention-days: 90
