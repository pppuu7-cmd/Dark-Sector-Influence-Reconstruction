name: Exp073DQ WW_S0_S0 durable A/B driver static admission v0.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/exp073dq-ww-s0-s0-durable-ab-driver-static-admission-v0-1.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: dsir-exp073dq-ww-s0-s0-durable-ab-driver-static-admission-v0-1
  cancel-in-progress: false
jobs:
  hosted-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Run durable-driver static admission
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/exp073dq_ww_s0_s0_durable_ab_driver_static_audit_v0_1.py | tee exp073dq_stdout.txt
          grep -Fx 'PASS_EXP073DQ_WW_S0_S0_DURABLE_AB_DRIVER_STATIC_ADMISSION_V0_1' exp073dq_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('exp073dq_ww_s0_s0_durable_ab_driver_static_admission_v0_1.json'))
          assert d['token']=='PASS_EXP073DQ_WW_S0_S0_DURABLE_AB_DRIVER_STATIC_ADMISSION_V0_1'
          assert d['science_gate_scored'] is False and d['ww_authority_created'] is False and d['home_execution_authorized'] is False
          assert all(d['checks'].values())
          PY
      - run: sha256sum exp073dq_ww_s0_s0_durable_ab_driver_static_admission_v0_1.json exp073dq_stdout.txt > exp073dq_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exp073dq-ww-s0-s0-durable-driver-static-${{ github.run_id }}-${{ github.sha }}
          path: |
            exp073dq_ww_s0_s0_durable_ab_driver_static_admission_v0_1.json
            exp073dq_stdout.txt
            exp073dq_sha256.txt
          if-no-files-found: error
          retention-days: 90
