name: DSIR DCDM withheld temporal localization v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dcdm-withheld-temporal-localization-v0-1.yml'
      - 'ci/dcdm_withheld_temporal_localization_v0_1.py'
      - 'experiments/053a_dcdm_withheld_temporal_localization_v0_1.md'

permissions:
  contents: read

jobs:
  dcdm-withheld:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install CLASS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip
          python3 -m pip install --user numpy

      - name: Clone and build pinned official CLASS
        run: |
          set -euxo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git rev-parse HEAD | tee ../exp053a_class_upstream_sha.txt
          test "$(git rev-parse HEAD)" = 'e85808324f51fc694d12e3ed7439552a3c3f9540'
          grep -Fq 'Gamma_dcdm = 0.0' explanatory.ini
          grep -Fq 'omega_ini_dcdm' explanatory.ini
          grep -Fq 'd\rho/dloga = -3 \rho - \Gamma/H \rho' source/background.c
          grep -Fq 'a * pba->Gamma_dcdm / k2 * metric_euler' source/perturbations.c
          make -j2 class

      - name: Freeze reference and withheld DCDM configurations
        working-directory: class_public
        run: |
          set -euxo pipefail
          mkdir -p outputs
          cat > dsir_dcdm_base.ini <<'EOF'
          h = 0.67
          T_cmb = 2.7255
          omega_b = 0.0224
          Omega_k = 0.
          Omega_fld = 0
          Omega_scf = 0
          YHe = 0.2404
          recombination = RECFAST
          reio_parametrization = reio_none
          output = mPk
          modes = s
          ic = ad
          gauge = synchronous
          P_k_ini type = analytic_Pk
          k_pivot = 0.05
          A_s = 2.10e-9
          n_s = 0.965
          alpha_s = 0.
          N_ur = 3.046
          N_ncdm = 0
          P_k_max_h/Mpc = 0.25
          primordial_P_k_max_h/Mpc = 0.25
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          headers = yes
          write background = yes
          EOF

          cat > dsir_cdm.ini <<'EOF'
          omega_cdm = 0.1200
          root = outputs/cdm_
          EOF
          cat dsir_dcdm_base.ini >> dsir_cdm.ini

          python3 - <<'PY'
          from pathlib import Path
          H0=67.0
          frozen=[(0.25,'g0p25'),(0.5,'g0p5'),(1.0,'g1'),(2.0,'g2')]
          base=Path('dsir_dcdm_base.ini').read_text()
          for gamma,tok in frozen:
              G=gamma*H0
              s=(
                'omega_cdm = 0.0\n'
                'omega_ini_dcdm = 0.1200\n'
                f'Gamma_dcdm = {G:.12g}\n'
                f'root = outputs/dcdm_{tok}_\n'
              )+base
              Path(f'dsir_dcdm_{tok}.ini').write_text(s)
              print(gamma,G,tok)
          PY

      - name: Verify frozen dimensionless decay controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected={'g0p25':16.75,'g0p5':33.5,'g1':67.0,'g2':134.0}
          for tok,G in expected.items():
              s=Path(f'class_public/dsir_dcdm_{tok}.ini').read_text()
              assert 'omega_ini_dcdm = 0.1200' in s
              assert f'Gamma_dcdm = {G:g}' in s or f'Gamma_dcdm = {G:.1f}' in s
              assert 'omega_cdm = 0.0' in s
          PY
          grep -Fq 'Omega_Lambda' class_public/explanatory.ini
          grep -Fq "'Omega_Lambda' unspecified" class_public/explanatory.ini

      - name: Run matched CDM reference and withheld DCDM family
        working-directory: class_public
        run: |
          set -euxo pipefail
          ./class dsir_cdm.ini pk_ref.pre 2>&1 | tee ../exp053a_cdm.log
          for tok in g0p25 g0p5 g1 g2; do
            ./class "dsir_dcdm_${tok}.ini" pk_ref.pre 2>&1 | tee "../exp053a_${tok}.log"
          done

      - name: Require seven explicit P(k,z) outputs and DCDM backgrounds
        run: |
          set -euxo pipefail
          for prefix in cdm_ dcdm_g0p25_ dcdm_g0p5_ dcdm_g1_ dcdm_g2_; do
            n=$(find class_public/outputs -maxdepth 1 -type f -name "${prefix}*pk.dat" | wc -l)
            test "$n" -eq 7
            for f in class_public/outputs/${prefix}*pk.dat; do
              grep -Eiq 'redshift[[:space:]]+z[[:space:]]*=' "$f"
              test "$(grep -vc '^#' "$f")" -gt 20
            done
          done
          for prefix in dcdm_g0p25_ dcdm_g0p5_ dcdm_g1_ dcdm_g2_; do
            test -f "class_public/outputs/${prefix}background.dat"
            grep -Eq 'rho_dcdm|rho_dr' "class_public/outputs/${prefix}background.dat"
          done

      - name: Test pre-frozen withheld-family temporal-localization prediction
        run: |
          python3 ci/dcdm_withheld_temporal_localization_v0_1.py \
            --directory class_public/outputs \
            --reference-prefix cdm_ \
            --models 0.25:dcdm_g0p25_ 0.5:dcdm_g0p5_ 1.0:dcdm_g1_ 2.0:dcdm_g2_ \
            --json dcdm_withheld_temporal_localization_v0_1.json
          cat dcdm_withheld_temporal_localization_v0_1.json

      - name: Record immutable provenance
        if: always()
        run: |
          {
            echo 'Experiment 053A withheld-family DCDM temporal localization'
            echo 'Frozen before first C6 outputs: gamma=Gamma/H0={0.25,0.5,1,2}; z_R defined from squared low-k P(k,z) response; every consecutive z_R step must exceed +1e-3.'
            echo 'Reference stable omega_cdm=0.1200; DCDM uses omega_ini_dcdm=0.1200 and CLASS-inferred flat Omega_Lambda closure.'
            echo 'C6 DCDM was not used to construct F21/F23/F25.'
            echo "DSIR head: $GITHUB_SHA"
            echo -n 'CLASS upstream: '; cat exp053a_class_upstream_sha.txt
          } > exp053a_environment.txt

      - name: Upload withheld-family artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcdm-withheld-temporal-localization-v0-1-${{ github.sha }}
          path: |
            dcdm_withheld_temporal_localization_v0_1.json
            exp053a_environment.txt
            exp053a_class_upstream_sha.txt
            exp053a_*.log
            class_public/dsir_*.ini
            class_public/pk_ref.pre
            class_public/outputs/cdm_*pk.dat
            class_public/outputs/dcdm_*pk.dat
            class_public/outputs/*background.dat
          if-no-files-found: warn
