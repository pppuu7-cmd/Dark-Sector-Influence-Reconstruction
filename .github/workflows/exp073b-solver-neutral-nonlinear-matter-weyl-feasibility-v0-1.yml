name: Exp073B nonlinear matter-Weyl feasibility v0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073b-solver-neutral-nonlinear-matter-weyl-feasibility-v0-1.yml'
      - 'ci/exp073b_solver_neutral_nonlinear_matter_weyl_feasibility_v0_1.py'
      - 'experiments/073b_solver_neutral_nonlinear_matter_weyl_feasibility_prereg_v0_1.md'

permissions:
  contents: read
  actions: read

jobs:
  source-capability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact Exp073A artifact
        run: |
          set -euxo pipefail
          mkdir -p external/exp073a
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9630897385 > external/exp073a_meta.json
          python3 - <<'PY'
          import json
          d=json.load(open('external/exp073a_meta.json'))
          assert d['id']==9630897385
          assert d['digest']=='sha256:0f2212d691c38c3e953d2a0d823b498a5557b9485fc759079719000cdc48cb25'
          assert d['workflow_run']['id']==33032781761
          assert d['workflow_run']['head_sha']=='03c9d0281a6ea780d29c6fb4a689dbd55e51fdf5'
          PY
          gh run download 33032781761 -n 'exp073a-gr-linear-perturbativity-eligibility-03c9d0281a6ea780d29c6fb4a689dbd55e51fdf5' -D external/exp073a
          J="$(find external/exp073a -name 'exp073a_gr_linear_perturbativity_eligibility_v0_1.json' -print -quit)"
          test -n "$J"
          echo 'a8bbafa971283cadf9ff27a27af4d0c4e3042bc0aec590d690142d39c919abb2  '"$J" | sha256sum -c -
          cp "$J" external/exp073a.json
      - name: Clone exact pinned provider and ACT sources
        run: |
          set -euxo pipefail
          git clone https://github.com/lesgourg/class_public.git external/class_public
          git -C external/class_public checkout 4c87916aab5ca124a68f1dd16f31846fc13d1829
          git clone https://github.com/EFTCAMB/EFTCAMB.git external/EFTCAMB
          git -C external/EFTCAMB checkout 16d9c4e9f85751e30efd0a53b177941713078904
          git clone https://github.com/ACTCollaboration/unWISExLens_lklh.git external/unWISExLens_lklh
          git -C external/unWISExLens_lklh checkout 6302c30d9e70f8e4ff2d4a84a9977b4471705179
      - name: Execute frozen Exp073B source capability audit
        run: |
          set -euxo pipefail
          python3 ci/exp073b_solver_neutral_nonlinear_matter_weyl_feasibility_v0_1.py \
            --c3-root external/class_public --c5-root external/EFTCAMB --act-root external/unWISExLens_lklh \
            --parent-json external/exp073a.json --parent-meta external/exp073a_meta.json \
            --output data/derived/g7/exp073b_solver_neutral_nonlinear_matter_weyl_feasibility_v0_1.json
      - name: Assert frozen classification semantics
        run: |
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp073b_solver_neutral_nonlinear_matter_weyl_feasibility_v0_1.json'
          d=json.load(open(p))
          assert d['status'] in {'FEASIBLE_EXISTING_STACK_NONLINEAR_MATTER_WEYL_ROUTE_EXP073B','GAP_EXISTING_STACK_NONLINEAR_MATTER_WEYL_ROUTE_EXP073B','FAIL_EXP073B_REPRODUCTION_OR_PROVENANCE'}
          assert d['controls']['covariance_read'] is False
          assert d['controls']['G8_read'] is False
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          if d['status']=='GAP_EXISTING_STACK_NONLINEAR_MATTER_WEYL_ROUTE_EXP073B':
              assert d['audit_trustworthy'] is True
              assert (d['tests']['F3_C3_GDM_nonlinear_provider']['pass'] is False or d['tests']['F4_C5_designer_fR_nonlinear_provider']['pass'] is False)
          print('EXP073B_RESULT',d['status'])
          print('F1_F8',{k:v['pass'] for k,v in d['tests'].items()})
          PY
      - name: Upload immutable Exp073B record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073b-nonlinear-matter-weyl-feasibility-${{ github.sha }}
          path: data/derived/g7/exp073b_solver_neutral_nonlinear_matter_weyl_feasibility_v0_1.json
          if-no-files-found: warn
