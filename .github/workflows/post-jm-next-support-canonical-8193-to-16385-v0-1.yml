name: post-jm-next-support-canonical-8193-to-16385-v0-1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-jm-next-support-canonical-8193-to-16385-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: post-jm-next-support-canonical-8193-to-16385-v0-1
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HELPER_BLOB: '10492520b4a0eb8992e9ccb101a4ccd26127be82'
  VALIDATOR_BLOB: 'd8eece64d6b2b7ab162fc3a4e6a9981bde604e08'
  JM_AUTH_BLOB: '7edc35506509d0ff7e359d91ce19e731dba1b678'
  RESOURCE_AUTH_BLOB: 'a1e38e6c77452836315e8ab5b2403b55279f4be8'
  CANON16385_AUTH_BLOB: '50aa473299c82c857921a083f7d4de652ba476a4'
  HISTORY_PATCH_BLOB: 'e20687e933d665973c3be40598180587701fa8e0'
  ENGINE_BLOB: '5f8475b961db20bef5f4b8a2eb7c99d9f7c722e2'
  PLAN_AUTH_BLOB: '5992faa10b6d25d1503b287c19456fb36756caa4'
  PLAN_SCRIPT_BLOB: '7180b74641acfa602c34db07ad6cc916c17ebd4f'
  IR_BLOB: '6ef2516dfcae8a8ae92f5b7dbe792274138c0f6f'
  JJ_BLOB: 'ee8fd0650a2a1322fab83a86bb06a219e84ca434'
  COARSE_BLOB: 'bc9a6e59fb27d7510796c1cb2d5470dfe8a5294b'
  FINE_BLOB: 'fc4eb1e7f51a0ad3773b8be13c477652b1f71368'
  MANIFEST: docs/dsir4/authority/EXP073IM_C2_REAL_INPUT_MANIFEST_V0_4.json
  WM_S3_OVERRIDE: docs/dsir4/authority/EXP073IP_C2_WM_S3_TRANSPORT_OVERRIDE_V0_2.json
jobs:
  canonical-next-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enforce frozen authorities, resource gate and identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/post_jm_next_support_canonical_one_live_refinement_v0_1.py)" = "$HELPER_BLOB"
          test "$(git hash-object ci/post_jm_next_support_terminal_validator_v0_1.py)" = "$VALIDATOR_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JM_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_FOURTH_REFINEMENT_NOT_CONVERGED_V0_2.json)" = "$JM_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/authority/CLASSIV_HISTORY_SUPPRESSED_16385_DUAL_RESOURCE_PILOT_V0_1.json)" = "$RESOURCE_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_16385_V0_1.json)" = "$CANON16385_AUTH_BLOB"
          test "$(git hash-object scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py)" = "$HISTORY_PATCH_BLOB"
          test "$(git hash-object ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py)" = "$ENGINE_BLOB"
          test "$(git hash-object docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json)" = "$PLAN_AUTH_BLOB"
          test "$(git hash-object ci/recovered_exp073jl_response_blind_request_plan_audit_v0_1.py)" = "$PLAN_SCRIPT_BLOB"
          test "$(git hash-object ci/exp073ir_article3_real_layerb_common_response_v0_1.py)" = "$IR_BLOB"
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = "$JJ_BLOB"
          test "$(git hash-object docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt)" = "$COARSE_BLOB"
          test "$(git hash-object docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt)" = "$FINE_BLOB"
          python3 -m py_compile ci/post_jm_next_support_canonical_one_live_refinement_v0_1.py ci/post_jm_next_support_terminal_validator_v0_1.py ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py ci/exp073ir_article3_real_layerb_common_response_v0_1.py ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py ci/recovered_exp073jl_response_blind_request_plan_audit_v0_1.py
          python3 - <<'PY'
          import json
          jm=json.load(open('docs/dsir4/authority/EXP073JM_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_FOURTH_REFINEMENT_NOT_CONVERGED_V0_2.json'))
          assert jm['artifact_verified_independently'] is True and jm['classification']=='COMMON_GRID_FOURTH_REFINEMENT_NOT_CONVERGED_PLUS_0_PLUS_0'
          assert jm['validated_branch_selected']=='NOT_CONVERGED_8193_TO_16385' and jm['next_support_rung_activated'] is True
          r=json.load(open('docs/dsir4/authority/CLASSIV_HISTORY_SUPPRESSED_16385_DUAL_RESOURCE_PILOT_V0_1.json'))
          assert r['artifact_verified_independently'] is True and r['resource_feasibility_pass'] is True and r['full_8193_to_16385_support_execution_permitted'] is True
          assert r['resource_pilot_response_hashes_are_scientific_authority'] is False and len(r['replicas'])==2
          assert all(x['total_solver_constructions']==4 and x['max_live_instances']==1 and x['final_live_instances']==0 and x['unsupported_target_evaluations']==0 and x['max_requested_node_coordinate_rel_mismatch']<=1e-12 for x in r['replicas'])
          ca=json.load(open('docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_16385_V0_1.json'))
          assert ca['artifact_verified_independently'] is True and ca['requested_node_count']==16385
          assert ca['node_payload_sha256']=='3e10cea6e46a6d0c07eac825a4e508829727914c8690d42b187ef894eaa2c975'
          p=json.load(open('docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json'))
          assert p['artifact_verified_independently'] is True and p['execution_shape_if_recovered_one_live']['total_solver_constructions']==8 and p['execution_shape_if_recovered_one_live']['max_live_instances']==1
          PY
      - name: Install frozen numerical/build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git unzip procps >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null
      - name: Checkout exact frozen CAMB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/camb
          git -C external/camb init -q
          git -C external/camb remote add origin https://github.com/cmbant/CAMB.git
          git -C external/camb fetch -q --depth 1 origin fa3f097343fbbe427cc04b4f5f0041c22c6ec764
          git -C external/camb checkout -q --detach FETCH_HEAD
          test "$(git -C external/camb rev-parse HEAD)" = fa3f097343fbbe427cc04b4f5f0041c22c6ec764
          python -m pip install ./external/camb >/dev/null
      - name: Build exact pinned CLASS-IV with proven history suppression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 18432'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 524288'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          Path('artifacts/capacity_patch.json').write_text(json.dumps({'schema':'POST_JM_NEXT_SUPPORT_CLASSIV_INPUT_CAPACITY_PATCH_V0_1','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','old_capacity':30,'new_capacity':18432,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_old_argument_capacity':1024,'parser_new_argument_capacity':524288,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost},indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py external/class_iv artifacts/history_patch.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/history_patch.json')); assert d['replacement_count']==1 and d['k_output_values_still_inserted_into_solver_grid'] is True and d['scientific_parameters_changed'] is False and d['post_sha256']=='4e9a419d46471ffab74df3d14239e000bf92f2e198edad4d2c7b82f1335f7a4b'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Download exact DES-Y1 radial payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/des_nz
          curl --fail --location --retry 3 -sS -o external/des_nz/source.fits 'https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/redshift_bins/y1_redshift_distributions_v1.fits'
          curl --fail --location --retry 3 -sS -o external/des_nz/lens.fits 'https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/chains/2pt_NG_mcal_1110.fits'
          echo 'b5d87138c35ae8bb4ecd02491972f544648398e606b3617039e6e54cb8ea943b  external/des_nz/source.fits' | sha256sum -c -
          echo '114035179b5a8e41090751e9a6478536d185128581d37b5a510eff5722f417ca  external/des_nz/lens.fits' | sha256sum -c -
      - name: Download exact Layer-A parent, angular and Exp073IM authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/parent inputs/angular inputs/expim
          get_artifact () { local id="$1" digest="$2" dest="$3"; local zip="${dest}.zip"; mkdir -p "$dest"; gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"; local actual expected; actual="$(sha256sum "$zip" | awk '{print $1}')"; expected="${digest#sha256:}"; test "$actual" = "$expected" || exit 31; unzip -q "$zip" -d "$dest"; }
          get_artifact 10131794281 'sha256:ac959926639d3b46ecfe114e396ce03cb20a0763ef2781db454408d8ad0759df' inputs/parent
          while IFS=$'\t' read -r slot id digest; do get_artifact "$id" "$digest" "inputs/angular/$slot"; done < <(jq -r '.angular[] | [.slot, (.artifact_id|tostring), .artifact_digest] | @tsv' "$MANIFEST")
          id="$(jq -r '.artifact_id' "$WM_S3_OVERRIDE")"; mkdir -p inputs/angular/Wm_S3/transport_override
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > inputs/angular/Wm_S3/transport_override.zip
          unzip -q inputs/angular/Wm_S3/transport_override.zip -d inputs/angular/Wm_S3/transport_override
          expected="$(jq -r '.required_each_canonical_sha256' "$WM_S3_OVERRIDE")"; nbytes="$(jq -r '.required_each_nbytes' "$WM_S3_OVERRIDE")"
          for f in inputs/angular/Wm_S3/transport_override/A/selected_te.bin inputs/angular/Wm_S3/transport_override/B/selected_te.bin; do test "$(stat -c%s "$f")" = "$nbytes"; test "$(sha256sum "$f" | awk '{print $1}')" = "$expected"; done
          cmp -s inputs/angular/Wm_S3/transport_override/A/selected_te.bin inputs/angular/Wm_S3/transport_override/B/selected_te.bin
          get_artifact 10130241439 'sha256:3325bab0faa821c5ca3b13b4cd64d3d58c323e56a6f3e44952be84bfbc477156' inputs/expim
      - name: Download exact frozen BOSS z3 operators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/exp073w_boss; base='https://fbeutler.github.io/hub'
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/W_NGC_z3.gz "$base/W_BOSS_DR12_NGC_z3_V6C_1_1_1_1_1_10_200_2000_averaged_v1.matrix.gz"
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/W_SGC_z3.gz "$base/W_BOSS_DR12_SGC_z3_V6C_1_1_1_1_1_10_200_2000_averaged_v1.matrix.gz"
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/M_NGC_z3.gz "$base/M_BOSS_DR12_NGC_z3_V6C_1_1_1_1_1_1200_2000.matrix.gz"
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/M_SGC_z3.gz "$base/M_BOSS_DR12_SGC_z3_V6C_1_1_1_1_1_1200_2000.matrix.gz"
          for f in external/exp073w_boss/*.gz; do gzip -t "$f"; gzip -dc "$f" > "${f%.gz}"; done
          echo 'a308dc562d1a7224cefcf91d32580877929e0daa33806517e0d2d53710236827  external/exp073w_boss/W_NGC_z3' | sha256sum -c -
          echo '2a542a2d48f3e8c8299f58a885d5273238e4ade32c0f0de020d8b9f23afe7759  external/exp073w_boss/W_SGC_z3' | sha256sum -c -
          echo '3ac30e68f79deee59963c5c52f7585e0cde495393963210a3922c1c62513a042  external/exp073w_boss/M_NGC_z3' | sha256sum -c -
          echo '3ac30e68f79deee59963c5c52f7585e0cde495393963210a3922c1c62513a042  external/exp073w_boss/M_SGC_z3' | sha256sum -c -
      - name: Execute frozen canonical 8193 to 16385 support refinement with telemetry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch artifacts
          : > artifacts/telemetry.log
          ( while true; do echo "TELEMETRY ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) $(awk '/^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree):/ {printf "%s%s=%s%s ",$1,$2,$3,$4} END {print ""}' /proc/meminfo) top=$(ps -eo rss,comm --sort=-rss | sed -n '2p' | xargs)" >> artifacts/telemetry.log; sleep 10; done ) & MON=$!
          trap 'kill $MON 2>/dev/null || true' EXIT
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/post_jm_next_support_canonical_one_live_refinement_v0_1.py \
            --jm-authority docs/dsir4/authority/EXP073JM_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_FOURTH_REFINEMENT_NOT_CONVERGED_V0_2.json \
            --canonical-16385-authority docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_16385_V0_1.json \
            --recovered-jl-script ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py \
            --ir-script ci/exp073ir_article3_real_layerb_common_response_v0_1.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --request-plan-script ci/recovered_exp073jl_response_blind_request_plan_audit_v0_1.py \
            --request-plan-authority docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json \
            --parent-root inputs/parent --parent-authority docs/dsir4/authority/EXP073IQ_ARTICLE3_REAL_LAYERA_SUPPORT_PASS_V0_1.json --manifest "$MANIFEST" --angular-root inputs/angular --expim-root inputs/expim --boss-root external/exp073w_boss \
            --source external/des_nz/source.fits --lens external/des_nz/lens.fits --camb-root external/camb --expz2-script ci/exp073z2_article3_des_radial_kernel_stable_direct_v0_2.py --exp073iq-script ci/exp073iq_article3_real_layera_support_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --coarse docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt \
            --capacity-patch-record artifacts/capacity_patch.json --scratch scratch --out artifacts/result.json
          kill $MON 2>/dev/null || true; wait $MON 2>/dev/null || true; trap - EXIT
          python ci/post_jm_next_support_terminal_validator_v0_1.py --input artifacts/result.json --out artifacts/terminal_validation.json
      - name: Upload terminal receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-jm-next-support-canonical-8193-to-16385-v0-1
          path: |
            artifacts/result.json
            artifacts/terminal_validation.json
            artifacts/capacity_patch.json
            artifacts/history_patch.json
            artifacts/telemetry.log
          if-no-files-found: warn
          retention-days: 90
