name: Exp073CQ Wm_S3 missing29-38 diagnostic resume resource v0.1
on:
  push:
    paths: ['launch/exp073cq_wm_s3_missing29_38_resource_v0_1.json']
permissions: {contents: write, actions: read}
concurrency: {group: dsir-home-exp073cq-missing29-38, cancel-in-progress: false}
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  PYTHONUNBUFFERED: '1'
  DSIR_CHECKPOINT_QUERY_ATTEMPTS: '7'
  DSIR_CHECKPOINT_FETCH_ATTEMPTS: '7'
  DSIR_CHECKPOINT_PUSH_ATTEMPTS: '7'
  DSIR_CHECKPOINT_GIT_TIMEOUT_SECONDS: '120'
jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fail-closed frozen authorization and runner exclusivity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f ci/exp073cq_wm_s3_missing29_38_resource_v0_1.activation.json
          python3 - <<'PY'
          import json,subprocess
          a=json.load(open('ci/exp073cq_wm_s3_missing29_38_resource_v0_1.activation.json'))
          assert a['experiment']=='Exp073CQ' and a['state']=='AUTHORIZED_AFTER_HOSTED_STATIC_AUDIT_PASS'
          def last(p): return subprocess.check_output(['git','log','-1','--format=%H','--',p],text=True).strip()
          assert a['prereg_commit']==last('preregistration/2026-09-03_exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.md')
          assert a['sync_commit']==last('ci/dsir_checkpoint_git_sync_v0_3.sh')
          assert a['driver_commit']==last('ci/exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.py')
          assert a['workflow_commit']==last('.github/workflows/exp073cq-wm-s3-missing29-38-diagnostic-resume-resource-v0-1.yml')
          assert a['binding_commit']==last('experiments/073cq_wm_s3_missing29_38_resource_v0_1_binding.json')
          assert a['audit_status']=='PASS_EXP073CQ_STATIC_PARENT_IMPORT_DIAGNOSTIC_RESUME_AUDIT_V0_1'
          PY
          python3 - <<'PY'
          import json,os,urllib.request
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID'])
          for status in ('queued','in_progress'):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100',headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: d=json.load(r)
              others=[x for x in d.get('workflow_runs',[]) if int(x['id'])!=current]
              assert not others,(status,[(x['id'],x['name']) for x in others])
          PY
  checkpointed-resource:
    needs: authorize
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact runtime lineage
        shell: bash
        run: |
          set -euo pipefail
          echo "DSIR_DRIVER_COMMIT=$(git log -1 --format=%H -- ci/exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.py)" >> "$GITHUB_ENV"
          echo "DSIR_WORKFLOW_COMMIT=$(git log -1 --format=%H -- .github/workflows/exp073cq-wm-s3-missing29-38-diagnostic-resume-resource-v0-1.yml)" >> "$GITHUB_ENV"
          echo "DSIR_BINDING_COMMIT=$(git log -1 --format=%H -- experiments/073cq_wm_s3_missing29_38_resource_v0_1_binding.json)" >> "$GITHUB_ENV"
      - name: Reuse or bootstrap proven NaMaster 2.7 environment
        shell: bash
        run: |
          set -euo pipefail
          MF="$HOME/.cache/dsir-miniforge"; ENV="$HOME/.cache/dsir-nmt27"
          if ! test -x "$MF/bin/conda"; then mkdir -p "$HOME/.cache"; curl -fL --retry 5 --retry-delay 2 https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o "$RUNNER_TEMP/miniforge.sh"; bash "$RUNNER_TEMP/miniforge.sh" -b -p "$MF"; fi
          if ! test -x "$ENV/bin/python"; then "$MF/bin/conda" create -y -p "$ENV" -c conda-forge python=3.11 namaster=2.7 numpy; fi
          "$ENV/bin/python" - <<'PY'
          import importlib.metadata
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          PY
          echo "NMT_PY=$ENV/bin/python" >> "$GITHUB_ENV"
      - name: Restore or initialize successor checkpoint first
        shell: bash
        run: |
          set -euo pipefail
          CQ="$RUNNER_TEMP/exp073cq-checkpoint"
          bash ci/dsir_checkpoint_git_sync_v0_3.sh restore "$CQ" checkpoints/exp073cq-wm-s3-missing29-38-resource-v0-1 ALLOW_ABSENT
          "$NMT_PY" ci/exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.py init --checkpoint-dir "$CQ" --source-head "$GITHUB_SHA" --driver-commit "$DSIR_DRIVER_COMMIT"
      - name: Exact import of immutable Exp073CP band0-28 authority
        shell: bash
        run: |
          set -euo pipefail
          CQ="$RUNNER_TEMP/exp073cq-checkpoint"; P="$RUNNER_TEMP/exp073cp-parent"; BR=checkpoints/exp073cq-wm-s3-missing29-38-resource-v0-1
          if ! test -f "$CQ/upstream/receipt.json"; then
            bash ci/dsir_checkpoint_git_sync_v0_3.sh restore "$P" checkpoints/exp073cp-wm-s3-full39-resource-v0-1 025629d9bb7b113bd0548ff6a32c6ee5812ae245
            "$NMT_PY" ci/exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.py import-parent --checkpoint-dir "$CQ" --parent-dir "$P"
            bash ci/dsir_checkpoint_git_sync_v0_3.sh push "$CQ" "$BR" imported-parent-band00-28
          fi
          "$NMT_PY" ci/exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.py validate --checkpoint-dir "$CQ"
      - name: Compile or restore frozen complete-band helper checkpoint
        shell: bash
        run: |
          set -euo pipefail
          CQ="$RUNNER_TEMP/exp073cq-checkpoint"; BR=checkpoints/exp073cq-wm-s3-missing29-38-resource-v0-1
          mkdir -p build "$CQ/build"
          if test -f "$CQ/build/exp073ca.so" -a -f "$CQ/build/receipt.json"; then
            cp "$CQ/build/exp073ca.so" build/exp073ca.so
            WANT=$(python3 -c 'import json; print(json.load(open("'"$CQ"'/build/receipt.json"))["sha256"])')
            test "$WANT" = "$(sha256sum build/exp073ca.so | awk '{print $1}')"
          else
            gcc -O2 -shared -fPIC -fopenmp -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize ci/exp073ca_stream_general_coupling_range_v0_1.c -o build/exp073ca.so -ldl -lm
            cp build/exp073ca.so "$CQ/build/exp073ca.so"
            "$NMT_PY" - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'exp073cq-checkpoint'; c=json.load(open(root/'contract.json')); p=root/'build/exp073ca.so'
          (root/'build/receipt.json').write_text(json.dumps({'stage':'compiled-helper','complete':True,'contract_fingerprint':c['fingerprint'],'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source':'ci/exp073ca_stream_general_coupling_range_v0_1.c'},sort_keys=True,indent=2)+'\n')
          PY
            bash ci/dsir_checkpoint_git_sync_v0_3.sh push "$CQ" "$BR" compiled-helper
          fi
      - name: Missing29-38 bounded eight-worker compute with per-band durability and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          "$NMT_PY" ci/exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.py compute --checkpoint-dir "$RUNNER_TEMP/exp073cq-checkpoint" --ca-so build/exp073ca.so --branch checkpoints/exp073cq-wm-s3-missing29-38-resource-v0-1 --sync-script ci/dsir_checkpoint_git_sync_v0_3.sh
      - name: Frozen final classification
        shell: bash
        run: |
          set -euo pipefail
          CQ="$RUNNER_TEMP/exp073cq-checkpoint"; BR=checkpoints/exp073cq-wm-s3-missing29-38-resource-v0-1
          set +e; "$NMT_PY" ci/exp073cq_wm_s3_missing29_38_diagnostic_resume_resource_v0_1.py finalize --checkpoint-dir "$CQ"; rc=$?; set -e
          bash ci/dsir_checkpoint_git_sync_v0_3.sh push "$CQ" "$BR" frozen-final
          mkdir -p data/derived/g7
          cp "$CQ/contract.json" data/derived/g7/exp073cq_contract_v0_1.json
          cp "$CQ/final/receipt.json" data/derived/g7/exp073cq_final_receipt_v0_1.json
          cp "$CQ/telemetry/resume29_38.json" data/derived/g7/exp073cq_telemetry_v0_1.json
          if test -f "$CQ/diagnostics/first_failure.json"; then cp "$CQ/diagnostics/first_failure.json" data/derived/g7/exp073cq_diagnostic_v0_1.json; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073cq-wm-s3-missing29-38-resource-${{ github.sha }}
          path: data/derived/g7/exp073cq_*.json
          retention-days: 90
          compression-level: 0
