name: Exp073BU science activation hosted audit v0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/activate_exp073bu_science_activation_audit_v0_1.txt'

permissions:
  contents: write

env:
  ORIGINAL_PREREG_BLOB: '816542c7eb7a8ba4e72d6e01228aa62d05c7c805'
  ACTIVATION_PREREG_BLOB: 'ffb8e97f2012b962d8d38d9a851ad88a93a39960'
  DRIVER_BLOB: '5c8d5d3463e455389a1ca3df2639bf06a3b7b603'
  HELPER_BLOB: '73ef04c479547dc8e2e89c9f511f1a55fae3ed64'
  ADAPTER_BLOB: 'dafe86086a470c852106f0d4ecccbda1d389e397'
  COMPONENT_BLOBS_BLOB: '0d6d6e882d1a4cf1ff79fbe8227a4f2b460c7e40'
  DOWNSTREAM_BLOB: 'acafb095deafae7602101d8305e239341010ba79'
  LAUNCHER_BLOB: '1a54ad89d32dd217443bc3062a6215bf10e8b17d'
  CX_RECOVERY_BLOB: '43b658028f74b7a0b52fca8261beeb58026d8ffc'
  SCIENCE_WORKFLOW_BLOB: '62774cbbe8073aeeb3f66e04a50c891173f91a23'

jobs:
  hosted-static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact immutable blob binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073bu_article3_wm_s3_fresh_independent_ab_exact_repeatability_v0_1_prereg.md)" = "${ORIGINAL_PREREG_BLOB}"
          test "$(git hash-object experiments/073bu_wm_s3_selfhosted_science_activation_v0_1_prereg.md)" = "${ACTIVATION_PREREG_BLOB}"
          test "$(git hash-object ci/exp073bu_wm_s3_fresh_ab_production_v0_1.py)" = "${DRIVER_BLOB}"
          test "$(git hash-object ci/exp073bu_fresh_wm_s3_pcl_v0_1.py)" = "${HELPER_BLOB}"
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py)" = "${ADAPTER_BLOB}"
          test "$(git hash-object ci/exp073cv_component_blobs_v0_1.json)" = "${COMPONENT_BLOBS_BLOB}"
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_v0_1.c)" = "${DOWNSTREAM_BLOB}"
          test "$(git hash-object ci/exp073bu_wm_s3_science_launcher_v0_1.py)" = "${LAUNCHER_BLOB}"
          test "$(git hash-object recovery/2026-09-04_exp073cx_v0_4_a1_activation_readiness_pass.md)" = "${CX_RECOVERY_BLOB}"
          test "$(git hash-object .github/workflows/exp073bu-wm-s3-fresh-ab-exact-science-v0-1.yml)" = "${SCIENCE_WORKFLOW_BLOB}"
          grep -Fq 'A1_EXP073BU_ACTIVATION_READINESS_PASS' recovery/2026-09-04_exp073cx_v0_4_a1_activation_readiness_pass.md
          echo PASS_EXP073BU_SCIENCE_ACTIVATION_EXACT_BLOB_BINDING_V0_1

      - name: Static fail-closed science-contract audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/exp073bu_wm_s3_science_launcher_v0_1.py ci/exp073bu_wm_s3_fresh_ab_production_v0_1.py
          python3 - <<'PY'
          from pathlib import Path
          prereg=Path('experiments/073bu_article3_wm_s3_fresh_independent_ab_exact_repeatability_v0_1_prereg.md').read_text()
          activation=Path('experiments/073bu_wm_s3_selfhosted_science_activation_v0_1_prereg.md').read_text()
          launcher=Path('ci/exp073bu_wm_s3_science_launcher_v0_1.py').read_text()
          science=Path('.github/workflows/exp073bu-wm-s3-fresh-ab-exact-science-v0-1.yml').read_text()
          driver=Path('ci/exp073bu_wm_s3_fresh_ab_production_v0_1.py').read_text()

          for token in ['### `PASS`','### `SCIENTIFIC_REPEATABILITY_FAIL`','### `INFRASTRUCTURE_INCOMPLETE`','### `BLOCKED`','PASS_EXP073BU_WM_S3_FRESH_AB_EXACT_REPEATABILITY_V0_1','numpy.array_equal(A, B)','No tolerance']:
              assert token in prereg, token
          for token in ["'PASS'", "'SCIENTIFIC_REPEATABILITY_FAIL'", "'INFRASTRUCTURE_INCOMPLETE'", "'BLOCKED'", 'PASS_EXP073BU_WM_S3_FRESH_AB_EXACT_REPEATABILITY_V0_1', 'np.array_equal', 'whole_canonical_sha256_equal', "for replica in ('A', 'B')"]:
              assert token in launcher, token
          assert '--replica' in launcher and 'subprocess.run' in launcher
          assert all(x not in launcher for x in ['np.allclose','np.isclose','rtol','atol'])
          assert 'np.array_equal' in driver and all(x not in driver for x in ['allclose','isclose','rtol','atol'])
          assert 'ACTIVATE_EXP073BU_WM_S3_V0_1' in science
          assert 'workflow_dispatch:' in science
          assert '\n  schedule:' not in science and '\n  push:' not in science and '\n  pull_request:' not in science
          assert science.count('runs-on: [self-hosted, Linux, X64]') == 1
          assert 'Exp073BU science A then B' in science
          assert 'flock -n 9' in science
          assert 'PASS_EXP073BU_LIVE_ACTIONS_HOME_EXCLUSIVITY' in science
          assert 'docs/CURRENT_PROCESS.md' in science
          assert 'checkpoints/exp073bu-wm-s3-a-v0-1' in activation
          assert 'checkpoints/exp073bu-wm-s3-b-v0-1' in activation
          assert 'does **not** change the science operator' in activation
          print('PASS_EXP073BU_SCIENCE_ACTIVATION_STATIC_CONTRACT_AUDIT_V0_1')
          PY

      - name: Write immutable hosted-audit recovery authority
        shell: bash
        run: |
          set -euo pipefail
          path='recovery/2026-09-04_exp073bu_science_activation_audit_v0_1_pass.md'
          cat > "$path" <<EOF
          # DSIR immutable recovery — Exp073BU science activation hosted audit v0.1 PASS

          Date: 2026-09-04. Scope: DSIR only; RTK/RQIR excluded.

          Hosted audit source head: ${GITHUB_SHA}.

          PASS_EXP073BU_SCIENCE_ACTIVATION_HOSTED_AUDIT_V0_1

          science_workflow_blob=${SCIENCE_WORKFLOW_BLOB}
          activation_prereg_blob=${ACTIVATION_PREREG_BLOB}
          original_science_prereg_blob=${ORIGINAL_PREREG_BLOB}
          production_driver_blob=${DRIVER_BLOB}
          science_launcher_blob=${LAUNCHER_BLOB}
          fresh_helper_blob=${HELPER_BLOB}
          exact_adapter_blob=${ADAPTER_BLOB}
          component_blobs_blob=${COMPONENT_BLOBS_BLOB}
          downstream_blob=${DOWNSTREAM_BLOB}
          cx_v0_4_a1_recovery_blob=${CX_RECOVERY_BLOB}

          Classification: hosted support/activation audit only, accounting +0/+0. No DES-scale Wm_S3 numerical science was executed and no Wm_S3 authority was created.

          The science workflow is manual `workflow_dispatch` only. It is authorized for explicit activation only after this recovery commit is present on `main`; it must still pass its fresh hosted and live self-hosted exclusivity/process-ledger gates before A/B numerics.
          EOF
          grep -Fq 'PASS_EXP073BU_SCIENCE_ACTIVATION_HOSTED_AUDIT_V0_1' "$path"
          grep -Fq "science_workflow_blob=${SCIENCE_WORKFLOW_BLOB}" "$path"

      - name: Commit hosted-audit PASS authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/2026-09-04_exp073bu_science_activation_audit_v0_1_pass.md
          if git diff --cached --quiet; then
            echo 'Hosted-audit recovery already identical.'
          else
            git commit -m 'record Exp073BU science activation hosted audit PASS'
            git push origin HEAD:main
          fi
          echo PASS_EXP073BU_SCIENCE_ACTIVATION_HOSTED_AUDIT_V0_1
