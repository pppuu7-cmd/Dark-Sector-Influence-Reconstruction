name: Exp073EN WW_S0_S0 file-backed full-resolution A/B exact science v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073en-ww-s0-s0-filebacked-full-resolution-ab-science-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dsir-exp073en-ww-s0-s0-filebacked-full-resolution-ab-science-v0-1
  cancel-in-progress: false

env:
  FROZEN_SOURCE_HEAD: 'de83e20a68f79ccf25b89b0d33eb4206e294c757'
  CONTRACT_FP: 'b7845df5ce4bc2bd730461476b7ff0831512003ceb5b3558436005c9876bd251'
  R1_ARTIFACT_ID: '9720335366'
  R1_DIGEST: 'sha256:ff87d8fc7d53b16b786a4eb3d6ffeb103676efb8a548223a187b9f59689f8abd'
  DRIVER_SHA256: '0b7a0a2336a89dcea63060d4049d09fabacc9c5e75fad870d2599efd27d0e63b'
  ADAPTER_SHA256: 'ab85f76e724a9861837299ce29c0961e4adcd09954b9522d678d5e610267f641'
  DRIVER_BLOB: 'baff99c2b9d7866432bebda5844d2d450324d08a'
  ADAPTER_BLOB: 'd6f20600d6a206dd9fbb254b382e71a49c6b3c07'
  DOWNSTREAM_BLOB: 'be4f381de4c5c043a9c0fcd107e63ef3f2079578'
  TASKRUNNER_BLOB: '050ed7dd3387c4fb031f877825e6b3f4d4ce3ef2'
  PATCH_BLOB: 'f1eb886ca8af2584a9f621f333cd8be3c6cdb967'
  EM_GENERATOR_BLOB: 'bd1795f2a2c2cf80341f212996eb8278e0be53d9'
  EM_COMPARE_BLOB: 'f0de92f3f121592b6d139eb7d948426946d901d1'
  PREREG_BLOB: '02f22926705cca05d128b1cea8ca7a3a3c73ef3b'
  PATCH_SHA256: '9a80a756960afa8b4ddf61b5fbba7fba6ad5ed9ac919e093bb1365a636c789f0'
  NAMASTER_HEAD: '24365fa59a38c15732f4f37e8b29265b75c442d5'
  EM_ARTIFACT_ID: '9977333691'
  EM_ARTIFACT_DIGEST: 'sha256:0ece75e489b6f413d96e85a099e42db96b5d5acdc03c3ee6901273357762cda1'

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen run head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind Exp073EM PASS and Exp073EN frozen identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073en_ww_s0_s0_filebacked_full_resolution_ab_science_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(git rev-parse HEAD:patches/namaster-v2.7-dsir-filebacked-mcm-v0.1.patch)" = "$PATCH_BLOB"
          test "$(git rev-parse HEAD:ci/exp073em_generate_namaster27_storage_reference_v0_1.py)" = "$EM_GENERATOR_BLOB"
          test "$(git rev-parse HEAD:ci/exp073em_compare_namaster27_storage_exact_v0_1.py)" = "$EM_COMPARE_BLOB"
          test "$(git rev-parse HEAD:ci/exp073dq_ww_s0_s0_durable_ab_production_v0_1.py)" = "$DRIVER_BLOB"
          test "$(git rev-parse HEAD:ci/exp073do_ww_s0_s0_production_exact_adapter_v0_1.py)" = "$ADAPTER_BLOB"
          test "$(git rev-parse HEAD:ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c)" = "$DOWNSTREAM_BLOB"
          test "$(git rev-parse HEAD:ci/exp073aa_article3_des_angular_task_runner_v0_1.py)" = "$TASKRUNNER_BLOB"
          test "$(sha256sum patches/namaster-v2.7-dsir-filebacked-mcm-v0.1.patch | awk '{print $1}')" = "$PATCH_SHA256"
          test "$(sha256sum ci/exp073dq_ww_s0_s0_durable_ab_production_v0_1.py | awk '{print $1}')" = "$DRIVER_SHA256"
          test "$(sha256sum ci/exp073do_ww_s0_s0_production_exact_adapter_v0_1.py | awk '{print $1}')" = "$ADAPTER_SHA256"
          bash -n ci/exp073en_home_filebacked_fullres_v0_1.sh

          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          aid=os.environ['EM_ARTIFACT_ID']; expected=os.environ['EM_ARTIFACT_DIGEST']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}',headers=h)
          with urllib.request.urlopen(req) as r: a=json.load(r)
          assert not a.get('expired'),a
          assert a.get('digest')==expected,(a.get('digest'),expected)
          print('PASS_EXP073EN_HOSTED_EM_ARTIFACT_BIND')
          PY

          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; bad=[]
          for status in ('queued','in_progress'):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100',headers=h)
              with urllib.request.urlopen(req) as r: runs=json.load(r).get('workflow_runs',[])
              for run in runs:
                  if int(run['id'])==current: continue
                  req2=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100",headers=h)
                  with urllib.request.urlopen(req2) as r2: jobs=json.load(r2).get('jobs',[])
                  if any(('self-hosted' in (j.get('labels') or [])) or j.get('runner_name')=='DSIR-HOME-PC' for j in jobs): bad.append(run['id'])
          if bad: raise SystemExit('BLOCKED competing self-hosted runs '+repr(sorted(set(bad))))
          print('PASS_EXP073EN_HOSTED_NONCOMPETITION')
          PY

  home-filebacked-science-ab:
    needs: hosted-preflight
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Checkout frozen run head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run exact-qualified file-backed WW_S0_S0 A/B science candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ci/exp073en_home_filebacked_fullres_v0_1.sh

      - name: Collect compact evidence even on interruption/failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/.cache/dsir/exp073en-ww-s0-s0-filebacked-ab-v0-1"
          OUT="$RUNNER_TEMP/exp073en-artifact"
          mkdir -p "$OUT"
          ROOT="$ROOT" OUT="$OUT" python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['ROOT']); out=Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True)
          if root.exists():
              for p in root.rglob('*.json'):
                  try:
                      rel=p.relative_to(root); q=out/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
                  except OSError: pass
              for rep in ('A','B'):
                  p=root/'checkpoints'/rep/'exact_route'/'selected_ee.bin'
                  if p.exists():
                      q=out/'checkpoints'/rep/'exact_route'/'selected_ee.bin'; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
              for name in ('A_driver.log','B_driver.log','ab_compare_stdout.txt','resource_telemetry.log','tiny.stderr'):
                  p=root/name
                  if p.exists(): shutil.copy2(p,out/name)
              act=root/'local_exp073em_activation'
              if act.exists():
                  for p in act.glob('*.log'):
                      q=out/'local_exp073em_activation'/p.name; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
          PY

      - name: Upload Exp073EN terminal/partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073en-ww-s0-s0-filebacked-fullres-evidence-v0-1
          path: ${{ runner.temp }}/exp073en-artifact
          if-no-files-found: warn
          retention-days: 30
