name: layerb-16385-32769-coarse-recovery-v02-static-audit-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-16385-32769-coarse-recovery-v02-static-audit-v0-1.yml'
      - '.github/workflows/layerb-16385-32769-coarse-recovery-v0-2.yml'
      - 'docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_2.json'

permissions:
  contents: read

jobs:
  source-science-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen sources and science semantics
        run: |
          set -euo pipefail
          mkdir -p out_source
          python3 - <<'PY' | tee out_source/source.txt
          import json,subprocess
          c=json.load(open('docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_2.json'))
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          r=c['retained_v01_science_contract']
          assert blob('scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py')==r['history_suppression_patch_git_blob']
          assert blob('ci/layerb_16385_to_32769_canonical_chunk_recovery_v0_1.py')==r['recovery_classifier_wrapper_git_blob']
          assert blob('ci/layerb_16385_32769_chunk_role_operand_v0_1.py')==r['role_operand_worker_git_blob']
          assert blob('ci/layerb_16385_32769_chunk_operand_adapter_v0_1.py')==r['operand_adapter_git_blob']
          assert blob('ci/layerb_16385_to_32769_chunk_terminal_consumer_v0_1.py')==r['terminal_consumer_git_blob']
          s=c['scientific_semantics']; assert s=={'h':0.0001,'relative_tolerance':0.001,'strict_less_than':True,'native_k_per_decade_for_pk':20.0,'lookup_relative_tolerance':1e-12,'interpolation':'centered-cubic','parent_retained_count':107,'invalid_row_fraction_max':0.05,'retained_after_layer_b_min':15,'unsupported_target_evaluations_required':0,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          print('LAYERB_16385_32769_RECOVERY_V02_FROZEN_SOURCE_SCIENCE_PASS_PLUS_0_PLUS_0')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: recovery-v02-static-source, path: out_source/, retention-days: 90}

  topology-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify coarse-only retry and fine no-recompute topology
        run: |
          set -euo pipefail
          mkdir -p out_topology
          python3 - <<'PY' | tee out_topology/topology.txt
          from pathlib import Path
          w=Path('.github/workflows/layerb-16385-32769-coarse-recovery-v0-2.yml').read_text()
          assert 'matrix:\n        role: [reference, alpha_minus, beta_plus, beta_minus]' in w
          assert 'max-parallel: 4' in w
          assert '--grid coarse' in w
          assert '--plan inputs/control/plan/plan.json' in w
          assert 'DSIR_CHUNK_PLAN:' in w and 'inputs/control/plan/plan.json' in w
          assert 'classiv_k_output_history_suppression_patch_v0_1.py external_class safe/history_patch.json' in w
          assert 'scientific_parameters_changed' in w
          assert '10299405397' in w and '10298479524' in w and '10298822640' in w and '10299311082' in w
          assert 'recovery_provenance_rebind_only' in w and 'recovery_response_payload_sha256' in w
          assert '--grid fine' not in w
          assert 'independent-terminal-verifier:' in w
          print('LAYERB_16385_32769_RECOVERY_V02_TOPOLOGY_PASS_PLUS_0_PLUS_0')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: recovery-v02-static-topology, path: out_topology/, retention-days: 90}

  failure-binding-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify V0.1 failed before science and delta is path-only
        run: |
          set -euo pipefail
          mkdir -p out_failure
          python3 - <<'PY' | tee out_failure/failure.txt
          import json
          c=json.load(open('docs/dsir4/contracts/LAYERB_16385_32769_COARSE_RECOVERY_CONTRACT_V0_2.json'))
          f=json.load(open('docs/dsir4/authority/LAYERB_16385_32769_COARSE_RECOVERY_V01_CONTROL_PATH_FAILURE_V0_1.json'))
          assert f['classification']=='LAYERB_16385_32769_COARSE_RECOVERY_V01_CONTROL_PATH_FAIL_PLUS_0_PLUS_0'
          assert f['causal_failure']['class_compute_reached'] is False and f['causal_failure']['scientific_response_read'] is False and f['causal_failure']['convergence_metric_computed'] is False
          d=c['allowed_executable_delta']; assert d['worker_plan_argument_from']=='inputs/control/plan.json' and d['worker_plan_argument_to']=='inputs/control/plan/plan.json'
          assert d['finalizer_plan_environment_from']=='inputs/control/plan.json' and d['finalizer_plan_environment_to']=='inputs/control/plan/plan.json'
          assert c['authorization']['fine_recompute_authorized'] is False and c['authorization']['coarse_recompute_authorized'] is True
          print('LAYERB_16385_32769_RECOVERY_V02_FAILURE_BINDING_PASS_PLUS_0_PLUS_0')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: recovery-v02-static-failure, path: out_failure/, retention-days: 90}

  finalizer:
    if: always()
    needs: [source-science-audit, topology-audit, failure-binding-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'recovery-v02-static-*', path: downloaded}
      - name: Independently require all receipts
        run: |
          set -euo pipefail
          mkdir -p final
          python3 - <<'PY'
          import json
          from pathlib import Path
          text='\n'.join(p.read_text() for p in Path('downloaded').rglob('*.txt'))
          req=['LAYERB_16385_32769_RECOVERY_V02_FROZEN_SOURCE_SCIENCE_PASS_PLUS_0_PLUS_0','LAYERB_16385_32769_RECOVERY_V02_TOPOLOGY_PASS_PLUS_0_PLUS_0','LAYERB_16385_32769_RECOVERY_V02_FAILURE_BINDING_PASS_PLUS_0_PLUS_0']
          missing=[x for x in req if text.count(x)!=1]
          d={'schema':'LAYERB_16385_32769_RECOVERY_V02_STATIC_AUDIT_V0_1','classification':'LAYERB_16385_32769_RECOVERY_V02_STATIC_AUDIT_PASS_PLUS_0_PLUS_0' if not missing else 'LAYERB_16385_32769_RECOVERY_V02_STATIC_AUDIT_FAIL_PLUS_0_PLUS_0','effect':'+0/+0','missing_or_duplicate_receipts':missing,'scientific_response_read':False,'scientific_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          Path('final/static.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n'); print(d['classification']); raise SystemExit(0 if not missing else 47)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: recovery-v02-static-final, path: final/, retention-days: 90}
