name: Exp073DN WW_S0_S0 checkpoint architecture binding v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073dn-ww-s0-s0-checkpoint-architecture-binding-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsir-exp073dn-ww-s0-s0-checkpoint-architecture-binding-v0-1
  cancel-in-progress: false
jobs:
  hosted-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Run frozen source-only architecture audit
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/exp073dn_ww_s0_s0_checkpoint_architecture_binding_v0_1.py | tee exp073dn_stdout.txt
          grep -Fx 'PASS_EXP073DN_REQUIRE_WW_SPECIFIC_CHECKPOINT_ADAPTER_V0_1' exp073dn_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('exp073dn_ww_s0_s0_checkpoint_architecture_binding_v0_1.json'))
          assert d['token']=='PASS_EXP073DN_REQUIRE_WW_SPECIFIC_CHECKPOINT_ADAPTER_V0_1'
          assert d['science_gate_scored'] is False and d['ww_authority_created'] is False
          assert d['direct_wm_driver_reuse_authorized'] is False
          assert d['ww_specific_adapter_required'] is True
          assert all(d['checks'].values())
          PY
      - name: Hash evidence
        run: sha256sum exp073dn_ww_s0_s0_checkpoint_architecture_binding_v0_1.json exp073dn_stdout.txt > exp073dn_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exp073dn-ww-s0-s0-checkpoint-architecture-binding-${{ github.run_id }}-${{ github.sha }}
          path: |
            exp073dn_ww_s0_s0_checkpoint_architecture_binding_v0_1.json
            exp073dn_stdout.txt
            exp073dn_sha256.txt
          if-no-files-found: error
          retention-days: 90
