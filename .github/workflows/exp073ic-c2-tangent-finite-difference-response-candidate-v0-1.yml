name: Exp073IC C2 Tangent Finite Difference Response Candidate v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073ic-c2-tangent-finite-difference-response-candidate-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  response:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen IC prereg and authority artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073IC_C2_TANGENT_FINITE_DIFFERENCE_RESPONSE_CANDIDATE_V0_1.md)" = '9e1235a48a4288bb2083d69084f1cae7d79847bb'
          test "$(git hash-object docs/dsir4/prereg/EXP073HX_C2_TANGENT_RUNTIME_PLAN_STATIC_AUDIT_V0_1.md)" = 'e00d972504abb2ec102f9fc09f0e57af1bccf33e'
          mkdir -p /tmp/ic/hw /tmp/ic/ib /tmp/ic/out
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10062705321/zip" -o /tmp/ic/hw.zip
          test "$(sha256sum /tmp/ic/hw.zip | awk '{print $1}')" = '7ea327f0d6e29e4b415c9f66201b266e9015d46a383e8867de94b05665517c00'
          unzip -q /tmp/ic/hw.zip -d /tmp/ic/hw
          test "$(sha256sum /tmp/ic/hw/dsir_c2_reference_deltam_bridge_v0_1.jsonl | awk '{print $1}')" = '2b6eb07c99273292bcb2cf929295071e401e81ed51cfe3f4c3b19d5a395518fb'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10065286473/zip" -o /tmp/ic/ib.zip
          test "$(sha256sum /tmp/ic/ib.zip | awk '{print $1}')" = '965e921224f516e76e9cf2d2ac84ed51a5027b97d79c73c87620d55a83011201'
          unzip -q /tmp/ic/ib.zip -d /tmp/ic/ib
          grep -Fxq 'operation_order=hconf_then_velocity_term_then_add' /tmp/ic/ib/AUTHORITY.txt
          grep -Fxq 'mapped_tangent_coordinate=true' /tmp/ic/ib/AUTHORITY.txt
      - name: Compute frozen response candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,hashlib,pathlib
          hw=pathlib.Path('/tmp/ic/hw/dsir_c2_reference_deltam_bridge_v0_1.jsonl')
          ib=pathlib.Path('/tmp/ic/ib'); out=pathlib.Path('/tmp/ic/out')
          ref=[json.loads(x) for x in hw.read_text().splitlines()]
          assert len(ref)==28
          vals={}
          for lab in ['alpha_m1e4','alpha_m1e3','alpha_m1e2','beta_p1e4','beta_m1e4','beta_p1e3','beta_m1e3','beta_p1e2','beta_m1e2']:
            rows=[json.loads(x) for x in (ib/(lab+'.jsonl')).read_text().splitlines()]
            assert len(rows)==28
            vals[lab]=rows
          scales=[('1e4',float('1e-4'),'alpha_m1e4','beta_p1e4','beta_m1e4'),('1e3',float('1e-3'),'alpha_m1e3','beta_p1e3','beta_m1e3'),('1e2',float('1e-2'),'alpha_m1e2','beta_p1e2','beta_m1e2')]
          rows=[]
          for i,r0 in enumerate(ref):
            rid=f'z{i//4:02d}k{i%4:02d}'; assert r0['request_id']==rid
            R=float.fromhex(r0['Delta_m_hex']); assert math.isfinite(R)
            row={'request_id':rid}
            for tag,h,al,bp,bm in scales:
              ra, rp, rm = vals[al][i], vals[bp][i], vals[bm][i]
              assert ra['request_id']==rp['request_id']==rm['request_id']==rid
              A=float.fromhex(ra['Delta_m_hex']); Bp=float.fromhex(rp['Delta_m_hex']); Bm=float.fromhex(rm['Delta_m_hex'])
              assert all(math.isfinite(x) for x in (A,Bp,Bm))
              alpha_numerator=A-R
              alpha_denominator=-h
              da=alpha_numerator/alpha_denominator
              beta_numerator=Bp-Bm
              beta_denominator=2.0*h
              db=beta_numerator/beta_denominator
              assert math.isfinite(da) and math.isfinite(db)
              row[f'dDelta_dalpha_h{tag}_hex']=da.hex()
              row[f'dDelta_dbeta_h{tag}_hex']=db.hex()
            rows.append(row)
          p=out/'tangent_response_candidates.jsonl'
          with p.open('w',encoding='utf-8',newline='\n') as f:
            for r in rows: f.write(json.dumps(r,separators=(',',':'))+'\n')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'response.sha256').write_text(sha+'\n')
          print('response_jsonl_sha256='+sha)
          print('record_count=28')
          PY
          cat > /tmp/ic/out/AUTHORITY.txt <<EOF
          hypothesis_id=C2_IDE_LOCAL_TANGENT_CONE
          source_hw_run=34242852819
          source_hw_artifact=10062705321
          source_ib_v0_2_run=34249229753
          source_ib_v0_2_job=102139059309
          source_ib_v0_2_artifact=10065286473
          ic_head=${GITHUB_SHA}
          ic_run=${GITHUB_RUN_ID}
          ic_prereg_blob=9e1235a48a4288bb2083d69084f1cae7d79847bb
          alpha_definition=one_sided_negative
          beta_definition=symmetric
          base_step=1e-4
          control_steps=1e-3,1e-2
          response_candidate_created=true
          tangent_response_ready=false
          prediction_ready=false
          scientific_model_authority_created=false
          G_DOMAIN_MAPPING=NOT_YET_TESTABLE
          EOF
          echo 'PASS_EXP073IC_C2_TANGENT_FINITE_DIFFERENCE_RESPONSE_CANDIDATE_V0_1'
          echo 'classification=TANGENT_RESPONSE_CANDIDATE_PLUS_0_PLUS_0'
          echo 'mapped_reference_coordinate=true'
          echo 'mapped_tangent_coordinate=true'
          echo 'response_candidate_created=true'
          echo 'tangent_response_ready=false'
          echo 'prediction_ready=false'
          echo 'scientific_model_authority_created=false'
          echo 'G_DOMAIN_MAPPING=NOT_YET_TESTABLE'
      - uses: actions/upload-artifact@v4
        with:
          name: exp073ic-c2-tangent-response-candidate-v0-1
          path: /tmp/ic/out/*
          retention-days: 30
          if-no-files-found: error
