name: Exp073P v0.5 hosted join synthetic branch selftest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/exp073p_v0_5_hosted_join_selftest.py'
      - '.github/workflows/exp073p-v0-5-hosted-join-selftest.yml'

permissions:
  contents: read

jobs:
  synthetic-branch-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen evaluator blob is unchanged
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object ci/exp073p_v0_5_hosted_r1_authority_join.py)" = '1fca8a3b45a0b591d9a8fc07c9e5d566a0b11478'
      - name: Run PASS INCOMPLETE INVALID branch controls
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_v0_5_hosted_join_selftest.py | tee exp073p_v05_hosted_join_selftest.json
          grep -q 'PASS_EXP073P_V05_HOSTED_JOIN_SYNTHETIC_BRANCH_SELFTEST' exp073p_v05_hosted_join_selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp073p-v05-hosted-join-selftest-${{ github.sha }}
          path: exp073p_v05_hosted_join_selftest.json
          if-no-files-found: error
          retention-days: 30
