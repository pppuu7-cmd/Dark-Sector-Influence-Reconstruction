name: Exp073X2 Article3 DES n4096 Wm0 split exact repeatability v0.1

on:
  push:
    paths:
      - 'ci/exp073x2_des_n4096_wm0_maskonly_repeatability_v0_1.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-replica:
    strategy:
      fail-fast: false
      matrix:
        replica: [A, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce prospective Exp073X2 freeze
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git log -1 --format=%H -- experiments/073x2_article3_des_n4096_wm0_maskonly_repeatability_v0_1_prereg.md)" = 'efe8a4e17638dfd9568fa710e24f56cd10526c6a'
          test "$(git log -1 --format=%H -- ci/exp073x2_des_n4096_wm0_maskonly_angular_replica_v0_1.py)" = 'df2eecd73ed0d8de080348ba155a2f1a3e84d7e1'
          test "$(git log -1 --format=%H -- ci/exp073x2_compare_replicas_v0_1.py)" = '8ec6f94ea9ddf3cc0a4c98e5af696d28d995b2b3'
          test -f experiments/073x2_article3_des_n4096_wm0_maskonly_repeatability_v0_1_workflow_freeze.md
          SELF_COMMIT="$(git log -1 --format=%H -- .github/workflows/exp073x2-article3-des-n4096-wm0-maskonly-repeatability-v0-1.yml)"
          grep -F "workflow_last_modifying_commit: \`${SELF_COMMIT}\`" experiments/073x2_article3_des_n4096_wm0_maskonly_repeatability_v0_1_workflow_freeze.md
          if test "${GITHUB_EVENT_NAME}" = push; then
            test "$(git diff --name-only HEAD^ HEAD)" = 'ci/exp073x2_des_n4096_wm0_maskonly_repeatability_v0_1.trigger'
          fi
          python3 -m py_compile ci/exp073x2_des_n4096_wm0_maskonly_angular_replica_v0_1.py
          python3 -m py_compile ci/exp073x2_compare_replicas_v0_1.py

      - name: Install exact NaMaster 2.7 lineage
        shell: bash
        run: |
          set -euxo pipefail
          if command -v conda >/dev/null 2>&1; then
            conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy numpy
            echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"
          else
            sudo apt-get update
            sudo apt-get install -y libgsl-dev libfftw3-dev libcfitsio-dev build-essential
            python3 -m venv "${RUNNER_TEMP}/nmt27"
            "${RUNNER_TEMP}/nmt27/bin/python" -m pip install --upgrade pip wheel 'numpy<2.4'
            "${RUNNER_TEMP}/nmt27/bin/python" -m pip install 'pymaster==2.7' healpy astropy
            echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"
          fi

      - name: Download exact hosted R1 authority artifact
        uses: actions/download-artifact@v4
        with:
          name: exp073r1-v08-hosted-wholestream-ef783ca941fb9b9b5f5eae537986c56ff06e6536
          path: external/r1
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33270843577

      - name: Download and bind exact DES Y1 lens mask
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external/des
          curl --fail --location --retry 3 \
            -o external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits \
            'https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/redmagic/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits'
          test "$(stat -c %s external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits)" = '104595840'
          echo 'a519b8522f899e4c33267bb0749f9734f8b7fa760d195636456d370f809a3d55  external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits' | sha256sum -c -

      - name: Inventory runner memory before exact workspace
        shell: bash
        run: |
          set -euxo pipefail
          free -h
          df -h .
          ulimit -a

      - name: Compute and immediately persist one exact replica
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euxo pipefail
          mkdir -p data/derived/g7
          lower="$(printf '%s' "${REPLICA}" | tr '[:upper:]' '[:lower:]')"
          /usr/bin/time -v "${NMT_PY}" ci/exp073x2_des_n4096_wm0_maskonly_angular_replica_v0_1.py \
            --replica "${REPLICA}" \
            --r1-root external/r1 \
            --r1-artifact-digest 'sha256:ff87d8fc7d53b16b786a4eb3d6ffeb103676efb8a548223a187b9f59689f8abd' \
            --lens-mask external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits \
            --output-json "data/derived/g7/exp073x2_replica_${lower}_v0_1.json" \
            --output-npz "data/derived/g7/exp073x2_replica_${lower}_v0_1.npz"

      - name: Enforce replica non-classifying firewall
        shell: bash
        env:
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euxo pipefail
          lower="$(printf '%s' "${REPLICA}" | tr '[:upper:]' '[:lower:]')"
          "${NMT_PY}" - "data/derived/g7/exp073x2_replica_${lower}_v0_1.json" "${REPLICA}" <<'PY'
          import json,sys
          p,r=sys.argv[1:]
          d=json.load(open(p))
          assert d['status']==f'PASS_EXP073X2_REPLICA_{r}_DES_N4096_WM0_MASK_ONLY_V0_1'
          assert d['nside']==4096 and d['bandpower_count']==39
          assert d['ell_axis']=={'first':0,'last':12287,'count':12288}
          assert d['workspace']['te_window_shape']==[39,12288]
          for k in ['direct_signal_catalog_read_for_workspace','physical_support_evaluated','science_gate_scored','retained_coordinates_evaluated','fiducial_P_weighting_used','covariance_read','nuisance_geometry_read','relation_null_read','G8_read','scientific_pass_claimed']:
              assert d[k] is False, k
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          assert d['article3_scientific_readiness_percent']==52
          print('EXP073X2_REPLICA_FIREWALL_PASS',r)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073x2-replica-${{ matrix.replica }}-${{ github.sha }}
          path: |
            data/derived/g7/exp073x2_replica_*.json
            data/derived/g7/exp073x2_replica_*.npz
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  aggregate-repeatability:
    needs: exact-replica
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-enforce prospective freeze
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git log -1 --format=%H -- experiments/073x2_article3_des_n4096_wm0_maskonly_repeatability_v0_1_prereg.md)" = 'efe8a4e17638dfd9568fa710e24f56cd10526c6a'
          test "$(git log -1 --format=%H -- ci/exp073x2_des_n4096_wm0_maskonly_angular_replica_v0_1.py)" = 'df2eecd73ed0d8de080348ba155a2f1a3e84d7e1'
          test "$(git log -1 --format=%H -- ci/exp073x2_compare_replicas_v0_1.py)" = '8ec6f94ea9ddf3cc0a4c98e5af696d28d995b2b3'
          SELF_COMMIT="$(git log -1 --format=%H -- .github/workflows/exp073x2-article3-des-n4096-wm0-maskonly-repeatability-v0-1.yml)"
          grep -F "workflow_last_modifying_commit: \`${SELF_COMMIT}\`" experiments/073x2_article3_des_n4096_wm0_maskonly_repeatability_v0_1_workflow_freeze.md

      - uses: actions/download-artifact@v4
        with:
          name: exp073x2-replica-A-${{ github.sha }}
          path: external/replica-a

      - uses: actions/download-artifact@v4
        with:
          name: exp073x2-replica-B-${{ github.sha }}
          path: external/replica-b

      - name: Compare independently persisted authorities
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data/derived/g7
          python3 ci/exp073x2_compare_replicas_v0_1.py \
            --replica-a-root external/replica-a \
            --replica-b-root external/replica-b \
            --output-json data/derived/g7/exp073x2_des_n4096_wm0_maskonly_repeatability_v0_1.json

      - name: Enforce X2 authority remains non-classifying
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp073x2_des_n4096_wm0_maskonly_repeatability_v0_1.json'
          d=json.load(open(p))
          assert d['status']=='PASS_EXP073X2_DES_N4096_WM0_MASK_ONLY_REPEATABILITY_V0_1'
          assert d['repeatability']=={'canonical_sha256_identical':True,'array_equal':True}
          assert d['frozen_metadata_identical'] is True
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          assert d['article3_scientific_readiness_percent']==52
          assert d['readiness_increment_from_x2']==0
          assert d['science_gate_scored'] is False and d['scientific_pass_claimed'] is False
          assert d['physical_support_evaluated'] is False and d['covariance_read'] is False and d['G8_read'] is False
          print('EXP073X2_AGGREGATOR_FIREWALL_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp073x2-repeatability-authority-${{ github.sha }}
          path: data/derived/g7/exp073x2_des_n4096_wm0_maskonly_repeatability_v0_1.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
