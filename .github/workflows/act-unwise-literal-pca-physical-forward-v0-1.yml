name: ACT x unWISE literal PCA physical forward v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/act-unwise-literal-pca-physical-forward-v0-1.yml'
      - 'ci/act_unwise_literal_pca_physical_forward_v0_1.py'
      - 'ci/act_unwise_physical_forward_reproduction_v0_1.py'
      - 'experiments/068b_literal_pca_semantics_physical_forward_reproduction_v0_1.md'
      - 'src/dsir/act_unwise_projection.py'

jobs:
  literal-pca-physical-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical and CAMB build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran git python3-dev
          python3 -m pip install --user numpy scipy cython setuptools wheel packaging

      - name: Fetch and install pinned CAMB
        run: |
          set -euxo pipefail
          mkdir -p external
          git clone https://github.com/cmbant/CAMB.git external/CAMB
          git -C external/CAMB checkout fa3f097343fbbe427cc04b4f5f0041c22c6ec764
          test "$(git -C external/CAMB rev-parse HEAD)" = 'fa3f097343fbbe427cc04b4f5f0041c22c6ec764'
          python3 -m pip install --user ./external/CAMB

      - name: Fetch pinned ACT x unWISE upstream source
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/ACTCollaboration/unWISExLens_lklh.git external/unWISExLens_lklh
          git -C external/unWISExLens_lklh checkout 6302c30d9e70f8e4ff2d4a84a9977b4471705179
          test "$(git -C external/unWISExLens_lklh rev-parse HEAD)" = '6302c30d9e70f8e4ff2d4a84a9977b4471705179'

      - name: Restore immutable official data archive cache
        id: archive-cache
        uses: actions/cache@v4
        with:
          path: external/data_unWISExLens.tar.gz
          key: act-unwise-data-1b2d1563c5eb548ca6488ed8d60c5260d9e110b743a2e3a84620cfe46fbb6570

      - name: Fetch official ACT x unWISE archive on cache miss
        if: steps.archive-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p external
          if ! curl --fail --location --retry 3 --retry-delay 3 \
            'https://lambda.gsfc.nasa.gov/data/suborbital/ACT/act_x_unWISE/data_unWISExLens.tar.gz' \
            -o external/data_unWISExLens.tar.gz; then
            rm -f external/data_unWISExLens.tar.gz
            curl --fail --location --retry 4 --retry-delay 3 \
              'https://portal.nersc.gov/project/act/act_x_unWISE_xcorr+3x2pt/data_unWISExLens.tar.gz' \
              -o external/data_unWISExLens.tar.gz
          fi

      - name: Verify and extract immutable official data archive
        run: |
          set -euxo pipefail
          echo '1b2d1563c5eb548ca6488ed8d60c5260d9e110b743a2e3a84620cfe46fbb6570  external/data_unWISExLens.tar.gz' | sha256sum -c -
          mkdir -p external/unwise_data
          tar -xzf external/data_unWISExLens.tar.gz -C external/unwise_data

      - name: Run frozen Exp068B physical comparison
        run: |
          set -euxo pipefail
          python3 ci/act_unwise_literal_pca_physical_forward_v0_1.py \
            --upstream-repo external/unWISExLens_lklh \
            --camb-repo external/CAMB \
            --extracted-root external/unwise_data \
            --archive external/data_unWISExLens.tar.gz \
            --output data/derived/g7/exp068b_act_unwise_literal_pca_physical_forward_v0_1_summary.json

      - name: Preserve immutable scientific outcome
        run: |
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp068b_act_unwise_literal_pca_physical_forward_v0_1_summary.json'
          d=json.load(open(p))
          assert d['status'] in {
              'PASS_ACT_UNWISE_LITERAL_PCA_PHYSICAL_FORWARD_V0_1',
              'FAIL_ACT_UNWISE_LITERAL_PCA_PHYSICAL_FORWARD_V0_1',
          }
          assert d['exp068a_status_preserved']=='FAIL_ACT_UNWISE_PHYSICAL_FORWARD_REPRODUCTION_V0_1'
          assert d['provenance']['expected_upstream_commit']=='6302c30d9e70f8e4ff2d4a84a9977b4471705179'
          assert d['provenance']['expected_CAMB_commit']=='fa3f097343fbbe427cc04b4f5f0041c22c6ec764'
          assert d['provenance']['expected_archive_sha256']=='1b2d1563c5eb548ca6488ed8d60c5260d9e110b743a2e3a84620cfe46fbb6570'
          assert d['frozen_domain']['ell_first']==0
          assert d['frozen_domain']['ell_last']==6143
          assert d['frozen_domain']['ell_count']==6144
          assert d['frozen_domain']['Gauss_Legendre_order']==96
          assert d['frozen_domain']['projector_kmax_Mpc^-1']==10.0
          assert d['raw_component_equivalence']['tolerance_factor']==5e-13
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP068B_RESULT', d['status'])
          print('PROVENANCE', d['provenance']['pass'])
          print('LITERAL_SOURCE', d['literal_upstream_pca_source_semantics']['pass'])
          print('TRACERS', d['tracer_binding']['pass'])
          print('PROVIDERS', d['physical_provider_sanity']['pass'])
          print('RAW_EQUIVALENCE', d['raw_component_equivalence']['pass'])
          print('NONTRIVIAL', d['nontrivial_physical_signal_control']['pass'])
          print('ZERO_COEFF', d['zero_displacement_coefficient_control']['pass'])
          PY

      - name: Upload Exp068B validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp068b-act-unwise-literal-pca-${{ github.sha }}
          path: data/derived/g7/exp068b_act_unwise_literal_pca_physical_forward_v0_1_summary.json
          if-no-files-found: warn
