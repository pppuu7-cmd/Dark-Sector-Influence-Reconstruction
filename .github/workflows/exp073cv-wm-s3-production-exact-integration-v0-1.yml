name: Exp073CV Wm_S3 production exact integration v0.1
on:
  push:
    paths:
      - 'control/activate_exp073cv_v0_1.txt'
permissions:
  contents: read
jobs:
  hosted-production-exact-integration-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Freeze contract and validated component identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073cv_wm_s3_production_exact_integration_v0_1_prereg.md)" = '5b869ee270a5b3ff6af98901de0d69415f0549ba'
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py)" = 'dafe86086a470c852106f0d4ecccbda1d389e397'
          test "$(git hash-object ci/exp073cv_component_blobs_v0_1.json)" = '0d6d6e882d1a4cf1ff79fbe8227a4f2b460c7e40'
          test "$(git hash-object ci/exp073bx_full_mcm_stock_order_v0_1.py)" = 'ae0282cbbcdd298f00765d8de68545fe214cec0e'
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_v0_1.c)" = 'acafb095deafae7602101d8305e239341010ba79'
          test "$(git hash-object ci/exp073ca_stock_write_fits_to_mmap_exact_chain_v0_1.py)" = 'd3c2e3a2ec42ddcb5811447499d80a4a1cfa3132'
          test "$(git hash-object ci/exp073cc_verify_fits_memmap_backing_v0_1.py)" = '88d17ad76cabc1651df6b6035d897e9f42853ca5'
          grep -Fq 'I1_PRODUCTION_INTERFACE_EXACT_INTEGRATION_PASS' experiments/073cv_wm_s3_production_exact_integration_v0_1_prereg.md
          grep -Fq "fresh_masks_complete" ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py
          grep -Fq "replica_receipt_complete" ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py
          grep -Fq "mmap.mmap" ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py
          grep -Fq "/proc/self/maps" ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py
          ! grep -Fq '.get_coupling_matrix(' ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py
          echo PASS_EXP073CV_V0_1_HOSTED_STATIC_FREEZE_AUDIT
      - name: Install exact NaMaster 2.7 plus GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "${GITHUB_ENV}"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"
      - name: Verify runtime NaMaster and GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib,importlib.metadata,inspect,pymaster as nmt
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f'
          print('PASS_EXP073CV_V0_1_NAMASTER27_RUNTIME_LINEAGE')
          PY
          grep -Eq '#define GSL_VERSION "2\.7' "${NMT_PREFIX}/include/gsl/gsl_version.h"
      - name: Compile frozen exact full-stock mmap downstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/exp073cv-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_v0_1.c -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073cv-bin/mmap_full_mcm"
          echo "MMAP_EMULATOR=${RUNNER_TEMP}/exp073cv-bin/mmap_full_mcm" >> "${GITHUB_ENV}"
      - name: Execute frozen production-interface exact regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/exp073cv
          "${NMT_PY}" ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py audit \
            --emulator "${MMAP_EMULATOR}" \
            --audit-out data/derived/exp073cv/exp073cv_hosted_exact_integration_v0_1.json \
            --source-head "${GITHUB_SHA}" \
            --contract-fingerprint '5b869ee270a5b3ff6af98901de0d69415f0549ba' \
            --component-blobs-json ci/exp073cv_component_blobs_v0_1.json
          grep -Fq '"status": "I1_PRODUCTION_INTERFACE_EXACT_INTEGRATION_PASS"' data/derived/exp073cv/exp073cv_hosted_exact_integration_v0_1.json
          echo PASS_EXP073CV_V0_1_EXECUTABLE_INTEGRATION_AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073cv-production-exact-integration-${{ github.sha }}
          path: data/derived/exp073cv/exp073cv_hosted_exact_integration_v0_1.json
