name: Exp073CC FITS mmap backing verification v0.1
on:
  push:
    paths:
      - 'control/activate_exp073cc_v0_1.txt'
permissions:
  contents: read
jobs:
  hosted-static-and-runtime-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Freeze preregistration and helper identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/exp073cc_verify_fits_memmap_backing_v0_1.py)" = '88d17ad76cabc1651df6b6035d897e9f42853ca5'
          test "$(git hash-object experiments/073cc_support_fits_memmap_backing_verification_v0_1_prereg.md)" = 'fdb1e1528d5844b78c0c8be30042ad7d577c73a3'
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_v0_1.c)" = 'acafb095deafae7602101d8305e239341010ba79'
          grep -Fq 'V1_VERIFIED_OS_MMAP_AND_EXACT_CHAIN' experiments/073cc_support_fits_memmap_backing_verification_v0_1_prereg.md
          grep -Fq '33829545473' experiments/073cc_support_fits_memmap_backing_verification_v0_1_prereg.md
          grep -Fq 'memmap=True' ci/exp073cc_verify_fits_memmap_backing_v0_1.py
          echo PASS_EXP073CC_V0_1_HOSTED_STATIC_FREEZE_AUDIT
      - name: Install exact NaMaster 2.7 plus GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "${GITHUB_ENV}"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"
      - name: Verify runtime source and GSL 2.7
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib,importlib.metadata,inspect,pymaster as nmt
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f'
          print('PASS_EXP073CC_V0_1_NAMASTER27_RUNTIME_LINEAGE')
          PY
          grep -Eq '#define GSL_VERSION "2\.7' "${NMT_PREFIX}/include/gsl/gsl_version.h"
      - name: Compile frozen Exp073BY mmap downstream emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/exp073cc-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_v0_1.c -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073cc-bin/mmap_full_mcm_emulator"
          echo "MMAP_EMULATOR=${RUNNER_TEMP}/exp073cc-bin/mmap_full_mcm_emulator" >> "${GITHUB_ENV}"
      - name: Execute frozen mmap backing verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/exp073cc
          "${NMT_PY}" ci/exp073cc_verify_fits_memmap_backing_v0_1.py --emulator "${MMAP_EMULATOR}" --out data/derived/exp073cc/exp073cc_verify_fits_memmap_backing_v0_1.json
          echo PASS_EXP073CC_V0_1_RUNTIME_QA_EXECUTED
      - uses: actions/upload-artifact@v4
        with:
          name: exp073cc-fits-mmap-verification-${{ github.sha }}
          path: data/derived/exp073cc/exp073cc_verify_fits_memmap_backing_v0_1.json
