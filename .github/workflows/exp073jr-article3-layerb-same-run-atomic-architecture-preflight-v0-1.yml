name: exp073jr-article3-layerb-same-run-atomic-architecture-preflight-v0-1

on:
  push:
    paths:
      - '.github/workflows/exp073jr-article3-layerb-same-run-atomic-architecture-preflight-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp073jr-article3-layerb-same-run-atomic-architecture-preflight-v0-1
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PREREG_BLOB: 'edc511f140640291f7ff7b7860b1c2064a64b758'
  HELPER_BLOB: '31b59c134b2a51749f6b9c1b14a8bcc8fa9d204d'
  JQ_AUTH_BLOB: ''

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        lattice: [coarse, fine]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen JR identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073JR_ARTICLE3_LAYERB_SAME_RUN_ATOMIC_ARCHITECTURE_PREFLIGHT_V0_1.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073jr_article3_layerb_same_run_atomic_architecture_preflight_v0_1.py)" = "$HELPER_BLOB"
          test "$(git hash-object docs/dsir4/prereg/EXP073JL_ARTICLE3_LAYERB_COMMON_GRID_THIRD_REFINEMENT_CONVERGENCE_V0_1.md)" = '0c143dd5b3c1c38b24fbb5b529d03ff9a2afdc58'
          test "$(git hash-object ci/exp073jl_article3_layerb_common_grid_third_refinement_convergence_v0_1.py)" = '91723736fedd090fa1c81b1fcff4f1f3601d2ce2'
          python - <<'PY'
          import json
          d=json.load(open('docs/dsir4/authority/EXP073JQ_ARTICLE3_SLOT20_SAME_RUN_HISTORY_INDEPENDENCE_V0_1.json'))
          assert d['classification']=='SAME_RUN_HISTORY_INDEPENDENCE_PASS_PLUS_0_PLUS_0'
          assert d['artifact_verified_independently'] is True
          assert d['checkpointed_JL_replay_authorized'] is False
          assert d['article3_readiness_percent']==68 and d['funnel_freeze_readiness_percent']==67
          PY
          python -m py_compile ci/exp073jr_article3_layerb_same_run_atomic_architecture_preflight_v0_1.py
      - name: Install frozen stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null
      - name: Build exact pinned capacity-patched CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 4608',1))
          q=Path('external/class_iv/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 131072',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Execute frozen same-run atomic preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python ci/exp073jr_article3_layerb_same_run_atomic_architecture_preflight_v0_1.py \
            --lattice '${{ matrix.lattice }}' \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --jq-authority docs/dsir4/authority/EXP073JQ_ARTICLE3_SLOT20_SAME_RUN_HISTORY_INDEPENDENCE_V0_1.json \
            --jl-prereg docs/dsir4/prereg/EXP073JL_ARTICLE3_LAYERB_COMMON_GRID_THIRD_REFINEMENT_CONVERGENCE_V0_1.md \
            --jl-implementation ci/exp073jl_article3_layerb_common_grid_third_refinement_convergence_v0_1.py \
            --out artifacts/result.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: exp073jr-${{ matrix.lattice }}
          path: artifacts/result.json
          retention-days: 90

  aggregate:
    needs: preflight
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exp073jr-*
          path: parts
      - name: Aggregate frozen JR classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import glob,json,pathlib
          files=glob.glob('parts/exp073jr-*/result.json')
          if len(files)!=2:
              out={'schema':'EXP073JR_AGGREGATE_RESULT_V0_1','experiment':'Exp073JR','classification':'INVALID_INFRA_PLUS_0_PLUS_0','effect':'+0/+0','receipt_count':len(files),'scientific_authority_created':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'article3_readiness_percent':68,'funnel_freeze_readiness_percent':67,'token':'FAIL_EXP073JR_INVALID_INFRA_PLUS_0_PLUS_0'}
          else:
              rows=[json.load(open(p)) for p in files]
              assert {d['lattice'] for d in rows}=={'coarse','fine'}
              classes={d['classification'] for d in rows}
              if classes=={'SAME_RUN_SEQUENTIAL_RESPONSE_ENGINE_EXACT_EQUIVALENCE_PASS_PLUS_0_PLUS_0'}:
                  cls='SAME_RUN_SEQUENTIAL_RESPONSE_ENGINE_EXACT_EQUIVALENCE_PASS_PLUS_0_PLUS_0'
              elif 'SAME_RUN_SEQUENTIAL_RESPONSE_ENGINE_NOT_EXACT_PLUS_0_PLUS_0' in classes:
                  cls='SAME_RUN_SEQUENTIAL_RESPONSE_ENGINE_NOT_EXACT_PLUS_0_PLUS_0'
              else:
                  cls='INVALID_INFRA_PLUS_0_PLUS_0'
              out={'schema':'EXP073JR_AGGREGATE_RESULT_V0_1','experiment':'Exp073JR','classification':cls,'effect':'+0/+0','receipt_count':2,'lattice_classifications':{d['lattice']:d['classification'] for d in rows},'scientific_authority_created':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'article3_readiness_percent':68,'funnel_freeze_readiness_percent':67,'token':('PASS_EXP073JR_' if cls.startswith('SAME_RUN_SEQUENTIAL_RESPONSE_ENGINE_EXACT') else 'FAIL_EXP073JR_')+cls}
          pathlib.Path('artifacts/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token']); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073jr-aggregate
          path: artifacts/result.json
          retention-days: 90
