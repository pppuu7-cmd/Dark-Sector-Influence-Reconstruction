name: DSIR interaction localization geometry v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/interaction-localization-geometry-v0-1.yml'
      - 'ci/interaction_localization_geometry_v0_1.py'
      - 'experiments/048a_interaction_localization_geometry_v0_1.md'
      - 'data/derived/comparison_readiness/local_response_tangents_v0_1.json'

permissions:
  contents: read

jobs:
  interaction-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run interaction localization audit
        run: |
          python ci/interaction_localization_geometry_v0_1.py \
            --input data/derived/comparison_readiness/local_response_tangents_v0_1.json \
            --json experiment_048a_interaction_localization_geometry_v0_1.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: interaction-localization-geometry-v0-1-${{ github.sha }}
          path: experiment_048a_interaction_localization_geometry_v0_1.json
          if-no-files-found: error
