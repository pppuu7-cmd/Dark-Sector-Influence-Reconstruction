name: Exp073FC Exp073FA committed driver binding v0.1

on:
  push:
    paths:
      - '.github/workflows/exp073fc-exp073fa-committed-driver-binding-v0-1.yml'

permissions:
  contents: read
  actions: read

jobs:
  hosted-binding-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREREG_BLOB: '9e194c2617114b88c46fa349c10dddf70cccd6da'
      FB_RUN_ID: '34018241319'
      FB_JOB_ID: '101445845648'
      FB_ARTIFACT_ID: '9984600349'
      FB_ARTIFACT_NAME: 'exp073fb-exp073fa-s0-s2-generated-drivers-v0-1'
      FB_ZIP_SHA256: 'b371821a77cb4a62051ceee45f82764a5486ea3b0bcf0939a9bcac0eff624cda'
      V01_SHA256: 'fe354b95e9aeefe0772f4c7eecbba6e1944fb1f4955fceb3e9e72ed1c06b293a'
      V02_SHA256: '77f321e22c923d8d5996105487cae9afb6eecc5863174d849b092164a26824ba'
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen bindings and independently consume Exp073FB artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073fc_exp073fa_committed_driver_binding_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(sha256sum ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py | awk '{print $1}')" = "$V01_SHA256"
          test "$(sha256sum ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py | awk '{print $1}')" = "$V02_SHA256"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/runs/$FB_RUN_ID" -o fb_run.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/runs/$FB_RUN_ID/jobs?per_page=100" -o fb_jobs.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/artifacts/$FB_ARTIFACT_ID" -o fb_artifact.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('fb_run.json')); jobs=json.load(open('fb_jobs.json'))['jobs']; a=json.load(open('fb_artifact.json'))
          assert r['id']==int(os.environ['FB_RUN_ID']) and r['status']=='completed' and r['conclusion']=='success'
          j=next(x for x in jobs if x['id']==int(os.environ['FB_JOB_ID'])); assert j['status']=='completed' and j['conclusion']=='success'
          assert a['id']==int(os.environ['FB_ARTIFACT_ID']) and a['name']==os.environ['FB_ARTIFACT_NAME'] and a['digest']=='sha256:'+os.environ['FB_ZIP_SHA256'] and not a['expired']
          assert a['workflow_run']['id']==int(os.environ['FB_RUN_ID'])
          PY
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/artifacts/$FB_ARTIFACT_ID/zip" -o fb.zip
          test "$(sha256sum fb.zip | awk '{print $1}')" = "$FB_ZIP_SHA256"
          mkdir generated && unzip -q fb.zip -d generated
          test "$(sha256sum generated/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py | awk '{print $1}')" = "$V01_SHA256"
          test "$(sha256sum generated/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py | awk '{print $1}')" = "$V02_SHA256"
          cmp -s generated/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py
          cmp -s generated/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py
          python3 - <<'PY'
          import json,os
          r=json.load(open('generated/transformation_receipt.json'))
          assert r['schema']=='dsir.exp073fb.driver_transform.v0.1'
          assert r['generated_v01_sha256']==os.environ['V01_SHA256'] and r['generated_v02_sha256']==os.environ['V02_SHA256']
          assert r['science_pair']=='S0->S2' and r['ordered_source_indices']==[0,2] and r['historical_numerical_import'] is False
          PY
      - name: Repeat critical committed-source semantic audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py
          grep -F "SCHEMA='dsir.exp073fa.ww_s0_s2.durable_ab_production.v0.1'" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "source_count_map(r1_root,2)" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "'ordered_source_indices':[0,2]" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "'source_pair':'S0->S2'" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "FULL_SHAPE=(4,39,4,12288); EE_SHAPE=(39,12288)" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "np.array_equal" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "EXPECTED_MCM_BYTES=19327352832" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py >/dev/null
          grep -F "read_from(str(wp),read_unbinned_MCM=True)" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py >/dev/null
          grep -F "get_bandpower_windows()" ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py >/dev/null
          ! grep -Eqi 'np\.(allclose|isclose)' ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py
          echo PASS_EXP073FC_EXP073FA_COMMITTED_DRIVER_BINDING_V0_1
          echo classification=SUPPORT_PLUS_0_PLUS_0
          echo ww_s0_s2_authority_created=false