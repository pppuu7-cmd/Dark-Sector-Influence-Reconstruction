name: Exp073FA WW_S0_S2 prerequisite static audit v0.1

on:
  push:
    paths:
      - '.github/workflows/exp073fa-ww-s0-s2-prereq-static-audit-v0-1.yml'

permissions:
  contents: read
  actions: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREREG_BLOB: 'edc044792be8ac7b796c8469943924942ae91932'
      TASKRUNNER_BLOB: '050ed7dd3387c4fb031f877825e6b3f4d4ce3ef2'
      READ_PATCH_BLOB: 'd534b698f9131688d263eedcef27260386c58641'
      EZ_RUN_ID: '34017921734'
      EZ_JOB_ID: '101444964371'
      SOURCE_HEAD: 'de83e20a68f79ccf25b89b0d33eb4206e294c757'
      CONTRACT_FP: 'b7845df5ce4bc2bd730461476b7ff0831512003ceb5b3558436005c9876bd251'
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed Exp073FA prerequisite audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073fa_ww_s0_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(git rev-parse HEAD:ci/exp073aa_article3_des_angular_task_runner_v0_1.py)" = "$TASKRUNNER_BLOB"
          test "$(git rev-parse HEAD:patches/namaster-v2.7-dsir-filebacked-mcm-read-v0.2.patch)" = "$READ_PATCH_BLOB"
          grep -F "2:{'selected':8_238_547" ci/exp073aa_article3_des_angular_task_runner_v0_1.py >/dev/null
          grep -F "'WW_S0_S2'" ci/exp073aa_article3_des_angular_task_runner_v0_1.py >/dev/null
          grep -F 'source_count_map(r1_root,0)' experiments/073fa_ww_s0_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md >/dev/null
          grep -F 'source_count_map(r1_root,2)' experiments/073fa_ww_s0_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md >/dev/null
          grep -F '19,327,352,832' experiments/073fa_ww_s0_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md >/dev/null
          grep -F 'PASS_EXP073FA_WW_S0_S2_FILEBACKED_AB_EXACT_REPEATABILITY_V0_1' experiments/073fa_ww_s0_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md >/dev/null
          ! grep -Eqi 'allclose|isclose|rounding|smoothing|averaging|effective-ell|fiducial-P shortcut.*permit' experiments/073fa_ww_s0_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md
          python3 - <<'PY'
          import json,os,urllib.request,time
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; rid=int(os.environ['EZ_RUN_ID']); jid=int(os.environ['EZ_JOB_ID'])
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              for i in range(6):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:return json.load(r)
                  except Exception:
                      if i==5: raise
                      time.sleep(2)
          run=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}')
          jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=100')['jobs']
          assert run['status']=='completed' and run['conclusion']=='success'
          j=next(x for x in jobs if x['id']==jid); assert j['status']=='completed' and j['conclusion']=='success'
          PY
          echo PASS_EXP073FA_WW_S0_S2_PREREQUISITE_STATIC_AUDIT_V0_1
          echo classification=SUPPORT_PLUS_0_PLUS_0
          echo ww_s0_s2_authority_created=false