name: Exp073R1 DESY1 self-hosted long-run Stage-B v0.6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/exp073r1_v0_6_selfhosted_longrun.trigger'

permissions:
  contents: read
  actions: read

env:
  METACAL_URL: https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/shear_catalogs/mcal-y1a1-combined-riz-unblind-v4-matched.fits
  SOURCE_RUN_ID: '33175886694'
  SOURCE_RUN_HEAD: '2926f1866fed4f0767ce3d1ec797f6e6ed4f4f2c'
  SOURCE_ARTIFACT_ID: '9688707039'
  SOURCE_ARTIFACT_NAME: exp073r1-v05-source-index-2926f1866fed4f0767ce3d1ec797f6e6ed4f4f2c
  SOURCE_ARTIFACT_DIGEST: sha256:366aad6468046e6964edc9cd2bfd299960d5dadf1856a30ec608e9ae191c1582
  SOURCE_WHOLE_SHA256: 491f623d9370d3e5657db67d410e7cfd0e89475827046e6cd82ef6b3dd88c7a5
  SOURCE_INDEX_SHA256: dbb362b10c68825e775e7398b18eb77d37fe725ce80cfd5c07faec5cb5755628
  R0_RUN_ID: '33103083736'
  R0_RUN_HEAD: '94b05d307295d5e9263646983ece9514f9fa2e88'
  R0_ARTIFACT_ID: '9661445512'
  R0_ARTIFACT_NAME: exp073r0-row-healpix-equivalence-94b05d307295d5e9263646983ece9514f9fa2e88
  R0_ARTIFACT_DIGEST: sha256:bfa97a88218cda6e6e6c58d915e8e5b21500fa677a484205691f2f01662ed4d0
  EVALUATOR_GIT_BLOB_SHA1: 46fe1271d97ddd9e2164d24e7d79cf27bfda805d

jobs:
  metacal-map-longrun:
    runs-on: [self-hosted, linux]
    timeout-minutes: 2880
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert preregistered unchanged evaluator and execution firewall
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object ci/exp073r1_sequential_wholestream_v0_5.py)" = "${EVALUATOR_GIT_BLOB_SHA1}"
          python3 -m py_compile ci/exp073r1_sequential_wholestream_v0_5.py
          test -f experiments/073r1_v0_6_selfhosted_longrun_stageb_prereg.md

      - name: Bind immutable Stage-A and Exp073R0 Actions metadata before download
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'DSIR-Exp073R1-v0.6-preflight',
          }
          def api(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)

          sr=api(f"actions/runs/{os.environ['SOURCE_RUN_ID']}")
          assert str(sr['id'])==os.environ['SOURCE_RUN_ID']
          assert sr['status']=='completed'
          # Whole v0.5 run was cancelled only because Stage B hit the hosted ceiling;
          # Stage-A authority is separately bound by its successful job/artifact/internal PASS.
          assert sr['head_sha']==os.environ['SOURCE_RUN_HEAD']
          assert sr['path']=='.github/workflows/exp073r1-desy1-sequential-wholestream-v0-5.yml'
          arts=api(f"actions/runs/{os.environ['SOURCE_RUN_ID']}/artifacts?name={os.environ['SOURCE_ARTIFACT_NAME']}")['artifacts']
          assert len(arts)==1
          a=arts[0]
          assert str(a['id'])==os.environ['SOURCE_ARTIFACT_ID']
          assert a['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert a.get('expired') is False
          assert a.get('digest')==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert a['workflow_run']['head_sha']==os.environ['SOURCE_RUN_HEAD']

          rr=api(f"actions/runs/{os.environ['R0_RUN_ID']}")
          assert str(rr['id'])==os.environ['R0_RUN_ID']
          assert rr['status']=='completed' and rr['conclusion']=='success'
          assert rr['head_sha']==os.environ['R0_RUN_HEAD']
          assert rr['path']=='.github/workflows/exp073r0-desy1-raw-row-healpix-equivalence-v0-1.yml'
          rarts=api(f"actions/runs/{os.environ['R0_RUN_ID']}/artifacts?name={os.environ['R0_ARTIFACT_NAME']}")['artifacts']
          assert len(rarts)==1
          ra=rarts[0]
          assert str(ra['id'])==os.environ['R0_ARTIFACT_ID']
          assert ra['name']==os.environ['R0_ARTIFACT_NAME']
          assert ra.get('expired') is False
          assert ra.get('digest')==os.environ['R0_ARTIFACT_DIGEST']
          assert ra['workflow_run']['head_sha']==os.environ['R0_RUN_HEAD']
          print('V06_IMMUTABLE_PARENT_METADATA_PASS')
          PY

      - name: Install frozen mapper runtime on long-lived runner
        shell: bash
        run: |
          set -euxo pipefail
          VENV="${RUNNER_TEMP}/exp073r1-v06-venv"
          rm -rf "${VENV}"
          python3 -m venv "${VENV}"
          "${VENV}/bin/python" -m pip install --disable-pip-version-check numpy healpy
          "${VENV}/bin/python" - <<'PY'
          import healpy, numpy
          print('numpy', numpy.__version__)
          print('healpy', healpy.__version__)
          PY
          "${VENV}/bin/python" -m py_compile ci/exp073r1_sequential_wholestream_v0_5.py
          echo "${VENV}/bin" >> "${GITHUB_PATH}"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: external/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.R0_ARTIFACT_NAME }}
          path: external/r0
          github-token: ${{ github.token }}
          run-id: ${{ env.R0_RUN_ID }}

      - name: Re-bind downloaded Stage-A and Exp073R0 internal contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for b in iter(lambda:f.read(8<<20),b''):
                      h.update(b)
              return h.hexdigest()

          source_summary=next(Path('external/source').rglob('source-summary.json'))
          source_index=next(Path('external/source').rglob('source-zbin-be-i2.bin'))
          s=json.loads(source_summary.read_text())
          assert s['status']=='PASS_EXP073R1_V05_SOURCE_WHOLE_STREAM_INDEX_BINDING'
          assert s['whole_sha256']==s['expected_whole_sha256']==os.environ['SOURCE_WHOLE_SHA256']
          assert s['nrows']==136930995
          assert s['source_index']['bytes']==273861990==source_index.stat().st_size
          assert s['source_index']['sha256']==os.environ['SOURCE_INDEX_SHA256']==sha(source_index)
          assert s['selection_applied'] is False
          assert s['science_gate_scored'] is False and s['f_invalid_computed'] is False
          assert s['covariance_read'] is False and s['G8_read'] is False
          assert s['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}

          r0=next(Path('external/r0').rglob('exp073r0_raw_row_healpix_equivalence_v0_1.json'))
          d=json.loads(r0.read_text())
          assert d['status']=='PASS_RAW_ROW_HEALPIX_EQUIVALENCE_EXP073R0'
          assert d['bins_with_selected_rows']==[0,1,2,3]
          assert d['source_field_exact'] and all(d['source_field_exact'].values())
          assert d['metacal_field_exact'] and all(d['metacal_field_exact'].values())
          assert d['per_bin'] and all(v.get('pixel_indices_exact') is True for v in d['per_bin'].values())
          assert d['science_gate_scored'] is False
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('V06_DOWNLOADED_PARENT_INTERNAL_PASS', sha(source_summary), sha(r0))
          PY

      - name: Sequentially stream authoritative 84GB metacal object and execute unchanged frozen mapper
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p v06_work data/derived/g7
          SOURCE_INDEX="$(find external/source -name 'source-zbin-be-i2.bin' -print -quit)"
          SOURCE_SUMMARY="$(find external/source -name 'source-summary.json' -print -quit)"
          R0_JSON="$(find external/r0 -name 'exp073r0_raw_row_healpix_equivalence_v0_1.json' -print -quit)"
          test -n "${SOURCE_INDEX}"
          test -n "${SOURCE_SUMMARY}"
          test -n "${R0_JSON}"
          python3 ci/exp073r1_sequential_wholestream_v0_5.py metacal-map \
            --url "${METACAL_URL}" \
            --source-index "${SOURCE_INDEX}" \
            --source-summary "${SOURCE_SUMMARY}" \
            --parent-json "${R0_JSON}" \
            --workdir v06_work \
            --out data/derived/g7/exp073r1_desy1_selfhosted_longrun_stageb_v0_6_summary.json

      - name: Assert genuine Exp073R1 reproduction PASS with no downstream science leakage
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os
          p='data/derived/g7/exp073r1_desy1_selfhosted_longrun_stageb_v0_6_summary.json'
          d=json.load(open(p))
          assert d['experiment']=='Exp073R1'
          assert d['status']=='PASS_DESY1_FULL_ONEPASS_WEAK_LENSING_MASK_EXP073R1'
          assert d['transport']=={'http_range_requests':0,'whole_object_get':True,'accept_encoding':'identity'}
          assert d['observed_bytes_metacal']==d['expected_bytes_metacal']==84075649920
          assert d['metacal_sha256']==d['expected_metacal_sha256']=='39a7fe03e54d96b85cee2fb523ea108c2a548ba1584368203f0464ed6241ebc8'
          assert d['source_identity_binding']['source_whole_sha256']==os.environ['SOURCE_WHOLE_SHA256']
          assert d['source_identity_binding']['source_index_bytes']==273861990
          assert d['source_identity_binding']['source_index_sha256']==os.environ['SOURCE_INDEX_SHA256']
          assert d['rows_read_source_index']==d['rows_read_metacal']==136930995
          assert d['selection']=='zbin_mcal == t AND dec >= -90 AND dec <= -35 AND flags_select == 0'
          assert d['mapper']=={'nside':4096,'ordering':'RING','coords':'C','lonlat':True}
          assert d['out_of_range_pixel_count']==0
          assert set(d['selected_rows_per_bin'])=={'0','1','2','3'}
          assert all(v>0 for v in d['selected_rows_per_bin'].values())
          assert all(all(x is True for x in v.values()) for v in d['repeatability_from_pixel_records'].values())
          assert all(d['parent_r0']['checks'].values())
          assert d['science_gate_scored'] is False and d['f_invalid_computed'] is False
          assert d['covariance_read'] is False and d['G8_read'] is False
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('PASS_DESY1_FULL_ONEPASS_WEAK_LENSING_MASK_EXP073R1')
          print('SELECTED_ROWS',d['selected_rows_per_bin'])
          print('MASK_SHA256',{k:v['sha256'] for k,v in d['masks'].items()})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073r1-v06-selfhosted-longrun-${{ github.sha }}
          path: |
            data/derived/g7/exp073r1_desy1_selfhosted_longrun_stageb_v0_6_summary.json
            data/derived/g7/exp073r1_v05_records/*.bin
            data/derived/g7/exp073r1_v05_masks/*.bin
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
