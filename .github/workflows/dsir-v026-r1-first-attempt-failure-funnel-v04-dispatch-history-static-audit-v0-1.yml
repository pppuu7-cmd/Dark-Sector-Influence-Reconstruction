name: dsir-v026-r1-first-attempt-failure-funnel-v04-dispatch-history-static-audit

on:
  push:
    branches:
      - audit/v026-r1-failure-funnel-v04-dispatch-history-closure

permissions:
  contents: read
  actions: read

env:
  AUDITOR: ci/dsir_v026_r1_sentinel_first_attempt_failure_funnel_v04_dispatch_history_static_audit_v0_1.py
  AUDITOR_BLOB: 73ebfa8d680809f3d577c7eab4b6f6f689c9edab
  TARGET_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-4.yml
  GH_TOKEN: ${{ github.token }}

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact auditor identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$AUDITOR")" = "$AUDITOR_BLOB"
          python3 -m py_compile "$AUDITOR"

      - name: Capture current v0.4 dispatch history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; path=os.environ['TARGET_WORKFLOW_PATH']
          runs=[]; url=f'https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=100'
          while url:
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r:
                  page=json.load(r); runs.extend(page.get('workflow_runs',[])); link=r.headers.get('Link','')
              url=next((p.split(';',1)[0].strip()[1:-1] for p in link.split(',') if 'rel="next"' in p),None)
          exact=[x for x in runs if x.get('path')==path and x.get('event')=='workflow_dispatch']
          json.dump({'total_count':len(exact),'workflow_runs':exact},open('safe/v04_live_runs.json','w'),indent=2,sort_keys=True)
          PY

      - name: Execute exact static auditor
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDITOR" --live-runs-json safe/v04_live_runs.json --out safe/v04_static_receipt.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/v04_static_receipt.json'))
          assert d['verdict']=='QUALIFIED'
          assert d['candidate_dispatch_run_count']==0
          assert d['github_run_number_1_guard_verified'] is True
          assert d['api_run_number_1_guard_verified'] is True
          assert d['end_of_run_live_history_recheck_verified'] is True
          assert d['post_run_single_terminal_history_verified'] is True
          assert d['promotion_authorized_by_this_receipt'] is False
          assert d['failure_funnel_dispatch_authorized_by_this_receipt'] is False
          assert d['full_107_row_execution_authorized'] is False
          PY
          sha256sum safe/v04_static_receipt.json > safe/v04_static_receipt.sha256

      - name: Persist immutable v0.4 static evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-first-attempt-failure-funnel-v04-dispatch-history-static-audit
          path: |
            safe/v04_static_receipt.json
            safe/v04_static_receipt.sha256
            safe/v04_live_runs.json
          if-no-files-found: error
          retention-days: 90
