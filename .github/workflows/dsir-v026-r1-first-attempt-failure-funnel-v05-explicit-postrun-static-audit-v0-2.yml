name: dsir-v026-r1-first-attempt-failure-funnel-v05-explicit-postrun-static-audit-v0-2

on:
  push:
    branches:
      - audit/v026-r1-failure-funnel-v05-explicit-postrun-dispatch

permissions:
  contents: read
  actions: read

env:
  AUDITOR: ci/dsir_v026_r1_sentinel_first_attempt_failure_funnel_v05_explicit_postrun_static_audit_v0_2.py
  AUDITOR_BLOB: 164af82efc1e9370c2d636bf5058791ae1e8a2d6
  TARGET_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-5.yml
  TERMINAL_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-terminal-history-v0-5.yml
  ORCHESTRATOR_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-orchestrator-v0-5.yml
  GH_TOKEN: ${{ github.token }}

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact auditor identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$AUDITOR")" = "$AUDITOR_BLOB"
          python3 -m py_compile "$AUDITOR"
      - name: Capture zero live dispatch history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          runs=[]; url=f'https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=100'
          while url:
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req) as r:
                  p=json.load(r); runs.extend(p.get('workflow_runs',[])); link=r.headers.get('Link','')
              url=next((z.split(';',1)[0].strip()[1:-1] for z in link.split(',') if 'rel="next"' in z),None)
          out={}
          for k,p in [('target',os.environ['TARGET_WORKFLOW_PATH']),('terminal',os.environ['TERMINAL_WORKFLOW_PATH']),('orchestrator',os.environ['ORCHESTRATOR_WORKFLOW_PATH'])]:
              xs=[x for x in runs if x.get('path')==p]; out[k]={'total_count':len(xs),'workflow_runs':xs}
          json.dump(out,open('safe/v05_live_runs.json','w'),indent=2,sort_keys=True)
          PY
      - name: Execute corrected response-blind v0.5 Critic
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDITOR" --live-runs-json safe/v05_live_runs.json --out safe/v05_static_receipt.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/v05_static_receipt.json'))
          assert d['verdict']=='QUALIFIED'
          assert d['target_dispatch_run_count']==0 and d['terminal_history_dispatch_run_count']==0 and d['orchestrator_dispatch_run_count']==0
          assert d['explicit_postrun_workflow_dispatch_verified'] is True
          assert d['filename_workflow_dispatch_ids_verified'] is True
          assert d['orchestrator_waits_for_target_terminal_before_postrun_dispatch'] is True
          assert d['promotion_authorized_by_this_receipt'] is False
          assert d['failure_funnel_dispatch_authorized_by_this_receipt'] is False
          assert d['successor_sentinel_science_authorized'] is False
          assert d['full_107_row_execution_authorized'] is False
          PY
          sha256sum safe/v05_static_receipt.json > safe/v05_static_receipt.sha256
      - name: Persist immutable v0.5 static evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-first-attempt-failure-funnel-v05-explicit-postrun-static-audit-v02
          path: |
            safe/v05_static_receipt.json
            safe/v05_static_receipt.sha256
            safe/v05_live_runs.json
          if-no-files-found: error
          retention-days: 90
