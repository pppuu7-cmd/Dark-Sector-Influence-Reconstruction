name: Exp073IG C2 Local Tangent Prediction Artifact Admission v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073ig-c2-local-tangent-prediction-artifact-admission-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen repo identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073IG_C2_LOCAL_TANGENT_PREDICTION_ARTIFACT_ADMISSION_V0_1.md)" = '5da4b65f26eeacd862a98e3e8e18d6036d0da143'
          test "$(git hash-object docs/dsir4/mappings/C2_IDE_LOCAL_TANGENT_CONE_MAPPING_V0_1.md)" = '5f2b690e4f56fc0fd3109ff2bcdb53dd0eb806cc'
          test "$(sha256sum docs/dsir4/mappings/C2_IDE_LOCAL_TANGENT_CONE_MAPPING_V0_1.md | awk '{print $1}')" = '7f660b6806494b00d17caed50b7cc66d01d9d02bc4cb1d66f333c1c12e1386df'
          test "$(git hash-object docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_V0_1.md)" = '7e244010ca65050d0c8edff8fe90a9583845a568'
          test "$(git hash-object docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_BASIS_V0_1.jsonl)" = 'b3c5dc5ec6aefb79f215c5e01d7baef566cc5251'
          test "$(sha256sum docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_BASIS_V0_1.jsonl | awk '{print $1}')" = '2836a3665e6bab75587957228fbd3b9e152ef7d6e667966c308d81bf666c7c56'
      - name: Download and verify admitted upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ig/hw /tmp/ig/ic /tmp/ig/id /tmp/ig/rebuilt
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10062705321/zip" -o /tmp/ig/hw.zip
          test "$(sha256sum /tmp/ig/hw.zip | awk '{print $1}')" = '7ea327f0d6e29e4b415c9f66201b266e9015d46a383e8867de94b05665517c00'
          unzip -q /tmp/ig/hw.zip -d /tmp/ig/hw
          test "$(sha256sum /tmp/ig/hw/dsir_c2_reference_deltam_bridge_v0_1.jsonl | awk '{print $1}')" = '2b6eb07c99273292bcb2cf929295071e401e81ed51cfe3f4c3b19d5a395518fb'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10065344213/zip" -o /tmp/ig/ic.zip
          test "$(sha256sum /tmp/ig/ic.zip | awk '{print $1}')" = 'e48b0fd4f7d80717231df60a5065d9f1eac37a13193951f17d01ee34761ff7dc'
          unzip -q /tmp/ig/ic.zip -d /tmp/ig/ic
          test "$(cat /tmp/ig/ic/response.sha256)" = 'e97ef98a5b137081df5937454f02576d30e726266e9c50733bf399a9be2b1907'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10065453571/zip" -o /tmp/ig/id.zip
          test "$(sha256sum /tmp/ig/id.zip | awk '{print $1}')" = 'e09efcb7095aedc0ad50d0aa7212cd4f1a44abf63cfc2fd5926906c390f7af77'
          unzip -q /tmp/ig/id.zip -d /tmp/ig/id
          grep -Fxq 'source_ic_run=34249380208' /tmp/ig/id/AUTHORITY.txt
          grep -Fxq 'source_ic_artifact=10065344213' /tmp/ig/id/AUTHORITY.txt
          grep -Fxq 'source_ic_response_sha256=e97ef98a5b137081df5937454f02576d30e726266e9c50733bf399a9be2b1907' /tmp/ig/id/AUTHORITY.txt
          grep -Fxq 'admitted_base_step=1e-4' /tmp/ig/id/AUTHORITY.txt
          grep -Fxq 'tangent_response_ready=true' /tmp/ig/id/AUTHORITY.txt
      - name: Reconstruct exact frozen prediction basis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,pathlib,hashlib
          hw=[json.loads(x) for x in pathlib.Path('/tmp/ig/hw/dsir_c2_reference_deltam_bridge_v0_1.jsonl').read_text().splitlines()]
          ic=[json.loads(x) for x in pathlib.Path('/tmp/ig/ic/tangent_response_candidates.jsonl').read_text().splitlines()]
          assert len(hw)==len(ic)==28
          rows=[]
          zs=['0.295','0.51','0.706','0.934','1.317','1.491','2.33']
          ks=['0.00067','0.00201','0.0067','0.0201']
          for i,(r,d) in enumerate(zip(hw,ic)):
              rid=f'z{i//4:02d}k{i%4:02d}'
              assert r['request_id']==d['request_id']==rid
              assert r['z_literal']==zs[i//4] and r['k_literal']==ks[i%4]
              vals=[r['Delta_m_hex'],d['dDelta_dalpha_h1e4_hex'],d['dDelta_dbeta_h1e4_hex']]
              assert all(math.isfinite(float.fromhex(v)) for v in vals)
              rows.append({'request_id':rid,'z_literal':r['z_literal'],'k_literal':r['k_literal'],'Delta_ref_hex':vals[0],'dDelta_dalpha_hex':vals[1],'dDelta_dbeta_hex':vals[2]})
          p=pathlib.Path('/tmp/ig/rebuilt/prediction.jsonl')
          with p.open('w',encoding='utf-8',newline='\n') as f:
              for r in rows: f.write(json.dumps(r,separators=(',',':'))+'\n')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='2836a3665e6bab75587957228fbd3b9e152ef7d6e667966c308d81bf666c7c56'
          frozen=pathlib.Path('docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_BASIS_V0_1.jsonl')
          assert p.read_bytes()==frozen.read_bytes()
          print('prediction_payload_sha256='+sha)
          print('prediction_record_count=28')
          PY
      - name: Audit prediction document and status separation
        shell: bash
        run: |
          set -euo pipefail
          f=docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_V0_1.md
          grep -Fq 'mapping artifact SHA256: `7f660b6806494b00d17caed50b7cc66d01d9d02bc4cb1d66f333c1c12e1386df`' "$f"
          grep -Fq 'SHA256: `2836a3665e6bab75587957228fbd3b9e152ef7d6e667966c308d81bf666c7c56`' "$f"
          grep -Fq 'dDelta_dalpha = (Delta(alpha=-h,beta=0)-Delta_ref)/(-h)' "$f"
          grep -Fq 'dDelta_dbeta = (Delta(alpha=0,beta=+h)-Delta(alpha=0,beta=-h))/(2*h)' "$f"
          grep -Fq 'admitted `h=1e-4` only' "$f"
          grep -Fq 'Delta_pred(alpha,beta;z,k) = Delta_ref(z,k) + alpha*dDelta_dalpha(z,k) + beta*dDelta_dbeta(z,k)' "$f"
          grep -Fq 'alpha is the physically allowed left-sided ray' "$f"
          grep -Fq 'beta is two-sided' "$f"
          grep -Fq 'No interpolation or extrapolation is admitted by this artifact.' "$f"
          grep -Fq 'numerically_evaluated=false' "$f"
          grep -Fq 'scientific_model_authority_created=false' "$f"
          grep -Fq 'G_DOMAIN_MAPPING=TESTABLE_NOT_EVALUATED' "$f"
      - name: Emit frozen admission result
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS_EXP073IG_C2_LOCAL_TANGENT_PREDICTION_ARTIFACT_ADMISSION_V0_1'
          echo 'classification=PREDICTION_ARTIFACT_ADMITTED_PLUS_0_PLUS_0'
          echo 'mapping_ready=true'
          echo 'prediction_artifact_created=true'
          echo 'prediction_ready=true'
          echo 'numerically_evaluated=false'
          echo 'scientific_model_authority_created=false'
          echo 'G_DOMAIN_MAPPING=TESTABLE_NOT_EVALUATED'
