name: DSIR V0.26 R1 minimal scientific response from numerical witnesses v0.2

on:
  push:
    branches:
      - main
    paths:
      - docs/dsir4/launch/LAYERB_BETA_V0_26_R1_MINIMAL_SCIENTIFIC_RESPONSE_FROM_NUMERICAL_WITNESSES_V0_2.launch.json

permissions:
  contents: read
  actions: read

concurrency:
  group: dsir-v026-r1-minimal-scientific-response-from-numerical-witnesses-v0-2
  cancel-in-progress: false

jobs:
  minimal-scientific-response:
    name: One-shot frozen M298 call375 scientific response
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout exact triggering main head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install exact read-only numerical dependency
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install "numpy==1.26.4" >/dev/null
          python - <<'PY'
          import platform
          import numpy as np
          assert platform.python_version() == "3.12.3"
          assert np.__version__ == "1.26.4"
          PY

      - name: Response-blind static contract self-check
        run: |
          set -euo pipefail
          mkdir -p evidence
          python ci/layerb_beta_v026_r1_minimal_scientific_response_from_numerical_witnesses_v0_2.py \
            --mode static-contract \
            --out evidence/static_contract.json

      - name: Execute exactly one frozen read-only scientific response gate
        run: |
          set -euo pipefail
          python ci/layerb_beta_v026_r1_minimal_scientific_response_from_numerical_witnesses_v0_2.py \
            --mode execute \
            --outdir evidence

      - name: Upload immutable scientific response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-v026-r1-minimal-scientific-response-v0-2
          path: evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Reflect frozen terminal classification without redefining science
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/result.json")
          if not p.is_file():
              raise SystemExit("missing scientific response result")
          d = json.loads(p.read_text())
          allowed = {
              "PASS_SCOPED_MINIMAL_SCIENTIFIC_RESPONSE_REPRODUCIBLE_NONZERO",
              "SCIENTIFIC_RESPONSE_ZERO_OR_NONFINITE",
              "SCIENTIFIC_RESPONSE_REPRODUCIBILITY_FAIL",
              "SCIENTIFIC_RESPONSE_CONSTRUCTION_MISMATCH",
              "PROVENANCE_FAIL",
              "INVALID_IMPLEMENTATION",
          }
          c = d.get("classification")
          if c not in allowed:
              raise SystemExit(f"unfrozen classification: {c!r}")
          print(c)
          PY
