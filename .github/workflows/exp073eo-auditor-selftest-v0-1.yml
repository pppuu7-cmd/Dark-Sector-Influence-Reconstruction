name: Exp073EO hosted provenance auditor selftest v0.1
on:
  push:
    paths:
      - '.github/workflows/exp073eo-auditor-selftest-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze auditor identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ci/exp073eo_ww_s0_s0_provenance_admission_v0_1.py)" = 'PLACEHOLDER_AUDITOR_BLOB'
          test "$(git rev-parse HEAD:ci/exp073eo_make_synthetic_fixture_v0_1.py)" = 'PLACEHOLDER_FIXTURE_BLOB'
      - name: Install numerical dependency
        run: python -m pip install -q numpy
      - name: Positive synthetic authority-chain test
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/eo-fixture"
          python ci/exp073eo_make_synthetic_fixture_v0_1.py --root "$R" | tee "$RUNNER_TEMP/digest.txt"
          D="$(tail -n1 "$RUNNER_TEMP/digest.txt")"
          python ci/exp073eo_ww_s0_s0_provenance_admission_v0_1.py \
            --artifact-root "$R" --run-metadata-json "$R/run.json" --artifact-metadata-json "$R/artifact.json" \
            --expected-artifact-digest "$D" --out "$R/eo_pass.json" | tee "$R/eo_pass.stdout"
          grep -Fx 'PASS_EXP073EO_WW_S0_S0_FILEBACKED_PROVENANCE_ADMISSION_V0_1' "$R/eo_pass.stdout"
      - name: Negative mutation must fail closed
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/eo-fixture"; D="$(tail -n1 "$RUNNER_TEMP/digest.txt")"
          python - "$R/checkpoints/B/exact_route/selected_ee.bin" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); b=bytearray(p.read_bytes()); b[17]^=1; p.write_bytes(b)
          PY
          set +e
          python ci/exp073eo_ww_s0_s0_provenance_admission_v0_1.py \
            --artifact-root "$R" --run-metadata-json "$R/run.json" --artifact-metadata-json "$R/artifact.json" \
            --expected-artifact-digest "$D" --out "$R/eo_blocked.json" > "$R/eo_blocked.stdout" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 4
          grep -F 'BLOCKED_EXP073EO_PROVENANCE_ADMISSION_V0_1' "$R/eo_blocked.stdout"
          echo PASS_EXP073EO_AUDITOR_FAIL_CLOSED_SELFTEST_V0_1
