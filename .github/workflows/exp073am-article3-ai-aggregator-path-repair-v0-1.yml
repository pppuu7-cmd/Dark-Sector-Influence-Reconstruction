name: Exp073AM Article3 AI aggregator path repair v0.1

on:
  push:
    paths:
      - 'ci/exp073am_article3_ai_aggregator_path_repair_v0_1.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'

jobs:
  aggregate-only-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce prospective Exp073AM freeze
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git log -1 --format=%H -- experiments/073am_article3_ai_aggregator_path_repair_v0_1_prereg.md)" = '3c18ea415f7fc5f4653cff5e241bdf0892140fde'
          test "$(git log -1 --format=%H -- ci/exp073ai_compare_single_thread_replicas_v0_1.py)" = '98e1518c34e30b0a7e59724ae60b7586f8c52f9c'
          test -f experiments/073am_article3_ai_aggregator_path_repair_v0_1_workflow_freeze.md
          SELF_COMMIT="$(git log -1 --format=%H -- .github/workflows/exp073am-article3-ai-aggregator-path-repair-v0-1.yml)"
          grep -F "workflow_last_modifying_commit: \`${SELF_COMMIT}\`" experiments/073am_article3_ai_aggregator_path_repair_v0_1_workflow_freeze.md
          if test "${GITHUB_EVENT_NAME}" = push; then
            test "$(git diff --name-only HEAD^ HEAD)" = 'ci/exp073am_article3_ai_aggregator_path_repair_v0_1.trigger'
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen aggregator dependency
        run: python -m pip install 'numpy==2.1.3'
      - uses: actions/download-artifact@v4
        with:
          name: exp073ai-single-thread-replica-A-fdfb0eae9ea799b4a185a059a0d1b9dfca17b31d
          path: external/a
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33310888983
      - uses: actions/download-artifact@v4
        with:
          name: exp073ai-single-thread-replica-B-fdfb0eae9ea799b4a185a059a0d1b9dfca17b31d
          path: external/b
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33310888983
      - name: Verify immutable artifact-root environment receipts
        shell: bash
        run: |
          set -euxo pipefail
          test -f external/a/exp073ai_env_a_v0_1.json
          test -f external/b/exp073ai_env_b_v0_1.json
          find external/a -maxdepth 2 -type f -printf 'A %P\n' | sort
          find external/b -maxdepth 2 -type f -printf 'B %P\n' | sort
      - name: Run unchanged frozen exact comparator
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data/derived/g7
          python ci/exp073ai_compare_single_thread_replicas_v0_1.py \
            --replica-a-root external/a \
            --replica-b-root external/b \
            --env-a external/a/exp073ai_env_a_v0_1.json \
            --env-b external/b/exp073ai_env_b_v0_1.json \
            --output-json data/derived/g7/exp073am_ai_single_thread_exact_reproducibility_repaired_v0_1.json
      - name: Enforce nonclassifying scientific accounting
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          p='data/derived/g7/exp073am_ai_single_thread_exact_reproducibility_repaired_v0_1.json'
          d=json.load(open(p))
          assert d['status'] in {'PASS_EXP073AI_SINGLE_THREAD_EXACT_REPRODUCIBILITY_V0_1','SCIENTIFIC_REPEATABILITY_FAIL_EXP073AI_SINGLE_THREAD_EXACT_V0_1'}
          assert d['production_release'] is False
          assert d['requires_future_successor_amendment_even_if_pass'] is True
          assert d['readiness_increment']==0
          assert d['article3_scientific_readiness_percent']==52
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          assert d['science_gate_scored'] is False
          assert d['scientific_pass_claimed'] is False
          assert d['physical_support_evaluated'] is False
          assert d['covariance_read'] is False
          assert d['nuisance_geometry_read'] is False
          assert d['G8_read'] is False
          print(d['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073am-ai-aggregator-path-repair-${{ github.sha }}
          path: data/derived/g7/exp073am_ai_single_thread_exact_reproducibility_repaired_v0_1.json
          if-no-files-found: error
          retention-days: 90
