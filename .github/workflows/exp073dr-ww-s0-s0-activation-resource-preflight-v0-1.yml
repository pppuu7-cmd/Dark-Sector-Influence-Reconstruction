name: Exp073DR WW_S0_S0 activation resource preflight v0.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/exp073dr-ww-s0-s0-activation-resource-preflight-v0-1.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: dsir-exp073dr-ww-s0-s0-activation-resource-preflight-v0-1
  cancel-in-progress: false
jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Run activation/resource preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/exp073dr_ww_s0_s0_activation_resource_preflight_v0_1.py | tee exp073dr_stdout.txt
          grep -Fx 'PASS_EXP073DR_WW_S0_S0_HOSTED_ACTIVATION_RESOURCE_PREFLIGHT_V0_1' exp073dr_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('exp073dr_ww_s0_s0_activation_resource_preflight_v0_1.json'))
          assert d['token']=='PASS_EXP073DR_WW_S0_S0_HOSTED_ACTIVATION_RESOURCE_PREFLIGHT_V0_1'
          assert d['science_gate_scored'] is False and d['ww_authority_created'] is False
          assert d['home_science_execution_authorized'] is False and d['home_readiness_preflight_authorized'] is True
          assert all(d['checks'].values())
          PY
      - run: sha256sum exp073dr_ww_s0_s0_activation_resource_preflight_v0_1.json exp073dr_stdout.txt > exp073dr_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exp073dr-ww-s0-s0-activation-resource-preflight-${{ github.run_id }}-${{ github.sha }}
          path: |
            exp073dr_ww_s0_s0_activation_resource_preflight_v0_1.json
            exp073dr_stdout.txt
            exp073dr_sha256.txt
          if-no-files-found: error
          retention-days: 90
