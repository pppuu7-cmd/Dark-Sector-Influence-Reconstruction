name: Exp073DW WW_S0_S0 DT-toolchain exact equivalence v0.1
on:
  push:
    branches: [main]
    paths: ['control/activate_exp073dw_v0_1.txt']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: dsir-exp073dw-ww-s0-s0-dt-toolchain-v0-1
  cancel-in-progress: false

env:
  PREREG_BLOB: '93ad37617dfe7604ab8aae79624ff7784b6d90d3'
  DP_BLOB: '2c04c353d357c6e84709e04946e3c1f52380c06f'
  WW_ADAPTER_BLOB: 'd6f20600d6a206dd9fbb254b382e71a49c6b3c07'
  SHARED_ADAPTER_BLOB: 'dafe86086a470c852106f0d4ecccbda1d389e397'
  OMP8_WRAPPER_BLOB: '63ee393791bba43d3eabbea654efdb9d439d477e'
  DOWNSTREAM_BLOB: 'be4f381de4c5c043a9c0fcd107e63ef3f2079578'
  OMP_NUM_THREADS: '8'
  OMP_DYNAMIC: 'FALSE'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

jobs:
  hosted-dt-toolchain-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Freeze DT-toolchain audit identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073dw_ww_s0_s0_dt_toolchain_exact_equivalence_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073dp_ww_exact_adapter_smallnside_equivalence_v0_1.py)" = "$DP_BLOB"
          test "$(git hash-object ci/exp073do_ww_s0_s0_production_exact_adapter_v0_1.py)" = "$WW_ADAPTER_BLOB"
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py)" = "$SHARED_ADAPTER_BLOB"
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_omp8_v0_3.py)" = "$OMP8_WRAPPER_BLOB"
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c)" = "$DOWNSTREAM_BLOB"
          echo PASS_EXP073DW_STATIC_FREEZE
      - name: Install exact DT numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "$GITHUB_ENV"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "$GITHUB_ENV"
      - name: Verify NaMaster lineage and compile exact DT downstream
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib,importlib.metadata,inspect,os,pymaster as nmt
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f'
          assert os.environ['OMP_NUM_THREADS']=='8' and os.environ['OMP_DYNAMIC']=='FALSE'
          for k in ['OPENBLAS_NUM_THREADS','MKL_NUM_THREADS','NUMEXPR_NUM_THREADS','BLIS_NUM_THREADS','VECLIB_MAXIMUM_THREADS']: assert os.environ[k]=='1',(k,os.environ[k])
          print('PASS_EXP073DW_NAMASTER27_DT_RUNTIME')
          PY
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -fopenmp -DDSIR_WORKERS=8 \
            -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c \
            -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073dw_downstream"
      - name: Execute frozen DP exact-equivalence harness under DT toolchain
        shell: bash
        run: |
          set -euo pipefail
          OUT=data/derived/exp073dw/v0_1
          mkdir -p "$OUT"
          "${NMT_PY}" ci/exp073dp_ww_exact_adapter_smallnside_equivalence_v0_1.py \
            --emulator "${RUNNER_TEMP}/exp073dw_downstream" --out "$OUT/dp_equivalence.json" | tee "$OUT/dp_stdout.txt"
          grep -Fx 'PASS_EXP073DP_WW_EXACT_ADAPTER_SMALLNSIDE_EQUIVALENCE_V0_1' "$OUT/dp_stdout.txt"
          "${NMT_PY}" - <<'PY'
          import json
          from pathlib import Path
          out=Path('data/derived/exp073dw/v0_1'); d=json.load(open(out/'dp_equivalence.json'))
          assert d['token']=='PASS_EXP073DP_WW_EXACT_ADAPTER_SMALLNSIDE_EQUIVALENCE_V0_1'
          assert d['science_gate_scored'] is False and d['ww_authority_created'] is False and d['no_tolerance_rescue'] is True
          assert len(d['cases'])==3
          for c in d['cases']:
              assert c['full_array_equal'] and c['full_sha_equal'] and c['full_max_abs_difference']==0.0
              assert c['ee_array_equal'] and c['ee_sha_equal'] and c['ee_max_abs_difference']==0.0
              assert c['semantics_ok'] and c['firewall_ok'] and c['mmap_ok']
          r={'schema':'dsir.exp073dw.ww_s0_s0.dt_toolchain_exact_equivalence.v0.1','classification':'QUALIFIER_PASS','token':'PASS_EXP073DW_WW_S0_S0_DT_TOOLCHAIN_EXACT_EQUIVALENCE_V0_1','science_gate_scored':False,'ww_s0_s0_authority_created':False,'accounting':'+0/+0','dp_frozen_token':d['token'],'cases':d['cases'],'compile_flags':'-O0 -std=c11 -fopenmp -DDSIR_WORKERS=8','runtime':'conda-forge PyMaster/NaMaster 2.7 + conda GSL','no_tolerance_rescue':True}
          (out/'terminal_qualifier_receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(r['token'])
          PY
          sha256sum "$OUT"/*.json "$OUT"/*.txt > "$OUT/payload_sha256.txt"
      - name: Upload immutable qualifier evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073dw-ww-s0-s0-dt-toolchain-v0-1-${{ github.sha }}
          path: data/derived/exp073dw/v0_1/
          if-no-files-found: error
