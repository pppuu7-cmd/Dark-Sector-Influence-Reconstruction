name: dsir-v026-r1-first-attempt-failure-funnel-v04-execution-authority-audit

on:
  push:
    branches:
      - audit/v026-r1-failure-funnel-v04-execution-authority-gate

permissions:
  contents: read
  actions: read

env:
  AUDITOR: ci/dsir_v026_r1_sentinel_first_attempt_failure_funnel_v04_execution_authority_audit_v0_1.py
  AUDITOR_BLOB: 968944ce86be8e909511189037725425241b2ad4
  TARGET_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-4.yml
  GH_TOKEN: ${{ github.token }}

jobs:
  execution-authority-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact execution-gate candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact execution-gate auditor identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$AUDITOR")" = "$AUDITOR_BLOB"
          python3 -m py_compile "$AUDITOR"

      - name: Capture fresh target dispatch history without side effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; path=os.environ['TARGET_WORKFLOW_PATH']
          runs=[]; url=f'https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=100'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          while url:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:
                  page=json.load(r); runs.extend(page.get('workflow_runs',[])); link=r.headers.get('Link','')
              url=next((p.split(';',1)[0].strip()[1:-1] for p in link.split(',') if 'rel="next"' in p),None)
          exact=[x for x in runs if x.get('path')==path and x.get('event')=='workflow_dispatch']
          json.dump({'total_count':len(exact),'workflow_runs':exact},open('safe/v04_target_live_runs.json','w'),indent=2,sort_keys=True)
          PY

      - name: Execute exact independent execution-authority auditor
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDITOR" --live-runs-json safe/v04_target_live_runs.json --out safe/v04_execution_gate_receipt.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/v04_execution_gate_receipt.json'))
          assert d['verdict']=='QUALIFIED'
          assert d['classification']=='V0_4_EXACT_ONE_FIRST_LIVE_FAILURE_FUNNEL_DISPATCH_AUTHORITY_QUALIFIED'
          assert d['candidate_dispatch_run_count']==0
          assert d['parallel_or_in_progress_target_sibling_count']==0
          assert d['consumer_schema_exact_match_verified'] is True
          assert d['atomic_pre_dispatch_recheck_required'] is True
          assert d['single_target_dispatch_authorized_after_exact_promotion'] is True
          assert d['dispatch_performed_by_this_receipt'] is False
          assert d['rerun_authorized'] is False
          assert d['second_dispatch_authorized'] is False
          assert d['same_nonce_second_attempt_authorized'] is False
          assert d['successor_sentinel_science_authorized'] is False
          assert d['full_107_row_execution_authorized'] is False
          PY
          sha256sum safe/v04_execution_gate_receipt.json > safe/v04_execution_gate_receipt.sha256

      - name: Persist immutable v0.4 execution-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-first-attempt-failure-funnel-v04-execution-authority-audit
          path: |
            safe/v04_execution_gate_receipt.json
            safe/v04_execution_gate_receipt.sha256
            safe/v04_target_live_runs.json
          if-no-files-found: error
          retention-days: 90
