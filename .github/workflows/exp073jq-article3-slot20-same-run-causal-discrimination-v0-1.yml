name: exp073jq-article3-slot20-same-run-causal-discrimination-v0-1

on:
  push:
    paths:
      - '.github/workflows/exp073jq-article3-slot20-same-run-causal-discrimination-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp073jq-article3-slot20-same-run-causal-discrimination-v0-1
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PREREG_BLOB: 'a67f2e42df0fc04448a62b7cc22cb759841e7690'
  HELPER_BLOB: '636b7195e562f88ea548cde2598585c0f95c34bc'
  CANONICAL_AUTHORITY_BLOB: 'b70ede7f8ecdf0cc67a9f20d33cafc1708eee8e8'
  JO_NEGATIVE_AUTHORITY_PATH: 'docs/dsir4/authority/EXP073JO_SLOT20_CANONICAL_SHARDED_HISTORY_EXACT_NEGATIVE_V0_5.json'
  CANONICAL_NODE_SHA: 'f30556be2547732ed0b87b56368e01e46504a975f94fcbbc5e7bc8cfc525e5eb'
  CANONICAL_HEX_SHA: '98cd360d0764a884471cb09b4504b79583e2ffaea4423389ec473e98b8656c2a'

jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        model: [reference, alpha_minus, beta_plus, beta_minus]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen JQ identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073JQ_ARTICLE3_SLOT20_SAME_RUN_CAUSAL_DISCRIMINATION_V0_1.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073jq_slot20_same_run_causal_discrimination_v0_1.py)" = "$HELPER_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JO_CANONICAL_4097_NODE_PAYLOAD_AUTHORITY_V0_5.json)" = "$CANONICAL_AUTHORITY_BLOB"
          test "$(sha256sum docs/dsir4/authority/EXP073JO_CANONICAL_4097_NODES_V0_5.f64 | awk '{print $1}')" = "$CANONICAL_NODE_SHA"
          test "$(sha256sum docs/dsir4/authority/EXP073JO_CANONICAL_4097_NODES_V0_5.hex | awk '{print $1}')" = "$CANONICAL_HEX_SHA"
          python - <<'PY'
          import json
          d=json.load(open('docs/dsir4/authority/EXP073JO_SLOT20_CANONICAL_SHARDED_HISTORY_EXACT_NEGATIVE_V0_5.json'))
          assert d['classification']=='SLOT20_CANONICAL_SHARDED_HISTORY_EXACT_FAIL_PLUS_0_PLUS_0'
          assert d['exact_array_equal'] is False
          assert d['checkpointed_JL_replay_authorized'] is False
          PY
          python -m py_compile ci/exp073jq_slot20_same_run_causal_discrimination_v0_1.py
      - name: Install frozen stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null
      - name: Build exact pinned capacity-patched CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 4608',1))
          q=Path('external/class_iv/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 131072',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Execute frozen same-run triple-instance control
        shell: bash
        run: |
          set -euo pipefail
          python ci/exp073jq_slot20_same_run_causal_discrimination_v0_1.py \
            --model '${{ matrix.model }}' \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --canonical-bin docs/dsir4/authority/EXP073JO_CANONICAL_4097_NODES_V0_5.f64 \
            --canonical-hex docs/dsir4/authority/EXP073JO_CANONICAL_4097_NODES_V0_5.hex \
            --canonical-authority docs/dsir4/authority/EXP073JO_CANONICAL_4097_NODE_PAYLOAD_AUTHORITY_V0_5.json \
            --out-dir artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: exp073jq-${{ matrix.model }}
          path: artifacts/
          retention-days: 90

  aggregate:
    needs: model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exp073jq-*
          path: parts
      - name: Aggregate exact causal classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import glob,json,pathlib
          rows=[]
          for p in glob.glob('parts/exp073jq-*'):
              d=json.load(open(pathlib.Path(p)/'result.json')); rows.append(d)
          assert len(rows)==4
          assert {d['model'] for d in rows}=={'reference','alpha_minus','beta_plus','beta_minus'}
          for d in rows:
              assert d['schema']=='EXP073JQ_SLOT20_SAME_RUN_CAUSAL_DISCRIMINATION_RESULT_V0_1'
              assert d['canonical_node_sha256']=='f30556be2547732ed0b87b56368e01e46504a975f94fcbbc5e7bc8cfc525e5eb'
              assert d['same_job'] is True and d['execution_order']==['fresh_A','after_history','fresh_B']
          cs=[d['classification'] for d in rows]
          if any(c=='SAME_RUN_FRESH_REEXECUTION_NOT_EXACT_PLUS_0_PLUS_0' for c in cs): agg='SAME_RUN_SOLVER_REEXECUTION_NONDETERMINISM_DETECTED_PLUS_0_PLUS_0'
          elif any(c=='SAME_RUN_HISTORY_DEPENDENCE_CONFIRMED_PLUS_0_PLUS_0' for c in cs): agg='SAME_RUN_HISTORY_DEPENDENCE_CONFIRMED_PLUS_0_PLUS_0'
          else:
              assert all(c=='SAME_RUN_HISTORY_INDEPENDENCE_PASS_PLUS_0_PLUS_0' for c in cs)
              agg='SAME_RUN_HISTORY_INDEPENDENCE_PASS_PLUS_0_PLUS_0'
          out={'schema':'EXP073JQ_AGGREGATE_RESULT_V0_1','experiment':'Exp073JQ','classification':agg,'effect':'+0/+0','scientific_authority_created':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'model_classifications':{d['model']:d['classification'] for d in rows},'checkpointed_JL_replay_authorized':False,'article3_readiness_percent':68,'funnel_freeze_readiness_percent':67,'token':'PASS_EXP073JQ_'+agg}
          pathlib.Path('artifacts/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token']); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073jq-aggregate
          path: artifacts/
          retention-days: 90
