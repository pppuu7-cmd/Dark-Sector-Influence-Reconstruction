name: F30 specificity and manifold retrospective audit v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/f30-specificity-manifold-retrospective-v0-1.yml'
      - 'ci/f30_specificity_manifold_retrospective_v0_1.py'
      - 'experiments/071a_f30_specificity_manifold_retrospective_v0_1.md'

permissions:
  contents: read
  actions: read

jobs:
  retrospective-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependency
        run: python3 -m pip install --user numpy
      - name: Download immutable already-unblinded artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs/c3 inputs/c5 inputs/c7 inputs/c8 inputs/c9
          gh run download 32904158849 --repo "$GITHUB_REPOSITORY" --dir inputs/c3
          gh run download 32907619613 --repo "$GITHUB_REPOSITORY" --dir inputs/c5
          gh run download 32920776596 --repo "$GITHUB_REPOSITORY" --dir inputs/c7
          gh run download 32926084015 --repo "$GITHUB_REPOSITORY" --dir inputs/c8
          gh run download 32957427686 --repo "$GITHUB_REPOSITORY" --dir inputs/c9
          test "$(find inputs/c3 -name exp049b_gdm_cv2_intermediate_scan.json | wc -l)" -eq 1
          test "$(find inputs/c5 -name 'exp049c_B0_*.json' | wc -l)" -ge 5
          test "$(find inputs/c7 -name idm_dr_common_source_response_slope_v0_1.json | wc -l)" -eq 1
          test "$(find inputs/c8 -name idm_photon_endpoint_half_transition_prospective_v0_1.json | wc -l)" -eq 1
          test "$(find inputs/c9 -name idm_baryon_multicoordinate_prospective_v0_1.json | wc -l)" -eq 1
      - name: Recompute post-unblinding specificity and manifold diagnostics
        run: |
          set -euxo pipefail
          python3 ci/f30_specificity_manifold_retrospective_v0_1.py \
            --gdm-root inputs/c3 --fr-root inputs/c5 --c7-root inputs/c7 --c8-root inputs/c8 --c9-root inputs/c9 \
            --json exp071a_f30_specificity_manifold_retrospective_v0_1.json
      - name: Assert only deterministic retrospective reconstruction
        run: |
          python3 - <<'PY'
          import json, math
          d=json.load(open('exp071a_f30_specificity_manifold_retrospective_v0_1.json'))
          assert d['status']=='DESCRIPTIVE_RETROSPECTIVE_F30_SPECIFICITY_MANIFOLD_AUDIT_V0_1'
          assert d['epistemic_status']=='POST_UNBLINDING_RETROSPECTIVE_ONLY'
          assert d['f30_preserved_status']=='PASS_IDM_BARYON_MULTICOORDINATE_PROSPECTIVE_V0_1'
          t=d['topology_specificity']
          assert t['total_permutations']==120
          assert t['simple_path_permutations_full']==40
          assert t['simple_path_permutations_robust_all_leave_one_z']==40
          assert math.isclose(t['simple_path_fraction_full'],1/3,rel_tol=0,abs_tol=1e-15)
          p=d['pooled_training_centered_svd']
          assert p['training_vectors']==20 and p['features']==35
          assert math.isclose(p['cumulative_variance_fraction'][1],0.961466503,rel_tol=0,abs_tol=2e-9)
          assert p['withheld_c9_subspace_transfer']['2']['max'] > 0.89
          assert p['withheld_c9_subspace_transfer']['4']['max'] > 0.37
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('F30 permutation pass fraction',t['simple_path_fraction_full'])
          print('training cumulative PC2',p['cumulative_variance_fraction'][1])
          print('C9 outside PC2',p['withheld_c9_subspace_transfer']['2'])
          print('family PC fractions',{k:v['variance_fraction'][:3] for k,v in d['within_family_centered_svd'].items()})
          PY
      - name: Record epistemic boundary
        run: |
          {
            echo 'Exp071A is post-unblinding retrospective only.'
            echo 'No threshold or coordinate is being preregistered from these already-seen C9 data.'
            echo 'F30 prospective PASS is preserved unchanged.'
            echo 'G7/G8/G9 remain OPEN.'
            echo "DSIR head: $GITHUB_SHA"
          } > exp071a_environment.txt
      - name: Upload immutable Exp071A descriptive record
        uses: actions/upload-artifact@v4
        with:
          name: exp071a-f30-specificity-manifold-retrospective-${{ github.sha }}
          path: |
            exp071a_f30_specificity_manifold_retrospective_v0_1.json
            exp071a_environment.txt
          if-no-files-found: error
