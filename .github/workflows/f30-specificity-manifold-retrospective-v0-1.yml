name: F30 specificity and manifold retrospective audit v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/f30-specificity-manifold-retrospective-v0-1.yml'
      - 'ci/f30_specificity_manifold_retrospective_v0_1.py'
      - 'experiments/071b_f30_specificity_manifold_retrospective_v0_1.md'

permissions:
  contents: read
  actions: read

jobs:
  retrospective-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user numpy
      - name: Download immutable already-unblinded inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs/c3 inputs/c5 inputs/c7 inputs/c8 inputs/c9
          gh run download 32904158849 --repo "$GITHUB_REPOSITORY" --dir inputs/c3
          gh run download 32907619613 --repo "$GITHUB_REPOSITORY" --dir inputs/c5
          gh run download 32920776596 --repo "$GITHUB_REPOSITORY" --dir inputs/c7
          gh run download 32926084015 --repo "$GITHUB_REPOSITORY" --dir inputs/c8
          gh run download 32957427686 --repo "$GITHUB_REPOSITORY" --dir inputs/c9
      - name: Recompute retrospective diagnostics
        run: |
          python3 ci/f30_specificity_manifold_retrospective_v0_1.py \
            --gdm-root inputs/c3 --fr-root inputs/c5 --c7-root inputs/c7 --c8-root inputs/c8 --c9-root inputs/c9 \
            --json exp071b_f30_specificity_manifold_retrospective_v0_1.json
      - name: Assert deterministic post-unblinding reconstruction only
        run: |
          python3 - <<'PY'
          import json, math
          d=json.load(open('exp071b_f30_specificity_manifold_retrospective_v0_1.json'))
          assert d['experiment']=='Exp071B'
          assert d['status']=='DESCRIPTIVE_RETROSPECTIVE_F30_SPECIFICITY_MANIFOLD_AUDIT_V0_1'
          assert d['epistemic_status']=='POST_UNBLINDING_RETROSPECTIVE_ONLY'
          assert d['f30_preserved_status']=='PASS_IDM_BARYON_MULTICOORDINATE_PROSPECTIVE_V0_1'
          t=d['topology_specificity']
          assert t['total_permutations']==120 and t['simple_path_permutations_full']==40
          assert t['simple_path_permutations_robust_all_leave_one_z']==40
          assert math.isclose(t['simple_path_fraction_full'],1/3,rel_tol=0,abs_tol=1e-15)
          p=d['pooled_training_centered_svd']
          assert math.isclose(p['cumulative_variance_fraction'][1],0.961466503,rel_tol=0,abs_tol=2e-9)
          assert p['withheld_c9_subspace_transfer']['2']['max']>0.89
          assert p['withheld_c9_subspace_transfer']['4']['max']>0.37
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('F30 permutation fraction=',t['simple_path_fraction_full'])
          print('training PC1+PC2=',p['cumulative_variance_fraction'][1])
          print('C9 PC2 residuals=',p['withheld_c9_subspace_transfer']['2'])
          print('family first-three fractions=',{k:v['variance_fraction'][:3] for k,v in d['within_family_centered_svd'].items()})
          PY
      - name: Upload immutable retrospective record
        uses: actions/upload-artifact@v4
        with:
          name: exp071b-f30-specificity-manifold-retrospective-${{ github.sha }}
          path: exp071b_f30_specificity_manifold_retrospective_v0_1.json
          if-no-files-found: error
