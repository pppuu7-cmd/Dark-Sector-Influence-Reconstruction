name: layerb-16385-cross-vm-numeric-repro-v0-1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-16385-cross-vm-numeric-repro-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1,2]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce response-blind diagnostic identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_16385_cross_vm_numeric_repro_probe_v0_1.py)" = 'd9ead00e746415f6d05c2f609bedf62e83e58954'
          test "$(git hash-object ci/layerb_post_jm_16385_one_live_resource_pilot_v0_1.py)" = '00d8cb7d7dd6f5fa84aa0a8ddd3ea1c8ed3f81cb'
          test "$(git hash-object ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py)" = 'c975a964805919cd61e3c028305ad3945773377f'
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = 'ee8fd0650a2a1322fab83a86bb06a219e84ca434'
          test "$(git hash-object docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_16385_V0_1.json)" = '50aa473299c82c857921a083f7d4de652ba476a4'
          test "$(git hash-object docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt)" = 'fc4eb1e7f51a0ad3773b8be13c477652b1f71368'
          test "$(git hash-object scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py)" = 'e20687e933d665973c3be40598180587701fa8e0'
      - name: Install exact numerical/build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
      - name: Build pinned CLASS-IV with proven 16385 execution patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 18432'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 524288'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          Path('artifacts/capacity_patch.json').write_text(json.dumps({'old_capacity':30,'new_capacity':18432,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_old_argument_capacity':1024,'parser_new_argument_capacity':524288,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost},indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py external/class_iv artifacts/history_patch.json
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.load(open('artifacts/history_patch.json')); assert d['replacement_count']==1 and d['post_sha256']=='4e9a419d46471ffab74df3d14239e000bf92f2e198edad4d2c7b82f1335f7a4b' and d['scientific_parameters_changed'] is False
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Execute four-role two-request numeric reproducibility probe
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/layerb_16385_cross_vm_numeric_repro_probe_v0_1.py \
            --resource-script ci/layerb_post_jm_16385_one_live_resource_pilot_v0_1.py \
            --canonical-authority docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_16385_V0_1.json \
            --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt \
            --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --capacity-patch-record artifacts/capacity_patch.json \
            --out artifacts/result.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/result.json'))
          assert d['classification']=='CANONICAL_16385_CROSS_VM_NUMERIC_REPRO_PROBE_PASS_PLUS_0_PLUS_0',d
          assert d['current_16385_scientific_result_read'] is False and d['full_107_row_traversal_executed'] is False
          assert d['execution_lifecycle']=={'total_solver_constructions':4,'max_live_instances':1,'final_live_instances':0}
          assert d['unsupported_target_evaluations']==0 and d['max_requested_node_coordinate_rel_mismatch']<=1e-12
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-16385-cross-vm-numeric-repro-replica-${{ matrix.replica }}
          path: |
            artifacts/result.json
            artifacts/capacity_patch.json
            artifacts/history_patch.json
          if-no-files-found: error
          retention-days: 90

  compare:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: layerb-16385-cross-vm-numeric-repro-replica-1
          path: r1
      - uses: actions/download-artifact@v4
        with:
          name: layerb-16385-cross-vm-numeric-repro-replica-2
          path: r2
      - name: Quantify cross-VM numeric differences without science classification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'numpy==1.26.4'
          mkdir -p artifacts
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          import numpy as np
          a=json.load(open('r1/result.json')); b=json.load(open('r2/result.json'))
          PASS='CANONICAL_16385_CROSS_VM_NUMERIC_REPRO_PROBE_PASS_PLUS_0_PLUS_0'
          assert a['classification']==PASS and b['classification']==PASS
          assert a['role_order']==b['role_order']==['reference','alpha_minus','beta_plus','beta_minus']
          byrole={}
          A={x['role']:x for x in a['model_receipts']}; B={x['role']:x for x in b['model_receipts']}
          for role in a['role_order']:
            byrole[role]={}
            for q in ('A','B'):
              x=np.asarray(A[role]['requests'][q]['values'],dtype=np.float64); y=np.asarray(B[role]['requests'][q]['values'],dtype=np.float64)
              d=np.abs(x-y); den=np.maximum(np.maximum(np.abs(x),np.abs(y)),np.finfo(float).tiny)
              byrole[role][q]={'values_replica_1':x.tolist(),'values_replica_2':y.tolist(),'max_absolute_difference':float(d.max()),'max_symmetric_relative_difference':float((d/den).max()),'rms_absolute_difference':float(np.sqrt(np.mean(d*d))),'sha_equal':A[role]['requests'][q]['payload_sha256']==B[role]['requests'][q]['payload_sha256']}
          resp={}
          for q in ('A','B'):
            x=np.asarray(a['pilot_responses'][q]['values'],dtype=np.float64); y=np.asarray(b['pilot_responses'][q]['values'],dtype=np.float64); d=np.abs(x-y); den=np.maximum(np.maximum(np.abs(x),np.abs(y)),np.finfo(float).tiny)
            resp[q]={'values_replica_1':x.tolist(),'values_replica_2':y.tolist(),'max_absolute_difference':float(d.max()),'max_symmetric_relative_difference':float((d/den).max()),'rms_absolute_difference':float(np.sqrt(np.mean(d*d))),'sha_equal':a['pilot_responses'][q]['payload_sha256']==b['pilot_responses'][q]['payload_sha256']}
          out={'schema':'LAYERB_16385_CROSS_VM_NUMERIC_REPRO_COMPARISON_V0_1','classification':'LAYERB_16385_CROSS_VM_NUMERIC_REPRO_DIAGNOSTIC_PASS_PLUS_0_PLUS_0','effect':'+0/+0','role_request_differences':byrole,'pilot_response_differences':resp,'all_operand_hashes_equal':all(byrole[r][q]['sha_equal'] for r in byrole for q in ('A','B')),'all_response_hashes_equal':all(resp[q]['sha_equal'] for q in ('A','B')),'current_16385_scientific_result_read':False,'full_107_row_traversal_executed':False,'scientific_authority_created':False,'stopping_rule_changed':False,'next_rung_authorized':False,'token':'LAYERB_16385_CROSS_VM_NUMERIC_REPRO_DIAGNOSTIC_PASS_PLUS_0_PLUS_0'}
          Path('artifacts/comparison.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(out['token']); print(json.dumps({'role_request_differences':byrole,'pilot_response_differences':resp},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-16385-cross-vm-numeric-repro-comparison-v0-1
          path: artifacts/comparison.json
          if-no-files-found: error
          retention-days: 90
