name: dsir-v026-r1-first-attempt-failure-funnel-execution-authority-audit-v0-1

on:
  push:
    branches:
      - audit/v026-r1-failure-funnel-execution-authority-audit
    paths:
      - ci/dsir_v026_r1_sentinel_first_attempt_failure_funnel_execution_authority_audit_v0_1.py
      - .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-execution-authority-audit-v0-1.yml

permissions:
  contents: read
  actions: read

env:
  WORKFLOW_BRANCH: audit/v026-r1-first-attempt-failure-funnel-hosted-workflow-candidate
  WORKFLOW_HEAD: 1a1f33df835218b7c6232e2a9078d6681081b16f
  AUTHORITY_BRANCH: audit/v026-r1-failure-funnel-hosted-execution-authority-candidate
  AUTHORITY_HEAD: 30461cd9f9d8b43072b47ef78718fe49bfd3a2dd
  TARGET_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-1.yml
  AUDITOR: ci/dsir_v026_r1_sentinel_first_attempt_failure_funnel_execution_authority_audit_v0_1.py
  GH_TOKEN: ${{ github.token }}

jobs:
  execution-authority-static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout independent audit branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact workflow and execution-authority candidate heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$WORKFLOW_BRANCH:refs/remotes/origin/workflow-target"
          git fetch --no-tags origin "$AUTHORITY_BRANCH:refs/remotes/origin/authority-target"
          test "$(git rev-parse refs/remotes/origin/workflow-target)" = "$WORKFLOW_HEAD"
          test "$(git rev-parse refs/remotes/origin/authority-target)" = "$AUTHORITY_HEAD"
          test "$(git hash-object "$AUDITOR")" = '7255fee3e6387d26a628f98dc33f8e6ff0660575'

      - name: Capture live dispatch history for failure-funnel workflow path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          path=os.environ['TARGET_WORKFLOW_PATH']
          runs=[]
          url=f'https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=100'
          while url:
              req=urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as r:
                  page=json.load(r)
                  runs.extend(page.get('workflow_runs', []))
                  link=r.headers.get('Link','')
              next_url=None
              for part in link.split(','):
                  if 'rel="next"' in part:
                      next_url=part.split(';',1)[0].strip()[1:-1]
              url=next_url
          exact=[x for x in runs if x.get('path')==path]
          json.dump({'total_count':len(exact),'workflow_runs':exact}, open('safe/candidate_live_runs.json','w'), indent=2, sort_keys=True)
          PY

      - name: Execute independent execution-authority compatibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$AUDITOR"
          python3 "$AUDITOR" \
            --candidate-live-runs-json safe/candidate_live_runs.json \
            --out safe/execution_authority_audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/execution_authority_audit.json'))
          assert d['verdict']=='BLOCKED'
          assert d['classification']=='HOSTED_FAILURE_FUNNEL_EXECUTION_AUTHORITY_RUNTIME_BINDING_INCOMPLETE'
          assert d['authorized_ref_runtime_enforced'] is False
          assert d['independent_review_runtime_bound'] is False
          assert d['candidate_dispatch_run_count']==0
          assert d['failure_funnel_execution_authorized_after_review'] is False
          assert d['authority_promotion_authorized'] is False
          assert d['workflow_candidate_promotion_authorized'] is False
          assert d['rerun_authorized'] is False
          assert d['successor_sentinel_science_authorized'] is False
          assert d['full_107_row_execution_authorized'] is False
          PY
          sha256sum safe/execution_authority_audit.json > safe/execution_authority_audit.sha256

      - name: Persist immutable blocked execution-authority audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-first-attempt-failure-funnel-execution-authority-audit-v0-1
          path: |
            safe/execution_authority_audit.json
            safe/execution_authority_audit.sha256
            safe/candidate_live_runs.json
          if-no-files-found: error
          retention-days: 90
