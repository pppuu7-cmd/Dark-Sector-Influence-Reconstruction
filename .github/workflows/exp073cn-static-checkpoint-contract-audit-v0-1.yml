name: Exp073CN hosted static checkpoint contract audit v0.1

on:
  push:
    paths:
      - 'ci/exp073cn_static_audit_request_v0_1.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit frozen commits and checkpoint/resource semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- preregistration/2026-09-03_exp073cn_wm_s3_8worker_band_checkpoint_resource_v0_1.md)" = '7a4c47a52204570abb5efbc04b583d66a93c26bf'
          test "$(git log -1 --format=%H -- ci/exp073cn_wm_s3_8worker_checkpoint_resource_v0_1.py)" = '6cd0016d061df0156ef64b705fee339c55d5ed9f'
          test "$(git log -1 --format=%H -- .github/workflows/exp073cn-wm-s3-8worker-checkpoint-resource-v0-1.yml)" = '584b3544a4785594f3607d787368400a74709688'
          test "$(git log -1 --format=%H -- experiments/073cn_wm_s3_8worker_checkpoint_resource_v0_1_binding.json)" = '19526b27380da048b40d55a112f27ed6bed80e97'
          test "$(git log -1 --format=%H -- docs/SELF_HOSTED_CHECKPOINT_POLICY.md)" = 'f45ae0ce4d199ae381e8612d41cfd7e4c7dfc427'
          test "$(git log -1 --format=%H -- ci/dsir_checkpoint_git_sync_v0_2.sh)" = 'bc468ca73a3c4e281bd2b1ee46d6f7704bb54bb1'
          python3 -m py_compile ci/exp073cn_wm_s3_8worker_checkpoint_resource_v0_1.py
          python3 - <<'PY'
          import ast, json, pathlib
          p=pathlib.Path('ci/exp073cn_wm_s3_8worker_checkpoint_resource_v0_1.py')
          s=p.read_text(); ast.parse(s)
          b=json.load(open('experiments/073cn_wm_s3_8worker_checkpoint_resource_v0_1_binding.json'))
          assert b['state']=='PREPARED_AWAITING_HOSTED_STATIC_AUDIT'
          assert b['outer_workers']==8 and b['nested_threads']==1
          assert b['checkpoint_after_each_complete_band'] is True
          assert b['bands']==list(range(16))
          assert b['exact_only'] is True and b['cpu_fraction_min']==0.90 and b['swap_increase_max_kib']==0
          assert b['checkpoint_branch']=='checkpoints/exp073cn-wm-s3-8worker-resource-v0-1'
          assert b['upstream_checkpoint_head']=='d405a7a934bbd8caf464cd2a4bcb6052b8d205cd'
          assert b['upstream_pcl_sha256']=='ec34ee34311f3b02a16e118113b5b1acd1b961859caccd2c4387c0ae529cd72d'
          assert b['upstream_reference_sha256']=='36ee9fca9fb276a30d8ebb97cb04fddc7e95cff18fb29248c033bb364ea2d8cf'
          required=[
            'ProcessPoolExecutor(max_workers=OUTER_WORKERS)',
            "for b in BANDS: load_band(root,b)",
            "store_band(root,b,a,tel); sync(root,branch,sync_script,f'band-{b:02d}-complete')",
            "OPENBLAS_NUM_THREADS","MKL_NUM_THREADS","OMP_NUM_THREADS","BLIS_NUM_THREADS","NUMEXPR_NUM_THREADS",
            "np.array_equal(first8,ref)","chash(first8)==REFERENCE_SHA",
            "cpu_fraction<CPU_FRACTION_MIN","swap_inc>0",
            "checkpoint contract mismatch; fail closed",
          ]
          for x in required: assert x in s, x
          assert "BANDS = tuple(range(16))" in s and "OUTER_WORKERS = 8" in s and "NESTED_THREADS = 1" in s
          assert "UPSTREAM_CM_HEAD = 'd405a7a934bbd8caf464cd2a4bcb6052b8d205cd'" in s
          w=pathlib.Path('.github/workflows/exp073cn-wm-s3-8worker-checkpoint-resource-v0-1.yml').read_text()
          assert 'runs-on: [self-hosted, Linux, X64]' in w
          assert "launch/exp073cn_wm_s3_8worker_resource_v0_1.json" in w
          assert "restore \"$CM\" 'checkpoints/exp073cm-wm-s3-resource-v0-1' 'd405a7a934bbd8caf464cd2a4bcb6052b8d205cd'" in w
          assert "restore \"$CP\" 'checkpoints/exp073cn-wm-s3-8worker-resource-v0-1' ALLOW_ABSENT" in w
          assert "--sync-script ci/dsir_checkpoint_git_sync_v0_2.sh" in w
          assert "bash ci/dsir_checkpoint_git_sync_v0_2.sh push \"$CP\" \"$BR\" 'frozen final classification'" in w
          assert not pathlib.Path('launch/exp073cn_wm_s3_8worker_resource_v0_1.json').exists(), 'home launch marker exists before audit PASS'
          print('PASS_EXP073CN_STATIC_CHECKPOINT_CONTRACT_AUDIT_V0_1')
          PY
      - name: Emit audit result
        shell: bash
        run: |
          mkdir -p audit
          python3 - <<'PY'
          import json, os
          x={'experiment':'Exp073CN','status':'PASS_EXP073CN_STATIC_CHECKPOINT_CONTRACT_AUDIT_V0_1','resource_workflow_commit':'584b3544a4785594f3607d787368400a74709688','driver_commit':'6cd0016d061df0156ef64b705fee339c55d5ed9f','binding_commit':'19526b27380da048b40d55a112f27ed6bed80e97','run_id':int(os.environ['GITHUB_RUN_ID']),'head_sha':os.environ['GITHUB_SHA'],'verified_delta':0.0,'draft_data_delta':0.0}
          open('audit/exp073cn_static_audit_v0_1.json','w').write(json.dumps(x,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073cn-static-checkpoint-contract-audit-${{ github.sha }}
          path: audit/exp073cn_static_audit_v0_1.json
          retention-days: 90
