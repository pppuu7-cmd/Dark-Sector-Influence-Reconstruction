name: Exp073BW GSL selected-solver exact equivalence v0.1

on:
  push:
    branches: [main]
    paths:
      - 'activations/exp073bw_gsl_selected_solver_equivalence_v0_1.activate'

permissions:
  contents: read

jobs:
  hosted-static-and-gsl-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Freeze preregistration and helper identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073bw_support_gsl_selected_solver_equivalence_v0_1_prereg.md)" = "e66c1e5d7a2f4593bfa8daf302663887790d44d2"
          test "$(git hash-object ci/exp073bw_gsl_selected_solver_equivalence_v0_1.py)" = "22c0cb391931e578f92c7ce75c4dba3429e09265"
          test "$(git hash-object ci/exp073bw_gsl_selected_solver_equivalence_v0_1.c)" = "c247d449ecaec12ab05975181f0a05e4c3ac52fe"
          grep -Fq 'G1_EXACT_SELECTED_GSL_EQUIVALENCE' experiments/073bw_support_gsl_selected_solver_equivalence_v0_1_prereg.md
          grep -Fq 'No closeness tolerance is an acceptance criterion.' experiments/073bw_support_gsl_selected_solver_equivalence_v0_1_prereg.md
          echo 'EXP073BW_SUPPORT_ONLY=1'
          echo 'EXP073BU_SCIENCE_AUTHORITY_FORBIDDEN=1'
          echo 'PASS_EXP073BW_V0_1_HOSTED_STATIC_FREEZE_AUDIT'

      - name: Install exact NaMaster 2.7 plus GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "${GITHUB_ENV}"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"

      - name: Verify runtime source and GSL version
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib, importlib.metadata, inspect
          import pymaster as nmt
          version=importlib.metadata.version('pymaster')
          assert version=='2.7' or version.startswith('2.7.'),version
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          got=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert got=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f',(p,got)
          print('PASS_EXP073BW_V0_1_NAMASTER27_RUNTIME_LINEAGE')
          PY
          test -f "${NMT_PREFIX}/include/gsl/gsl_version.h"
          grep -Eq '#define GSL_VERSION "2\.7' "${NMT_PREFIX}/include/gsl/gsl_version.h"
          grep '#define GSL_VERSION' "${NMT_PREFIX}/include/gsl/gsl_version.h"

      - name: Compile frozen C helper against exact conda GSL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/exp073bw-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 \
            -I"${NMT_PREFIX}/include" ci/exp073bw_gsl_selected_solver_equivalence_v0_1.c \
            -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm \
            -o "${RUNNER_TEMP}/exp073bw-bin/gsl_solver"
          test -x "${RUNNER_TEMP}/exp073bw-bin/gsl_solver"
          echo "GSL_SOLVER=${RUNNER_TEMP}/exp073bw-bin/gsl_solver" >> "${GITHUB_ENV}"
          echo 'PASS_EXP073BW_V0_1_GSL_HELPER_COMPILED'

      - name: Execute frozen three-case GSL isolation QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/exp073bw
          "${NMT_PY}" ci/exp073bw_gsl_selected_solver_equivalence_v0_1.py \
            --solver "${GSL_SOLVER}" \
            --out data/derived/exp073bw/exp073bw_gsl_selected_solver_equivalence_v0_1.json
          echo 'PASS_EXP073BW_V0_1_SYNTHETIC_QA_EXECUTED'

      - name: Upload complete receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073bw-gsl-selected-solver-${{ github.sha }}
          path: data/derived/exp073bw/exp073bw_gsl_selected_solver_equivalence_v0_1.json
          if-no-files-found: warn
