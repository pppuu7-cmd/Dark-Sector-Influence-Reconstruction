name: Exp073AC2 Article3 factorized Layer-A synthetic infra repair v0.2

on:
  push:
    paths:
      - 'ci/exp073ac2_article3_factorized_layera_synthetic_infra_repair_v0_2.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-factorized-layera-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce frozen evaluator and infra-only repair
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git log -1 --format=%H -- experiments/073ac_article3_factorized_layera_synthetic_v0_1_prereg.md)" = 'c5fc9e21f6def22194c713fa70cf3100f2136667'
          test "$(git log -1 --format=%H -- ci/exp073ac_article3_factorized_layera_synthetic_v0_1.py)" = 'e7117d54ca43390b9da0452d99f92b7776ddfcf9'
          test "$(git log -1 --format=%H -- experiments/073ac2_article3_factorized_layera_synthetic_infra_repair_v0_2.md)" = 'e90239e06b60f4f479434f9c755b49d2ce0e51d3'
          test -f experiments/073ac2_article3_factorized_layera_synthetic_infra_repair_v0_2_workflow_freeze.md
          SELF="$(git log -1 --format=%H -- .github/workflows/exp073ac2-article3-factorized-layera-synthetic-infra-repair-v0-2.yml)"
          grep -F "workflow_last_modifying_commit: \`${SELF}\`" experiments/073ac2_article3_factorized_layera_synthetic_infra_repair_v0_2_workflow_freeze.md
          if test "${GITHUB_EVENT_NAME}" = push; then
            test "$(git diff --name-only HEAD^ HEAD)" = 'ci/exp073ac2_article3_factorized_layera_synthetic_infra_repair_v0_2.trigger'
          fi
      - name: Install missing runtime dependency only
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install 'numpy<2.4'
      - name: Run unchanged frozen synthetic evaluator
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data/derived/g7
          python3 ci/exp073ac_article3_factorized_layera_synthetic_v0_1.py --out data/derived/g7/exp073ac_article3_factorized_layera_synthetic_v0_1.json
      - name: Enforce non-classifying firewall
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/derived/g7/exp073ac_article3_factorized_layera_synthetic_v0_1.json'))
          assert d['status']=='PASS_EXP073AC_FACTORIZED_LAYERA_SYNTHETIC_V0_1'
          assert d['test_count']==14 and all(x['pass'] for x in d['tests'].values())
          assert d['real_angular_window_read'] is False and d['real_radial_kernel_read'] is False
          assert d['physical_support_realdata_evaluated'] is False and d['science_gate_scored'] is False
          assert d['scientific_readiness_credit'] is False and d['article3_scientific_readiness_percent']==52
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP073AC2_INFRA_REPAIR_FIREWALL_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073ac2-factorized-layera-synthetic-${{ github.sha }}
          path: data/derived/g7/exp073ac_article3_factorized_layera_synthetic_v0_1.json
          if-no-files-found: error
          retention-days: 90
