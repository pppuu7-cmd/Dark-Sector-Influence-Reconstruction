name: Exp073P v0.3 strict JSON evidence ambiguity guard v0.1

on:
  push:
    branches: [main]
    paths:
      - 'ci/exp073p_v03_json_evidence_ambiguity_guard_v0_1.py'
      - '.github/workflows/exp073p-v03-json-evidence-ambiguity-guard-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-json-evidence-ambiguity-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run fail-closed synthetic ambiguity suite
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile ci/exp073p_v03_json_evidence_ambiguity_guard_v0_1.py
          python3 ci/exp073p_v03_json_evidence_ambiguity_guard_v0_1.py --selftest
