name: IDE comoving-transfer compatibility calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ide-transfer-audit.yml'
      - 'ci/ide_calibration_trigger.txt'
      - 'patches/apply_class_iv_ac627d54_compile_fix.py'

jobs:
  ide-transfer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout DSIR
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip libgsl-dev
          python3 -m pip install --user numpy

      - name: Clone repaired pinned class_iv
        run: |
          git clone https://github.com/kaeonikc/class_iv.git external_iv
          cd external_iv
          git checkout ac627d54e9ce196a08878d1ba33999819925d19c
          git rev-parse HEAD | tee ../iv_upstream_sha.txt
          python3 ../patches/apply_class_iv_ac627d54_compile_fix.py source/background.c
          git diff --check
          git diff -- source/background.c | tee ../iv_applied_compile_fix.diff
          make -j2 \
            OPTFLAG="-O2 -fcommon" \
            LDFLAG="-g -fPIC -Wl,--no-as-needed -lgsl -lgslcblas" \
            class

      - name: Write LambdaCDM transfer baseline
        run: |
          mkdir -p external_iv/dsir_transfer_outputs
          cat > external_iv/baseline_transfer.ini <<'EOF'
          h = 0.67556
          T_cmb = 2.7255
          omega_b = 0.022032
          N_ur = 3.046
          omega_cdm = 0.12038
          Omega_dcdmdr = 0.0
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0
          Omega_scf = 0
          Omega_idm_dr = 0.
          YHe = 0.2404
          recombination = RECFAST
          reio_parametrization = reio_none
          output = mTk,vTk,mPk
          modes = s
          ic = ad
          gauge = synchronous
          P_k_ini type = analytic_Pk
          k_pivot = 0.05
          A_s = 2.215e-9
          n_s = 0.9619
          alpha_s = 0.
          P_k_max_h/Mpc = 0.25
          z_pk = 0,1
          headers = yes
          write background = yes
          write thermodynamics = no
          write primordial = no
          root = dsir_transfer_outputs/baseline_
          EOF

      - name: Write zero-coupling IDE transfer realization
        run: |
          cat > external_iv/ide0_transfer.ini <<'EOF'
          h = 0.67556
          T_cmb = 2.7255
          omega_b = 0.022032
          N_ur = 3.046
          omega_cdm = 0.12038
          alpha_idm_iv = 0.
          beta_idm_iv = 0.
          f_idm_iv = 1.
          f_iv = 1.
          Omega_dcdmdr = 0.0
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0
          Omega_scf = 0
          Omega_idm_dr = 0.
          YHe = 0.2404
          recombination = RECFAST
          reio_parametrization = reio_none
          output = mTk,vTk,mPk
          modes = s
          ic = ad
          gauge = synchronous
          P_k_ini type = analytic_Pk
          k_pivot = 0.05
          A_s = 2.215e-9
          n_s = 0.9619
          alpha_s = 0.
          P_k_max_h/Mpc = 0.25
          z_pk = 0,1
          headers = yes
          write background = yes
          write thermodynamics = no
          write primordial = no
          root = dsir_transfer_outputs/ide0_
          EOF

      - name: Run transfer calculations
        working-directory: external_iv
        run: |
          ./class baseline_transfer.ini 2>&1 | tee dsir_transfer_outputs/baseline.log
          ./class ide0_transfer.ini 2>&1 | tee dsir_transfer_outputs/ide0.log
          ls -lah dsir_transfer_outputs

      - name: Record calibration provenance
        run: |
          {
            echo "DSIR IDE comoving-transfer compatibility calibration"
            echo "purpose: inspect transfer columns required to construct the same pressureless-matter Delta_m used by G1 gauge audit"
            echo "candidate common definition: Delta_m = delta_m + 3 a H theta_m/k^2"
            echo "no cross-solver hard tolerance imposed before inspecting this artifact"
            echo "DSIR commit: $GITHUB_SHA"
            echo -n "class_iv upstream: "
            cat iv_upstream_sha.txt
            echo "gauge: synchronous (required by pinned IDE perturbation path)"
          } > external_iv/dsir_transfer_outputs/environment.txt

      - name: Upload transfer calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: ide-transfer-audit-${{ github.sha }}
          path: |
            external_iv/dsir_transfer_outputs/
            external_iv/baseline_transfer.ini
            external_iv/ide0_transfer.ini
            iv_upstream_sha.txt
            iv_applied_compile_fix.diff
          if-no-files-found: error
