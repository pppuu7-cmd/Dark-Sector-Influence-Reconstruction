name: Exp073EY WW_S0_S1 checkpoint resume v0.2
on:
  push:
    branches: [main]
    paths: ['.github/activations/exp073ey-science-resume-v0-3.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: dsir-exp073ey-ww-s0-s1-filebacked-ab-science-v0-1
  cancel-in-progress: false
env:
  FROZEN_SOURCE_HEAD: 'de83e20a68f79ccf25b89b0d33eb4206e294c757'
  CONTRACT_FP: 'b7845df5ce4bc2bd730461476b7ff0831512003ceb5b3558436005c9876bd251'
  R1_ARTIFACT_ID: '9720335366'
  R1_DIGEST: 'sha256:ff87d8fc7d53b16b786a4eb3d6ffeb103676efb8a548223a187b9f59689f8abd'
  NAMASTER_HEAD: '24365fa59a38c15732f4f37e8b29265b75c442d5'
  PATCH_BLOB: 'd534b698f9131688d263eedcef27260386c58641'
  DRIVER_V01_BLOB: '1db1eabbdba492c476cc61d3c4d71147aa688384'
  DRIVER_V02_BLOB: '066847006b2ed9d712d2c22d3576a0d8887fa7bf'
  TASKRUNNER_BLOB: '050ed7dd3387c4fb031f877825e6b3f4d4ce3ef2'
  EM_GENERATOR_BLOB: 'bd1795f2a2c2cf80341f212996eb8278e0be53d9'
  EM_COMPARE_BLOB: 'f0de92f3f121592b6d139eb7d948426946d901d1'
  REPAIR_ERRATUM_BLOB: 'a6fc7a1a3af86f8f02eba8c02294283192642784'
  REPAIR_WRAPPER_BLOB: 'a9cabeadc9b091424246adf00e9959dc62145e9b'
  BASE_HOME_BLOB: 'e48453e71970eecabdc6dec33facb26b77bb9e4e'
  ER_RUN_ID: '33997539503'
  ER_ARTIFACT_ID: '9978528214'
  ER_DIGEST: 'sha256:1e0c3516de041e773eca030d9488f7af7d38455033ae5b97ba1151820eb22267'
jobs:
  hosted-repair-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed repair and authority audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073ey_ww_s0_s1_filebacked_full_resolution_ab_science_v0_5_read_patch_repair_erratum.md)" = "$REPAIR_ERRATUM_BLOB"
          test "$(git rev-parse HEAD:ci/exp073ey_home_filebacked_fullres_v0_2.sh)" = "$REPAIR_WRAPPER_BLOB"
          test "$(git rev-parse HEAD:ci/exp073ey_home_filebacked_fullres_v0_1.sh)" = "$BASE_HOME_BLOB"
          test "$(git rev-parse HEAD:ci/exp073ey_ww_s0_s1_durable_ab_production_v0_1.py)" = "$DRIVER_V01_BLOB"
          test "$(git rev-parse HEAD:ci/exp073ey_ww_s0_s1_durable_ab_production_v0_2.py)" = "$DRIVER_V02_BLOB"
          test "$(git rev-parse HEAD:patches/namaster-v2.7-dsir-filebacked-mcm-read-v0.2.patch)" = "$PATCH_BLOB"
          grep -F 'diff --git a/src/nmt_io.c b/src/nmt_io.c' patches/namaster-v2.7-dsir-filebacked-mcm-read-v0.2.patch >/dev/null
          grep -F 'dsir_nmt_alloc_unbinned(w,(int)n_el,0);' patches/namaster-v2.7-dsir-filebacked-mcm-read-v0.2.patch >/dev/null
          grep -F "EXPECTED_READ_PATCH_BLOB='d534b698f9131688d263eedcef27260386c58641'" ci/exp073ey_home_filebacked_fullres_v0_2.sh >/dev/null
          ! grep -Eqi 'allclose|isclose|tolerance|rounding|smoothing|averaging' ci/exp073ey_home_filebacked_fullres_v0_2.sh
          python3 - "$GITHUB_REPOSITORY" "$GH_TOKEN" "$ER_RUN_ID" "$ER_ARTIFACT_ID" "$ER_DIGEST" <<'PY'
          import json,sys,urllib.request,time
          repo,token=sys.argv[1],sys.argv[2]; rid=int(sys.argv[3]); aid=int(sys.argv[4]); digest=sys.argv[5]
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
            for i in range(8):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:return json.load(r)
              except Exception:
                if i==7: raise
                time.sleep(2)
          r=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}'); a=get(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}')
          assert r['status']=='completed' and r['conclusion']=='success'
          assert a['digest']==digest and a['expired'] is False and (a.get('workflow_run') or {}).get('id')==rid
          print('PASS_EXP073EY_READ_PATCH_REPAIR_STATIC_AUDIT_V0_1')
          PY
  home-science-resume:
    needs: hosted-repair-audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Resume frozen ordered S0-to-S1 A/B gate from verified checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/exp073ey_home_filebacked_fullres_v0_2.sh
      - name: Collect compact terminal or partial evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/.cache/dsir/exp073ey-ww-s0-s1-filebacked-ab-v0-1"; OUT="$RUNNER_TEMP/exp073ey-resume-artifact"; rm -rf "$OUT"; mkdir -p "$OUT"
          ROOT="$ROOT" OUT="$OUT" python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['ROOT']); out=Path(os.environ['OUT'])
          if root.exists():
            for p in root.rglob('*.json'):
              try:q=out/p.relative_to(root); q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
              except OSError:pass
            for rep in ('A','B'):
              p=root/'checkpoints'/rep/'exact_route'/'selected_ee.bin'
              if p.exists():q=out/'checkpoints'/rep/'exact_route'/'selected_ee.bin'; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
            for n in ('A_driver.log','B_driver.log','ab_compare_stdout.txt','resource_telemetry.log','terminal_receipt.json'):
              p=root/n
              if p.exists():shutil.copy2(p,out/n)
          PY
      - name: Upload Exp073EY resume evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073ey-ww-s0-s1-filebacked-ab-resume-v0-2
          path: ${{ runner.temp }}/exp073ey-resume-artifact
          if-no-files-found: warn
          retention-days: 30
