name: Exp073AL Article3 AI vs primary exact stability classifier v0.1

on:
  push:
    paths:
      - 'ci/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-cross-route-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce prospective Exp073AL freeze
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git log -1 --format=%H -- experiments/073al_article3_ai_vs_primary_exact_stability_classifier_v0_1_prereg.md)" = 'cf3e4062f3068badc7e4453cb816de72168ffbc9'
          test "$(git log -1 --format=%H -- ci/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.py)" = 'a0ee0c5f37533093931c0495b4edd5967ce5a00c'
          test -f experiments/073al_article3_ai_vs_primary_exact_stability_classifier_v0_1_workflow_freeze.md
          SELF_COMMIT="$(git log -1 --format=%H -- .github/workflows/exp073al-article3-ai-vs-primary-exact-stability-classifier-v0-1.yml)"
          grep -F "workflow_last_modifying_commit: \`${SELF_COMMIT}\`" experiments/073al_article3_ai_vs_primary_exact_stability_classifier_v0_1_workflow_freeze.md
          if test "${GITHUB_EVENT_NAME}" = push; then
            test "$(git diff --name-only HEAD^ HEAD)" = 'ci/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.trigger'
          fi
          python3 -m py_compile ci/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.py

      - name: Run frozen synthetic cross-route matrix
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data/derived/g7
          python3 ci/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.py \
            --self-test \
            --output-json data/derived/g7/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.json

      - name: Enforce non-scientific accounting
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.json'
          d=json.load(open(p))
          assert d['status']=='PASS_EXP073AL_AI_VS_PRIMARY_EXACT_STABILITY_CLASSIFIER_SYNTHETIC_V0_1'
          assert d['synthetic_only'] is True
          assert d['tests_passed']==13
          assert d['real_ai_authority_read'] is False
          assert d['real_cross_route_classification_performed'] is False
          assert d['readiness_increment']==0
          assert d['article3_scientific_readiness_percent']==52
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          assert d['production_released'] is False
          assert d['scientific_model_pass_claimed'] is False
          print('EXP073AL_HOSTED_SYNTHETIC_EXACT_STABILITY_CLASSIFIER_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp073al-ai-vs-primary-exact-stability-${{ github.sha }}
          path: data/derived/g7/exp073al_article3_ai_vs_primary_exact_stability_classifier_v0_1.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
