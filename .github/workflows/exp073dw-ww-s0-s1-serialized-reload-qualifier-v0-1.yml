name: Exp073DW WW_S0_S1 serialized-reload qualifier v0.1
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/RESEARCH_LOG_EXP073DW_2026-09-05.md'
permissions:
  contents: read
jobs:
  hosted-serialized-reload-qualifier:
    runs-on: ubuntu-24.04
    env:
      PREREG_BLOB: 215eba072da712c194af4962e83aa05a0169da08
      QUALIFIER_BLOB: dd50faac96b202140fe087b275bebf0e7040e119
      ADAPTER_BLOB: d6f20600d6a206dd9fbb254b382e71a49c6b3c07
      SHARED_ADAPTER_BLOB: dafe86086a470c852106f0d4ecccbda1d389e397
      DOWNSTREAM_BLOB: be4f381de4c5c043a9c0fcd107e63ef3f2079578
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Freeze identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073dw_ww_s0_s1_serialized_reload_qualifier_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073dw_ww_s0_s1_serialized_reload_qualifier_v0_1.py)" = "$QUALIFIER_BLOB"
          test "$(git hash-object ci/exp073do_ww_s0_s0_production_exact_adapter_v0_1.py)" = "$ADAPTER_BLOB"
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py)" = "$SHARED_ADAPTER_BLOB"
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c)" = "$DOWNSTREAM_BLOB"
      - name: Install exact NaMaster 2.7 plus GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "$GITHUB_ENV"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "$GITHUB_ENV"
      - name: Verify runtime lineage and compile emulator
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib,inspect,importlib.metadata,pymaster as nmt
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.')
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f'
          PY
          mkdir -p "${RUNNER_TEMP}/exp073dw-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -fopenmp -DDSIR_WORKERS=2 -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073dw-bin/mmap_full_mcm"
          echo "MMAP_EMULATOR=${RUNNER_TEMP}/exp073dw-bin/mmap_full_mcm" >> "$GITHUB_ENV"
      - name: Execute fail-closed serialized-reload qualifier
        shell: bash
        run: |
          set -euo pipefail
          OUT=data/derived/exp073dw/v0_1; mkdir -p "$OUT"
          "${NMT_PY}" ci/exp073dw_ww_s0_s1_serialized_reload_qualifier_v0_1.py --emulator "${MMAP_EMULATOR}" --out-dir "$OUT/runtime" --source-head "${GITHUB_SHA}" --contract-fingerprint "$PREREG_BLOB" --component-blobs-json ci/exp073dw_component_blobs_v0_1.json --nside 16 | tee "$OUT/stdout.txt"
          cp "$OUT/runtime/terminal_qualifier_receipt.json" "$OUT/terminal_qualifier_receipt.json"
      - name: Upload immutable qualifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073dw-ww-s0-s1-serialized-reload-v0-1-${{ github.sha }}
          path: data/derived/exp073dw/v0_1/
          if-no-files-found: error
