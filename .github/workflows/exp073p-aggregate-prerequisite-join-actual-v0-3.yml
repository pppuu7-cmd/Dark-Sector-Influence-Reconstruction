name: Exp073P aggregate prerequisite join actual v0.3

on:
  workflow_dispatch:
    inputs:
      r1_artifact_id:
        description: Exact v0.7 attempt-2 R1 artifact ID after terminal completion
        required: true
        type: string
      r1_artifact_digest:
        description: Exact v0.7 attempt-2 R1 artifact sha256 digest
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: exp073p-aggregate-prerequisite-join-actual-v0-3
  cancel-in-progress: false

env:
  AGGREGATE_EVALUATOR_V01_SHA256: 9dc0b5a0ea82b8fb69d82e06b566b08d61c1982bd5e13ecd8db6752253bc0e46
  METADATA_COLLECTOR_V01_SHA256: cda5cb20c2d4f9be8a3068dacfead4db25e5dfbd867815005b754ab8cde955f3
  AGGREGATE_EVALUATOR_V03_SHA256: bb7b485a8249790ee9ed3586a1d65ac3255ecc67aafede806e0e472fa2118114
  METADATA_COLLECTOR_V03_SHA256: 3bb52c9c7245e46b8a7308e9be501468784d1e03607d714e7370fd2df1b4b0f1
  PAYLOAD_VALIDATOR_V03_SHA256: 7083d15db6f8ab0b89d756b53349731ed70efc4b70c8569cb18c6c3fb2d0ee67
  ARTIFACT_DOWNLOADER_V01_SHA256: 3d9b40602661d339504ad1cebadaef41cbe6bf3743e1008a12dae7dd6885186b
  AUTHORITY_PREREG_V03_SHA256: e27761b2db4a81283bb9fbac1decb95f62fadb785c40cb3e3f676f8651711f40
  R1_V07_WORKFLOW_SHA256: 8ef3fb2305fe2789e6198547f5095969cfc107df1f0e17853b20a7aa5c601328
  R1_V07_ACQUISITION_SHA256: 18ca2ed0dbf0ae9ab534ffff9f10bc9bb4b3e388e6ee6a03daa353fa1692c15b
  R1_RUN_ID: '33240490287'
  R1_RUN_ATTEMPT: '2'
  R1_JOB_ID: '99080934021'
  R1_ARTIFACT_NAME: exp073r1-v07-transport-stabilized-9a4606fb37d5aaa071aa57322ebb7c05eca905d7

jobs:
  real-prerequisite-join-v03:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      R1_ARTIFACT_ID: ${{ inputs.r1_artifact_id }}
      R1_ARTIFACT_DIGEST: ${{ inputs.r1_artifact_digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert prospectively frozen v0.3 route firewall
        id: firewall
        shell: bash
        run: |
          set -euxo pipefail
          test "${GITHUB_REPOSITORY}" = 'pppuu7-cmd/Dark-Sector-Influence-Reconstruction'
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "$(sha256sum ci/exp073p_aggregate_prerequisite_join_v0_1.py | cut -d' ' -f1)" = "${AGGREGATE_EVALUATOR_V01_SHA256}"
          test "$(sha256sum ci/exp073p_actions_metadata_bundle_v0_1.py | cut -d' ' -f1)" = "${METADATA_COLLECTOR_V01_SHA256}"
          test "$(sha256sum ci/exp073p_aggregate_prerequisite_join_v0_3.py | cut -d' ' -f1)" = "${AGGREGATE_EVALUATOR_V03_SHA256}"
          test "$(sha256sum ci/exp073p_actions_metadata_bundle_v0_3.py | cut -d' ' -f1)" = "${METADATA_COLLECTOR_V03_SHA256}"
          test "$(sha256sum ci/exp073p_v07_r1_payload_bundle_v0_3.py | cut -d' ' -f1)" = "${PAYLOAD_VALIDATOR_V03_SHA256}"
          test "$(sha256sum ci/exp073p_v03_artifact_zip_download_v0_1.py | cut -d' ' -f1)" = "${ARTIFACT_DOWNLOADER_V01_SHA256}"
          test "$(sha256sum experiments/073p_aggregate_prerequisite_join_v07_r1_authority_prereg_v0_3.md | cut -d' ' -f1)" = "${AUTHORITY_PREREG_V03_SHA256}"
          test "$(sha256sum .github/workflows/exp073r1-desy1-transport-stabilized-replay-v0-7.yml | cut -d' ' -f1)" = "${R1_V07_WORKFLOW_SHA256}"
          test "$(sha256sum ci/exp073r1_v0_7_whole_object_acquire.py | cut -d' ' -f1)" = "${R1_V07_ACQUISITION_SHA256}"
          python3 -m py_compile \
            ci/exp073p_actions_metadata_bundle_v0_1.py \
            ci/exp073p_actions_metadata_bundle_v0_3.py \
            ci/exp073p_aggregate_prerequisite_join_v0_1.py \
            ci/exp073p_aggregate_prerequisite_join_v0_3.py \
            ci/exp073p_v07_r1_payload_bundle_v0_3.py \
            ci/exp073p_v03_artifact_zip_download_v0_1.py \
            ci/exp073p_r1_admissibility_interlock_v0_1.py
          python3 - <<'PY'
          import os,re
          assert os.environ['R1_RUN_ID']=='33240490287'
          assert os.environ['R1_RUN_ATTEMPT']=='2'
          assert os.environ['R1_JOB_ID']=='99080934021'
          assert re.fullmatch(r'[1-9][0-9]*',os.environ['R1_ARTIFACT_ID'])
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',os.environ['R1_ARTIFACT_DIGEST'])
          print('PASS_EXP073P_ACTUAL_JOIN_ROUTE_FIREWALL_V0_3')
          PY

      - name: Collect attempt-specific live metadata for all frozen parents
        id: metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_actions_metadata_bundle_v0_3.py \
            --repository "${GITHUB_REPOSITORY}" \
            --r1-artifact-id "${R1_ARTIFACT_ID}" \
            --r1-artifact-digest "${R1_ARTIFACT_DIGEST}" \
            --out join_inputs/actions_metadata_v0_3.json \
            --error-out join_inputs/actions_metadata_collection_failure_v0_3.json

      - name: Download exact large-source identity record
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp073p-source-bin-full-sha256-372997bf1240a224c2a915fd0d1a5ae50476ba7a
          path: join_inputs/large_source
          github-token: ${{ github.token }}
          run-id: 33081571259

      - name: Download exact large-metacal identity record
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp073p-metacal-full-sha256-372997bf1240a224c2a915fd0d1a5ae50476ba7a
          path: join_inputs/large_metacal
          github-token: ${{ github.token }}
          run-id: 33081571259

      - name: Download exact remaining-object P2 record
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp073p2-remaining-des-checksums-fbcd8eb0a46a566b2510081f7f90714b534e7252
          path: join_inputs/p2
          github-token: ${{ github.token }}
          run-id: 33086291753

      - name: Download sole v0.7 attempt-2 R1 result artifact
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_v03_artifact_zip_download_v0_1.py \
            --repository "${GITHUB_REPOSITORY}" \
            --artifact-id "${R1_ARTIFACT_ID}" \
            --expected-digest "${R1_ARTIFACT_DIGEST}" \
            --out join_inputs/r1_artifact_v0_3.zip

      - name: Normalize unchanged small parent records
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          expected={
              'large_source':(Path('join_inputs/large_source'),'exp073p_y1_source_redshift_binning_v1_streaming_sha256_v0_1.json'),
              'large_metacal':(Path('join_inputs/large_metacal'),'exp073p_mcal_y1a1_streaming_sha256_v0_1.json'),
              'p2':(Path('join_inputs/p2'),'exp073p2_remaining_desy1_checksums_v0_1.json'),
          }
          out=Path('join_inputs/normalized_parents')
          out.mkdir(parents=True,exist_ok=True)
          for key,(root,name) in expected.items():
              matches=list(root.rglob(name))
              assert len(matches)==1,(key,matches)
              shutil.copyfile(matches[0],out/f'{key}.json')
          print('PASS_EXP073P_EXACT_PARENT_PATH_NORMALIZATION_V0_3')
          PY

      - name: Validate complete v0.7 payload and preserve exact bytes
        id: payload
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_v07_r1_payload_bundle_v0_3.py \
            --zip join_inputs/r1_artifact_v0_3.zip \
            --out-dir join_inputs/normalized_r1_v0_3 \
            --manifest-out join_inputs/r1_payload_manifest_v0_3.json

      - name: Execute real fail-closed aggregate prerequisite join v0.3
        id: join
        if: ${{ always() && steps.firewall.outcome == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_aggregate_prerequisite_join_v0_3.py \
            --classifying \
            --metadata join_inputs/actions_metadata_v0_3.json \
            --preflight data/derived/g7/exp073p_des_public_input_checksum_preflight_v0_1.json \
            --large-source join_inputs/normalized_parents/large_source.json \
            --large-metacal join_inputs/normalized_parents/large_metacal.json \
            --p2 join_inputs/normalized_parents/p2.json \
            --s0 data/derived/g7/exp073s0_redmagic_mask_nz_v0_1_key_metrics.json \
            --r1 join_inputs/normalized_r1_v0_3/exp073r1_desy1_transport_stabilized_replay_v0_7_summary.json \
            --r1-acquisition join_inputs/normalized_r1_v0_3/exp073r1_v0_7_remote_acquisition_provenance.json \
            --r1-payload-manifest join_inputs/r1_payload_manifest_v0_3.json \
            --boss data/derived/g7/exp073j_boss_finite_matrix_component_support_v0_1_key_metrics.json \
            --out data/derived/g7/exp073p_aggregate_prerequisite_join_actual_v0_3.json

      - name: Assert v0.3 receipt and no-leakage boundary
        if: ${{ always() && steps.firewall.outcome == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/derived/g7/exp073p_aggregate_prerequisite_join_actual_v0_3.json')
          assert path.is_file()
          data=json.loads(path.read_text())
          allowed={
              'PASS_EXP073P_PREREQUISITE_BINDING_V0_3',
              'REJECTED_EXP073P_PREREQUISITE_BINDING_V0_3',
              'INCOMPLETE_EXP073P_PREREQUISITE_BINDING_V0_3',
          }
          assert data['status'] in allowed
          assert data['synthetic'] is False and data['scientific_classification'] is None
          assert data['r1_authority']['run_id']==33240490287
          assert data['r1_authority']['run_attempt']==2
          assert data['r1_authority']['job_id']==99080934021
          assert data['support_executor_authorized'] is (data['status']=='PASS_EXP073P_PREREQUISITE_BINDING_V0_3')
          for key in (
              'support_fraction_evaluated','f_invalid_computed','retained_dimension_evaluated',
              'covariance_read','whitening_read','nuisance_svd_read','relation_null_read',
              'heldout_read','G8_read',
          ):
              assert data[key] is False,key
          assert data['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP073P_ACTUAL_AGGREGATE_JOIN_RECEIPT_V0_3',data['status'])
          PY

      - name: Upload immutable v0.3 receipt and compact provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073p-aggregate-prerequisite-join-actual-v0-3-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            data/derived/g7/exp073p_aggregate_prerequisite_join_actual_v0_3.json
            join_inputs/actions_metadata_v0_3.json
            join_inputs/actions_metadata_collection_failure_v0_3.json
            join_inputs/r1_payload_manifest_v0_3.json
          if-no-files-found: error
          retention-days: 90
