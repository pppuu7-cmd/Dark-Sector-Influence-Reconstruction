name: layerb-post-16385-stencil-geometry-census-v0-1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-post-16385-stencil-geometry-census-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    strategy:
      fail-fast: false
      matrix:
        mode: [full, edge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce response-blind geometry identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- ci/layerb_post_16385_stencil_geometry_census_v0_1.py)" = '729871120e5606edd20e5f6fa8f315215a0bd5ca'
          test "$(git hash-object docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt)" = 'bc9a6e59fb27d7510796c1cb2d5470dfe8a5294b'
          test "$(git hash-object docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt)" = 'fc4eb1e7f51a0ad3773b8be13c477652b1f71368'
      - run: python -m pip install -q 'numpy==1.26.4'
      - name: Run response-blind stencil geometry census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python ci/layerb_post_16385_stencil_geometry_census_v0_1.py \
            --mode '${{ matrix.mode }}' \
            --nodes8193 docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt \
            --nodes16385 docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt \
            --out artifacts/result.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/result.json'))
          assert d['classification']=='POST_16385_STENCIL_GEOMETRY_CENSUS_PASS_PLUS_0_PLUS_0',d
          assert d['science_result_read'] is False and d['class_solver_invoked'] is False,d
          assert d['full_107_row_traversal_executed'] is False and d['scientific_authority_created'] is False,d
          assert d['next_rung_authorized'] is False and d['covariance_restriction_authorized'] is False and d['Wm_S3_opened'] is False,d
          mode='${{ matrix.mode }}'
          assert d['mode']==mode,d
          assert d['target_count']==8189 if mode=='full' else d['target_count']==512,d
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-stencil-geometry-${{ matrix.mode }}-v0-1
          path: artifacts/result.json
          if-no-files-found: error
          retention-days: 90
