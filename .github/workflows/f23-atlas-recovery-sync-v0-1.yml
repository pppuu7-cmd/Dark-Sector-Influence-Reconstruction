name: One-shot F23 atlas and recovery sync

on:
  push:
    branches: [research/f23-atlas-recovery-sync-v0-1]
    paths:
      - '.github/workflows/f23-atlas-recovery-sync-v0-1.yml'
      - 'ci/f23_atlas_recovery_sync_v0_1.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/f23-atlas-recovery-sync-v0-1
          fetch-depth: 0
      - name: Synchronize F23, atlas, literature, readiness and recovery records
        run: python3 ci/f23_atlas_recovery_sync_v0_1.py
      - name: Commit synchronized documents
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SCIENTIFIC_FINDINGS_REGISTER.md docs/RECOVERY_LATEST.md docs/RECOVERY_MANUAL.md docs/STATUS.md docs/GATES.md docs/BUYANOVGPT_TABLE.md docs/LITERATURE_MAP.md docs/UNIVERSAL_MODEL_READINESS.md
          if git diff --cached --quiet; then
            echo 'No documentation changes needed.'
          else
            git commit -m 'docs: synchronize F23 atlas and recovery records [skip ci]'
            git push origin HEAD:research/f23-atlas-recovery-sync-v0-1
          fi
