name: layerb-beta-tolerance-isolation-v0-8

on:
  push:
    branches: [main]
    paths:
      - 'docs/dsir4/launch/LAYERB_BETA_TOLERANCE_ISOLATION_V0_8_LAUNCH.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  CONTRACT: 'docs/dsir4/contracts/LAYERB_BETA_TOLERANCE_KNOB_ISOLATION_V0_8.json'
  PROBES: 'docs/dsir4/contracts/LAYERB_TARGETED_DIRECT_K_BETA_PROBES_V0_4.json'
  EXECUTOR: 'ci/layerb_beta_tol_isolation_v0_8.py'
  V07_EXECUTOR: 'ci/layerb_beta_solver_conditioning_v0_7.py'
  JJ: 'ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py'
  BASELINE: 'configs/dsir4/c2/ide0_reference_v0_1.ini'
  PRECISION: 'configs/dsir4/c2/dsir_ide_p8_v0_1.pre'
  RAW_PARENT_RUN_ID: '34719180791'
  V07_RUN_ID: '34719555760'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  invariant-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen V0.8 identities and decision thresholds
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def blobsha(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          C=json.load(open('docs/dsir4/contracts/LAYERB_BETA_TOLERANCE_KNOB_ISOLATION_V0_8.json'))
          A=json.load(open('docs/dsir4/authority/LAYERB_BETA_SOLVER_CONDITIONING_V0_7.json'))
          assert C['status']=='PROSPECTIVELY_FROZEN_BEFORE_V0_8_EXECUTION'
          assert A['classification']==C['parent_classification']=='UPSTREAM_RESPONSE_SOLVER_CONDITIONING_PARTIALLY_SUPPORTED'
          assert A['attribution']==C['parent_attribution']=='PERTURBATION_INTEGRATION_TOLERANCE_SENSITIVE'
          assert A['authorized_next_stage']==C['authorized_parent_next_stage']=='PROSPECTIVELY_FROZEN_LOCALIZED_SOLVER_KNOB_ISOLATION_AUDIT'
          assert C['production_h']==1e-4 and C['relative_tolerance']==1e-3
          assert C['h_values']==[4e-4,2e-4,1e-4,5e-5,2.5e-5]
          assert C['production_tol_perturb_integration']==3e-10
          assert C['production_perturb_sampling_stepsize']==0.00035
          assert C['tolerance_order']==['PROD','TOL3','TOL10','TOL30','TOL100','TOL300','TOL1000']
          assert C['all_tolerances']=={'PROD':3e-10,'TOL3':1e-10,'TOL10':3e-11,'TOL30':1e-11,'TOL100':3e-12,'TOL300':1e-12,'TOL1000':3e-13}
          assert C['adequate_recovery_fraction']==0.75
          assert C['adequate_median_h_spread']==1e-3
          assert C['adjacent_median_worsening_factor']==1.25
          assert C['adjacent_recovered_count_loss_allowance']==1
          assert all(C['forbidden'].values())
          assert hashlib.sha256(Path(C['probe_manifest']).read_bytes()).hexdigest()==C['probe_manifest_sha256']
          assert blobsha(C['baseline'])==C['baseline_git_blob_sha1']
          assert blobsha(C['production_precision'])==C['production_precision_git_blob_sha1']
          assert blobsha(C['v07_domain_executor'])==C['v07_domain_executor_git_blob_sha1']
          assert blobsha(C['executor'])==C['executor_git_blob_sha1']
          assert blobsha(C['frozen_response_engine_source'])==C['frozen_response_engine_git_blob_sha1']
          P=json.load(open(C['probe_manifest']))
          assert P['unique_failure_coordinates']==23 and P['unique_all_coordinates']==46
          text=Path(C['production_precision']).read_text()
          assert 'tol_perturb_integration = 3e-10' in text
          assert 'perturb_sampling_stepsize = 0.00035' in text
          out={'schema':'LAYERB_BETA_TOLERANCE_ISOLATION_INVARIANT_AUDIT_V0_8','pass':True,'profiles':sorted(C['profiles']),'effect':'+0/+0','covariance_read':False,'Wm_S3_opened':False,'science_gate_opened':False,'token':'PASS_LAYERB_BETA_TOLERANCE_ISOLATION_INVARIANTS_V0_8'}
          Path('safe/invariant.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token'])
          PY
          python3 -m py_compile "$EXECUTOR" "$V07_EXECUTOR"
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-tolerance-isolation-invariant-v0-8
          path: safe/invariant.json
          retention-days: 90

  tolerance-domain:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        profile: [TOL3, TOL30, TOL300, TOL1000]
        domain: [D, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install exact production numerical stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libgsl-dev >/dev/null
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
          git clone -q https://github.com/kaeonikc/class_iv.git external_class
          git -C external_class checkout -q "$CLASS_COMMIT"
      - name: Reproduce pinned CLASS exposure and non-scientific capacity/history patches
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('external_class/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 128',1))
          q=Path('external_class/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 16384',1))
          r=Path('external_class/source/perturbations.c'); s=r.read_text(); old='perhaps_print_variables = perturb_print_variables;'; assert s.count(old)==1; r.write_text(s.replace(old,'perhaps_print_variables = NULL;',1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" .venv/bin/python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external_class
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" .venv/bin/python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external_class
          .venv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('external_class/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" make -C external_class -j2 all >/dev/null
      - name: Run one frozen tolerance-only profile
        run: |
          set -euo pipefail
          mkdir -p safe
          .venv/bin/python "$EXECUTOR" --mode domain --profile '${{ matrix.profile }}' --domain '${{ matrix.domain }}' --probes "$PROBES" --contract "$CONTRACT" --v07-executor "$V07_EXECUTOR" --jj-script "$JJ" --baseline "$BASELINE" --precision "$PRECISION" --out safe/solver_${{ matrix.profile }}_${{ matrix.domain }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-tolerance-isolation-${{ matrix.profile }}-${{ matrix.domain }}-v0-8
          path: safe/solver_${{ matrix.profile }}_${{ matrix.domain }}.json
          retention-days: 90

  decision:
    needs: [invariant-audit, tolerance-domain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install decision dependency
        run: |
          set -euo pipefail
          python3 -m venv .decision-venv
          .decision-venv/bin/python -m pip install --upgrade pip >/dev/null
          .decision-venv/bin/python -m pip install 'numpy==1.26.4' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-beta-tolerance-isolation-*-v0-8
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-beta-solver-conditioning-*-v0-7
          path: v07
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34719555760
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-beta-fd-repair-*-v0-6
          path: raw
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34719180791
      - name: Verify reused provenance and apply frozen V0.8 decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p safe
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPO/actions/runs/$V07_RUN_ID/artifacts?per_page=100" > /tmp/v07_artifacts.json
          python3 - <<'PY'
          import json
          C=json.load(open('docs/dsir4/contracts/LAYERB_BETA_TOLERANCE_KNOB_ISOLATION_V0_8.json'))
          A=json.load(open('/tmp/v07_artifacts.json'))['artifacts']
          by_name={x['name']:x for x in A}
          for prof in ['TOL10','TOL100']:
              for dom in ['D','B']:
                  name=f'layerb-beta-solver-conditioning-{prof}-{dom}-v0-7'
                  x=by_name[name]; e=C['reused_profiles'][prof]
                  digest=(x.get('digest') or '')
                  if digest.startswith('sha256:'): digest=digest[7:]
                  assert x['id']==e[f'{dom}_artifact_id']
                  assert digest==e[f'{dom}_artifact_sha256']
                  assert not x['expired']
          inv=json.load(open('inputs/invariant.json'))
          assert inv['pass'] is True and inv['token']=='PASS_LAYERB_BETA_TOLERANCE_ISOLATION_INVARIANTS_V0_8'
          PY
          .decision-venv/bin/python "$EXECUTOR" --mode decision --contract "$CONTRACT" --v07-executor "$V07_EXECUTOR" --parent-inputs raw/fd_D.json raw/fd_B.json --reused-inputs v07/solver_TOL10_D.json v07/solver_TOL10_B.json v07/solver_TOL100_D.json v07/solver_TOL100_B.json --new-inputs inputs/solver_*.json --out safe/decision.json
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-tolerance-isolation-decision-v0-8
          path: safe/decision.json
          retention-days: 90
