name: layerb-32769-resource-authority-candidate-packaging-static-audit-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-32769-resource-authority-candidate-packaging-static-audit-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-packaging-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaging workflow is read-only, event-bound and candidate-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git hash-object .github/workflows/layerb-32769-resource-authority-candidate-packaging-v0-1.yml)" = '93dc50385c4b126b91d384e79f6b7079bae283a6'
          test "$(git hash-object docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_CONTRACT_V0_1.json)" = 'ade2fd2d43ce7e556bf473f93ae8491a694e868f'
          test "$(git hash-object ci/layerb_32769_resource_authority_candidate_packager_v0_1.py)" = 'c92ffc97c04c27ff6cdbf05b7f84527884848f40'
          test "$(git hash-object ci/layerb_32769_resource_authority_materializer_v0_1.py)" = '8000bd563eab5744ad8f7e2af36ca19721566922'
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('.github/workflows/layerb-32769-resource-authority-candidate-packaging-v0-1.yml').read_text()

          assert '\n  workflow_run:\n' in s
          assert '      - layerb-32769-resource-lifecycle-independent-consumer-v0-1' in s
          assert '      - completed' in s
          for forbidden in ('\n  push:', '\n  schedule:', '\n  workflow_dispatch:', '\n  pull_request:'):
              assert forbidden not in s,forbidden
          assert 'permissions:\n  contents: read\n  actions: read' in s
          assert 'contents: write' not in s and 'actions: write' not in s
          assert 'git push' not in s and 'git commit' not in s
          assert 'gh api' in s
          assert '/actions/runs/${INDEPENDENT_RUN_ID}/jobs?per_page=100' in s
          assert '/actions/runs/${INDEPENDENT_RUN_ID}/artifacts?per_page=100' in s
          assert '/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100' in s
          assert '/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100' in s
          assert '/actions/artifacts/${INDEPENDENT_ARTIFACT_ID}/zip' in s
          assert '/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip' in s

          i_pack=s.index('Freeze API-backed candidate provenance')
          i_mat=s.index('Materialize read-only resource authority candidate')
          i_upload=s.index('uses: actions/upload-artifact@v4')
          i_fail=s.index('Fail workflow if candidate provenance was not ready')
          assert i_pack < i_mat < i_upload < i_fail
          assert "if: steps.package.outputs.candidate_ready == 'true'" in s
          assert "if: steps.package.outputs.candidate_ready != 'true'" in s
          assert '--out candidate/provenance.json' in s
          assert '--provenance candidate/provenance.json' in s
          assert '--out candidate/resource_authority_candidate.json' in s
          assert "'candidate_only':True,'durable_repository_authority_created':False" in s
          assert "'scientific_execution_authorized':False" in s
          assert 'run: exit 31' in s

          # The packaging layer may create only an Actions artifact candidate, never the durable path.
          assert 'docs/dsir4/authority/LAYERB_32769_HIGH_MEMORY_RESOURCE_LIFECYCLE_V0_1.json' not in s
          assert 'candidate/resource_authority_candidate.json' in s
          assert 'candidate/candidate_receipt.json' in s

          out={
            'schema':'LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_STATIC_AUDIT_V0_1',
            'classification':'LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_STATIC_AUDIT_PASS_PLUS_0_PLUS_0',
            'effect':'+0/+0',
            'packaging_workflow_git_blob':'93dc50385c4b126b91d384e79f6b7079bae283a6',
            'trigger_exact_independent_consumer_completed':True,
            'read_only_permissions':True,
            'repository_write_forbidden':True,
            'source_and_independent_jobs_artifacts_api_bound':True,
            'downloaded_zip_hashes_packager_bound':True,
            'materializer_runs_only_after_packager_pass':True,
            'candidate_only':True,
            'durable_repository_authority_created':False,
            'not_ready_path_fails_workflow_closed':True,
            'scientific_solver_invoked':False,
            'scientific_response_read':False,
            'scientific_execution_authorized':False,
            'high_memory_resource_lifecycle_preflight_pass_now':False,
            'covariance_restriction_authorized':False,
            'Wm_S3_opened':False,
          }
          out['token']=out['classification']
          Path('artifacts/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-32769-resource-authority-candidate-packaging-static-audit-v0-1
          path: artifacts/result.json
          if-no-files-found: error
          retention-days: 90

  independent-verifier:
    needs: static-packaging-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: layerb-32769-resource-authority-candidate-packaging-static-audit-v0-1
          path: evidence
      - name: Independently verify candidate packaging static receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/layerb-32769-resource-authority-candidate-packaging-v0-1.yml)" = '93dc50385c4b126b91d384e79f6b7079bae283a6'
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/result.json'))
          assert d['classification']=='LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_STATIC_AUDIT_PASS_PLUS_0_PLUS_0'
          assert d['trigger_exact_independent_consumer_completed'] is True
          assert d['read_only_permissions'] is True and d['repository_write_forbidden'] is True
          assert d['source_and_independent_jobs_artifacts_api_bound'] is True
          assert d['downloaded_zip_hashes_packager_bound'] is True
          assert d['materializer_runs_only_after_packager_pass'] is True
          assert d['candidate_only'] is True and d['durable_repository_authority_created'] is False
          assert d['not_ready_path_fails_workflow_closed'] is True
          assert d['scientific_solver_invoked'] is False and d['scientific_execution_authorized'] is False
          print('LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_INDEPENDENT_STATIC_VALIDATION_PASS_PLUS_0_PLUS_0')
          PY
