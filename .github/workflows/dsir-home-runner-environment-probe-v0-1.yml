name: dsir-home-runner-environment-probe-v0-1

on:
  push:
    paths:
      - '.github/workflows/dsir-home-runner-environment-probe-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-runner-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record sanitized home-runner environment
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          {
            echo "schema=DSIR_HOME_RUNNER_ENVIRONMENT_PROBE_V0_1"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "hostname=$(hostname)"
            echo "kernel=$(uname -srmo)"
            echo "nproc=$(nproc)"
            awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ {print}' /proc/meminfo
            echo '--- free -h ---'
            free -h || true
            echo '--- tools ---'
            for x in python3 gcc g++ gfortran make pkg-config cmake git; do
              if command -v "$x" >/dev/null 2>&1; then echo "$x=$(command -v "$x")"; else echo "$x=MISSING"; fi
            done
            if command -v pkg-config >/dev/null 2>&1 && pkg-config --exists gsl; then
              echo 'gsl_pkg_config=AVAILABLE'
              echo "gsl_version=$(pkg-config --modversion gsl)"
            else
              echo 'gsl_pkg_config=MISSING'
            fi
            if sudo -n true >/dev/null 2>&1; then echo 'sudo_noninteractive=AVAILABLE'; else echo 'sudo_noninteractive=UNAVAILABLE'; fi
            echo '--- cpu summary ---'
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' || true
          } | tee artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsir-home-runner-environment-probe-v0-1
          path: artifacts/environment.txt
          if-no-files-found: error
          retention-days: 30
