name: Exp073CB causal repair stock write_to FITS to mmap exact chain v0.1
on:
  push:
    paths:
      - 'control/activate_exp073cb_v0_1.txt'
permissions:
  contents: read
jobs:
  hosted-static-and-runtime-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Freeze preregistration and helper identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/exp073cb_stock_write_fits_to_mmap_exact_chain_v0_1.py)" = 'd7921bfb58aa88b6f4c20121ca3c41209d0e590b'
          test "$(git hash-object experiments/073cb_support_stock_write_fits_to_mmap_exact_chain_causal_repair_v0_1_prereg.md)" = '45a9b37e983bfb1ec4eaefed60233d043c66055d'
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_v0_1.c)" = 'acafb095deafae7602101d8305e239341010ba79'
          grep -Fq 'C1_EXACT_STOCK_WRITE_TO_MMAP_CHAIN' experiments/073cb_support_stock_write_fits_to_mmap_exact_chain_causal_repair_v0_1_prereg.md
          grep -Fq '33827950939' experiments/073cb_support_stock_write_fits_to_mmap_exact_chain_causal_repair_v0_1_prereg.md
          ! grep -Fq '.get_coupling_matrix(' ci/exp073cb_stock_write_fits_to_mmap_exact_chain_v0_1.py
          grep -Fq 'memmap=True' ci/exp073cb_stock_write_fits_to_mmap_exact_chain_v0_1.py
          echo PASS_EXP073CB_V0_1_HOSTED_STATIC_FREEZE_AUDIT
      - name: Install exact NaMaster 2.7 plus GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "${GITHUB_ENV}"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"
      - name: Verify runtime source and GSL 2.7
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib,importlib.metadata,inspect,pymaster as nmt
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f'
          print('PASS_EXP073CB_V0_1_NAMASTER27_RUNTIME_LINEAGE')
          PY
          grep -Eq '#define GSL_VERSION "2\.7' "${NMT_PREFIX}/include/gsl/gsl_version.h"
      - name: Compile frozen Exp073BY mmap downstream emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/exp073cb-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_v0_1.c -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073cb-bin/mmap_full_mcm_emulator"
          echo "MMAP_EMULATOR=${RUNNER_TEMP}/exp073cb-bin/mmap_full_mcm_emulator" >> "${GITHUB_ENV}"
      - name: Execute frozen three-case stock-write persistence chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/exp073cb
          "${NMT_PY}" ci/exp073cb_stock_write_fits_to_mmap_exact_chain_v0_1.py --emulator "${MMAP_EMULATOR}" --out data/derived/exp073cb/exp073cb_stock_write_fits_to_mmap_exact_chain_v0_1.json
          echo PASS_EXP073CB_V0_1_RUNTIME_QA_EXECUTED
      - uses: actions/upload-artifact@v4
        with:
          name: exp073cb-stock-write-mmap-${{ github.sha }}
          path: data/derived/exp073cb/exp073cb_stock_write_fits_to_mmap_exact_chain_v0_1.json
