name: layerb-32769-parser-crash-diagnostics-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-32769-parser-crash-diagnostics-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  STAGE_PROBE_BLOB: '2c7e0c41f5d3269de14d129b00046e349ec41f96'
  PARENT_BLOB: '11c7d9a1f95d7c1c394dd520f1c4340a4ce397b4'
  JO_BLOB: 'c975a964805919cd61e3c028305ad3945773377f'
  JJ_BLOB: 'ee8fd0650a2a1322fab83a86bb06a219e84ca434'
  CANON_AUTH_BLOB: 'dddf7b0f8596506b9e792186d8ebaf14ff789f4c'
  CANON_FILE_BLOB: '7b67706156d7d2016ecba0628210fb08f6f05616'
  BUILD_AUTH_BLOB: 'ec773d9f5cbed652c52c52b5a4fae74efd5ecd0d'
  BUILD_COMPAT_BLOB: 'b7fe663154519b605699c1fd622d0079a5f76772'
  PUBLIC_EXPOSURE_BLOB: 'e5afe14eccf531d3e5b9de09b19d34df431a08b9'

jobs:
  static-input-length-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Measure exact parser payload lengths without invoking CLASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m venv .venv
          .venv/bin/python -m pip install 'numpy==1.26.4' >/dev/null
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = "$JJ_BLOB"
          .venv/bin/python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          import numpy as np
          spec=importlib.util.spec_from_file_location('jj','ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py'); jj=importlib.util.module_from_spec(spec); spec.loader.exec_module(jj)
          def nodes(path):
              lines=Path(path).read_text().splitlines(); words=np.asarray([int(x,16) for x in lines],dtype='<u8'); return np.ascontiguousarray(words.view('<f8'),dtype=np.float64)
          cases={
            '16385':nodes('docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt'),
            '32769':nodes('docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt'),
          }
          parser_capacity=524288
          rows={}
          for label,n in cases.items():
              p=jj.class_params(Path('configs/dsir4/c2/ide0_reference_v0_1.ini'),Path('configs/dsir4/c2/dsir_ide_p8_v0_1.pre'),0.0,0.0,n)
              s=p['k_output_values']; b=len(s.encode()); rows[label]={'node_count':len(n),'k_output_values_bytes':b,'bytes_including_nul':b+1,'fits_parser_capacity':b+1<=parser_capacity,'overflow_bytes':max(0,b+1-parser_capacity)}
          out={'schema':'LAYERB_32769_PARSER_PAYLOAD_LENGTH_AUDIT_V0_1','classification':'LAYERB_32769_PARSER_PAYLOAD_LENGTH_AUDIT_PLUS_0_PLUS_0','effect':'+0/+0','parser_capacity':parser_capacity,'rows':rows,'scientific_response_read':False,'class_solver_invoked':False,'scientific_authority_created':False,'successor_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          out['token']=out['classification']; Path('evidence/parser_lengths.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-32769-parser-payload-length-audit-v0-1
          path: evidence/parser_lengths.json
          retention-days: 90

  crash-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        mode: [faulthandler, unlimited_stack, gdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact diagnostic and frozen parent identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_32769_parser_crash_stage_probe_v0_1.py)" = "$STAGE_PROBE_BLOB"
          test "$(git hash-object ci/layerb_32769_response_blind_resource_lifecycle_pilot_v0_1.py)" = "$PARENT_BLOB"
          test "$(git hash-object ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py)" = "$JO_BLOB"
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = "$JJ_BLOB"
          test "$(git hash-object docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_32769_V0_1.json)" = "$CANON_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt)" = "$CANON_FILE_BLOB"
          test "$(git hash-object docs/dsir4/authority/LAYERB_32769_CLASS_CAPACITY_BUILD_ENVELOPE_V0_1.json)" = "$BUILD_AUTH_BLOB"
      - name: Build exact CLASS-IV diagnostic stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git gdb >/dev/null
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q "$CLASS_COMMIT"
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 32769',1))
          q=Path('external/class_iv/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 524288',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Run exact staged crash diagnostic
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -u
          mkdir -p evidence
          ulimit -s > evidence/stack_before.txt
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo > evidence/mem_before.txt
          args=(ci/layerb_32769_parser_crash_stage_probe_v0_1.py --canonical-authority docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_32769_V0_1.json --build-authority docs/dsir4/authority/LAYERB_32769_CLASS_CAPACITY_BUILD_ENVELOPE_V0_1.json --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt --parent-script ci/layerb_32769_response_blind_resource_lifecycle_pilot_v0_1.py --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py --baseline configs/dsir4/c2/ide0_reference_v0_1.ini --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre --markers evidence/markers.jsonl --out evidence/result.json)
          export PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}"
          set +e
          if [ "$MODE" = faulthandler ]; then
            PYTHONFAULTHANDLER=1 .venv/bin/python -u "${args[@]}" > evidence/stdout.log 2> evidence/stderr.log
            rc=$?
          elif [ "$MODE" = unlimited_stack ]; then
            ulimit -s unlimited
            ulimit -s > evidence/stack_after.txt
            PYTHONFAULTHANDLER=1 .venv/bin/python -u "${args[@]}" > evidence/stdout.log 2> evidence/stderr.log
            rc=$?
          else
            gdb -q -batch -ex 'set pagination off' -ex run -ex 'thread apply all bt full' --args .venv/bin/python -u "${args[@]}" > evidence/gdb.log 2>&1
            rc=$?
          fi
          set -e
          echo "$rc" > evidence/process_rc.txt
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo > evidence/mem_after.txt
          python3 - "$MODE" "$rc" <<'PY'
          import json,sys
          from pathlib import Path
          mode=sys.argv[1]; rc=int(sys.argv[2]); markers=[]
          p=Path('evidence/markers.jsonl')
          if p.is_file():
              for line in p.read_text().splitlines():
                  if line.strip(): markers.append(json.loads(line))
          out={'schema':'LAYERB_32769_CRASH_DIAGNOSTIC_WRAPPER_V0_1','classification':'LAYERB_32769_CRASH_DIAGNOSTIC_CAPTURED_PLUS_0_PLUS_0','effect':'+0/+0','mode':mode,'process_rc':rc,'stages':[x.get('stage') for x in markers],'last_stage':markers[-1].get('stage') if markers else None,'stage_records':markers,'result_present':Path('evidence/result.json').is_file(),'scientific_transfer_values_read':False,'scientific_response_read':False,'scientific_response_computed':False,'scientific_authority_created':False,'successor_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          out['token']=out['classification']; Path('evidence/wrapper.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-crash-diagnostic-${{ matrix.mode }}-v0-1
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  diagnostic-summary:
    needs: [static-input-length-audit, crash-diagnostic]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-32769-*-v0-1
          path: evidence
      - name: Summarize cause-discriminating evidence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          length=json.load(open(next(Path('evidence').rglob('parser_lengths.json'))))
          modes={}
          for p in Path('evidence').rglob('wrapper.json'):
              d=json.load(open(p)); modes[d['mode']]={'process_rc':d['process_rc'],'last_stage':d['last_stage'],'stages':d['stages'],'result_present':d['result_present']}
          out={'schema':'LAYERB_32769_PARSER_CRASH_DIAGNOSTIC_SUMMARY_V0_1','classification':'LAYERB_32769_PARSER_CRASH_DIAGNOSTIC_SUMMARY_PLUS_0_PLUS_0','effect':'+0/+0','parser_length_audit':length,'modes':modes,'scientific_response_read':False,'scientific_authority_created':False,'successor_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          out['token']=out['classification']; Path('diagnostic_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-32769-parser-crash-diagnostic-summary-v0-1
          path: diagnostic_summary.json
          retention-days: 90
