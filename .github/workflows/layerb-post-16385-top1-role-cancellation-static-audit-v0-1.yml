name: layerb-post-16385-top1-role-cancellation-static-audit-v0-1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-post-16385-top1-role-cancellation-static-audit-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit prospective top-1 cancellation helper without CLASS execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_post_16385_top1_role_cancellation_decomposition_v0_1.py)" = '76624d9a4b59d6e1ead02e22ead774135a799bbc'
          test "$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_DECOMPOSITION_V0_1.md)" = '$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_DECOMPOSITION_V0_1.md)'
          mkdir -p artifacts
          python - <<'PY'
          import ast,json
          from pathlib import Path
          s=Path('ci/layerb_post_16385_top1_role_cancellation_decomposition_v0_1.py').read_text()
          p=Path('docs/dsir4/prereg/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_DECOMPOSITION_V0_1.md').read_text()
          checks={
            'parseable':bool(ast.parse(s)),
            'conditional_prereg':'PROSPECTIVELY FROZEN / CONDITIONAL / NOT YET EXECUTION-AUTHORIZED' in p,
            'source_pass_required':'POST_16385_EXACT_RESPONSE_ATOM_HOTSPOT_LOCALIZATION_PASS_PLUS_0_PLUS_0' in s,
            'validator_pass_required':'POST_16385_EXACT_HOTSPOT_TERMINAL_VALIDATION_PASS_PLUS_0_PLUS_0' in s,
            'deterministic_top1':"t=top[0]" in s and "selection_rule':'exact_hotspot.top_64_response_atoms[0]'" in s,
            'full_plateau_required':'AUTH_MAX=0.012484060640679777' in s,
            'frozen_h':'H=1e-4' in s,
            'lookup_tol':'LOOKUP_TOL=1e-12' in s,
            'four_roles':all(x in s for x in ('reference','alpha_minus','beta_plus','beta_minus')),
            'canonical_8193':'6d35a9d79aa8826554e8e39315ab12a8be1675d32d25a86ec04c978c7723a515' in s,
            'canonical_16385':'3e10cea6e46a6d0c07eac825a4e508829727914c8690d42b187ef894eaa2c975' in s,
            'eight_constructions':"tracker!={'constructions':8,'live':0,'max_live':1}" in s,
            'alpha_numerator':"raw['alpha_minus']-raw['reference']" in s,
            'beta_numerator':"raw['beta_plus']-raw['beta_minus']" in s,
            'both_components_recorded':'alpha_response_cross_grid_relative_difference' in s and 'beta_response_cross_grid_relative_difference' in s,
            'no_alternative_h':"'alternative_h_evaluated':False" in s,
            'no_107':"'scientific_107_row_replay_executed':False" in s,
            'downstream_closed':all(x in s for x in ("'next_rung_authorized':False","'covariance_restriction_authorized':False","'Wm_S3_opened':False")),
          }
          ok=all(checks.values())
          out={'schema':'LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_STATIC_AUDIT_V0_1','classification':'POST_16385_TOP1_ROLE_CANCELLATION_STATIC_AUDIT_PASS_PLUS_0_PLUS_0' if ok else 'POST_16385_TOP1_ROLE_CANCELLATION_STATIC_AUDIT_FAIL_PLUS_0_PLUS_0','effect':'+0/+0','checks':checks,'pass_count':sum(checks.values()),'check_count':len(checks),'class_solver_invoked':False,'scientific_response_read':False,'hotspot_result_read':False,'execution_authorized':False,'scientific_authority_created':False,'next_rung_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          Path('artifacts/static.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(out['classification'],f"{out['pass_count']}/{out['check_count']}"); assert ok,out
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-top1-role-cancellation-static-audit-v0-1
          path: artifacts/static.json
          if-no-files-found: error
          retention-days: 90
