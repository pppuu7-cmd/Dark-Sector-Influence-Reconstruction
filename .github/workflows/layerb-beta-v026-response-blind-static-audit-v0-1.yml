name: layerb-beta-v026-response-blind-static-audit-v0-1

on:
  push:
    branches:
      - research/v026-full-layerb-prereg
    paths:
      - '.github/workflows/layerb-beta-v026-response-blind-static-audit-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4

      - name: Pin response-blind audit dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==1.26.4

      - name: Fetch exact frozen request-plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT_ID: '10298655751'
        run: |
          set -euo pipefail
          mkdir -p _v026_plan
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PLAN_ARTIFACT_ID}/zip" > _v026_plan/plan.zip
          printf '%s  %s\n' '9b8bdcf03cb05bc979e8c72135acac92232864a74dc1d510b579d8efb5cbb2a7' '_v026_plan/plan.zip' | sha256sum -c -
          unzip -q _v026_plan/plan.zip -d _v026_plan/unpacked
          test -f _v026_plan/unpacked/plan.json
          test "$(wc -c < _v026_plan/unpacked/plan.json)" = '3953984'
          printf '%s  %s\n' 'c12bdb2a407de3f9e2c0c410719ae604d9b3516dabb76c9b1598340418ee8064' '_v026_plan/unpacked/plan.json' | sha256sum -c -

      - name: Execute response-blind static auditor
        run: |
          set -euo pipefail
          python ci/layerb_beta_v026_response_blind_static_audit_v0_1.py \
            --plan _v026_plan/unpacked/plan.json \
            --out _v026_plan/v026_static_audit.json
          python - <<'PY'
          import json
          p='_v026_plan/v026_static_audit.json'
          d=json.load(open(p))
          assert d['token']=='PASS_LAYERB_BETA_V0_26_RESPONSE_BLIND_STATIC_AUDIT'
          assert d['class_solver_invoked'] is False
          assert d['scientific_response_read'] is False
          assert d['covariance_read'] is False
          assert d['mixed']['canonical_sha256']=='59abce49f6338c30b93d11fa462e1ff8642615d6100d23feca4b36505a5cef85'
          assert d['direct']['canonical_sha256']=='1c98927960e81d7fb55ebc687ef36059d964b233001551dba2aa9a01652c8864'
          print(d['token'])
          PY
          sha256sum _v026_plan/v026_static_audit.json > _v026_plan/v026_static_audit.sha256

      - name: Persist immutable response-blind receipt
        uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-v026-response-blind-static-audit-v0-1
          path: |
            _v026_plan/v026_static_audit.json
            _v026_plan/v026_static_audit.sha256
          if-no-files-found: error
          retention-days: 90
