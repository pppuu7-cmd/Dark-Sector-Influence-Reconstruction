name: layerb-beta-v026-r1-sentinel-launch-package-static-audit-v0-1

on:
  push:
    branches:
      - research/v026-r1-sentinel-launch-package
    paths:
      - '.github/workflows/layerb-beta-v026-r1-sentinel-launch-package-static-audit-v0-1.yml'
      - 'ci/layerb_beta_v026_r1_sentinel_launch_package_static_audit_v0_1.py'
      - 'docs/dsir4/contracts/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_PACKAGE_CONTRACT_V0_1.json'
      - 'docs/dsir4/workflow_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_ACTIVE_WORKFLOW_CANDIDATE_V0_2.yml'
      - 'docs/dsir4/authority_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_AUTHORITY_CANDIDATE_V0_1.json'
      - 'docs/dsir4/launch_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_CANDIDATE_V0_1.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static-launch-package-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact inactive launch-package head
        uses: actions/checkout@v4

      - name: Verify exact frozen launch-package blobs and absence of active paths
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/workflow_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_ACTIVE_WORKFLOW_CANDIDATE_V0_2.yml)" = '19907175f0f3417ddee2aba6916d961c6be02e26'
          test "$(git hash-object docs/dsir4/authority_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_AUTHORITY_CANDIDATE_V0_1.json)" = '4ba40e59e6a9d48636d95d07efab575e56ae0966'
          test "$(git hash-object docs/dsir4/launch_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_CANDIDATE_V0_1.json)" = '9c217e41764d979bea12644fae372354241bc976'
          test "$(git hash-object docs/dsir4/contracts/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_PACKAGE_CONTRACT_V0_1.json)" = '26806597e651fb22956de59f102c0ad24d11c576'
          test "$(git hash-object ci/layerb_beta_v026_r1_sentinel_launch_package_static_audit_v0_1.py)" = '8efdccffcf0e740a799fd462c3988cdc20a29b1a'
          test ! -e .github/workflows/layerb-beta-v026-r1-sentinel-science-v0-1.yml
          test ! -e docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_AUTHORITY_V0_1.json
          test ! -e docs/dsir4/launch/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_V0_1.json
          test ! -e docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_PACKAGE_QUALIFICATION_V0_1.json

      - name: Syntax-check auditor and future workflow YAML candidate
        run: |
          set -euo pipefail
          python3 -m py_compile ci/layerb_beta_v026_r1_sentinel_launch_package_static_audit_v0_1.py
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0]); puts 'FUTURE_WORKFLOW_YAML_SYNTAX_OK'" docs/dsir4/workflow_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_ACTIVE_WORKFLOW_CANDIDATE_V0_2.yml

      - name: Execute response-blind acyclic launch-package static audit
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 ci/layerb_beta_v026_r1_sentinel_launch_package_static_audit_v0_1.py \
            --out safe/launch_package_static_audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/launch_package_static_audit.json'))
          assert d['token']=='PASS_LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_PACKAGE_STATIC_AUDIT_PLUS_0_PLUS_0'
          assert d['classification']=='SENTINEL_LAUNCH_PACKAGE_ACYCLIC_RESPONSE_BLIND_STATIC_AUDIT_PASS'
          assert d['provenance_topology']=='W_TO_A_TO_L_THEN_Q'
          assert d['A_binds_W'] is True and d['A_binds_L'] is False
          assert d['L_binds_A'] is True and d['L_binds_W'] is True
          assert d['future_active_W_present'] is False
          assert d['future_authority_A_present'] is False
          assert d['future_trigger_L_present'] is False
          assert d['future_package_Q_present'] is False
          assert d['class_solver_invoked'] is False
          assert d['scientific_response_read'] is False
          assert d['sentinel_science_execution_authorized_by_this_receipt'] is False
          assert d['full_107_row_execution_authorized'] is False
          print(d['token'])
          PY
          sha256sum safe/launch_package_static_audit.json > safe/launch_package_static_audit.sha256

      - name: Persist immutable launch-package audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-v026-r1-sentinel-launch-package-static-audit-v0-1
          path: |
            safe/launch_package_static_audit.json
            safe/launch_package_static_audit.sha256
            safe/future_W_exact_copy.yml
            safe/future_A_exact_copy.json
            safe/future_L_exact_copy.json
          if-no-files-found: error
          retention-days: 90
