name: Exp073IB C2 Tangent Delta_m Common Coordinate Map v0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073ib-c2-tangent-deltam-common-coordinate-map-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen identities and inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073IB_C2_TANGENT_DELTAM_COMMON_COORDINATE_MAP_V0_2.md)" = '69c8e313cbe95ee426ba23112d63548c9ab26556'
          mkdir -p /tmp/ib2/ia /tmp/ib2/old /tmp/ib2/out
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10065081303/zip" -o /tmp/ib2/ia.zip
          test "$(sha256sum /tmp/ib2/ia.zip | awk '{print $1}')" = '6bf115c76d538f0691c1fcfa9d9a26721b9b593f26aceb2a7a59bdb7cc9aa0ce'
          unzip -q /tmp/ib2/ia.zip -d /tmp/ib2/ia
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10065129526/zip" -o /tmp/ib2/old.zip
          test "$(sha256sum /tmp/ib2/old.zip | awk '{print $1}')" = 'b0725f47946c0abacff21e4e686fe9d746be26d6249ae9c6a36cce34683639c7'
          unzip -q /tmp/ib2/old.zip -d /tmp/ib2/old
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10062705321/zip" -o /tmp/ib2/hw.zip
          test "$(sha256sum /tmp/ib2/hw.zip | awk '{print $1}')" = '7ea327f0d6e29e4b415c9f66201b266e9015d46a383e8867de94b05665517c00'
          unzip -p /tmp/ib2/hw.zip BRIDGE_RECEIPT.txt | grep -Fxq 'operation_order=hconf_then_velocity_term_then_add'
      - name: Apply exact HW operation order and regression-compare
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,hashlib,pathlib
          ia=pathlib.Path('/tmp/ib2/ia'); old=pathlib.Path('/tmp/ib2/old'); out=pathlib.Path('/tmp/ib2/out')
          labels=['alpha_m1e4','alpha_m1e3','alpha_m1e2','beta_p1e4','beta_m1e4','beta_p1e3','beta_m1e3','beta_p1e2','beta_m1e2']
          manifest=[]; compared=0
          for lab in labels:
            inrows=[json.loads(x) for x in (ia/(lab+'.jsonl')).read_text().splitlines()]
            oldrows=[json.loads(x) for x in (old/(lab+'.jsonl')).read_text().splitlines()]
            assert len(inrows)==len(oldrows)==28
            rows=[]
            for i,(r,o) in enumerate(zip(inrows,oldrows)):
              rid=f'z{i//4:02d}k{i%4:02d}'; assert r['request_id']==o['request_id']==rid
              vals={k[:-4]:float.fromhex(v) for k,v in r.items() if k.endswith('_hex')}
              assert all(math.isfinite(x) for x in vals.values())
              k=vals['k']; assert k>0.0 and vals['rho_idm_iv']>0.0 and vals['rho_iv']>=0.0
              hconf=vals['a']*vals['H']; assert math.isfinite(hconf)
              velocity_term=3.0*hconf*vals['theta_m']/(k*k); assert math.isfinite(velocity_term)
              Delta=vals['delta_m']+velocity_term; assert math.isfinite(Delta)
              hx=Delta.hex(); assert hx==o['Delta_m_hex']; compared+=1
              rows.append({'request_id':rid,'Delta_m_hex':hx})
            p=out/(lab+'.jsonl')
            with p.open('w',encoding='utf-8',newline='\n') as f:
              for r in rows: f.write(json.dumps(r,separators=(',',':'))+'\n')
            sha=hashlib.sha256(p.read_bytes()).hexdigest(); manifest.append((lab,sha)); print(lab,sha)
          assert compared==252
          with (out/'mapped_sha256.tsv').open('w') as f:
            for lab,sha in manifest: f.write(f'{lab} {sha}\n')
          print('EXP073IB_V0_2_REGRESSION_EXACT_EQUAL_RECORDS=252')
          PY
          cat > /tmp/ib2/out/AUTHORITY.txt <<EOF
          hypothesis_id=C2_IDE_LOCAL_TANGENT_CONE
          source_ia_run=34248722000
          source_ia_job=102137324616
          source_ia_artifact=10065081303
          historical_ib_v0_1_run=34248841106
          historical_ib_v0_1_artifact=10065129526
          historical_ib_v0_1_classification=IMPLEMENTATION_PROVENANCE_FAIL_PLUS_0_PLUS_0
          reference_hw_run=34242852819
          reference_hw_artifact=10062705321
          operation_order=hconf_then_velocity_term_then_add
          ib_v0_2_head=${GITHUB_SHA}
          ib_v0_2_run=${GITHUB_RUN_ID}
          ib_v0_2_prereg_blob=69c8e313cbe95ee426ba23112d63548c9ab26556
          tangent_raw_set_admitted=true
          decoded=true
          mapped=true
          mapped_tangent_coordinate=true
          tangent_response_ready=false
          prediction_ready=false
          scientific_model_authority_created=false
          G_DOMAIN_MAPPING=NOT_YET_TESTABLE
          EOF
          echo 'PASS_EXP073IB_C2_TANGENT_DELTAM_COMMON_COORDINATE_MAP_V0_2'
          echo 'classification=TANGENT_MAPPED_COMMON_COORDINATE_PLUS_0_PLUS_0'
          echo 'tangent_raw_set_admitted=true'
          echo 'decoded=true'
          echo 'mapped=true'
          echo 'mapped_tangent_coordinate=true'
          echo 'tangent_response_ready=false'
          echo 'prediction_ready=false'
          echo 'scientific_model_authority_created=false'
          echo 'G_DOMAIN_MAPPING=NOT_YET_TESTABLE'
      - uses: actions/upload-artifact@v4
        with:
          name: exp073ib-c2-tangent-mapped-v0-2
          path: /tmp/ib2/out/*
          retention-days: 30
          if-no-files-found: error
