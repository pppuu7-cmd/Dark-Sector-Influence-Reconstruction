    branches: [main]
    paths: ['.github/activations/exp073ey-static-audit-v0-1.txt']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bind prospective Exp073EY identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073ey_ww_s0_s1_filebacked_full_resolution_ab_science_v0_1_prereg.md)" = '5790f7502370abffc5c450278520cc73c1f901f8'
