          test "$(git rev-parse HEAD:ci/exp073ey_ww_s0_s1_durable_ab_production_v0_1.py)" = '1db1eabbdba492c476cc61d3c4d71147aa688384'
          test "$(git rev-parse HEAD:ci/exp073ey_ww_s0_s1_durable_ab_production_v0_2.py)" = '066847006b2ed9d712d2c22d3576a0d8887fa7bf'
