name: Exp073FS autonomous queue static audit v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/activations/exp073fs-queue-static-audit-v0-1.txt'

permissions:
  contents: read

jobs:
  hosted-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit autonomous handoff and S1S2 production code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/workflows/exp073fr-ww-s1-s1-provenance-admission-and-dispatch-v0-1.yml)" = '3bea3f168ad28adaac0195618bf6a5f3b8c7dd79'
          test "$(git rev-parse HEAD:.github/workflows/exp073fs-ww-s1-s2-home-science-v0-1.yml)" = '157850a2ae01b7c58c0bfac20df6360525f3a198'
          test "$(git rev-parse HEAD:experiments/073fr_ww_s1_s1_provenance_admission_and_successor_dispatch_v0_1_prereg.md)" = '384410ba6d557f5a7ae4b711be362496109fc78f'
          test "$(git rev-parse HEAD:experiments/073fs_ww_s1_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md)" = '80c6af017b47d51db3f588221749fb152577b0e5'
          test "$(git rev-parse HEAD:experiments/073ft_ww_s1_s2_provenance_admission_v0_1_prereg.md)" = '072bdeae68e86312142e980fe2015f979e7b117f'
          test "$(git rev-parse HEAD:ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py)" = '030f64f4d1b5bb233ad977b6a6971ebb197d45bf'
          test "$(git rev-parse HEAD:ci/exp073fs_ww_s1_s2_durable_ab_production_v0_2.py)" = 'a02370a5d9d588a813026dee6355c8a1c58a380d'
          test "$(git rev-parse HEAD:ci/exp073fs_verify_and_prune_replica_v0_1.py)" = '92bf5eaa047d97adeddad240784dcc5176c9459e'
          test "$(git rev-parse HEAD:ci/exp073fs_compare_terminal_receipts_v0_1.py)" = '826fcefc8ce64a26e8c8205b1898f63c42ffc0f0'
          test "$(git rev-parse HEAD:ci/exp073fs_home_filebacked_fullres_v0_1.sh)" = 'a9f1777c68db522c02068828bc9e47a78b065681'
          python3 -m py_compile ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py ci/exp073fs_ww_s1_s2_durable_ab_production_v0_2.py ci/exp073fs_verify_and_prune_replica_v0_1.py ci/exp073fs_compare_terminal_receipts_v0_1.py
          bash -n ci/exp073fs_home_filebacked_fullres_v0_1.sh
          grep -F "workflows: ['Exp073FM WW_S1_S1 audited home science v0.1']" .github/workflows/exp073fr-ww-s1-s1-provenance-admission-and-dispatch-v0-1.yml >/dev/null
          grep -F 'exp073fs-ww-s1-s2-home-science-v0-1.yml' .github/workflows/exp073fr-ww-s1-s1-provenance-admission-and-dispatch-v0-1.yml >/dev/null
          grep -F 'source_count_map(r1_root,1)' ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F 'source_count_map(r1_root,2)' ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F 'compute_coupling_matrix(f1,f2,b)' ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "'ordered_source_indices':[1,2]" ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F 'field_construction_count' ci/exp073fs_verify_and_prune_replica_v0_1.py >/dev/null
          grep -F 'EXPECTED_MCM_BYTES = 19327352832' ci/exp073fs_ww_s1_s2_durable_ab_production_v0_2.py >/dev/null
          grep -F 'PASS_EXP073FR_WW_S1_S1_FILEBACKED_PROVENANCE_ADMISSION_V0_1' .github/workflows/exp073fr-ww-s1-s1-provenance-admission-and-dispatch-v0-1.yml >/dev/null
          grep -F 'PASS_EXP073FT_WW_S1_S2_FILEBACKED_PROVENANCE_ADMISSION_V0_1' .github/workflows/exp073fs-ww-s1-s2-home-science-v0-1.yml >/dev/null
          ! grep -Eqi 'np\.(allclose|isclose)|rounding_rescue|smoothing_rescue|averaging_rescue' ci/exp073fs_*.py experiments/073f[rst]_*.md
          echo PASS_EXP073FS_AUTONOMOUS_QUEUE_STATIC_AUDIT_V0_1
          echo classification=SUPPORT_PLUS_0_PLUS_0
          echo self_hosted_science_started=false
