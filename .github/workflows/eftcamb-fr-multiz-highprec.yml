name: H-EFTCAMB designer-fR high-precision hard regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eftcamb-fr-multiz-highprec.yml'
      - 'ci/eftcamb_fr_multiz.py'
      - 'ci/eftcamb_fr_manifold_summary.py'
      - 'ci/eftcamb_fr_mgs1_gate.py'
      - 'experiments/026_eftcamb_fr_multiz_manifold.md'

jobs:
  mgs1_highprec:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y git gfortran gcc make liblapack-dev libblas-dev python3 python3-pip
          python3 -m pip install --user numpy

      - name: Clone pinned H-EFTCAMB and raise only text-output precision
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/EFTCAMB/EFTCAMB.git eftcamb
          cd eftcamb
          git checkout 16d9c4e9f85751e30efd0a53b177941713078904
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../eftcamb_mgs1_hp_upstream_sha.txt
          cd fortran
          grep -n "E15.6" results.f90 | tee ../../mgs1_writer_before.txt
          sed -i 's/E15\.6/E25.16/g' results.f90
          grep -n "E25.16" results.f90 | tee ../../mgs1_writer_after.txt
          test "$(grep -c 'E25.16' results.f90)" -ge 2
          make camb

      - name: Write common DSIR baseline
        working-directory: eftcamb/fortran/eftcamb_test/parameters
        run: |
          set -euxo pipefail
          cp base_params.ini dsir_mgs1_hp_base.ini
          sed -i 's/^get_scalar_cls[[:space:]]*=.*/get_scalar_cls = F/' dsir_mgs1_hp_base.ini
          sed -i 's/^get_tensor_cls[[:space:]]*=.*/get_tensor_cls = F/' dsir_mgs1_hp_base.ini
          sed -i 's/^do_lensing[[:space:]]*=.*/do_lensing = F/' dsir_mgs1_hp_base.ini
          sed -i 's/^do_nonlinear[[:space:]]*=.*/do_nonlinear = 0/' dsir_mgs1_hp_base.ini
          sed -i 's/^hubble[[:space:]]*=.*/hubble = 67/' dsir_mgs1_hp_base.ini
          sed -i 's/^ombh2[[:space:]]*=.*/ombh2 = 0.0224/' dsir_mgs1_hp_base.ini
          sed -i 's/^omch2[[:space:]]*=.*/omch2 = 0.1200/' dsir_mgs1_hp_base.ini
          sed -i 's/^omnuh2[[:space:]]*=.*/omnuh2 = 0/' dsir_mgs1_hp_base.ini
          sed -i 's/^massless_neutrinos[[:space:]]*=.*/massless_neutrinos = 3.046/' dsir_mgs1_hp_base.ini
          sed -i 's/^nu_mass_eigenstates[[:space:]]*=.*/nu_mass_eigenstates = 0/' dsir_mgs1_hp_base.ini
          sed -i 's/^massive_neutrinos[[:space:]]*=.*/massive_neutrinos = 0/' dsir_mgs1_hp_base.ini
          sed -i 's/^helium_fraction[[:space:]]*=.*/helium_fraction = 0.2404/' dsir_mgs1_hp_base.ini
          sed -i 's/^scalar_amp(1)[[:space:]]*=.*/scalar_amp(1) = 2.10e-9/' dsir_mgs1_hp_base.ini
          sed -i 's/^scalar_spectral_index(1)[[:space:]]*=.*/scalar_spectral_index(1) = 0.965/' dsir_mgs1_hp_base.ini
          sed -i 's/^reionization[[:space:]]*=.*/reionization = F/' dsir_mgs1_hp_base.ini
          sed -i 's/^transfer_kmax[[:space:]]*=.*/transfer_kmax = 0.25/' dsir_mgs1_hp_base.ini
          sed -i 's/^transfer_k_per_logint[[:space:]]*=.*/transfer_k_per_logint = 80/' dsir_mgs1_hp_base.ini
          sed -i 's/^transfer_num_redshifts[[:space:]]*=.*/transfer_num_redshifts = 7/' dsir_mgs1_hp_base.ini
          sed -i 's/^transfer_redshift(1)[[:space:]]*=.*/transfer_redshift(1) = 2.33/' dsir_mgs1_hp_base.ini
          sed -i 's/^transfer_filename(1)[[:space:]]*=.*/transfer_filename(1) = z7_transfer.dat/' dsir_mgs1_hp_base.ini
          sed -i 's/^transfer_matterpower(1)[[:space:]]*=.*/transfer_matterpower(1) = z7_matterpower.dat/' dsir_mgs1_hp_base.ini
          sed -i 's/^number_of_threads[[:space:]]*=.*/number_of_threads = 2/' dsir_mgs1_hp_base.ini
          cat >> dsir_mgs1_hp_base.ini <<'EOF'
          transfer_redshift(2) = 1.491
          transfer_filename(2) = z6_transfer.dat
          transfer_matterpower(2) = z6_matterpower.dat
          transfer_redshift(3) = 1.317
          transfer_filename(3) = z5_transfer.dat
          transfer_matterpower(3) = z5_matterpower.dat
          transfer_redshift(4) = 0.934
          transfer_filename(4) = z4_transfer.dat
          transfer_matterpower(4) = z4_matterpower.dat
          transfer_redshift(5) = 0.706
          transfer_filename(5) = z3_transfer.dat
          transfer_matterpower(5) = z3_matterpower.dat
          transfer_redshift(6) = 0.51
          transfer_filename(6) = z2_transfer.dat
          transfer_matterpower(6) = z2_matterpower.dat
          transfer_redshift(7) = 0.295
          transfer_filename(7) = z1_transfer.dat
          transfer_matterpower(7) = z1_matterpower.dat
          EOF

      - name: Write GR and designer configurations
        working-directory: eftcamb/fortran/eftcamb_test/parameters
        run: |
          set -euxo pipefail
          cat > dsir_mgs1_hp_gr.ini <<'EOF'
          EFTflag = 0
          output_root = eftcamb_test/results/spectra_results/dsir_mgs1_hp_gr_
          DEFAULT(dsir_mgs1_hp_base.ini)
          EOF
          for pair in '0 b0' '1e-7 b1em7' '1e-6 b1em6' '1e-5 b1em5' '1e-4 b1em4' '1e-3 b1em3'; do
            set -- $pair; B0=$1; TOK=$2
            cat > dsir_mgs1_hp_${TOK}.ini <<EOF
          EFTflag = 3
          DesignerEFTmodel = 1
          EFTwDE = 0
          EFTB0 = ${B0}
          EFT_ghost_math_stability = F
          EFT_mass_math_stability = F
          EFT_ghost_stability = T
          EFT_gradient_stability = T
          EFT_mass_stability = F
          EFT_mass_stability_rate = 10.0
          EFT_additional_priors = T
          EFTCAMB_turn_on_time = 0.01
          EFTCAMB_stability_time = 1.e-10
          EFTCAMB_stability_threshold = 0.0
          output_root = eftcamb_test/results/spectra_results/dsir_mgs1_hp_${TOK}_
          DEFAULT(dsir_mgs1_hp_base.ini)
          EOF
          done

      - name: Run fresh common-baseline high-precision regression
        working-directory: eftcamb/fortran
        run: |
          set -euxo pipefail
          mkdir -p eftcamb_test/results/spectra_results
          ./camb eftcamb_test/parameters/dsir_mgs1_hp_gr.ini 2>&1 | tee ../../mgs1_hp_gr.log
          for tok in b0 b1em7 b1em6 b1em5 b1em4 b1em3; do
            ./camb "eftcamb_test/parameters/dsir_mgs1_hp_${tok}.ini" 2>&1 | tee "../../dsir_mgs1_hp_${tok}.log"
          done

      - name: Require stable error-free designer runs
        run: |
          set -euxo pipefail
          for tok in b0 b1em7 b1em6 b1em5 b1em4 b1em3; do
            f="dsir_mgs1_hp_${tok}.log"
            grep -q 'EFTCAMB: theory stable' "$f"
            ! grep -q 'ERROR STOP' "$f"
          done

      - name: Extract frozen responses
        run: |
          set -euxo pipefail
          python3 ci/eftcamb_fr_multiz.py --root eftcamb/fortran --gr-token dsir_mgs1_hp_gr_ --model-token dsir_mgs1_hp_b0_ --B0 0 --json mgs1_hp_B0_0.json
          python3 ci/eftcamb_fr_multiz.py --root eftcamb/fortran --gr-token dsir_mgs1_hp_gr_ --model-token dsir_mgs1_hp_b1em7_ --B0 1e-7 --json mgs1_hp_B0_1e-7.json
          python3 ci/eftcamb_fr_multiz.py --root eftcamb/fortran --gr-token dsir_mgs1_hp_gr_ --model-token dsir_mgs1_hp_b1em6_ --B0 1e-6 --json mgs1_hp_B0_1e-6.json
          python3 ci/eftcamb_fr_multiz.py --root eftcamb/fortran --gr-token dsir_mgs1_hp_gr_ --model-token dsir_mgs1_hp_b1em5_ --B0 1e-5 --json mgs1_hp_B0_1e-5.json
          python3 ci/eftcamb_fr_multiz.py --root eftcamb/fortran --gr-token dsir_mgs1_hp_gr_ --model-token dsir_mgs1_hp_b1em4_ --B0 1e-4 --json mgs1_hp_B0_1e-4.json
          python3 ci/eftcamb_fr_multiz.py --root eftcamb/fortran --gr-token dsir_mgs1_hp_gr_ --model-token dsir_mgs1_hp_b1em3_ --B0 1e-3 --json mgs1_hp_B0_1e-3.json
          python3 ci/eftcamb_fr_manifold_summary.py --glob 'mgs1_hp_B0_*.json' --json mgs1_hp_manifold_summary.json

      - name: Hard gate frozen MG-S1 production manifold
        run: |
          set -euxo pipefail
          python3 ci/eftcamb_fr_mgs1_gate.py \
            --glob 'mgs1_hp_B0_*.json' \
            --zero-max 2e-6 \
            --production-min-b0 1e-6 \
            --production-min-response 1e-4 \
            --json mgs1_hp_hard_gate.json

      - name: Record hard-regression provenance
        run: |
          {
            echo 'DSIR MG-S1 high-precision HARD regression'
            echo 'Thresholds were frozen before this fresh run.'
            echo 'exact-zero max |r_Delta| <= 2e-6 over all 7x5 frozen cells'
            echo 'production B0 >= 1e-6; each production max response >= 1e-4; maxima strictly increase with B0'
            echo 'B0=1e-7 is a solver-threshold transition control and is excluded from the production gate'
            echo 'Physics/common baseline identical to Experiment 026 calibration.'
            echo 'Text-output formatting only: pinned CAMB E15.6 occurrences are raised to E25.16 before compilation; equations and parameters are unchanged.'
            echo -n 'H-EFTCAMB upstream: '; cat eftcamb_mgs1_hp_upstream_sha.txt
            echo "DSIR commit: $GITHUB_SHA"
          } > mgs1_hp_environment.txt

      - name: Upload hard-regression artifact
        uses: actions/upload-artifact@v4
        with:
          name: eftcamb-mgs1-hard-${{ github.sha }}
          path: |
            mgs1_hp_*.json
            dsir_mgs1_hp_*.log
            mgs1_hp_gr.log
            mgs1_hp_environment.txt
            mgs1_writer_before.txt
            mgs1_writer_after.txt
            eftcamb_mgs1_hp_upstream_sha.txt
            eftcamb/fortran/eftcamb_test/parameters/dsir_mgs1_hp_*.ini
            eftcamb/fortran/eftcamb_test/results/spectra_results/dsir_mgs1_hp_*matterpower*.dat
          if-no-files-found: error
