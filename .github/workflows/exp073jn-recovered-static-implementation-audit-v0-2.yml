name: exp073jn-recovered-static-implementation-audit-v0-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073jn-recovered-static-implementation-audit-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce response-blind frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/exp073jn_article3_recovered_canonical_one_live_scientific_closure_v0_2.py)" = 'efb3eb0d13bb26a72c450a2de880b2a0dcea3507'
          test "$(git hash-object docs/dsir4/prereg/EXP073JN_RECOVERED_CANONICAL_ONE_LIVE_EXECUTION_ALIGNMENT_V0_2.md)" = '6bfbaa229a7f850aa3c54fddcda991ff49a43ce4'
          test "$(git hash-object docs/dsir4/prereg/EXP073JN_ARTICLE3_LAYERB_SHARED_GRID_SCIENTIFIC_CLOSURE_RERUN_V0_1.md)" = '7320186baa6c97315b4ced5e54cfb9a5d79d8ad1'
          test "$(git hash-object ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py)" = '5f8475b961db20bef5f4b8a2eb7c99d9f7c722e2'
          python3 -m py_compile ci/exp073jn_article3_recovered_canonical_one_live_scientific_closure_v0_2.py
      - name: Audit implementation without importing CLASS or reading JL result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import ast,hashlib,json
          from pathlib import Path
          hp=Path('ci/exp073jn_article3_recovered_canonical_one_live_scientific_closure_v0_2.py')
          ap=Path('docs/dsir4/prereg/EXP073JN_RECOVERED_CANONICAL_ONE_LIVE_EXECUTION_ALIGNMENT_V0_2.md')
          pp=Path('docs/dsir4/prereg/EXP073JN_ARTICLE3_LAYERB_SHARED_GRID_SCIENTIFIC_CLOSURE_RERUN_V0_1.md')
          ep=Path('ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py')
          s=hp.read_text(); a=ap.read_text(); p=pp.read_text(); e=ep.read_text(); ast.parse(s)
          checks={
            'no_class_import': 'from classy import' not in s and 'import classy' not in s,
            'no_runtime_grid_regeneration': 'guarded_lattice(' not in s and 'geomspace(' not in s,
            'activation_exact_classification': 'jl.get("classification") != JL_CONVERGED' in s,
            'activation_independent_verification': 'jl.get("artifact_verified_independently") is not True' in s,
            'no_activation_observation_dependency': 'observations' not in s and 'jl_max' not in s,
            'fresh_engine_execution': 'fresh = engine.execute(a)' in s,
            'activating_response_not_reused': '"response_values_reused": False' in s,
            'h_exact': 'H = 1e-4' in s,
            'rel_tol_exact': 'REL_TOL = 1e-3' in s,
            'native_kpd_exact': 'NATIVE_KPD = 20.0' in s,
            'strict_less_than': 'float(mx) < REL_TOL' in s,
            'lookup_ceiling': '<= LOOKUP_REL_TOL' in s,
            'physical_fraction': 'float(layer["invalid_row_fraction"]) <= 0.05' in s,
            'retained_dimension': 'layer["retained_after_layer_b"] >= 15' in s,
            'four_frozen_outcomes': all(x in s for x in ['PASS_PHYSICAL_SUPPORT_ARTICLE3_SHARED_GRID_V0_1','FAIL_PHYSICAL_SUPPORT_ARTICLE3_SHARED_GRID_V0_1','NUMERICALLY_UNRESOLVED_EXP073JN','INVALID_INFRA_PLUS_0_PLUS_0']),
            'canonical_2049': '6305c95025e52296b6cb623903f82dc45bb66ac692708b242fc354862ac54c46' in s,
            'canonical_4097': 'f30556be2547732ed0b87b56368e01e46504a975f94fcbbc5e7bc8cfc525e5eb' in s,
            'plan_coarse': '505716116cc385d5700e455017d8e541c5bba7774fa6647298392495c83ecfe0' in s,
            'plan_fine': '0f7ce2e5fa459e15954268dfd46045eaa0ab6356dfdab5a2e282514e7a34ae4e' in s,
            'eight_constructions': 'lifecycle.get("total_solver_constructions") == 8' in s,
            'one_live': 'lifecycle.get("max_live_instances") == 1' in s,
            'final_live_zero': 'lifecycle.get("final_live_instances") == 0' in s,
            'same_process': 'lifecycle.get("cross_process_raw_operand_combination") is False' in s,
            'calls_4040': 'plan.get("total_get_transfer_calls") == 4040' in s,
            'original_activation_preserved': 'valid, independently verified `COMMON_GRID_THIRD_REFINEMENT_CONVERGED_PLUS_0_PLUS_0`' in p,
            'alignment_science_unchanged': 'scientific contract remains `EXP073JN_ARTICLE3_LAYERB_SHARED_GRID_SCIENTIFIC_CLOSURE_RERUN_V0_1.md` unchanged' in a,
            'alignment_forbids_response_reuse': 'No scientific quantity from the activating JL artifact may be reused as the fresh JN response' in a,
            'engine_has_planner_replay': 'class PlannerSuite' in e and 'class ReplaySuite' in e,
            'engine_has_eight_one_live_guard': 'tracker != {"constructions": 8, "live": 0, "max_live": 1}' in e,
          }
          assert all(checks.values()), [k for k,v in checks.items() if not v]
          def sha(x): return hashlib.sha256(x.read_bytes()).hexdigest()
          result={'schema':'EXP073JN_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_RESULT_V0_2','classification':'EXP073JN_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_PASS_PLUS_0_PLUS_0','effect':'+0/+0','branch_activated':False,'scientific_response_read':False,'class_solver_invoked':False,'scientific_authority_created':False,'check_count':len(checks),'checks':checks,'helper_sha256':sha(hp),'alignment_sha256':sha(ap),'original_prereg_sha256':sha(pp),'recovered_engine_sha256':sha(ep),'article3_repository_readiness_percent':68,'funnel_freeze_readiness_percent':67,'token':'EXP073JN_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_PASS_PLUS_0_PLUS_0'}
          Path('artifacts/result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(result['token'],result['check_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073jn-recovered-static-implementation-audit-v0-2
          path: artifacts/result.json
          if-no-files-found: error
          retention-days: 90
