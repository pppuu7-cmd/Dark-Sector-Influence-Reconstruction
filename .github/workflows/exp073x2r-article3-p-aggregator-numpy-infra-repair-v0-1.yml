name: Exp073X2R Article3 P aggregator NumPy infra repair v0.1

on:
  push:
    paths:
      - 'ci/exp073x2r_article3_p_aggregator_numpy_infra_repair_v0_1.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repaired-primary-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce prospective repair freeze
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git log -1 --format=%H -- experiments/073x2r_article3_p_aggregator_numpy_infra_repair_v0_1_prereg.md)" = 'abe894465bacca43a758b8082923d1e0dbe54dfa'
          test "$(git log -1 --format=%H -- ci/exp073x2_compare_replicas_v0_1.py)" = '8ec6f94ea9ddf3cc0a4c98e5af696d28d995b2b3'
          test -f experiments/073x2r_article3_p_aggregator_numpy_infra_repair_v0_1_workflow_freeze.md
          SELF_COMMIT="$(git log -1 --format=%H -- .github/workflows/exp073x2r-article3-p-aggregator-numpy-infra-repair-v0-1.yml)"
          grep -F "workflow_last_modifying_commit: \`${SELF_COMMIT}\`" experiments/073x2r_article3_p_aggregator_numpy_infra_repair_v0_1_workflow_freeze.md
          if test "${GITHUB_EVENT_NAME}" = push; then
            test "$(git diff --name-only HEAD^ HEAD)" = 'ci/exp073x2r_article3_p_aggregator_numpy_infra_repair_v0_1.trigger'
          fi

      - name: Install only missing aggregator runtime
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'numpy==2.1.3'
          python3 - <<'PY'
          import numpy as np
          assert np.__version__ == '2.1.3'
          print('NUMPY_RUNTIME_REPAIR_OK', np.__version__)
          PY

      - name: Verify immutable primary replica artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
              'https://api.github.com/repos/pppuu7-cmd/Dark-Sector-Influence-Reconstruction/actions/runs/33300997298/artifacts?per_page=100',
              headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json'}
          )
          with urllib.request.urlopen(req) as r:
              d=json.load(r)
          by_id={int(a['id']):a for a in d['artifacts']}
          expected={
            9730411514:('exp073x2-replica-A-2403d9680e1d08a3853084034eb2878faa52b4e0','sha256:34530157cddf594c93728d5e092ab937d16a653665623f00513f4fd58df17555'),
            9730409129:('exp073x2-replica-B-2403d9680e1d08a3853084034eb2878faa52b4e0','sha256:36358663fb1980ad75cb71f7ca7149d06d357cf7de8b29feca4273f4f88c89e5'),
          }
          for aid,(name,digest) in expected.items():
              a=by_id.get(aid)
              assert a is not None, aid
              assert a['name']==name, (aid,a['name'])
              assert a.get('digest')==digest, (aid,a.get('digest'))
              assert a['expired'] is False
              assert int(a['workflow_run']['id'])==33300997298
              assert a['workflow_run']['head_sha']=='2403d9680e1d08a3853084034eb2878faa52b4e0'
          print('PRIMARY_REPLICA_ARTIFACT_METADATA_BOUND')
          PY

      - uses: actions/download-artifact@v4
        with:
          name: exp073x2-replica-A-2403d9680e1d08a3853084034eb2878faa52b4e0
          path: external/replica-a
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33300997298
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: exp073x2-replica-B-2403d9680e1d08a3853084034eb2878faa52b4e0
          path: external/replica-b
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33300997298
          github-token: ${{ github.token }}

      - name: Execute unchanged frozen comparator once
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data/derived/g7
          python3 ci/exp073x2_compare_replicas_v0_1.py \
            --replica-a-root external/replica-a \
            --replica-b-root external/replica-b \
            --output-json data/derived/g7/exp073x2r_primary_repaired_repeatability_authority_v0_1.json

      - name: Enforce non-classifying accounting
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp073x2r_primary_repaired_repeatability_authority_v0_1.json'
          d=json.load(open(p))
          assert d['status']=='PASS_EXP073X2_DES_N4096_WM0_MASK_ONLY_REPEATABILITY_V0_1'
          assert d['record_type']=='REAL_DES_N4096_MASK_ONLY_WM0_ANGULAR_OPERATOR_REPEATABILITY_AUTHORITY_NONCLASSIFYING'
          assert d['repeatability']=={'canonical_sha256_identical':True,'array_equal':True}
          assert d['frozen_metadata_identical'] is True
          assert d['te_window_shape']==[39,12288]
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          assert d['article3_scientific_readiness_percent']==52
          assert d['readiness_increment_from_x2']==0
          assert d['science_gate_scored'] is False
          assert d['scientific_pass_claimed'] is False
          assert d['physical_support_evaluated'] is False
          assert d['covariance_read'] is False
          assert d['G8_read'] is False
          print('EXP073X2R_PRIMARY_NONCLASSIFYING_AUTHORITY_PASS', d['canonical_te_window_sha256'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp073x2r-primary-repaired-repeatability-${{ github.sha }}
          path: data/derived/g7/exp073x2r_primary_repaired_repeatability_authority_v0_1.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
