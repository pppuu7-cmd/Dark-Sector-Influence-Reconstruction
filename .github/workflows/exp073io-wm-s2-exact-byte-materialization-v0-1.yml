name: exp073io-wm-s2-exact-byte-materialization-v0-1

on:
  push:
    branches: [main]
    paths:
      - 'ci/exp073io_wm_s2_exact_materializer_v0_1.py'
      - 'docs/dsir4/authority/EXP073IO_C2_WM_S2_BYTE_MATERIALIZATION_REPAIR_V0_1.md'
      - '.github/workflows/exp073io-wm-s2-exact-byte-materialization-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_CORETYPE: Nehalem
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      SOURCE_ARTIFACT_ID: '9841348367'
      SOURCE_ARTIFACT_DIGEST: d6703819745b22eadc9c6557c4d89d926ed9675c09bd41cb19e79d4050ef399b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3'
      - name: Download and verify frozen compact lane A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/compact
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > inputs/compact.zip
          actual="$(sha256sum inputs/compact.zip | awk '{print $1}')"
          test "$actual" = "$SOURCE_ARTIFACT_DIGEST" || { echo "source artifact digest mismatch: $actual"; exit 31; }
          unzip -q inputs/compact.zip -d inputs/compact
      - name: Materialize exact pre-existing Wm_S2 logical authority
        run: |
          mkdir -p artifacts
          python ci/exp073io_wm_s2_exact_materializer_v0_1.py \
            --compact-root inputs/compact \
            --out-npy artifacts/wm_s2_te_window_exp073io_v0_1.npy \
            --out-json artifacts/exp073io_wm_s2_exact_materialization_v0_1.json
      - name: Assert exact PASS and canonical W hash
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PASS_EXP073IO_C2_WM_S2_EXACT_BYTE_MATERIALIZATION_V0_1' artifacts/exp073io_wm_s2_exact_materialization_v0_1.json
          grep -q '96248e7699a5a12945854db2c9af150affcfe13f4f9dc0bfcbb87b99f92ff087' artifacts/exp073io_wm_s2_exact_materialization_v0_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp073io-wm-s2-exact-byte-materialization-v0-1
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
