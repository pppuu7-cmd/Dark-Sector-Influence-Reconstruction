name: layerb-post-16385-top64-role-cancellation-static-audit-v0-1
on:
  push:
    paths:
      - '.github/workflows/layerb-post-16385-top64-role-cancellation-static-audit-v0-1.yml'
permissions:
  contents: read
  actions: read
jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Audit prospectively frozen top-64 helper without scientific execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_post_16385_top64_role_cancellation_census_v0_1.py)" = '92f35f0f563fe5c5ba54b3984ae9a82e2abaf8e7'
          test "$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_TOP64_ROLE_CANCELLATION_CENSUS_V0_1.md)" = '940a09d194fe9e68e6fc14271e7ab99b6aded3e4'
          test "$(git hash-object docs/dsir4/authority/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_TERMINAL_AUTHORITY_V0_1.json)" = '506b93566d06b76db609ac9c3f227ed77c28a747'
          python -m py_compile ci/layerb_post_16385_top64_role_cancellation_census_v0_1.py
          mkdir -p artifacts
          python - <<'PY'
          import ast,json
          from pathlib import Path
          p=Path('ci/layerb_post_16385_top64_role_cancellation_census_v0_1.py')
          s=p.read_text(); tree=ast.parse(s)
          checks={}
          checks['h_frozen']='H=1e-4' in s
          checks['lookup_frozen']='LOOKUP_TOL=1e-12' in s
          checks['source_441']="s.get('shared_call_count')==441" in s
          checks['source_377']="s.get('des_call_count')==377" in s
          checks['source_64_boss']="s.get('boss_gl64_call_count')==64" in s
          checks['top64_exact']="if len(top)!=64" in s and "source_result.top_64_response_atoms" in s
          checks['eight_constructions']="{'constructions':8,'live':0,'max_live':1}" in s
          checks['four_roles']="('reference',0.0,0.0)" in s and "('alpha_minus',-H,0.0)" in s and "('beta_plus',0.0,H)" in s and "('beta_minus',0.0,-H)" in s
          checks['binary64_roundtrip']='binary64 roundtrip' in s and 'float.fromhex' in s
          checks['repro_tol']='rr>1e-12' in s
          checks['no_alt_h']="'alternative_h_evaluated':False" in s
          checks['no_107_replay']="'scientific_107_row_replay_executed':False" in s
          checks['no_science_classification']="'scientific_classification_created':False" in s
          checks['no_science_authority']="'scientific_authority_created':False" in s
          checks['no_next_rung']="'next_rung_authorized':False" in s
          checks['no_covariance']="'covariance_restriction_authorized':False" in s
          checks['no_wms3']="'Wm_S3_opened':False" in s
          checks['fixed_source_run']="source_hotspot_run_id':34592951737" in s
          checks['fixed_source_sha']='4023403aaae03481507f778ce4a85c119160cebd785c9c91a534260783049394' in s
          checks['canonical_8193_sha']='90b9aee9e01784a4af89ab0aa1bd5cbf1e95061f2d412d7a0e1b8ee5332ba7d6' in s
          checks['canonical_16385_sha']='7e8f13abe29617bc0d331f07143e6680f50512e2f3811e017bbc74ea847dff69' in s
          checks['descriptive_spearman']='spearman_log10_min_cancellation_scale_vs_log10_primary_response_discrepancy' in s
          checks['fail_closed']= all(x in s for x in ('INVALID_INFRA_PLUS_0_PLUS_0','try:r=execute(a)','except Exception as e'))
          checks['no_result_file_literal']='10268078468' not in s and '10268761538' not in s
          assert all(checks.values()),{k:v for k,v in checks.items() if not v}
          out={'schema':'LAYERB_POST_16385_TOP64_ROLE_CANCELLATION_STATIC_AUDIT_V0_1','classification':'POST_16385_TOP64_ROLE_CANCELLATION_STATIC_AUDIT_PASS_PLUS_0_PLUS_0','effect':'+0/+0','check_count':len(checks),'pass_count':sum(checks.values()),'checks':checks,'class_solver_invoked':False,'scientific_response_read':False,'top64_role_result_read':False,'execution_authorized':False,'scientific_authority_created':False,'next_rung_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          Path('artifacts/static.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['classification'],out['pass_count'],out['check_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-top64-role-cancellation-static-audit-v0-1
          path: artifacts/static.json
          if-no-files-found: error
          retention-days: 90
