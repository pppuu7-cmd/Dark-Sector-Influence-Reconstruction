name: dsir-v026-r1-first-attempt-failure-funnel-runtime-binding-audit-v0-2

on:
  push:
    branches:
      - audit/v026-r1-failure-funnel-runtime-binding-v02
    paths:
      - '.github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-2.yml'
      - '.github/workflows/dsir-v026-r1-first-attempt-failure-funnel-runtime-binding-audit-v0-2.yml'
      - 'ci/dsir_v026_r1_sentinel_first_attempt_failure_funnel_runtime_binding_audit_v0_2.py'
      - 'docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_HOSTED_EXECUTION_AUTHORITY_V0_2.json'
      - 'docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_HOSTED_EXECUTION_AUTHORITY_REVIEW_CONFIRMATION_V0_2.json'

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-2.yml
  CANDIDATE_WORKFLOW_BLOB: 670a771e1d2e2854c33d71cc1c37ea6beea85566
  AUTHORITY_PATH: docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_HOSTED_EXECUTION_AUTHORITY_V0_2.json
  AUTHORITY_BLOB: 47788695c3ab7050099ed44cacbb6f507cbbf03d
  REVIEW_PATH: docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_HOSTED_EXECUTION_AUTHORITY_REVIEW_CONFIRMATION_V0_2.json
  REVIEW_BLOB: f8824d107a7fbfb260e5c5946a9d05f71131c94b
  AUDITOR: ci/dsir_v026_r1_sentinel_first_attempt_failure_funnel_runtime_binding_audit_v0_2.py
  AUDITOR_BLOB: 66f4c9352c8efa0732d625689c4ba582535dfb73
  GH_TOKEN: ${{ github.token }}

jobs:
  runtime-binding-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact candidate identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/audit/v026-r1-failure-funnel-runtime-binding-v02"
          test "$(git hash-object "$CANDIDATE_WORKFLOW_PATH")" = "$CANDIDATE_WORKFLOW_BLOB"
          test "$(git hash-object "$AUTHORITY_PATH")" = "$AUTHORITY_BLOB"
          test "$(git hash-object "$REVIEW_PATH")" = "$REVIEW_BLOB"
          test "$(git hash-object "$AUDITOR")" = "$AUDITOR_BLOB"

      - name: Capture zero dispatch history for corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          path=os.environ['CANDIDATE_WORKFLOW_PATH']
          runs=[]
          url=f'https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=100'
          while url:
              req=urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as r:
                  page=json.load(r)
                  runs.extend(page.get('workflow_runs', []))
                  link=r.headers.get('Link','')
              next_url=None
              for part in link.split(','):
                  if 'rel="next"' in part:
                      next_url=part.split(';',1)[0].strip()[1:-1]
              url=next_url
          exact=[x for x in runs if x.get('path')==path]
          json.dump({'total_count':len(exact),'workflow_runs':exact}, open('safe/candidate_live_runs.json','w'), indent=2, sort_keys=True)
          PY

      - name: Execute independent runtime binding audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$AUDITOR"
          python3 "$AUDITOR" \
            --candidate-live-runs-json safe/candidate_live_runs.json \
            --out safe/runtime_binding_audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/runtime_binding_audit.json'))
          assert d['verdict']=='QUALIFIED'
          assert d['classification']=='HOSTED_FAILURE_FUNNEL_V0_2_RUNTIME_BINDING_CORRECTIONS_INDEPENDENTLY_CONFIRMED'
          assert d['candidate_dispatch_run_count']==0
          assert d['authorized_ref_runtime_enforced'] is True
          assert d['independent_review_runtime_bound'] is True
          assert d['failure_funnel_executed_during_audit'] is False
          assert d['promotion_authorized_by_this_receipt'] is False
          assert d['failure_funnel_dispatch_authorized_by_this_receipt'] is False
          assert d['full_107_row_execution_authorized'] is False
          PY
          sha256sum safe/runtime_binding_audit.json > safe/runtime_binding_audit.sha256

      - name: Persist immutable runtime binding audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-first-attempt-failure-funnel-runtime-binding-audit-v0-2
          path: |
            safe/runtime_binding_audit.json
            safe/runtime_binding_audit.sha256
            safe/candidate_live_runs.json
          if-no-files-found: error
          retention-days: 90
