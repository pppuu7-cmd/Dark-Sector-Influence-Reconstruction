name: DSIR core G-T-tau additive projection v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-G-T-tau-additive-projection-v0-1.yml'
      - 'ci/core_G_T_tau_additive_projection_v0_1.py'
      - 'experiments/044_chat_audit_buyanovgpt_hair_hypothesis_v0_1.md'
      - 'experiments/045a_core_G_T_tau_additive_projection_v0_1.md'
      - 'data/derived/comparison_readiness/local_response_tangents_v0_1.json'
      - 'docs/**'

permissions:
  contents: read

jobs:
  core-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run frozen additive projection
        run: |
          python ci/core_G_T_tau_additive_projection_v0_1.py \
            --input data/derived/comparison_readiness/local_response_tangents_v0_1.json \
            --json experiment_045a_core_G_T_tau_additive_projection_v0_1.json
      - name: Upload Experiment 045A result
        uses: actions/upload-artifact@v4
        with:
          name: core-G-T-tau-additive-projection-v0-1-${{ github.sha }}
          path: experiment_045a_core_G_T_tau_additive_projection_v0_1.json
          if-no-files-found: error
