name: Exp073CS Exp073BU component blob binding v0.1

on:
  push:
    paths:
      - 'activation/exp073cs_v0_1.activate'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact executable blob bindings and frozen fresh-PCL semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee exp073cs_binding_receipt.json
          import json, pathlib, subprocess
          pairs={
            'ci/exp073bu_fresh_wm_s3_pcl_v0_1.py':'73ef04c479547dc8e2e89c9f511f1a55fae3ed64',
            'ci/exp073bx_full_mcm_stock_order_v0_1.py':'ae0282cbbcdd298f00765d8de68545fe214cec0e',
            'ci/exp073ca_stock_write_fits_to_mmap_exact_chain_v0_1.py':'d3c2e3a2ec42ddcb5811447499d80a4a1cfa3132',
            'ci/exp073cc_verify_fits_memmap_backing_v0_1.py':'88d17ad76cabc1651df6b6035d897e9f42853ca5',
            'ci/exp073by_mmap_full_mcm_downstream_v0_1.py':'a22d14ad9ae7e81ba6dd35c61b9ab35a05617d76',
            'ci/exp073cr_wm_s3_ll3_sharded_resource_v0_1.py':'934c339bb01dd7f541e9191129bcdc8b3a7ad772',
            'ci/test_dsir_checkpoint_git_sync_v0_2.sh':'39e90b4c1986f1972d43e9dce7b74f0082c39559',
          }
          observed={}
          ok=True
          for path,expected in pairs.items():
            p=pathlib.Path(path)
            if not p.is_file(): observed[path]={'expected':expected,'observed':None}; ok=False; continue
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            observed[path]={'expected':expected,'observed':actual}
            ok &= actual==expected
          fresh=pathlib.Path('ci/exp073bu_fresh_wm_s3_pcl_v0_1.py').read_text('utf-8')
          required=[
            'NSIDE = 4096','LMAX = 3 * NSIDE - 1',
            "S3_RECORD_SHA256 = '3996f2bacf29d46278773530058d4f5666c0d590bf6cebc06459659166bc60ec'",
            "S3_OCCUPANCY_SHA256 = '21e3776111de305c108463b02b0e3fd5e138cc97817d37e7b05330132d058094'",
            "LENS_SHA256 = 'a519b8522f899e4c33267bb0749f9734f8b7fa760d195636456d370f809a3d55'",
            'COUPLING_SIGNATURE = [0, 2, 0, 2]',
            "SELECTED_SEMANTICS = {'output': 'TE', 'input': 'TE'}",
          ]
          semantics={x:(x in fresh) for x in required}
          ok &= all(semantics.values())
          token='B1_EXP073BU_COMPONENT_BLOB_BINDING_PASS' if ok else 'B2_COMPONENT_BINDING_FAIL'
          print(json.dumps({'token':token,'head_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'bindings':observed,'fresh_pcl_semantics':semantics,'accounting':'+0/+0',
            'wm_s3_authority_created':False,'exp073bu_activated':False},sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
          grep -F 'B1_EXP073BU_COMPONENT_BLOB_BINDING_PASS' exp073cs_binding_receipt.json
          grep -F '"wm_s3_authority_created": false' exp073cs_binding_receipt.json
          grep -F '"exp073bu_activated": false' exp073cs_binding_receipt.json
      - name: Upload binding receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073cs-v0-1-binding-receipt
          path: exp073cs_binding_receipt.json
          if-no-files-found: warn
