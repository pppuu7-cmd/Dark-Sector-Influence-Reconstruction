name: Exp073DX WW cross-field MCM storage orientation audit v0.1
on:
  push:
    paths:
      - 'docs/RESEARCH_LOG_EXP073DX_2026-09-05.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-diagnostic:
    runs-on: ubuntu-24.04
    env:
      PREREG_BLOB: 6a0a8b8fd73eecd0ab9d01cdca5cdfb548d8a5a0
      SCRIPT_BLOB: cbca557b13a9e4753b80c1fff8e99598ff412d8d
    steps:
      - uses: actions/checkout@v4
      - name: Freeze diagnostic identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073dx_ww_crossfield_mcm_storage_orientation_audit_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073dx_ww_crossfield_mcm_storage_orientation_audit_v0_1.py)" = "$SCRIPT_BLOB"
      - name: Install NaMaster 2.7 diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 astropy
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "$GITHUB_ENV"
      - name: Run observational storage/orientation audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/exp073dx/v0_1
          "${NMT_PY}" ci/exp073dx_ww_crossfield_mcm_storage_orientation_audit_v0_1.py --out data/derived/exp073dx/v0_1/diagnostic.json --source-head "${GITHUB_SHA}" | tee data/derived/exp073dx/v0_1/stdout.txt
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073dx-ww-crossfield-mcm-storage-orientation-v0-1-${{ github.sha }}
          path: data/derived/exp073dx/v0_1/
          if-no-files-found: error
