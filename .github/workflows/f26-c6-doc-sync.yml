name: One-shot F26 C6 recovery sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/f26_c6_doc_sync.py'
      - '.github/workflows/f26-c6-doc-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Append F26/C6 records
        run: python3 ci/f26_c6_doc_sync.py
      - name: Commit synchronized documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/
          if git diff --cached --quiet; then
            echo 'No documentation changes needed.'
          else
            git commit -m 'F26: sync C6 recovery status gates readiness atlas'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
