name: One-shot Exp050A document sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/exp050a_doc_sync.py'
      - '.github/workflows/exp050a-doc-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Prepare chronology target
        run: |
          mkdir -p docs
          touch docs/RESEARCH_LOG_2026-08-26_EXP050A.md
      - name: Append idempotent Exp050A records
        run: python3 ci/exp050a_doc_sync.py
      - name: Commit synchronized documentation to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/
          if git diff --cached --quiet; then
            echo 'No documentation changes needed.'
          else
            git commit -m 'Exp050A: sync recovery status gates findings atlas'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
