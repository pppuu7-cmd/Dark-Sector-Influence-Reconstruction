name: layerb-post-16385-top1-role-cancellation-chain-static-audit-v0-1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-post-16385-top1-role-cancellation-chain-static-audit-v0-1.yml'
      - '.github/workflows/layerb-post-16385-top1-role-cancellation-chain-v0-1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit chain without reading hotspot result or invoking CLASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git hash-object .github/workflows/layerb-post-16385-top1-role-cancellation-chain-v0-1.yml)" = '8397a83527de93d53ec4077e04f998ff4bb1a537'
          test "$(git hash-object ci/layerb_post_16385_top1_role_cancellation_decomposition_v0_1.py)" = '76624d9a4b59d6e1ead02e22ead774135a799bbc'
          test "$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_DECOMPOSITION_V0_1.md)" = 'a75eccff06c410646c5a813f288a6cf78cb11577'
          test "$(git hash-object docs/dsir4/authority/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_STATIC_AUDIT_V0_2.json)" = '84cbcbf28aafd4b1cd65a07a4b69e3d422e31329'
          python3 -m py_compile ci/layerb_post_16385_top1_role_cancellation_decomposition_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/workflows/layerb-post-16385-top1-role-cancellation-chain-v0-1.yml').read_text()
          checks={
            'workflow_run_trigger':"workflows: ['layerb-post-16385-exact-hotspot-terminal-consumer-v0-1']" in p,
            'success_gate':"github.event.workflow_run.conclusion == 'success'" in p,
            'fixed_source_run':'run-id: 34592951737' in p,
            'fixed_checkout':'ref: 029db882c1d4162734c83f6086e413df84920877' in p,
            'source_artifact':'layerb-post-16385-exact-response-atom-hotspot-v0-1' in p,
            'validation_artifact':'layerb-post-16385-exact-hotspot-terminal-consumer-v0-1' in p,
            'source_pass':'POST_16385_EXACT_RESPONSE_ATOM_HOTSPOT_LOCALIZATION_PASS_PLUS_0_PLUS_0' in p,
            'validator_pass':'POST_16385_EXACT_HOTSPOT_TERMINAL_VALIDATION_PASS_PLUS_0_PLUS_0' in p,
            'exact_441':"s['shared_call_count']==441" in p,
            'exact_377':"s['des_call_count']==377" in p,
            'exact_64':"s['boss_gl64_call_count']==64" in p,
            'plateau':'0.012484060640679777' in p,
            'repro_tol':'<=1e-12' in p,
            'helper_invocation':'layerb_post_16385_top1_role_cancellation_decomposition_v0_1.py' in p,
            'no_manual_hotspot':'top_64_response_atoms[0]' in p,
            'capacity_18432':'18432' in p,
            'parser_524288':'524288' in p,
            'class_commit':'ac627d54e9ce196a08878d1ba33999819925d19c' in p,
            'no_workflow_dispatch':'workflow_dispatch' not in p,
          }
          a=json.load(open('docs/dsir4/authority/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_STATIC_AUDIT_V0_2.json'))
          checks['prior_helper_static_authority']=a['artifact_verified_independently'] is True and a['pass_count']==a['check_count']==18 and a['execution_authorized'] is False
          ok=all(checks.values())
          out={'schema':'LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_CHAIN_STATIC_AUDIT_V0_1','classification':'POST_16385_TOP1_ROLE_CANCELLATION_CHAIN_STATIC_AUDIT_PASS_PLUS_0_PLUS_0' if ok else 'POST_16385_TOP1_ROLE_CANCELLATION_CHAIN_STATIC_AUDIT_FAIL_PLUS_0_PLUS_0','effect':'+0/+0','checks':checks,'pass_count':sum(checks.values()),'check_count':len(checks),'class_solver_invoked':False,'hotspot_result_read':False,'terminal_validation_result_read':False,'execution_authorized':False,'scientific_authority_created':False,'next_rung_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          Path('artifacts/static.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['classification'],f"{out['pass_count']}/{out['check_count']}")
          assert ok,out
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-top1-role-cancellation-chain-static-audit-v0-1
          path: artifacts/static.json
          if-no-files-found: error
          retention-days: 90
