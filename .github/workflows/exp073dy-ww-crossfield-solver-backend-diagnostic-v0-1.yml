name: Exp073DY WW cross-field solver backend diagnostic v0.1
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/RESEARCH_LOG_EXP073DY_2026-09-05.md'
permissions:
  contents: read
jobs:
  hosted-diagnostic:
    runs-on: ubuntu-24.04
    env:
      PREREG_BLOB: 7e23a1daf217c50d4506594c9b5b754350ae19fb
      SCRIPT_BLOB: 25a196f298d5d030a0d303162e780e1d50936157
      ADAPTER_BLOB: d6f20600d6a206dd9fbb254b382e71a49c6b3c07
      SHARED_ADAPTER_BLOB: dafe86086a470c852106f0d4ecccbda1d389e397
      DOWNSTREAM_BLOB: be4f381de4c5c043a9c0fcd107e63ef3f2079578
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Freeze diagnostic identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073dy_ww_crossfield_solver_backend_diagnostic_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073dy_ww_crossfield_solver_backend_diagnostic_v0_1.py)" = "$SCRIPT_BLOB"
          test "$(git hash-object ci/exp073do_ww_s0_s0_production_exact_adapter_v0_1.py)" = "$ADAPTER_BLOB"
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py)" = "$SHARED_ADAPTER_BLOB"
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c)" = "$DOWNSTREAM_BLOB"
      - name: Install NaMaster 2.7 and compiler lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "$GITHUB_ENV"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "$GITHUB_ENV"
      - name: Compile frozen GSL comparator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/exp073dy-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -fopenmp -DDSIR_WORKERS=2 -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073dy-bin/mmap_full_mcm"
          echo "MMAP_EMULATOR=${RUNNER_TEMP}/exp073dy-bin/mmap_full_mcm" >> "$GITHUB_ENV"
      - name: Run frozen solver-backend diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT=data/derived/exp073dy/v0_1; mkdir -p "$OUT"
          "${NMT_PY}" ci/exp073dy_ww_crossfield_solver_backend_diagnostic_v0_1.py --emulator "${MMAP_EMULATOR}" --out-dir "$OUT/runtime" --source-head "${GITHUB_SHA}" --contract-fingerprint "$PREREG_BLOB" | tee "$OUT/stdout.txt"
          cp "$OUT/runtime/diagnostic.json" "$OUT/diagnostic.json"
      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073dy-ww-crossfield-solver-backend-v0-1-${{ github.sha }}
          path: data/derived/exp073dy/v0_1/
          if-no-files-found: error
