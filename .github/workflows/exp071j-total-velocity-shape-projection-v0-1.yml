name: Exp071J total-velocity shape projection v0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/exp071j_total_velocity_shape_projection.trigger'

permissions:
  contents: read
  actions: read

jobs:
  velocity-shape-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PARENT_RUN: '33181895623'
      PARENT_ID: '9690064470'
      PARENT_NAME: exp071i-k2-gdm-total-velocity-49996b5053b6b15428a2ff936efb4fd21fac266c
      PARENT_DIGEST: sha256:ba41e25e6bcdfd2c23c4c9c8bc48bf9ddd85d7776a2e5bb7976e2e061d531e14
    steps:
      - uses: actions/checkout@v4
      - name: Install evaluator runtime
        run: |
          set -euxo pipefail
          python3 -m pip install --user numpy
          python3 -m py_compile ci/k2_gdm_total_velocity_direction_control_v0_1.py ci/exp071j_total_velocity_shape_projection_v0_1.py
      - name: Bind immutable Exp071I artifact
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['PARENT_RUN']
          d=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'],text=True))
          m=[x for x in d['artifacts'] if x['name']==os.environ['PARENT_NAME']]
          assert len(m)==1
          x=m[0]
          assert str(x['id'])==os.environ['PARENT_ID']
          assert x['digest']==os.environ['PARENT_DIGEST']
          assert x['expired'] is False
          print('BOUND_EXP071I',x['id'],x['digest'])
          PY
      - name: Download immutable Exp071I artifact
        uses: actions/download-artifact@v4
        with:
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33181895623
          name: exp071i-k2-gdm-total-velocity-49996b5053b6b15428a2ff936efb4fd21fac266c
          path: inputs/exp071i
      - name: Execute frozen Exp071J projection
        run: |
          set -euxo pipefail
          python3 ci/exp071j_total_velocity_shape_projection_v0_1.py --artifact-root inputs/exp071i --json exp071j_total_velocity_shape_projection_v0_1.json
      - name: Assert preregistered semantics
        run: |
          python3 - <<'PY'
          import json,math
          d=json.load(open('exp071j_total_velocity_shape_projection_v0_1.json'))
          assert d['experiment']=='Exp071J'
          assert d['status']=='COMPLETE_EXP071J'
          assert d['threshold_deg']==45.0
          assert d['classification'] in {'K2_VELOCITY_SHAPE_SEPARATED_FROM_BOTH_GDM_AXES_EXP071J','K2_VELOCITY_SHAPE_OVERLAPS_AT_LEAST_ONE_GDM_AXIS_EXP071J'}
          a=d['primary_angles_deg']; assert d['primary_pass'] is all(v>=45.0 for v in a.values())
          assert all(v>1e-12 for v in d['retained_shape_norm_fraction'].values())
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP071J',d['classification']); print('PRIMARY',a); print('RETAINED',d['retained_shape_norm_fraction']); print('K2_DRIFT',d['robustness_nonclassifying']['max_K2_shape_angle_to_bar1_deg'])
          PY
      - name: Record provenance
        if: always()
        run: |
          {
            echo 'Exp071J prereg commit: 306c19a4286ffc459fc2886097a8b70fa6df89e9'
            echo 'Primary projection: per-redshift equal-weight subtraction of constant-in-k response mode.'
            echo '45-degree separator inherited unchanged.'
            echo 'No new solver run; immutable Exp071I artifact only.'
            echo 'G7/G8/G9 remain OPEN.'
            echo "DSIR head: ${GITHUB_SHA}"
          } > exp071j_environment.txt
      - name: Upload Exp071J result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp071j-velocity-shape-${{ github.sha }}
          path: |
            exp071j_total_velocity_shape_projection_v0_1.json
            exp071j_environment.txt
          if-no-files-found: warn
          retention-days: 90
