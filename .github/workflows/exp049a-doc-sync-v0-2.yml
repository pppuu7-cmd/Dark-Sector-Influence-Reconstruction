name: One-shot Exp049A F22 documentation sync

on:
  push:
    branches: [research/physical-transition-scale-bridge-v0-2]
    paths:
      - '.github/workflows/exp049a-doc-sync-v0-2.yml'
      - 'ci/exp049a_doc_sync_v0_2.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/physical-transition-scale-bridge-v0-2
          fetch-depth: 0
      - name: Append idempotent F22 recovery records
        run: python3 ci/exp049a_doc_sync_v0_2.py
      - name: Commit synchronized documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SCIENTIFIC_FINDINGS_REGISTER.md docs/RECOVERY_LATEST.md docs/RECOVERY_MANUAL.md docs/STATUS.md docs/GATES.md
          if git diff --cached --quiet; then
            echo 'No documentation changes needed.'
          else
            git commit -m 'docs: synchronize Exp049A F22 recovery records [skip ci]'
            git push origin HEAD:research/physical-transition-scale-bridge-v0-2
          fi
