name: Exp073CR v0.3 Wm_S3 ll3-sharded resource

on:
  push:
    branches: [main]
    paths:
      - 'ci/exp073cr_v0_3_home.activation.json'

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      seed_head: ${{ steps.auth.outputs.seed_head }}
      seed_fingerprint: ${{ steps.auth.outputs.seed_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: auth
        name: Fail-closed v0.3 hosted authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          a=json.load(open('ci/exp073cr_v0_3_home.activation.json'))
          assert a['experiment']=='Exp073CR' and a['version']=='v0.3'
          assert a['hosted_audit_token']=='PASS_EXP073CR_V0_3_HOSTED_SEED_STATIC_BITWISE_AUDIT'
          assert a['control_repair_token']=='PASS_EXP073CR_V0_3_R3_AFFINITY_CPU_CONTROL_AUDIT'
          assert a['home_bind_diagnostic_token']=='PASS_EXP073CR_V0_3_R2_HOME_BIND_DIAGNOSTIC'
          assert a['candidate_sha256']=='d48e46197b48a6fcdf7d3eb3b0817973a2eadb25bbb617e7b8060c8c17209462'
          assert a['queue_sha256']=='3ba315d9bc24883ef746d92e785e0a040f9b13e751f59dda9a93e825a6390db4'
          assert a['checkpoint_namespace']=='checkpoints/exp073cr-wm-s3-ll3-sharded-resource-v0-3'
          assert re.fullmatch(r'[0-9a-f]{40}',a['seed_head'])
          assert re.fullmatch(r'[0-9a-f]{64}',a['seed_fingerprint'])
          print('seed_head='+a['seed_head'])
          print('seed_fingerprint='+a['seed_fingerprint'])
          PY
          echo PASS_EXP073CR_V0_3_R3_HOSTED_AUDIT_AUTHORIZATION

  checkpointed-resource:
    needs: authorize
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      PYTHONUNBUFFERED: '1'
      DSIR_CHECKPOINT_QUERY_ATTEMPTS: '7'
      DSIR_CHECKPOINT_FETCH_ATTEMPTS: '7'
      DSIR_CHECKPOINT_PUSH_ATTEMPTS: '7'
      DSIR_CHECKPOINT_GIT_TIMEOUT_SECONDS: '120'
      SEED_HEAD: ${{ needs.authorize.outputs.seed_head }}
      SEED_FP: ${{ needs.authorize.outputs.seed_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind host CPU availability
        shell: bash
        run: |
          set -euo pipefail
          affinity_cpus="$(python3 - <<'PY'
          import os
          print(len(os.sched_getaffinity(0)) if hasattr(os,'sched_getaffinity') else (os.cpu_count() or 0))
          PY
          )"
          echo "home_affinity_cpus=$affinity_cpus"
          echo "omp_pinned_nproc=$(nproc)"
          test "$affinity_cpus" -ge "8"
      - name: Bind exact v0.3 lineage
        shell: bash
        run: |
          set -euo pipefail
          driver="$(git log -1 --format=%H -- ci/exp073cr_wm_s3_ll3_sharded_resource_v0_3.py)"
          workflow="$(git log -1 --format=%H -- .github/workflows/exp073cr-v0-3-wm-s3-ll3-sharded-resource.yml)"
          binding="$(git log -1 --format=%H -- experiments/073cr_wm_s3_ll3_sharded_binding_v0_3.json)"
          echo "DRIVER_COMMIT=$driver" >> "$GITHUB_ENV"
          echo "WORKFLOW_COMMIT=$workflow" >> "$GITHUB_ENV"
          echo "BINDING_COMMIT=$binding" >> "$GITHUB_ENV"
          echo "driver=$driver workflow=$workflow binding=$binding"
      - name: Compile bound v0.3 Python sources
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 -m py_compile ci/exp073cr_wm_s3_ll3_sharded_resource_v0_1.py ci/exp073cr_wm_s3_ll3_sharded_resource_v0_2.py ci/exp073cr_wm_s3_ll3_sharded_resource_v0_3.py
      - name: Run bound v0.3 source-order static audit
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/exp073cr_v0_3_static_audit.py | tee "$RUNNER_TEMP/exp073cr-v03-static.log"
          grep -Fx 'PASS_EXP073CR_V0_3_SOURCE_ORDER_STATIC_AUDIT' "$RUNNER_TEMP/exp073cr-v03-static.log"
      - name: Reuse or bootstrap NaMaster 2.7
        shell: bash
        run: |
          set -euo pipefail
          MF="$HOME/.cache/dsir-miniforge"; ENV="$HOME/.cache/dsir-nmt27"
          if ! test -x "$MF/bin/conda"; then
            mkdir -p "$HOME/.cache"
            curl -fL --retry 5 --retry-delay 2 https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o "$RUNNER_TEMP/miniforge.sh"
            bash "$RUNNER_TEMP/miniforge.sh" -b -p "$MF"
          fi
          if ! test -x "$ENV/bin/python"; then
            "$MF/bin/conda" create -y -p "$ENV" -c conda-forge python=3.11 namaster=2.7 numpy
          fi
          echo "NMT_PY=$ENV/bin/python" >> "$GITHUB_ENV"
      - name: Restore exact v0.3 hosted seed
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/exp073cr-v03"
          bash ci/dsir_checkpoint_git_sync_v0_3.sh restore "$R" checkpoints/exp073cr-wm-s3-ll3-sharded-resource-v0-3 "$SEED_HEAD"
          "$NMT_PY" ci/exp073cr_wm_s3_ll3_sharded_resource_v0_3.py validate-seed --root "$R"
          python3 - <<'PY'
          import json,os
          c=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'exp073cr-v03','contract.json')))
          assert c['fingerprint']==os.environ['SEED_FP']
          assert c['version']=='v0.3'
          assert c['checkpoint_namespace']=='checkpoints/exp073cr-wm-s3-ll3-sharded-resource-v0-3'
          PY
          echo "CR_ROOT=$R" >> "$GITHUB_ENV"
      - name: Compile exact helper and validate frozen geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          gcc -O2 -shared -fPIC -fopenmp -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize ci/exp073cr_stream_band_ll3_range_v0_1.c -o build/exp073cr.so -ldl -lm
          nm -D build/exp073cr.so | grep -F ' exp073cr_stream_compress_band_ll3_range_v0_1'
          "$NMT_PY" ci/exp073cr_wm_s3_ll3_sharded_resource_v0_3.py validate-geometry --candidate experiments/073cr_wm_s3_ll3_sharded_resource_candidate_v0_1.json --manifest experiments/073cr_wm_s3_ll3_sharded_heavy_first_manifest_v0_1.json
      - name: Compute 64 frozen shards with durability-before-refill
        shell: bash
        run: |
          set +e
          "$NMT_PY" ci/exp073cr_wm_s3_ll3_sharded_resource_v0_3.py compute --root "$CR_ROOT" --candidate experiments/073cr_wm_s3_ll3_sharded_resource_candidate_v0_1.json --manifest experiments/073cr_wm_s3_ll3_sharded_heavy_first_manifest_v0_1.json --helper build/exp073cr.so --branch checkpoints/exp073cr-wm-s3-ll3-sharded-resource-v0-3 --sync-script ci/dsir_checkpoint_git_sync_v0_3.sh
          rc=$?
          set -e
          echo "COMPUTE_RC=$rc" >> "$GITHUB_ENV"
          echo "compute_rc=$rc"
      - name: Frozen final resource classification
        shell: bash
        run: |
          set -euo pipefail
          if test "${COMPUTE_RC:-1}" != "0"; then
            echo "FINAL_RC=${COMPUTE_RC:-1}" >> "$GITHUB_ENV"
            exit 0
          fi
          set +e
          "$NMT_PY" ci/exp073cr_wm_s3_ll3_sharded_resource_v0_3.py finalize --root "$CR_ROOT" --candidate experiments/073cr_wm_s3_ll3_sharded_resource_candidate_v0_1.json --manifest experiments/073cr_wm_s3_ll3_sharded_heavy_first_manifest_v0_1.json
          rc=$?
          set -e
          bash ci/dsir_checkpoint_git_sync_v0_3.sh push "$CR_ROOT" checkpoints/exp073cr-wm-s3-ll3-sharded-resource-v0-3 frozen-final
          echo "FINAL_RC=$rc" >> "$GITHUB_ENV"
      - name: Prepare immutable authority artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/g7
          R="${CR_ROOT:-$RUNNER_TEMP/exp073cr-v03}"
          test ! -f "$R/contract.json" || cp "$R/contract.json" data/derived/g7/exp073cr_v0_3_contract.json
          test ! -f "$R/final/receipt.json" || cp "$R/final/receipt.json" data/derived/g7/exp073cr_v0_3_final_receipt.json
          test ! -f "$R/telemetry/final.json" || cp "$R/telemetry/final.json" data/derived/g7/exp073cr_v0_3_telemetry.json
          test ! -f "$R/diagnostics/first_failure.json" || cp "$R/diagnostics/first_failure.json" data/derived/g7/exp073cr_v0_3_diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073cr-v0-3-resource-${{ github.sha }}
          path: data/derived/g7/exp073cr_v0_3_*.json
          retention-days: 90
          compression-level: 0
      - name: Preserve frozen terminal exit code
        if: always()
        shell: bash
        run: |
          rc="${FINAL_RC:-${COMPUTE_RC:-1}}"
          exit "$rc"
