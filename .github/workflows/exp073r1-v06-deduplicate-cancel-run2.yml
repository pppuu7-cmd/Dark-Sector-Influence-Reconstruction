name: Exp073R1 v0.6 cancel non-authoritative queued runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073r1-v06-deduplicate-cancel-run2.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-non-authoritative:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded queued or running v0.6 attempts
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: '33212050260 33212040452 33212522053 33213021914'
        run: |
          set -euxo pipefail
          for run in ${RUNS}; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.status')"
            if [ "$state" = queued ] || [ "$state" = in_progress ] || [ "$state" = waiting ] || [ "$state" = pending ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/cancel"
            fi
            echo "run=${run} prior_state=${state}"
          done
