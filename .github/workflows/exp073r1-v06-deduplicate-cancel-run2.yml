name: Exp073R1 v0.6 deduplicate run2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073r1-v06-deduplicate-cancel-run2.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel duplicate queued run only
        env:
          GH_TOKEN: ${{ github.token }}
          DUP_RUN: '33212050260'
        run: |
          set -euxo pipefail
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DUP_RUN}" --jq '.status')"
          if [ "$state" = queued ] || [ "$state" = in_progress ] || [ "$state" = waiting ] || [ "$state" = pending ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${DUP_RUN}/cancel"
          fi
          echo "duplicate_run=${DUP_RUN} prior_state=${state}"
