name: Exp073IJ C2 WW Angular Authority Admission v0.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073ij-c2-ww-angular-authority-admission-v0-1.yml'
permissions:
  contents: read
  actions: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/DSIR4_ANGULAR_AUTHORITY_BINDING_CONTRACT_V0_1.md)" = 'af2cdbfa03e0a68c24df8d1009c723d411d2d0a2'
          test "$(git hash-object docs/dsir4/authority/C2_WW_ANGULAR_AUTHORITY_RECEIPT_V0_2.json)" = '5c381d6d212a8bc774338511c4dca6e13a4fdfae'
          test "$(git hash-object docs/dsir4/prereg/EXP073IJ_C2_WW_ANGULAR_AUTHORITY_ADMISSION_V0_1.md)" = '9abb37509dc275753aebe42a25d90df9ecb65e48'
      - name: Verify redirected-log transport regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/102147505217/logs" -o /tmp/ih.log
          grep -Fq 'PASS_EXP073IH_C2_G_DOMAIN_MAPPING_V0_1' /tmp/ih.log
          grep -Fq 'G_DOMAIN_MAPPING=PASS' /tmp/ih.log
          echo PASS_EXP073IJ_REDIRECTED_JOB_LOG_TRANSPORT_REGRESSION_V0_1
      - name: Verify all admitted pair authorities fail-closed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; tok=os.environ['GH_TOKEN']
          R=json.loads(Path('docs/dsir4/authority/C2_WW_ANGULAR_AUTHORITY_RECEIPT_V0_2.json').read_text())
          assert R['schema']=='C2_WW_ANGULAR_AUTHORITY_RECEIPT_V0_2'
          assert R['hypothesis_id']=='C2_IDE_LOCAL_TANGENT_CONE'
          assert R['angular_contract_blob']=='af2cdbfa03e0a68c24df8d1009c723d411d2d0a2'
          c=R['common']; assert c=={'semantics':'EE<-EE','dtype':'<f8','shape':[39,12288],'des_nside':4096,'ell_min':0,'ell_max':12287,'bands':39,'mcm_bytes':19327352832,'exact_equality_only':True}
          expected=['S0_S0','S0_S1','S0_S2','S0_S3','S1_S1','S1_S2','S1_S3','S2_S2','S2_S3','S3_S3']
          assert [x['pair'] for x in R['authorities']]==expected
          def api(url):
              q=urllib.request.Request(url, headers={'Authorization':f'Bearer {tok}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(q, timeout=60) as r: return r.read().decode('utf-8','replace')
          def joblog(job):
              return subprocess.check_output(['curl','-fsSL','-H',f'Authorization: Bearer {tok}','-H','Accept: application/vnd.github+json',f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs'],text=True,timeout=90)
          ih=joblog(102147505217)
          assert 'PASS_EXP073IH_C2_G_DOMAIN_MAPPING_V0_1' in ih and 'G_DOMAIN_MAPPING=PASS' in ih
          for a in R['authorities']:
              pair=a['pair']; low=pair.lower()
              assert a['relation']==('same_object' if pair.split('_')[0]==pair.split('_')[1] else 'ordered_distinct')
              assert len(a['head'])==40 and len(a['canonical_sha256'])==64
              run=json.loads(api(f"https://api.github.com/repos/{repo}/actions/runs/{a['run']}"))
              assert run['head_sha']==a['head']
              jobs=json.loads(api(f"https://api.github.com/repos/{repo}/actions/runs/{a['run']}/jobs?per_page=100"))['jobs']
              assert any(j['id']==a['job'] and j['status']=='completed' and j['conclusion']=='success' for j in jobs)
              log=joblog(a['job'])
              assert a['token'] in log
              assert 'SCIENTIFIC_AUTHORITY_ADMITTED' in log
              assert f"ww_{low}_authority_created" in log and 'true' in log.lower()
              assert a['canonical_sha256'] in log
              art=json.loads(api(f"https://api.github.com/repos/{repo}/actions/artifacts/{a['source_artifact']}"))
              assert art['id']==a['source_artifact'] and art['digest']==a['source_artifact_digest'] and not art['expired']
              assert a['source_artifact_digest'] in log or a['source_artifact_digest'].split(':',1)[1] in log
              print('BOUND',pair,a['run'],a['job'],a['source_artifact'],a['canonical_sha256'])
          print('PASS_EXP073IJ_C2_G_ANGULAR_AUTHORITY_V0_1')
          print('classification=SCIENTIFIC_GATE_PASS')
          print('G_DOMAIN_MAPPING=PASS')
          print('G_ANGULAR_AUTHORITY=PASS')
          print('angular_authority_receipt_created=true')
          print('scientific_model_authority_created=false')
          print('overall_status=NOT_YET_TESTABLE')
          PY
