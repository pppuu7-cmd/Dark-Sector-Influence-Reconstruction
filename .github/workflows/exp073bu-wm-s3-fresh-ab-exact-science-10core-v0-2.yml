name: Exp073BU Wm_S3 fresh A/B exact science 10-core v0.2

on:
  push:
    branches: [main]
    paths:
      - 'control/activate_exp073bu_wm_s3_science_10core_v0_2.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: exp073bu-wm-s3-home-science-10core-v0-2
  cancel-in-progress: false

env:
  ORIGINAL_PREREG_BLOB: '816542c7eb7a8ba4e72d6e01228aa62d05c7c805'
  TENCORE_PREREG_BLOB: '56bdbca1217b4213603734a96665dae33e3fc4c5'
  BASE_DRIVER_BLOB: '5c8d5d3463e455389a1ca3df2639bf06a3b7b603'
  TENCORE_DRIVER_BLOB: '08fba42876c1e3a42847a677473dfc8fb20ff592'
  TENCORE_ADAPTER_BLOB: 'c5cd7ae0113ec280e363e46850af33d841ff16f8'
  TENCORE_DOWNSTREAM_BLOB: 'be4f381de4c5c043a9c0fcd107e63ef3f2079578'
  TENCORE_LAUNCHER_BLOB: '77eb05659f2baebe1f72f93fb620dcc95d0249b6'
  HELPER_BLOB: '73ef04c479547dc8e2e89c9f511f1a55fae3ed64'
  BASE_ADAPTER_BLOB: 'dafe86086a470c852106f0d4ecccbda1d389e397'
  COMPONENT_BLOBS_BLOB: '0d6d6e882d1a4cf1ff79fbe8227a4f2b460c7e40'
  AUDIT_RECOVERY: 'recovery/2026-09-04_exp073bu_10core_v0_2_exact_equivalence_pass.md'
  ACTIVATION_CONTROL: 'control/activate_exp073bu_wm_s3_science_10core_v0_2.txt'

jobs:
  hosted-preflight:
    name: Hosted frozen 10-core activation preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_head: ${{ steps.freeze.outputs.source_head }}
      contract_fingerprint: ${{ steps.freeze.outputs.contract_fingerprint }}
      workflow_blob: ${{ steps.freeze.outputs.workflow_blob }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: freeze
        name: Bind exact 10-core implementation and source head
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep -Fxq "${ACTIVATION_CONTROL}"
          test "$(git hash-object experiments/073bu_article3_wm_s3_fresh_independent_ab_exact_repeatability_v0_1_prereg.md)" = "${ORIGINAL_PREREG_BLOB}"
          test "$(git hash-object experiments/073bu_wm_s3_fresh_ab_exact_repeatability_10core_v0_2_prereg.md)" = "${TENCORE_PREREG_BLOB}"
          test "$(git hash-object ci/exp073bu_wm_s3_fresh_ab_production_v0_1.py)" = "${BASE_DRIVER_BLOB}"
          test "$(git hash-object ci/exp073bu_wm_s3_fresh_ab_production_10core_v0_2.py)" = "${TENCORE_DRIVER_BLOB}"
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_omp10_v0_2.py)" = "${TENCORE_ADAPTER_BLOB}"
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c)" = "${TENCORE_DOWNSTREAM_BLOB}"
          test "$(git hash-object ci/exp073bu_wm_s3_science_launcher_10core_v0_2.py)" = "${TENCORE_LAUNCHER_BLOB}"
          test "$(git hash-object ci/exp073bu_fresh_wm_s3_pcl_v0_1.py)" = "${HELPER_BLOB}"
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py)" = "${BASE_ADAPTER_BLOB}"
          test "$(git hash-object ci/exp073cv_component_blobs_v0_1.json)" = "${COMPONENT_BLOBS_BLOB}"
          test -f "${AUDIT_RECOVERY}"
          grep -Fq 'PASS_EXP073BU_10CORE_EXACT_EQUIVALENCE_V0_2' "${AUDIT_RECOVERY}"
          workflow_blob="$(git hash-object .github/workflows/exp073bu-wm-s3-fresh-ab-exact-science-10core-v0-2.yml)"
          fp="$(printf '%s\n' "${GITHUB_SHA}" "${ORIGINAL_PREREG_BLOB}" "${TENCORE_PREREG_BLOB}" "${BASE_DRIVER_BLOB}" "${TENCORE_DRIVER_BLOB}" "${TENCORE_ADAPTER_BLOB}" "${TENCORE_DOWNSTREAM_BLOB}" "${TENCORE_LAUNCHER_BLOB}" "${workflow_blob}" | sha256sum | awk '{print $1}')"
          echo "source_head=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "contract_fingerprint=${fp}" >> "$GITHUB_OUTPUT"
          echo "workflow_blob=${workflow_blob}" >> "$GITHUB_OUTPUT"
          echo PASS_EXP073BU_10CORE_FROZEN_BINDING_V0_2

      - name: Fresh repository Actions noncompetition check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          other=[]
          for status in ('queued','in_progress'):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100',headers=h)
              with urllib.request.urlopen(q) as r: runs=json.load(r).get('workflow_runs',[])
              for x in runs:
                  if int(x['id'])!=current: other.append({'id':x['id'],'status':x['status'],'name':x.get('name')})
          if other: raise SystemExit('BLOCKED competing Actions runs: '+json.dumps(other,sort_keys=True))
          print('PASS_EXP073BU_10CORE_HOSTED_NONCOMPETITION')
          PY

  science-ab:
    name: Exp073BU science A then B 10-core
    needs: hosted-preflight
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '10'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      SOURCE_HEAD: ${{ needs.hosted-preflight.outputs.source_head }}
      CONTRACT_FP: ${{ needs.hosted-preflight.outputs.contract_fingerprint }}
      WORKFLOW_BLOB: ${{ needs.hosted-preflight.outputs.workflow_blob }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-bind source and require at least 10 CPUs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          cpus="$(python3 - <<'PY'
          import os
          print(len(os.sched_getaffinity(0)) if hasattr(os,'sched_getaffinity') else (os.cpu_count() or 0))
          PY
          )"
          echo "home_affinity_cpus=${cpus}"
          test "${cpus}" -ge 10
          root="$HOME/.cache/dsir/exp073bu-wm-s3-fresh-ab-10core-v0-2-${GITHUB_RUN_ID}"
          test ! -e "$root"
          mkdir -p "$root"
          echo "CHECKPOINT_ROOT=$root" >> "$GITHUB_ENV"

      - name: Install or reuse exact NaMaster 2.7 environment
        shell: bash
        run: |
          set -euo pipefail
          MF="$HOME/.cache/dsir-miniforge"
          ENV="$HOME/.cache/dsir-nmt27"
          if ! test -x "$MF/bin/conda"; then
            mkdir -p "$HOME/.cache/dsir"
            curl -fL --retry 5 --retry-delay 2 https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o "$RUNNER_TEMP/miniforge.sh"
            bash "$RUNNER_TEMP/miniforge.sh" -b -p "$MF"
          fi
          if ! test -x "$ENV/bin/python"; then
            "$MF/bin/conda" create -y -p "$ENV" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          else
            "$MF/bin/conda" install -y -p "$ENV" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          fi
          echo "NMT_PREFIX=$ENV" >> "$GITHUB_ENV"
          echo "NMT_PY=$ENV/bin/python" >> "$GITHUB_ENV"
          "$ENV/bin/python" - <<'PY'
          import importlib.metadata,os
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          assert os.environ['OMP_NUM_THREADS']=='10'
          print('pymaster',v,'OMP_NUM_THREADS',os.environ['OMP_NUM_THREADS'])
          PY

      - name: Stage exact frozen Exp073R1 S3 authority
        uses: actions/download-artifact@v4
        with:
          name: exp073r1-v08-hosted-wholestream-ef783ca941fb9b9b5f5eae537986c56ff06e6536
          run-id: 33270843577
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/exp073bu-r1

      - name: Stage and hash-verify exact DES lens mask
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exp073bu-lens"
          lens="$RUNNER_TEMP/exp073bu-lens/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits"
          curl --fail --location --retry 5 --retry-delay 2 --output "$lens" https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/redmagic/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits
          test "$(stat -c %s "$lens")" = '104595840'
          test "$(sha256sum "$lens" | awk '{print $1}')" = 'a519b8522f899e4c33267bb0749f9734f8b7fa760d195636456d370f809a3d55'
          echo "LENS_PATH=$lens" >> "$GITHUB_ENV"

      - name: Compile deterministic OpenMP-10 full-window downstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exp073bu-bin"
          "$NMT_PREFIX/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -fopenmp -DDSIR_WORKERS=10 \
            -I"$NMT_PREFIX/include" ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c \
            -L"$NMT_PREFIX/lib" -Wl,-rpath,"$NMT_PREFIX/lib" -lgsl -lgslcblas -lm \
            -o "$RUNNER_TEMP/exp073bu-bin/mmap_full_mcm_omp10"
          echo "DOWNSTREAM_EXE=$RUNNER_TEMP/exp073bu-bin/mmap_full_mcm_omp10" >> "$GITHUB_ENV"

      - name: Runtime-certify actual 10-thread downstream before DES numerics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct,numpy as np,os
          p=os.environ['RUNNER_TEMP']+'/omp10_probe.bin'; L=4; ncls=2; edges=np.array([0,2,4],dtype='<i4'); nr=ncls*L
          m=np.eye(nr,dtype='<f8')
          with open(p,'wb') as f:
              f.write(struct.pack('<iii',ncls,2,L)); f.write(edges.tobytes()); f.write(m.tobytes())
          PY
          set +e
          probe="$($DOWNSTREAM_EXE "$RUNNER_TEMP/omp10_probe.bin" "$RUNNER_TEMP/omp10_probe_out.bin" 2>&1)"; rc=$?
          set -e
          echo "$probe"
          test "$rc" = '0'
          grep -Fq 'DSIR_OMP_TEAM=10' <<<"$probe"
          echo PASS_EXP073BU_RUNTIME_10_THREAD_TEAM

      - name: Fresh live exclusivity and Exp073BU 10-core A-then-B science
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock="$HOME/.cache/dsir/DSIR-HOME-PC.exp073bu-10core.lock"
          exec 9>"$lock"
          flock -n 9 || { echo BLOCKED; exit 4; }
          "$NMT_PY" - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID']); token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; bad=[]
          for status in ('queued','in_progress'):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100',headers=h)
              with urllib.request.urlopen(q) as r: runs=json.load(r).get('workflow_runs',[])
              for run in runs:
                  if int(run['id'])==current: continue
                  q2=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100",headers=h)
                  with urllib.request.urlopen(q2) as r2: jobs=json.load(r2).get('jobs',[])
                  if any('self-hosted' in (j.get('labels') or []) or j.get('runner_name')=='DSIR-HOME-PC' for j in jobs): bad.append(run['id'])
          if bad: raise SystemExit('BLOCKED competing self-hosted runs '+repr(bad))
          print('PASS_EXP073BU_10CORE_LIVE_EXCLUSIVITY')
          PY
          terminal="$CHECKPOINT_ROOT/terminal_science_receipt.json"
          "$NMT_PY" ci/exp073bu_wm_s3_science_launcher_10core_v0_2.py \
            --driver ci/exp073bu_wm_s3_fresh_ab_production_10core_v0_2.py \
            --r1-root "$RUNNER_TEMP/exp073bu-r1" \
            --lens-mask "$LENS_PATH" \
            --checkpoint-root "$CHECKPOINT_ROOT" \
            --downstream-exe "$DOWNSTREAM_EXE" \
            --component-blobs-json ci/exp073cv_component_blobs_v0_1.json \
            --source-head "$SOURCE_HEAD" \
            --contract-fingerprint "$CONTRACT_FP" \
            --out "$terminal"

      - name: Prepare immutable 10-core science evidence artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/exp073bu-science-evidence-10core"; rm -rf "$out"; mkdir -p "$out/A" "$out/B"
          test ! -f "$CHECKPOINT_ROOT/terminal_science_receipt.json" || cp "$CHECKPOINT_ROOT/terminal_science_receipt.json" "$out/"
          for r in A B; do
            test ! -f "$CHECKPOINT_ROOT/$r/replica_receipt.json" || cp "$CHECKPOINT_ROOT/$r/replica_receipt.json" "$out/$r/"
            for s in fresh_masks_complete fresh_workspace_mcm_complete mcm_fits_verified full_window_complete selected_te_complete replica_receipt_complete; do
              test ! -f "$CHECKPOINT_ROOT/$r/$s.json" || cp "$CHECKPOINT_ROOT/$r/$s.json" "$out/$r/"
            done
          done
          find "$out" -type f -maxdepth 3 -print -exec sha256sum {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073bu-wm-s3-fresh-ab-science-10core-v0-2-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/exp073bu-science-evidence-10core
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Preserve frozen terminal classification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          terminal="$CHECKPOINT_ROOT/terminal_science_receipt.json"
          test -f "$terminal" || { echo INFRASTRUCTURE_INCOMPLETE; exit 4; }
          "$NMT_PY" - <<'PY'
          import json,os
          r=json.load(open(os.path.join(os.environ['CHECKPOINT_ROOT'],'terminal_science_receipt.json'))); c=r.get('classification')
          print('classification='+str(c)); print('raw_token='+str(r.get('raw_token')))
          if c=='PASS':
              assert r.get('raw_token')=='PASS_EXP073BU_WM_S3_FRESH_AB_EXACT_REPEATABILITY_10CORE_V0_2'
              assert r.get('science_gate_scored') is True and r.get('wm_s3_authority_created') is True
              assert r['comparison']['whole_canonical_sha256_equal'] is True and r['comparison']['numpy_array_equal'] is True
              raise SystemExit(0)
          if c=='SCIENTIFIC_REPEATABILITY_FAIL': raise SystemExit(3)
          raise SystemExit(4)
          PY
