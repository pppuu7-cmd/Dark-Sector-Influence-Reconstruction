name: DSIR-I JCAP compile v0.1

on:
  push:
    branches:
      - paper/dsir-i-observable-response-geometry
    paths:
      - 'papers/dsir1/manuscript.md'
      - 'papers/dsir1/sections/**'
      - 'papers/dsir1/build_manuscript_v0_2.py'
      - 'papers/dsir1/build_jcap_candidate.py'
      - 'papers/dsir1/build_jcap_latex.py'
      - 'papers/dsir1/JCAP_FRONT_MATTER_DRAFT.md'
      - 'papers/dsir1/ACKNOWLEDGMENTS_AND_DISCLOSURES.md'
      - 'papers/dsir1/FIGURE_CAPTIONS.md'
      - 'papers/dsir1/references.bib'
      - 'papers/dsir1/figures/*.py'
      - '.github/workflows/paper-dsir1-jcap-compile-v0-1.yml'
  workflow_dispatch:

concurrency:
  group: dsir1-jcap-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout paper branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib

      - name: Install TeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils
          pdflatex --version | head -n 2
          bibtex --version | head -n 2

      - name: Build audited manuscript and JCAP source
        run: |
          python papers/dsir1/audit_paper_v0_2.py
          python papers/dsir1/audit_jcap_front_matter.py
          python papers/dsir1/build_jcap_candidate.py
          python papers/dsir1/audit_bibliography_integrity.py
          python papers/dsir1/build_jcap_latex.py

      - name: Build publication figures required by TeX
        run: |
          python papers/dsir1/figures/fig01_operator_architecture.py
          python papers/dsir1/figures/fig02_additive_core_failure.py
          python papers/dsir1/figures/fig03_chiI_hierarchy.py
          python papers/dsir1/figures/fig04_channel_conditional_degeneracy.py
          python papers/dsir1/figures/fig05_curvature_and_localization.py
          python papers/dsir1/figures/fig06_failure_resistant_science.py
          python papers/dsir1/figures/fig07_observation_space_support_closure.py

      - name: Fetch and minimally patch pinned SISSA JCAP styles
        run: |
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/LSSTDESC/LSS_DC1_paper/8979efd021be92214ce6048f315b40e2dadf6937/texmf/styles/jcappub.sty' \
            --output papers/dsir1/jcap/jcappub.sty
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/LSSTDESC/LSS_DC1_paper/8979efd021be92214ce6048f315b40e2dadf6937/texmf/bib/JHEP.bst' \
            --output papers/dsir1/jcap/JHEP.bst

          test "$(git hash-object papers/dsir1/jcap/jcappub.sty)" = '6d7508b34b5f0069d3d590186c97ba84c608b89e'
          test "$(git hash-object papers/dsir1/jcap/JHEP.bst)" = '7b9b88cfed16dc5c7249cb5265288416bf842d86'
          grep -F '\ProvidesPackage{jcappub}[2012/08/02 r764]' papers/dsir1/jcap/jcappub.sty
          grep -F '% JHEP bibliography style ver. 2.7' papers/dsir1/jcap/JHEP.bst

          cp papers/dsir1/jcap/JHEP.bst papers/dsir1/jcap/JHEP.upstream.bst
          python - <<'PY'
          from pathlib import Path
          p = Path('papers/dsir1/jcap/JHEP.bst')
          s = p.read_text(encoding='utf-8')
          fixes = {
              'MACRO {apj} {ApJ}': 'MACRO {apj} {"ApJ"}',
              'MACRO {aa} {A\\&A}': 'MACRO {aa} {"A\\&A"}',
          }
          for old, new in fixes.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one pinned JHEP macro to patch: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('papers/dsir1/jcap/JHEP_BST_PATCH.txt').write_text(
              'upstream_commit=8979efd021be92214ce6048f315b40e2dadf6937\n'
              'upstream_git_blob=7b9b88cfed16dc5c7249cb5265288416bf842d86\n'
              'patch=quote two invalid BibTeX MACRO payloads only: apj and aa\n',
              encoding='utf-8',
          )
          PY
          grep -F 'MACRO {apj} {"ApJ"}' papers/dsir1/jcap/JHEP.bst
          grep -F 'MACRO {aa} {"A\&A"}' papers/dsir1/jcap/JHEP.bst

      - name: Compile JCAP candidate
        working-directory: papers/dsir1/jcap
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error dsir1_jcap.tex
          bibtex dsir1_jcap
          pdflatex -interaction=nonstopmode -halt-on-error dsir1_jcap.tex
          pdflatex -interaction=nonstopmode -halt-on-error dsir1_jcap.tex

      - name: Audit compiled PDF
        working-directory: papers/dsir1/jcap
        run: |
          set -euo pipefail
          test -s dsir1_jcap.pdf

          if grep -E 'LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|Package natbib Warning: Citation .* undefined' dsir1_jcap.log; then
            echo 'Unresolved citations/references detected.' >&2
            exit 1
          fi

          pdfinfo dsir1_jcap.pdf > PDFINFO.txt
          pages="$(awk '/^Pages:/ {print $2}' PDFINFO.txt)"
          test -n "$pages"
          test "$pages" -le 50

          pdftotext -f 1 -l 1 dsir1_jcap.pdf FIRST_PAGE.txt
          grep -F 'Abstract.' FIRST_PAGE.txt
          grep -F 'Keywords:' FIRST_PAGE.txt
          grep -F 'Aleksey Buyanov' FIRST_PAGE.txt

          pdflatex --version > TEX_ENGINE.txt
          bibtex --version >> TEX_ENGINE.txt
          git hash-object jcappub.sty > JCAP_STYLE_GIT_BLOB.txt
          git hash-object JHEP.upstream.bst > JHEP_BST_UPSTREAM_GIT_BLOB.txt
          git hash-object JHEP.bst > JHEP_BST_PATCHED_GIT_BLOB.txt
          sha256sum dsir1_jcap.tex dsir1_jcap.pdf jcappub.sty JHEP.upstream.bst JHEP.bst > COMPILE_SHA256SUMS.txt

          echo "pages=$pages" | tee COMPILE_STATUS.txt
          echo 'first_page_abstract=PASS' | tee -a COMPILE_STATUS.txt
          echo 'unresolved_references=0' | tee -a COMPILE_STATUS.txt
          echo 'jhep_bst_patch=two_macro_quoting_only' | tee -a COMPILE_STATUS.txt

      - name: Upload compiled JCAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsir1-jcap-compiled-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/dsir1/jcap/dsir1_jcap.tex
            papers/dsir1/jcap/dsir1_jcap.pdf
            papers/dsir1/jcap/dsir1_jcap.bbl
            papers/dsir1/jcap/dsir1_jcap.log
            papers/dsir1/jcap/jcappub.sty
            papers/dsir1/jcap/JHEP.upstream.bst
            papers/dsir1/jcap/JHEP.bst
            papers/dsir1/jcap/JHEP_BST_PATCH.txt
            papers/dsir1/jcap/PDFINFO.txt
            papers/dsir1/jcap/FIRST_PAGE.txt
            papers/dsir1/jcap/TEX_ENGINE.txt
            papers/dsir1/jcap/JCAP_STYLE_GIT_BLOB.txt
            papers/dsir1/jcap/JHEP_BST_UPSTREAM_GIT_BLOB.txt
            papers/dsir1/jcap/JHEP_BST_PATCHED_GIT_BLOB.txt
            papers/dsir1/jcap/COMPILE_SHA256SUMS.txt
            papers/dsir1/jcap/COMPILE_STATUS.txt
            papers/dsir1/references.bib
            papers/dsir1/figures/generated/*.pdf
