name: C5 explicit-EFT general-accuracy convergence v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c5-explicit-eft-general-accuracy-convergence-v0-1.yml'
      - 'ci/c5_explicit_eft_general_accuracy_convergence_v0_1.py'
      - 'experiments/069f_c5_explicit_eft_general_accuracy_convergence_prereg_v0_1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/c5-explicit-eft-general-accuracy-convergence-v0-1.yml'
      - 'ci/c5_explicit_eft_general_accuracy_convergence_v0_1.py'
      - 'experiments/069f_c5_explicit_eft_general_accuracy_convergence_prereg_v0_1.md'

permissions:
  contents: read
  actions: read

jobs:
  general-accuracy-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install H-EFTCAMB Python toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git gfortran gcc make liblapack-dev libblas-dev python3 python3-dev python3-pip
          python3 -m pip install --user numpy scipy sympy packaging
          python3 -m py_compile ci/c5_explicit_eft_general_accuracy_convergence_v0_1.py

      - name: Build pinned H-EFTCAMB Python backend
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/EFTCAMB/EFTCAMB.git eftcamb
          git -C eftcamb checkout 16d9c4e9f85751e30efd0a53b177941713078904
          git -C eftcamb submodule update --init --recursive
          test "$(git -C eftcamb rev-parse HEAD)" = '16d9c4e9f85751e30efd0a53b177941713078904'
          grep -Fq 'def set_accuracy(' eftcamb/camb/model.py
          grep -Fq 'self.Accuracy.AccuracyBoost = AccuracyBoost' eftcamb/camb/model.py
          grep -Fq 'self.Accuracy.lAccuracyBoost = lAccuracyBoost' eftcamb/camb/model.py
          grep -Fq 'self.DoLateRadTruncation = DoLateRadTruncation' eftcamb/camb/model.py
          make -C eftcamb/fortran python
          test "$(git -C eftcamb rev-parse HEAD)" = '16d9c4e9f85751e30efd0a53b177941713078904'

      - name: Write Exp069B-E matched ordinary baseline
        run: |
          set -euxo pipefail
          mkdir -p exp069f_configs
          cp eftcamb/fortran/eftcamb_test/parameters/base_params.ini exp069f_configs/base.ini
          sed -i 's/^get_scalar_cls[[:space:]]*=.*/get_scalar_cls = F/' exp069f_configs/base.ini
          sed -i 's/^get_tensor_cls[[:space:]]*=.*/get_tensor_cls = F/' exp069f_configs/base.ini
          sed -i 's/^do_lensing[[:space:]]*=.*/do_lensing = F/' exp069f_configs/base.ini
          sed -i 's/^do_nonlinear[[:space:]]*=.*/do_nonlinear = 0/' exp069f_configs/base.ini
          sed -i 's/^hubble[[:space:]]*=.*/hubble = 67/' exp069f_configs/base.ini
          sed -i 's/^ombh2[[:space:]]*=.*/ombh2 = 0.0224/' exp069f_configs/base.ini
          sed -i 's/^omch2[[:space:]]*=.*/omch2 = 0.1200/' exp069f_configs/base.ini
          sed -i 's/^omnuh2[[:space:]]*=.*/omnuh2 = 0/' exp069f_configs/base.ini
          sed -i 's/^massless_neutrinos[[:space:]]*=.*/massless_neutrinos = 3.046/' exp069f_configs/base.ini
          sed -i 's/^nu_mass_eigenstates[[:space:]]*=.*/nu_mass_eigenstates = 0/' exp069f_configs/base.ini
          sed -i 's/^massive_neutrinos[[:space:]]*=.*/massive_neutrinos = 0/' exp069f_configs/base.ini
          sed -i 's/^helium_fraction[[:space:]]*=.*/helium_fraction = 0.2404/' exp069f_configs/base.ini
          sed -i 's/^scalar_amp(1)[[:space:]]*=.*/scalar_amp(1) = 2.10e-9/' exp069f_configs/base.ini
          sed -i 's/^scalar_spectral_index(1)[[:space:]]*=.*/scalar_spectral_index(1) = 0.965/' exp069f_configs/base.ini
          sed -i 's/^reionization[[:space:]]*=.*/reionization = F/' exp069f_configs/base.ini
          sed -i 's/^transfer_kmax[[:space:]]*=.*/transfer_kmax = 0.30/' exp069f_configs/base.ini
          sed -i 's/^feedback_level[[:space:]]*=.*/feedback_level = 3/' exp069f_configs/base.ini
          for key in EFTflag DesignerEFTmodel EFTwDE EFTB0 EFT_ghost_math_stability EFT_mass_math_stability EFT_ghost_stability EFT_gradient_stability EFT_mass_stability EFT_mass_stability_rate EFT_additional_priors EFTCAMB_turn_on_time EFTCAMB_stability_time EFTCAMB_stability_threshold model_background_num_points EFTCAMB_skip_RGR EFTCAMB_GR_threshold; do
            sed -i "/^[[:space:]]*${key}[[:space:]]*=/d" exp069f_configs/base.ini
          done
          grep -Fq 'high_accuracy_default=T' exp069f_configs/base.ini
          grep -Fq 'transfer_high_precision = T' exp069f_configs/base.ini

      - name: Execute frozen Exp069F q ladder
        run: |
          set -euxo pipefail
          python3 ci/c5_explicit_eft_general_accuracy_convergence_v0_1.py \
            --eft-root eftcamb \
            --config exp069f_configs/base.ini \
            --output data/derived/g7/exp069f_c5_explicit_eft_general_accuracy_convergence_v0_1_summary.json

      - name: Assert preregistered contract and interpretation boundary
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp069f_c5_explicit_eft_general_accuracy_convergence_v0_1_summary.json'
          d=json.load(open(p))
          assert d['experiment']=='Exp069F'
          assert d['status']=='COMPLETE_C5_EXPLICIT_EFT_GENERAL_ACCURACY_CONVERGENCE_V0_1'
          assert d['primary_classification'] in {
              'GENERAL_ACCURACY_RECOVERS_FROZEN_GR_LIMIT',
              'GENERAL_ACCURACY_DOES_NOT_RECOVER_FROZEN_GR_LIMIT'}
          assert d['hard_GR_limit']==5e-6
          assert d['frozen']['q']==[1.0,2.0,3.0,4.0]
          assert d['frozen']['z']==[0.0,0.295,0.51,0.934,1.491,2.33,3.0]
          assert d['frozen']['k_Mpc^-1']==[0.003,0.01,0.03,0.1,0.2]
          assert d['frozen']['z_bg']==[0.0,3.0,10.0,100.0,1000.0,1100.0,10000.0,1000000.0]
          assert d['frozen']['k_per_logint']==320
          assert d['frozen']['lSampleBoost']==1.0
          assert d['frozen']['DoLateRadTruncation'] is True
          assert d['controls']['pinned_solver_before_and_after'] is True
          assert d['controls']['all_case_processes_success'] is True
          assert d['controls']['all_case_analysis_success'] is True
          assert d['controls']['all_raw_grids_exact'] is True
          assert d['controls']['all_nonlinear_none'] is True
          assert d['controls']['all_accuracy_readback'] is True
          assert d['controls']['all_designer_readback'] is True
          assert d['exp069b_preserved']=='FAIL_C5_EXPLICIT_EFT_PYTHON_POWER_BRIDGE_V0_1'
          assert d['exp069e_preserved']=='COMPLETE_C5_EXACT_ZERO_RGR_FUNCTION_FLOOR_AUDIT_V0_1'
          assert d['c5_provider_certified'] is False
          assert d['support_mask_authorized'] is False
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP069F_PRIMARY',d['primary_classification'])
          print('M_q',d['diagnostics']['M_q'])
          print('R_q',d['diagnostics']['R_q'])
          print('M_over_M1',d['diagnostics']['M_over_M1'])
          print('FIRST_PASSING_Q',d['first_passing_q'])
          for c in d['cases']:
              print('q',c['q'],'turn_on',c['designer0']['effective_EFTCAMB_pert_turn_on_after_results'])
          PY
          test "$(git -C eftcamb rev-parse HEAD)" = '16d9c4e9f85751e30efd0a53b177941713078904'
          test -z "$(git -C eftcamb status --porcelain --untracked-files=no)"

      - name: Upload immutable Exp069F record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp069f-c5-general-accuracy-${{ github.sha }}
          path: |
            data/derived/g7/exp069f_c5_explicit_eft_general_accuracy_convergence_v0_1_summary.json
            data/derived/g7/exp069f_cases/*.json
            data/derived/g7/exp069f_cases/*.log
            exp069f_configs/base.ini
          if-no-files-found: warn
