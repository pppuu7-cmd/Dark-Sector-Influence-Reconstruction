name: exp073jg-article3-layerb-local-interpolation-curvature-v0-1

on:
  push:
    paths:
      - '.github/workflows/exp073jg-article3-layerb-local-interpolation-curvature-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp073jg-article3-layerb-local-interpolation-curvature-v0-1
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enforce prospective contract and JF authority
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/dsir4/prereg/EXP073JG_ARTICLE3_LAYERB_LOCAL_INTERPOLATION_CURVATURE_DIAGNOSTIC_V0_1.md
          test -f docs/dsir4/authority/EXP073JF_ARTICLE3_LAYERB_SHARED_FIXED_K_GRID_EXTENDED_DENSITY_OBSERVED_V0_1.json
          python -m py_compile ci/exp073jg_article3_layerb_local_interpolation_curvature_v0_1.py ci/exp073je_article3_layerb_shared_fixed_k_grid_scaling_v0_1.py
          python - <<'PY'
          import json
          d=json.load(open('docs/dsir4/authority/EXP073JF_ARTICLE3_LAYERB_SHARED_FIXED_K_GRID_EXTENDED_DENSITY_OBSERVED_V0_1.json'))
          assert d['classification']=='SHARED_FIXED_K_GRID_EXTENDED_DENSITY_OBSERVED_PLUS_0_PLUS_0'
          assert d['artifact_verified_independently'] is True
          assert d['artifact_zip_sha256']=='f71c1603f46e622a6c71ebab6733d30e9633cc92e9dc50a98cecdf364b28fffb'
          assert d['result_json_sha256']=='a18d46f6a6e62c3009df92344c97f8f41d8f61ebad172e18b0e519704398a3e6'
          assert d['scaling_candidates']==[]
          assert d['covariance_restriction_authorized'] is False
          PY
          test "$(sha256sum configs/dsir4/c2/ide0_reference_v0_1.ini | awk '{print $1}')" = '0a68f4af6ead7ee69c75f1867f60914a40d4f7ff1219b965a0ae38186ca5c65c'
      - name: Install frozen stack and static audit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git
          python -m pip install --upgrade pip wheel 'setuptools<76'
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy
          PYTHONPATH=ci python - <<'PY'
          import exp073jg_article3_layerb_local_interpolation_curvature_v0_1 as jg
          assert jg.N==512
          assert jg.RULES==('linear_bracket','quadratic_left','quadratic_right','cubic_centered')
          assert jg.PARENT_RESPONSES=={'alpha_left':11.515198203966293,'beta_symmetric':1.8700385146530607}
          print('PASS_EXP073JG_STATIC_AUDIT_V0_1')
          PY
          python - <<'PY'
          import numpy as np
          nodes=np.geomspace(1e-4,0.06664762008318016,512,dtype=np.float64)
          s=','.join(format(float(x),'.17g') for x in nodes)
          assert len(s.encode()) < 32768
          print('JG_SERIALIZED_K_BYTES',len(s.encode()))
          PY
      - name: Build exact pinned patched CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          grep -F '#define _MAX_NUMBER_OF_K_FILES_ 30' external/class_iv/include/perturbations.h >/dev/null
          grep -F '#define _ARGUMENT_LENGTH_MAX_ 1024' external/class_iv/include/parser.h >/dev/null
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 512'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 32768'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          rec={'schema':'EXP073JE_CLASSIV_INPUT_CAPACITY_PATCH_V0_2','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','path':'include/perturbations.h','old_capacity':30,'new_capacity':512,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_path':'include/parser.h','parser_old_argument_capacity':1024,'parser_new_argument_capacity':32768,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost}
          Path('artifacts/capacity_patch.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; new="extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          make -C external/class_iv -j2 all
      - name: Execute frozen curvature diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python ci/exp073jg_article3_layerb_local_interpolation_curvature_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --capacity-patch-record artifacts/capacity_patch.json \
            --out artifacts/exp073jg_result.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/exp073jg_result.json'))
          assert d['classification']=='LOCAL_INTERPOLATION_CURVATURE_OBSERVED_PLUS_0_PLUS_0'
          assert d['scientific_authority_created'] is False
          assert d['covariance_restriction_authorized'] is False
          print(d['token'])
          print('CURVATURE_CANDIDATES',d['curvature_candidates'])
          for rule,s in d['rule_summary'].items():
              print('RULE',rule,'SUMMARY',s)
              for kpd in ('10','20'):
                  print('ERR',rule,kpd,'alpha',d['observations'][kpd]['alpha_left']['rules'][rule]['relative_error_to_exact_k'],'beta',d['observations'][kpd]['beta_symmetric']['rules'][rule]['relative_error_to_exact_k'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073jg-local-interpolation-curvature-v0-1
          path: |
            artifacts/exp073jg_result.json
            artifacts/capacity_patch.json
          retention-days: 90
