name: classiv-k-output-history-suppression-8193-equivalence-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/classiv-k-output-history-suppression-8193-equivalence-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PREREG_BLOB: 'fdae0672d52aaf6206f205a055f8f7b992dbbdac'
  PATCH_BLOB: 'e20687e933d665973c3be40598180587701fa8e0'
  HELPER_BLOB: 'c975a964805919cd61e3c028305ad3945773377f'
  JL_AUTH_BLOB: 'aca79d6596f49ced9fe9d965059a2352447f13b4'
  JM_STATIC_BLOB: '98e5d43686500ff8044f3197e646364afbf50006'
  CANON_AUTH_BLOB: 'ab25bdc60aa1538ffd5383ce8c43372b2e402406'
  CANON_FILE_BLOB: 'bc9a6e59fb27d7510796c1cb2d5470dfe8a5294b'
  JJ_BLOB: 'ee8fd0650a2a1322fab83a86bb06a219e84ca434'

jobs:
  equivalence:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enforce frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/LAYERB_K_OUTPUT_HISTORY_SUPPRESSION_EXECUTION_PATCH_EQUIVALENCE_V0_1.md)" = "$PREREG_BLOB"
          test "$(git hash-object scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py)" = "$PATCH_BLOB"
          test "$(git hash-object ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py)" = "$HELPER_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json)" = "$JL_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_V0_2.json)" = "$JM_STATIC_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json)" = "$CANON_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt)" = "$CANON_FILE_BLOB"
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = "$JJ_BLOB"
          python3 -m py_compile scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py

      - name: Install exact numerical/build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git procps >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null

      - name: Build pinned CLASS-IV with execution-only history suppression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 9216'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 262144'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          Path('artifacts/capacity_patch.json').write_text(json.dumps({'schema':'EXP073JO_CLASSIV_INPUT_CAPACITY_PATCH_V0_1','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','path':'include/perturbations.h','old_capacity':30,'new_capacity':9216,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_path':'include/parser.h','parser_old_argument_capacity':1024,'parser_new_argument_capacity':262144,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost},indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py external/class_iv artifacts/history_patch.json
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null

      - name: Execute patched canonical-8193 pilot with telemetry
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts/telemetry.log
          (
            while true; do
              ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              mem="$(awk '/^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree):/ {printf "%s%s=%s%s ",$1,$2,$3,$4} END {print ""}' /proc/meminfo)"
              top="$(ps -eo rss,comm --sort=-rss | sed -n '2p' | xargs)"
              echo "TELEMETRY ts=$ts $mem top=$top" | tee -a artifacts/telemetry.log
              sleep 5
            done
          ) & MON=$!
          trap 'kill $MON 2>/dev/null || true' EXIT
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py \
            --jl-authority docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json \
            --jm-static-authority docs/dsir4/authority/EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_V0_2.json \
            --canonical-authority docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json \
            --fine docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --capacity-patch-record artifacts/capacity_patch.json \
            --out artifacts/result.json
          kill $MON 2>/dev/null || true
          wait $MON 2>/dev/null || true
          trap - EXIT

      - name: Require exact baseline numerical equivalence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=json.load(open('artifacts/result.json'))
          expected={
            'reference':{'A':'56588d01bebb122926dddeca4fd0018272c487e34e2d72b262a7d74c3362bd1c','B':'5a8fee70676c7714b615ca2286b58384512bf0c3af3e4afae57c821e72997bdf'},
            'alpha_minus':{'A':'e88565c3dde3f2d4b433b646481515018148d009cb1419238c9b5c26cf0f8eb3','B':'faae61cc48893ccce204259cfff64f29912c444aea9b9e2fa3324365fa484955'},
            'beta_plus':{'A':'3871f805b7a5fcf0f01091e0659d6db7aea446667048f019b3ba72f1d8284bc5','B':'1f6e10545102bdb5e7031dc7c8deff41866670f1bd82aaa967306388cf8d55b1'},
            'beta_minus':{'A':'8ed59764ebe0df88eda071bac55f9705bd962acb432fe58a7d4062100d5d3c8f','B':'a5ec5824968ae8e937d783f4133c98837a0e69a691da382c8b27295ce61c53cd'}}
          assert d['classification']=='CANONICAL_8193_ONE_LIVE_FOUR_BUILD_RESOURCE_PILOT_PASS_PLUS_0_PLUS_0'
          assert d['canonical_8193_node_sha256']=='6d35a9d79aa8826554e8e39315ab12a8be1675d32d25a86ec04c978c7723a515'
          assert d['execution_lifecycle']['total_solver_constructions']==4 and d['execution_lifecycle']['max_live_instances']==1 and d['execution_lifecycle']['final_live_instances']==0
          assert d['unsupported_target_evaluations']==0 and d['max_requested_node_coordinate_rel_mismatch']<=1e-12
          got={r['role']:{k:v['operand_payload_sha256'] for k,v in r['requests'].items()} for r in d['model_receipts']}
          assert got==expected,(got,expected)
          assert d['pilot_responses']['A']['payload_sha256']=='e5271068b6012bc3d2432c6ed767c696975fcb1987992535a1c07eb7f2584c59'
          assert d['pilot_responses']['B']['payload_sha256']=='506ae1cf98f70ac33f8507754f99aacc2f61f9480b099e4c1ef94023a23f94c5'
          peak=0
          for line in Path('artifacts/telemetry.log').read_text().splitlines():
            m=re.search(r'top=(\d+)\s+',line)
            if m: peak=max(peak,int(m.group(1)))
          out={'schema':'CLASSIV_K_OUTPUT_HISTORY_SUPPRESSION_8193_EQUIVALENCE_RESULT_V0_1','classification':'CLASSIV_K_OUTPUT_HISTORY_SUPPRESSION_8193_EXACT_EQUIVALENCE_PASS_PLUS_0_PLUS_0','effect':'+0/+0','replica':${{ matrix.replica }},'exact_raw_operand_hash_match':True,'exact_pilot_response_hash_match':True,'canonical_node_hash_match':True,'unsupported_target_evaluations':0,'max_requested_node_coordinate_rel_mismatch':d['max_requested_node_coordinate_rel_mismatch'],'peak_top_process_rss_kb':peak,'scientific_authority_created':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'token':'CLASSIV_K_OUTPUT_HISTORY_SUPPRESSION_8193_EXACT_EQUIVALENCE_PASS_PLUS_0_PLUS_0'}
          Path('artifacts/equivalence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token'], 'replica', out['replica'], 'peak_rss_kb', peak)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classiv-history-suppression-8193-equivalence-replica-${{ matrix.replica }}
          path: |
            artifacts/equivalence.json
            artifacts/result.json
            artifacts/capacity_patch.json
            artifacts/history_patch.json
            artifacts/telemetry.log
          if-no-files-found: warn
          retention-days: 90
