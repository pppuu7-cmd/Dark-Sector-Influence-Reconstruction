name: Smooth-w dark-energy local tangent calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wde-tangent.yml'
      - 'ci/wde_tangent_scan.py'
      - 'experiments/029_wde_tangent.md'

jobs:
  wde-tangent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip
          python3 -m pip install --user numpy
      - name: Clone and build pinned GDM_CLASS
        run: |
          git clone https://github.com/s-ilic/gdm_class_public.git solver
          cd solver
          git checkout 4c87916aab5ca124a68f1dd16f31846fc13d1829
          git rev-parse HEAD | tee ../wde_upstream_sha.txt
          make -j2 class
      - name: Freeze validated p8 precision
        run: |
          cat > solver/dsir_p8.pre <<'EOF'
          k_step_sub = 0.0010
          k_step_super = 0.000003
          k_step_super_reduction = 0.1
          start_small_k_at_tau_c_over_tau_h = 1e-6
          start_large_k_at_tau_h_over_tau_k = 0.05
          tight_coupling_trigger_tau_c_over_tau_h = 0.005
          tight_coupling_trigger_tau_c_over_tau_k = 0.008
          start_sources_at_tau_c_over_tau_h = 0.006
          tol_perturb_integration = 3e-10
          perturb_sampling_stepsize = 0.00035
          radiation_streaming_approximation = 2
          radiation_streaming_trigger_tau_over_tau_k = 240.
          radiation_streaming_trigger_tau_c_over_tau = 100.
          ur_fluid_approximation = 2
          ur_fluid_trigger_tau_over_tau_k = 50.
          EOF
      - name: Write LambdaCDM reference and one-sided smooth-w controls
        run: |
          mkdir -p solver/out
          cat > solver/lcdm.ini <<'EOF'
          h = 0.67
          T_cmb = 2.7255
          omega_b = 0.0224
          N_ur = 3.046
          omega_cdm = 0.1200
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0
          Omega_scf = 0
          YHe = 0.2404
          recombination = RECFAST
          reio_parametrization = reio_none
          output = mPk
          modes = s
          ic = ad
          gauge = synchronous
          P_k_ini type = analytic_Pk
          k_pivot = 0.05
          A_s = 2.10e-9
          n_s = 0.965
          alpha_s = 0.
          P_k_max_h/Mpc = 0.25
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          headers = yes
          write background = yes
          root = out/lcdm_
          EOF
          for spec in '1e-4 1em4' '1e-3 1em3' '1e-2 1em2'; do
            set -- $spec; EPS=$1; TOK=$2
            python3 - "$EPS" "$TOK" <<'PY'
          import sys
          eps=float(sys.argv[1]); tok=sys.argv[2]
          w=-1+eps
          txt=open('solver/lcdm.ini').read()
          txt=txt.replace('Omega_fld = 0','Omega_Lambda = 0\nfluid_equation_of_state = CLP\nuse_ppf = no\nw0_fld = %.12g\nwa_fld = 0.\ncs2_fld = 1.'%w)
          txt=txt.replace('root = out/lcdm_','root = out/w%s_'%tok)
          open('solver/w%s.ini'%tok,'w').write(txt)
          PY
          done
      - name: Run same-solver reference and deformations
        working-directory: solver
        run: |
          set -euxo pipefail
          ./class lcdm.ini dsir_p8.pre | tee out/lcdm.log
          for f in w1em4.ini w1em3.ini w1em2.ini; do ./class "$f" dsir_p8.pre | tee "out/${f%.ini}.log"; done
      - name: Extract local tangent and convergence
        run: |
          python3 ci/wde_tangent_scan.py --directory solver/out --json wde_tangent.json
      - name: Upload calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: wde-tangent-${{ github.sha }}
          path: |
            wde_tangent.json
            wde_upstream_sha.txt
            solver/dsir_p8.pre
            solver/*.ini
            solver/out/
          if-no-files-found: error
