name: dsir-v026-r1-sentinel-runtime-chain-correction-funnel-audit-v0-2

on:
  push:
    branches:
      - audit/v026-r1-sentinel-runtime-chain-correction-v02
    paths:
      - '.github/workflows/dsir-v026-r1-sentinel-runtime-chain-correction-funnel-audit-v0-2.yml'
      - 'ci/dsir_v026_r1_sentinel_runtime_chain_correction_funnel_audit_v0_2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: '78f96f2c60db385f88a391b7fd046dd312176019'
  CORRECTION_HEAD: 'd3b32cd341ce16b5494024dfa9785a2480173dc1'
  STATIC_ARTIFACT_ID: '10419525675'
  STATIC_ZIP_SHA256: '82929104a6129f5f8f8bd465ef574b4ce55c172411415c19458de9bb8fe5fa0f'
  STATIC_RECEIPT_SHA256: 'b326cfc032a2e758d9565b4672d34f5f18ec61d8475ee5d23601e037bf3dab39'
  AUDITOR: 'ci/dsir_v026_r1_sentinel_runtime_chain_correction_funnel_audit_v0_2.py'

jobs:
  runtime-chain-correction-funnel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout independent audit branch only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify independent auditor and fetch exact candidate object
        run: |
          set -euo pipefail
          test "$(git hash-object "$AUDITOR")" = '1ee95009fef7b259deaa93b4594a67f37d20dbf3'
          git fetch --no-tags origin "$CORRECTION_HEAD"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$CORRECTION_HEAD^{commit}"
          test "$(git rev-parse "$CORRECTION_HEAD:docs/dsir4/authority_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_AUTHORITY_CANDIDATE_V0_1.json")" = '1c9945dd00b137f3e202efa14bf4112fffebf8af'
          test "$(git rev-parse "$CORRECTION_HEAD:docs/dsir4/launch_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_CANDIDATE_V0_1.json")" = 'fa7014435f0a5688def2124898ddd01d0c0183aa'
          test "$(git rev-parse "$CORRECTION_HEAD:docs/dsir4/authority_candidates/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_PACKAGE_QUALIFICATION_CANDIDATE_V0_1.json")" = 'f7b97f47d9e771e3d3ea78875da5a45962160cd0'
          if git cat-file -e "$CORRECTION_HEAD:docs/dsir4/launch/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_V0_1.json" 2>/dev/null; then
            echo 'ERROR: correction head contains final L' >&2
            exit 1
          fi

      - name: Download and verify immutable static audit receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p safe/static
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATIC_ARTIFACT_ID}/zip" > safe/static.zip
          printf '%s  %s\n' "$STATIC_ZIP_SHA256" safe/static.zip | sha256sum -c -
          unzip -q safe/static.zip -d safe/static
          test -f safe/static/runtime_chain_correction_static_audit.json
          test "$(wc -c < safe/static/runtime_chain_correction_static_audit.json)" = '1590'
          printf '%s  %s\n' "$STATIC_RECEIPT_SHA256" safe/static/runtime_chain_correction_static_audit.json | sha256sum -c -

      - name: Capture exact candidate-head sentinel science runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/layerb-beta-v026-r1-sentinel-science-v0-1.yml/runs?head_sha=${CORRECTION_HEAD}&event=push&per_page=100" > safe/science_runs.json

      - name: Execute independent response-blind funnel audit
        run: |
          set -euo pipefail
          python3 -m py_compile "$AUDITOR"
          python3 "$AUDITOR" \
            --static-receipt safe/static/runtime_chain_correction_static_audit.json \
            --science-runs-json safe/science_runs.json \
            --out safe/runtime_chain_correction_funnel_audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/runtime_chain_correction_funnel_audit.json'))
          assert d['verdict']=='QUALIFIED'
          assert d['classification']=='SENTINEL_GOVERNANCE_ONLY_A_L_Q_RUNTIME_CHAIN_CORRECTION_QUALIFIED_FOR_AUTHORITY_FIRST_PROMOTION'
          assert d['corrected_A_git_blob_sha1']=='1c9945dd00b137f3e202efa14bf4112fffebf8af'
          assert d['corrected_L_git_blob_sha1']=='fa7014435f0a5688def2124898ddd01d0c0183aa'
          assert d['corrected_Q_git_blob_sha1']=='f7b97f47d9e771e3d3ea78875da5a45962160cd0'
          assert d['independent_A_delta_ok'] is True
          assert d['independent_L_delta_ok'] is True
          assert d['independent_Q_delta_ok'] is True
          assert d['independent_W_consumer_contract_ok'] is True
          assert d['independent_executor_consumer_contract_ok'] is True
          assert d['decision_firewall_ok'] is True
          assert d['science_workflow_run_count_at_candidate_head']==0
          assert d['final_L_present'] is False
          assert d['class_solver_invoked'] is False
          assert d['scientific_response_read'] is False
          assert d['sentinel_science_execution_authorized_by_this_receipt'] is False
          assert d['full_107_row_execution_authorized'] is False
          assert d['token']=='QUALIFIED_DSIR_V0_26_R1_SENTINEL_RUNTIME_CHAIN_CORRECTION_FUNNEL_V0_2_PLUS_0_PLUS_0'
          print(d['token'])
          PY
          sha256sum safe/runtime_chain_correction_funnel_audit.json > safe/runtime_chain_correction_funnel_audit.sha256

      - name: Persist immutable independent funnel receipt
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-sentinel-runtime-chain-correction-funnel-audit-v0-2
          path: |
            safe/runtime_chain_correction_funnel_audit.json
            safe/runtime_chain_correction_funnel_audit.sha256
            safe/science_runs.json
          if-no-files-found: error
          retention-days: 90
