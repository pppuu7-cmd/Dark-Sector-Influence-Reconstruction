name: layerb-post-16385-top64-role-cancellation-census-v0-1
on:
  push:
    paths:
      - '.github/workflows/layerb-post-16385-top64-role-cancellation-census-v0-1.yml'
permissions:
  actions: read
  contents: read
concurrency:
  group: layerb-post-16385-top64-role-cancellation-census-v0-1
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 717a15a615061cea441910d03fdda1f9a4a2b2c2
          fetch-depth: 1
      - name: Enforce frozen helper, prereg and static authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_post_16385_top64_role_cancellation_census_v0_1.py)" = '92f35f0f563fe5c5ba54b3984ae9a82e2abaf8e7'
          test "$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_TOP64_ROLE_CANCELLATION_CENSUS_V0_1.md)" = '940a09d194fe9e68e6fc14271e7ab99b6aded3e4'
          test "$(git hash-object docs/dsir4/authority/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_TERMINAL_AUTHORITY_V0_1.json)" = 'cb0b07bd75208619e681f02528fb0c761ddedabb'
          test "$(git hash-object docs/dsir4/authority/LAYERB_POST_16385_TOP64_ROLE_CANCELLATION_STATIC_AUDIT_V0_2.json)" = '67bc1d7b0c58cfd7d124f80e51bd31e1eaac32ff'
          python - <<'PY'
          import json
          a=json.load(open('docs/dsir4/authority/LAYERB_POST_16385_TOP64_ROLE_CANCELLATION_STATIC_AUDIT_V0_2.json'))
          assert a['artifact_verified_independently'] is True
          assert a['classification']=='POST_16385_TOP64_ROLE_CANCELLATION_STATIC_AUDIT_PASS_PLUS_0_PLUS_0'
          assert a['pass_count']==a['check_count']==24
          assert a['class_solver_invoked'] is False and a['scientific_response_read'] is False and a['top64_role_result_read'] is False
          assert a['execution_authorized'] is True
          assert a['next_rung_authorized'] is False and a['covariance_restriction_authorized'] is False and a['Wm_S3_opened'] is False
          PY
      - uses: actions/download-artifact@v4
        with:
          name: layerb-post-16385-exact-response-atom-hotspot-v0-1
          path: source
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 34592951737
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact source artifact payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum source/result.json | awk '{print $1}')" = '4023403aaae03481507f778ce4a85c119160cebd785c9c91a534260783049394'
          test "$(sha256sum source/capacity_patch.json | awk '{print $1}')" = 'fb23d8cf0c57f4a0112e0d0a9a8e3680b873b9ea2a509e9b9e3a10ac355bbc7f'
          test "$(sha256sum source/history_patch.json | awk '{print $1}')" = '628d92c1b5bef05e776b6b510d3edc2b45513320310a1e616cef849ca7601f09'
          python - <<'PY'
          import json
          s=json.load(open('source/result.json'))
          assert s['classification']=='POST_16385_EXACT_RESPONSE_ATOM_HOTSPOT_LOCALIZATION_PASS_PLUS_0_PLUS_0'
          assert s['shared_call_count']==441 and s['des_call_count']==377 and s['boss_gl64_call_count']==64
          assert len(s['top_64_response_atoms'])==64 and s['shared_plan_bitwise_identical'] is True
          assert s['execution_lifecycle']=={'constructions':8,'live':0,'max_live':1}
          assert s['unsupported_target_evaluations']==0 and s['max_requested_node_coordinate_rel_mismatch']<=1e-12
          assert s['scientific_authority_created'] is False and s['next_rung_authorized'] is False
          PY
      - name: Install frozen numerical/build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null
      - name: Build exact pinned CLASS-IV with frozen execution-only patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 18432',1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,'#define _ARGUMENT_LENGTH_MAX_ 524288',1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          Path('artifacts/capacity_patch.json').write_text(json.dumps({'schema':'POST_16385_TOP64_ROLE_CANCELLATION_CLASSIV_INPUT_CAPACITY_PATCH_V0_1','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','old_capacity':30,'new_capacity':18432,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_old_argument_capacity':1024,'parser_new_argument_capacity':524288,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost},indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py external/class_iv artifacts/history_patch.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('artifacts/history_patch.json')); assert d['replacement_count']==1 and d['k_output_values_still_inserted_into_solver_grid'] is True and d['scientific_parameters_changed'] is False
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Execute frozen top-64 role cancellation census
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/layerb_post_16385_top64_role_cancellation_census_v0_1.py \
            --source-result source/result.json \
            --top1-authority docs/dsir4/authority/LAYERB_POST_16385_TOP1_ROLE_CANCELLATION_TERMINAL_AUTHORITY_V0_1.json \
            --engine-script ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --coarse docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt \
            --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --out artifacts/census.json
          python - <<'PY'
          import json,math
          d=json.load(open('artifacts/census.json'))
          assert d['classification']=='POST_16385_TOP64_ROLE_CANCELLATION_CENSUS_PASS_PLUS_0_PLUS_0',d
          assert d['atom_count']==64 and len(d['atoms'])==64,d
          assert d['execution_lifecycle']=={'constructions':8,'live':0,'max_live':1},d
          assert d['unsupported_target_evaluations']==0 and d['max_requested_node_coordinate_rel_mismatch']<=1e-12,d
          assert d['max_primary_reproduction_relative_error']<=1e-12,d
          assert d['alternative_h_evaluated'] is False and d['scientific_107_row_replay_executed'] is False,d
          assert d['scientific_classification_created'] is False and d['scientific_authority_created'] is False,d
          assert d['next_rung_authorized'] is False and d['covariance_restriction_authorized'] is False and d['Wm_S3_opened'] is False,d
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-top64-role-cancellation-census-v0-1
          path: |
            artifacts/census.json
            artifacts/capacity_patch.json
            artifacts/history_patch.json
          if-no-files-found: error
          retention-days: 90
