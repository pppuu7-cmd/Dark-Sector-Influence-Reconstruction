name: layerb-post-16385-plateau-rootcause-v0-1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-post-16385-plateau-rootcause-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  static-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen diagnostic identities
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_post_16385_plateau_rootcause_probe_v0_1.py)" = '19a3fd05a646162014062dcdf098019cb1348889'
          test "$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_PLATEAU_ROOTCAUSE_PLAN_V0_1.md)" = '44978ef1916b75f4c317f5326f4391d9810f0ba0'
          test "$(git hash-object docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt)" = 'bc9a6e59fb27d7510796c1cb2d5470dfe8a5294b'
          test "$(git hash-object docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt)" = 'fc4eb1e7f51a0ad3773b8be13c477652b1f71368'
          test "$(git hash-object ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py)" = 'c975a964805919cd61e3c028305ad3945773377f'
          test "$(git hash-object ci/layerb_post_jm_16385_one_live_resource_pilot_v0_1.py)" = '00d8cb7d7dd6f5fa84aa0a8ddd3ea1c8ed3f81cb'
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = 'ee8fd0650a2a1322fab83a86bb06a219e84ca434'
      - run: python -m pip install -q 'numpy==1.26.4'
      - name: Execute canonical nesting/interpolation control
        run: |
          mkdir -p artifacts
          python ci/layerb_post_16385_plateau_rootcause_probe_v0_1.py --lane interpolation \
            --resource-script ci/layerb_post_jm_16385_one_live_resource_pilot_v0_1.py \
            --coarse docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt \
            --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt \
            --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --out artifacts/result.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/result.json'))
          assert d['classification']=='POST_16385_CANONICAL_INTERPOLATION_CONTROL_PASS_PLUS_0_PLUS_0',d
          assert d['exact_shared_node_nesting'] is True and d['class_solver_invoked'] is False and d['next_rung_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-interpolation-control-v0-1
          path: artifacts/result.json
          retention-days: 90

  raw-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen diagnostic identities
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_post_16385_plateau_rootcause_probe_v0_1.py)" = '19a3fd05a646162014062dcdf098019cb1348889'
          test "$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_PLATEAU_ROOTCAUSE_PLAN_V0_1.md)" = '44978ef1916b75f4c317f5326f4391d9810f0ba0'
      - name: Install exact numerical/build stack
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
      - name: Build pinned CLASS-IV with proven execution-only patches
        run: |
          set -euo pipefail; mkdir -p artifacts; git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv; git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/include/perturbations.h'); s=p.read_text(); assert s.count('#define _MAX_NUMBER_OF_K_FILES_ 30')==1; p.write_text(s.replace('#define _MAX_NUMBER_OF_K_FILES_ 30','#define _MAX_NUMBER_OF_K_FILES_ 18432',1))
          q=Path('external/class_iv/include/parser.h'); s=q.read_text(); assert s.count('#define _ARGUMENT_LENGTH_MAX_ 1024')==1; q.write_text(s.replace('#define _ARGUMENT_LENGTH_MAX_ 1024','#define _ARGUMENT_LENGTH_MAX_ 524288',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py external/class_iv artifacts/history_patch.json
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Execute fixed-node raw localization
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/layerb_post_16385_plateau_rootcause_probe_v0_1.py --lane raw \
            --resource-script ci/layerb_post_jm_16385_one_live_resource_pilot_v0_1.py --coarse docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt \
            --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre --out artifacts/result.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/result.json')); assert d['classification']=='POST_16385_FIXED_NODE_RAW_LOCALIZATION_PASS_PLUS_0_PLUS_0',d; assert d['next_rung_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-raw-localization-v0-1
          path: |
            artifacts/result.json
            artifacts/history_patch.json
          retention-days: 90

  cancellation-conditioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen diagnostic identities
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_post_16385_plateau_rootcause_probe_v0_1.py)" = '19a3fd05a646162014062dcdf098019cb1348889'
          test "$(git hash-object docs/dsir4/prereg/LAYERB_POST_16385_PLATEAU_ROOTCAUSE_PLAN_V0_1.md)" = '44978ef1916b75f4c317f5326f4391d9810f0ba0'
      - name: Install exact numerical/build stack
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
      - name: Build pinned CLASS-IV with proven execution-only patches
        run: |
          set -euo pipefail; mkdir -p artifacts; git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv; git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/include/perturbations.h'); s=p.read_text(); assert s.count('#define _MAX_NUMBER_OF_K_FILES_ 30')==1; p.write_text(s.replace('#define _MAX_NUMBER_OF_K_FILES_ 30','#define _MAX_NUMBER_OF_K_FILES_ 18432',1))
          q=Path('external/class_iv/include/parser.h'); s=q.read_text(); assert s.count('#define _ARGUMENT_LENGTH_MAX_ 1024')==1; q.write_text(s.replace('#define _ARGUMENT_LENGTH_MAX_ 1024','#define _ARGUMENT_LENGTH_MAX_ 524288',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python scripts/dsir4/classiv_k_output_history_suppression_patch_v0_1.py external/class_iv artifacts/history_patch.json
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Execute fixed-h cancellation conditioning audit
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/layerb_post_16385_plateau_rootcause_probe_v0_1.py --lane conditioning \
            --resource-script ci/layerb_post_jm_16385_one_live_resource_pilot_v0_1.py --coarse docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_16385_NODES_U64HEX_V0_1.txt \
            --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre --out artifacts/result.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/result.json')); assert d['classification']=='POST_16385_FIXED_H_CANCELLATION_AUDIT_PASS_PLUS_0_PLUS_0',d; assert d['alternative_h_evaluated'] is False and d['next_rung_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-post-16385-cancellation-conditioning-v0-1
          path: |
            artifacts/result.json
            artifacts/history_patch.json
          retention-days: 90
