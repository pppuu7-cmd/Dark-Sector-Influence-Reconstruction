name: dsir-v026-r1-corrected-aq-post-replacement-funnel-audit-v0-1

on:
  push:
    branches:
      - audit/v026-r1-corrected-aq-post-replacement-funnel
    paths:
      - '.github/workflows/dsir-v026-r1-corrected-aq-post-replacement-funnel-audit-v0-1.yml'
      - 'ci/dsir_v026_r1_corrected_aq_post_replacement_funnel_audit_v0_1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PROMO: '41ef654d7552b670c20d3202249d7687bae5f870'
  AUDITOR: 'ci/dsir_v026_r1_corrected_aq_post_replacement_funnel_audit_v0_1.py'
  PRODUCER_ARTIFACT_ID: '10421774259'
  PRODUCER_ZIP_SHA256: '5b3c9e894d1f09d3aab707a1894adaf20df7ed16f3caa1b60a8b8fc00d246c5c'
  SCIENCE_WORKFLOW: 'layerb-beta-v026-r1-sentinel-science-v0-1.yml'

jobs:
  corrected-aq-post-replacement-funnel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout independent audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify independent auditor and exact main replacement
        run: |
          set -euo pipefail
          test "$(git hash-object "$AUDITOR")" = '1b8e7e621014b8ff0f4375faf7a6389a610d38af'
          git cat-file -e "$PROMO^{commit}"
          test "$(git rev-parse "$PROMO:docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_AUTHORITY_V0_1.json")" = '1c9945dd00b137f3e202efa14bf4112fffebf8af'
          test "$(git rev-parse "$PROMO:docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_PACKAGE_QUALIFICATION_V0_1.json")" = 'f7b97f47d9e771e3d3ea78875da5a45962160cd0'
          if git cat-file -e "$PROMO:docs/dsir4/launch/LAYERB_BETA_V0_26_R1_SENTINEL_LAUNCH_V0_1.json" 2>/dev/null; then
            echo 'ERROR: final L unexpectedly present at reviewed replacement head' >&2
            exit 1
          fi

      - name: Download and verify immutable producer receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p safe/producer
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRODUCER_ARTIFACT_ID}/zip" > safe/producer.zip
          printf '%s  %s\n' "$PRODUCER_ZIP_SHA256" safe/producer.zip | sha256sum -c -
          unzip -q safe/producer.zip -d safe/producer
          test "$(wc -c < safe/producer/corrected_aq_post_replacement_audit.json)" = '1970'
          printf '%s  %s\n' 'e0b31076a7dea383a2749c63089373de3b1be1fa4426f6f23c39d7b3c37d43d2' safe/producer/corrected_aq_post_replacement_audit.json | sha256sum -c -

      - name: Capture exact sentinel-science runs at replacement head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${SCIENCE_WORKFLOW}/runs?head_sha=${PROMO}&event=push&per_page=100" > safe/science_runs.json

      - name: Execute independent response-blind funnel audit
        run: |
          set -euo pipefail
          python3 -m py_compile "$AUDITOR"
          python3 "$AUDITOR" \
            --producer-receipt safe/producer/corrected_aq_post_replacement_audit.json \
            --science-runs safe/science_runs.json \
            --out safe/corrected_aq_post_replacement_funnel_audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('safe/corrected_aq_post_replacement_funnel_audit.json'))
          assert d['verdict']=='QUALIFIED'
          assert d['classification']=='SENTINEL_CORRECTED_AQ_POST_REPLACEMENT_FAIL_CLOSED_QUALIFIED_FOR_EXPLICIT_L_GATE_AUTHORITY'
          assert d['minimal_A_delta_reproduced'] is True
          assert d['minimal_Q_delta_reproduced'] is True
          assert d['final_L_present'] is False
          assert d['science_workflow_run_count_at_replacement_head']==0
          assert d['sentinel_science_executed'] is False
          assert d['class_solver_invoked'] is False
          assert d['scientific_response_read'] is False
          assert d['covariance_read'] is False
          assert d['L_gate_authority_creation_admissible'] is True
          assert d['final_L_creation_authorized_by_this_receipt'] is False
          assert d['sentinel_science_execution_authorized_by_this_receipt'] is False
          assert d['full_107_row_execution_authorized'] is False
          assert d['token']=='QUALIFIED_LAYERB_BETA_V0_26_R1_CORRECTED_AQ_POST_REPLACEMENT_FUNNEL_PLUS_0_PLUS_0'
          print(d['token'])
          PY
          sha256sum safe/corrected_aq_post_replacement_funnel_audit.json > safe/corrected_aq_post_replacement_funnel_audit.sha256
          sha256sum safe/science_runs.json > safe/science_runs.sha256

      - name: Persist immutable independent funnel receipt
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-corrected-aq-post-replacement-funnel-audit-v0-1
          path: |
            safe/corrected_aq_post_replacement_funnel_audit.json
            safe/corrected_aq_post_replacement_funnel_audit.sha256
            safe/science_runs.json
            safe/science_runs.sha256
          if-no-files-found: error
          retention-days: 90
