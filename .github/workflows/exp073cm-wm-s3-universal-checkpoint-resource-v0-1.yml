name: Exp073CM Wm_S3 universal-checkpoint direct8 resource v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/exp073cm_wm_s3_resource_launch_v0_1.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: dsir-home-exp073cm-universal-checkpoint
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '8'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  PYTHONUNBUFFERED: '1'

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed prospective authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- docs/SELF_HOSTED_CHECKPOINT_POLICY.md)" = 'f45ae0ce4d199ae381e8612d41cfd7e4c7dfc427'
          test "$(git log -1 --format=%H -- preregistration/2026-09-03_exp073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1.md)" = '914a57e45ee98b6ebbb8830a524ec59bfef0c78b'
          test "$(git log -1 --format=%H -- ci/exp073cm_memory_stable_wm_s3_pcl_v0_1.py)" = '8a5f9f5e0341d24ee843f3097199075c50ab2d02'
          test "$(git log -1 --format=%H -- ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py)" = 'e48737a0f616ed4fa05e4c45cf05d06b05ad6c6f'
          test "$(git log -1 --format=%H -- ci/exp073cl_memory_stable_wm_s3_pcl_v0_1.py)" = 'a4caf0eb3acca2ad1a5fd21b2971cf83a0c02faf'
          test "$(git log -1 --format=%H -- ci/exp073ca_stream_general_coupling_range_v0_1.c)" = 'fa971eb4ef8c47e81eb0bb4e13eeb76f7cf42e22'
          test "$(git log -1 --format=%H -- ci/dsir_checkpoint_git_sync_v0_2.sh)" = 'bc468ca73a3c4e281bd2b1ee46d6f7704bb54bb1'
          test -f experiments/073cm_wm_s3_universal_checkpoint_resource_v0_1_binding.json
          test -f ci/exp073cm_wm_s3_universal_checkpoint_resource_v0_1.activation.json
          WF="$(git log -1 --format=%H -- .github/workflows/exp073cm-wm-s3-universal-checkpoint-resource-v0-1.yml)"
          BIND="$(git log -1 --format=%H -- experiments/073cm_wm_s3_universal_checkpoint_resource_v0_1_binding.json)"
          export WF BIND
          python3 - <<'PY'
          import json, os
          b=json.load(open('experiments/073cm_wm_s3_universal_checkpoint_resource_v0_1_binding.json'))
          a=json.load(open('ci/exp073cm_wm_s3_universal_checkpoint_resource_v0_1.activation.json'))
          assert b['experiment']=='Exp073CM' and b['task']=='Wm_S3'
          assert b['state']=='PREPARED_NOT_AUTHORIZED'
          assert b['universal_checkpoint_required'] is True
          assert b['checkpoint_branch']=='checkpoints/exp073cm-wm-s3-resource-v0-1'
          assert b['checkpoint_stages']==['pcl','reference','target','final']
          assert b['threads']==8 and b['reference_threads']==1 and b['chunk_bands']==8
          assert b['band_range']==[0,8] and b['cpu_fraction_min']==0.90
          assert b['workflow_commit']==os.environ['WF']
          assert b['prereg_commit']=='914a57e45ee98b6ebbb8830a524ec59bfef0c78b'
          assert b['pcl_helper_commit']=='8a5f9f5e0341d24ee843f3097199075c50ab2d02'
          assert b['resource_helper_commit']=='e48737a0f616ed4fa05e4c45cf05d06b05ad6c6f'
          assert b['checkpoint_sync_commit']=='bc468ca73a3c4e281bd2b1ee46d6f7704bb54bb1'
          assert a['experiment']=='Exp073CM' and a['state']=='AUTHORIZED_UNIVERSAL_CHECKPOINT_RESOURCE_V0_1'
          assert a['workflow_commit']==os.environ['WF'] and a['binding_commit']==os.environ['BIND']
          PY
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']; current=int(os.environ['GITHUB_RUN_ID']); repo=os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def count(status):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              return sum(1 for x in data.get('workflow_runs',[]) if int(x['id']) != current)
          q=count('queued'); p=count('in_progress')
          print(f'other_queued={q} other_in_progress={p}')
          assert q==0 and p==0, (q,p)
          PY

  checkpointed-resource:
    needs: authorize
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse or bootstrap proven NaMaster 2.7 environment
        shell: bash
        run: |
          set -euo pipefail
          MF="$HOME/.cache/dsir-miniforge"
          ENV="$HOME/.cache/dsir-nmt27"
          if ! test -x "$MF/bin/conda"; then
            mkdir -p "$HOME/.cache"
            curl -fL --retry 5 --retry-delay 2 https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o "$RUNNER_TEMP/miniforge.sh"
            bash "$RUNNER_TEMP/miniforge.sh" -b -p "$MF"
          fi
          if ! test -x "$ENV/bin/python"; then
            "$MF/bin/conda" create -y -p "$ENV" -c conda-forge python=3.11 namaster=2.7 healpy astropy numpy
          fi
          "$ENV/bin/python" - <<'PY'
          import importlib.metadata
          v=importlib.metadata.version('pymaster')
          assert v=='2.7' or v.startswith('2.7.'),v
          PY
          echo "NMT_PY=$ENV/bin/python" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: exp073r1-v08-hosted-wholestream-ef783ca941fb9b9b5f5eae537986c56ff06e6536
          path: external/r1
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33270843577
      - uses: actions/download-artifact@v4
        with:
          name: exp073cl-exact-des-mask-9a7b1c19aa130c5b11f68c2d9ea73ff9a2f6c105
          path: external/des
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33683175039
      - name: Verify immutable inputs and spill capacity
        shell: bash
        run: |
          set -euo pipefail
          target='external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits'
          test "$(stat -c %s "$target")" = '104595840'
          echo "a519b8522f899e4c33267bb0749f9734f8b7fa760d195636456d370f809a3d55  $target" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/exp073cm-spill" data/derived/g7 build
          free_bytes="$(df -PB1 "$RUNNER_TEMP/exp073cm-spill" | awk 'NR==2 {print $4}')"
          test "$free_bytes" -ge 2684354560
      - name: Compile frozen range helper
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -shared -fPIC -fopenmp -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize \
            ci/exp073ca_stream_general_coupling_range_v0_1.c -o build/exp073ca.so -ldl -lm
      - name: Universal durable checkpointed Wm_S3 qualification
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/exp073cm-checkpoint"
          BR='checkpoints/exp073cm-wm-s3-resource-v0-1'
          RES='e48737a0f616ed4fa05e4c45cf05d06b05ad6c6f'
          bash ci/dsir_checkpoint_git_sync_v0_2.sh restore "$CP" "$BR" ALLOW_ABSENT
          "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py init \
            --checkpoint-dir "$CP" --source-head "$GITHUB_SHA" --resource-helper-commit "$RES"

          if "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py check --checkpoint-dir "$CP" --stage pcl; then
            echo 'RESUME pcl checkpoint valid'
          else
            rc=$?; test "$rc" = 3
            mkdir -p "$RUNNER_TEMP/exp073cm-fresh"
            /usr/bin/time -v -o "$RUNNER_TEMP/exp073cm-pcl-time.txt" \
              "$NMT_PY" ci/exp073cm_memory_stable_wm_s3_pcl_v0_1.py \
              --task Wm_S3 --r1-root external/r1 \
              --lens-mask external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits \
              --spill-root "$RUNNER_TEMP/exp073cm-spill" \
              --out-npy "$RUNNER_TEMP/exp073cm-fresh/pcl.npy" \
              --out-json "$RUNNER_TEMP/exp073cm-fresh/pcl.json"
            "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py store-pcl \
              --checkpoint-dir "$CP" --src-npy "$RUNNER_TEMP/exp073cm-fresh/pcl.npy" --src-json "$RUNNER_TEMP/exp073cm-fresh/pcl.json"
            cp "$RUNNER_TEMP/exp073cm-pcl-time.txt" "$CP/stages/pcl/time.txt"
            bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$BR" 'Exp073CM complete PCL'
          fi

          if "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py check --checkpoint-dir "$CP" --stage reference; then
            echo 'RESUME reference checkpoint valid'
          else
            rc=$?; test "$rc" = 3
            "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py compute \
              --checkpoint-dir "$CP" --stage reference --ca-so build/exp073ca.so
            bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$BR" 'Exp073CM complete reference'
          fi

          if "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py check --checkpoint-dir "$CP" --stage target; then
            echo 'RESUME target checkpoint valid'
          else
            rc=$?; test "$rc" = 3
            "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py compute \
              --checkpoint-dir "$CP" --stage target --ca-so build/exp073ca.so
            bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$BR" 'Exp073CM complete target'
          fi

          "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py finalize --checkpoint-dir "$CP"
          bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$BR" 'Exp073CM final comparator'
          "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py export --checkpoint-dir "$CP" --out-dir data/derived/g7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073cm-wm-s3-checkpointed-resource-${{ github.sha }}
          path: data/derived/g7/exp073cm_*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Enforce frozen classification after durable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          "$NMT_PY" ci/exp073cm_checkpointed_wm_s3_resource_v0_1.py enforce-final \
            --checkpoint-dir "$RUNNER_TEMP/exp073cm-checkpoint"
