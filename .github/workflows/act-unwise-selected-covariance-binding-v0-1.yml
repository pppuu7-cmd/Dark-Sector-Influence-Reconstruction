name: ACT x unWISE selected covariance binding v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/act-unwise-selected-covariance-binding-v0-1.yml'
      - 'ci/act_unwise_selected_covariance_binding_v0_1.py'
      - 'experiments/065b_act_unwise_selected_covariance_binding_v0_1.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: python3 -m pip install --user numpy pyyaml
      - name: Fetch pinned official likelihood source
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/ACTCollaboration/unWISExLens_lklh.git external/unWISExLens_lklh
          git -C external/unWISExLens_lklh checkout 6302c30d9e70f8e4ff2d4a84a9977b4471705179
          test "$(git -C external/unWISExLens_lklh rev-parse HEAD)" = "6302c30d9e70f8e4ff2d4a84a9977b4471705179"
      - name: Fetch exact official data archive
        run: |
          set -euxo pipefail
          mkdir -p external/unwise_data
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://portal.nersc.gov/project/act/act_x_unWISE_xcorr+3x2pt/data_unWISExLens.tar.gz' \
            -o external/data_unWISExLens.tar.gz
          echo '1b2d1563c5eb548ca6488ed8d60c5260d9e110b743a2e3a84620cfe46fbb6570  external/data_unWISExLens.tar.gz' | sha256sum -c -
          tar -xzf external/data_unWISExLens.tar.gz -C external/unwise_data
      - name: Run Exp065B selected covariance audit
        run: |
          set -euxo pipefail
          python3 ci/act_unwise_selected_covariance_binding_v0_1.py \
            --external-repo external/unWISExLens_lklh \
            --extracted-root external/unwise_data \
            --archive external/data_unWISExLens.tar.gz \
            --output data/derived/g7/exp065b_act_unwise_selected_covariance_binding_v0_1.json
      - name: Preserve scientific eligibility outcome
        run: |
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp065b_act_unwise_selected_covariance_binding_v0_1.json'
          d=json.load(open(p))
          assert d['status'] in {
              'PASS_ACT_UNWISE_SELECTED_COVARIANCE_ELIGIBLE_V0_1',
              'FAIL_ACT_UNWISE_SELECTED_COVARIANCE_ELIGIBILITY_V0_1',
          }
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          assert 'No jitter' in d['anti_regularization']
          print('EXP065B_RESULT', d['status'])
          print('COMBINED', d['checks']['combined_selected_covariance'])
          PY
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: exp065b-act-unwise-selected-covariance-${{ github.sha }}
          path: data/derived/g7/exp065b_act_unwise_selected_covariance_binding_v0_1.json
          if-no-files-found: error
