name: exp073iy-article3-layerb-cross-build-reproducibility-v0-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/exp073iy_article3_layerb_cross_build_reproducibility_v0_1.trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: exp073iy-article3-layerb-cross-build-reproducibility-v0-1
  cancel-in-progress: false

jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        replica: [A, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MANIFEST: docs/dsir4/authority/EXP073IM_C2_REAL_INPUT_MANIFEST_V0_4.json
      WM_S3_OVERRIDE: docs/dsir4/authority/EXP073IP_C2_WM_S3_TRANSPORT_OVERRIDE_V0_2.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce frozen lineage
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/dsir4/prereg/EXP073IY_ARTICLE3_LAYERB_CROSS_BUILD_REPRODUCIBILITY_V0_1.md
          test -f docs/dsir4/authority/EXP073IX_ARTICLE3_LAYERB_INSTRUMENTATION_NEUTRALITY_V0_1.json
          python -m py_compile ci/exp073ir_article3_real_layerb_common_response_v0_1.py scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py
          test "$(sha256sum configs/dsir4/c2/ide0_reference_v0_1.ini | awk '{print $1}')" = '0a68f4af6ead7ee69c75f1867f60914a40d4f7ff1219b965a0ae38186ca5c65c'
      - name: Install frozen stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git unzip
          python -m pip install --upgrade pip wheel 'setuptools<76'
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy
      - name: Checkout and build exact solver stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/camb; git -C external/camb init; git -C external/camb remote add origin https://github.com/cmbant/CAMB.git
          git -C external/camb fetch --depth 1 origin fa3f097343fbbe427cc04b4f5f0041c22c6ec764; git -C external/camb checkout --detach FETCH_HEAD
          test "$(git -C external/camb rev-parse HEAD)" = fa3f097343fbbe427cc04b4f5f0041c22c6ec764; python -m pip install ./external/camb
          git clone https://github.com/kaeonikc/class_iv.git external/class_iv; git -C external/class_iv checkout ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv hash-object source/perturbations.c)" = 92a48331658c5941ed4eb43b0e98ee78e39b8385
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; new="extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          make -C external/class_iv -j2 all
          python - <<'PY'
          import classy,camb
          print('CLASSY_FILE',classy.__file__); print('CAMB_FILE',camb.__file__)
          PY
      - name: Download exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/des_nz inputs/parent inputs/angular inputs/expim external/exp073w_boss
          curl --fail --location --retry 3 -o external/des_nz/source.fits 'https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/redshift_bins/y1_redshift_distributions_v1.fits'
          curl --fail --location --retry 3 -o external/des_nz/lens.fits 'https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/chains/2pt_NG_mcal_1110.fits'
          echo 'b5d87138c35ae8bb4ecd02491972f544648398e606b3617039e6e54cb8ea943b  external/des_nz/source.fits' | sha256sum -c -
          echo '114035179b5a8e41090751e9a6478536d185128581d37b5a510eff5722f417ca  external/des_nz/lens.fits' | sha256sum -c -
          get_artifact () { local id="$1" digest="$2" dest="$3"; local zip="${dest}.zip"; mkdir -p "$dest"; gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"; test "$(sha256sum "$zip"|awk '{print $1}')" = "${digest#sha256:}"; unzip -q "$zip" -d "$dest"; }
          get_artifact 10131794281 'sha256:ac959926639d3b46ecfe114e396ce03cb20a0763ef2781db454408d8ad0759df' inputs/parent
          while IFS=$'\t' read -r slot id digest; do get_artifact "$id" "$digest" "inputs/angular/$slot"; done < <(jq -r '.angular[] | [.slot, (.artifact_id|tostring), .artifact_digest] | @tsv' "$MANIFEST")
          id="$(jq -r '.artifact_id' "$WM_S3_OVERRIDE")"; mkdir -p inputs/angular/Wm_S3/transport_override; gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > inputs/angular/Wm_S3/transport_override.zip; unzip -q inputs/angular/Wm_S3/transport_override.zip -d inputs/angular/Wm_S3/transport_override
          expected="$(jq -r '.required_each_canonical_sha256' "$WM_S3_OVERRIDE")"; nbytes="$(jq -r '.required_each_nbytes' "$WM_S3_OVERRIDE")"; for f in inputs/angular/Wm_S3/transport_override/A/selected_te.bin inputs/angular/Wm_S3/transport_override/B/selected_te.bin; do test "$(stat -c%s "$f")" = "$nbytes"; test "$(sha256sum "$f"|awk '{print $1}')" = "$expected"; done; cmp -s inputs/angular/Wm_S3/transport_override/A/selected_te.bin inputs/angular/Wm_S3/transport_override/B/selected_te.bin
          get_artifact 10130241439 'sha256:3325bab0faa821c5ca3b13b4cd64d3d58c323e56a6f3e44952be84bfbc477156' inputs/expim
          base='https://fbeutler.github.io/hub'; curl --fail --location --retry 3 -o external/exp073w_boss/W_NGC_z3.gz "$base/W_BOSS_DR12_NGC_z3_V6C_1_1_1_1_1_10_200_2000_averaged_v1.matrix.gz"; curl --fail --location --retry 3 -o external/exp073w_boss/W_SGC_z3.gz "$base/W_BOSS_DR12_SGC_z3_V6C_1_1_1_1_1_10_200_2000_averaged_v1.matrix.gz"; curl --fail --location --retry 3 -o external/exp073w_boss/M_NGC_z3.gz "$base/M_BOSS_DR12_NGC_z3_V6C_1_1_1_1_1_1200_2000.matrix.gz"; curl --fail --location --retry 3 -o external/exp073w_boss/M_SGC_z3.gz "$base/M_BOSS_DR12_SGC_z3_V6C_1_1_1_1_1_1200_2000.matrix.gz"
          for f in external/exp073w_boss/*.gz; do gzip -t "$f"; gzip -dc "$f" > "${f%.gz}"; done
          echo 'a308dc562d1a7224cefcf91d32580877929e0daa33806517e0d2d53710236827  external/exp073w_boss/W_NGC_z3' | sha256sum -c -; echo '2a542a2d48f3e8c8299f58a885d5273238e4ade32c0f0de020d8b9f23afe7759  external/exp073w_boss/W_SGC_z3' | sha256sum -c -; echo '3ac30e68f79deee59963c5c52f7585e0cde495393963210a3922c1c62513a042  external/exp073w_boss/M_NGC_z3' | sha256sum -c -; echo '3ac30e68f79deee59963c5c52f7585e0cde495393963210a3922c1c62513a042  external/exp073w_boss/M_SGC_z3' | sha256sum -c -
      - name: Execute uninstrumented repaired Exp073IR and capture provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts scratch
          python ci/exp073ir_article3_real_layerb_common_response_v0_1.py --parent-root inputs/parent --parent-authority docs/dsir4/authority/EXP073IQ_ARTICLE3_REAL_LAYERA_SUPPORT_PASS_V0_1.json --manifest "$MANIFEST" --angular-root inputs/angular --expim-root inputs/expim --boss-root external/exp073w_boss --source external/des_nz/source.fits --lens external/des_nz/lens.fits --camb-root external/camb --expz2-script ci/exp073z2_article3_des_radial_kernel_stable_direct_v0_2.py --exp073iq-script ci/exp073iq_article3_real_layera_support_v0_1.py --baseline configs/dsir4/c2/ide0_reference_v0_1.ini --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre --scratch scratch --out artifacts/output.json
          REPLICA='${{ matrix.replica }}' python - <<'PY'
          import hashlib,json,os,platform,subprocess,sys,pathlib,glob
          import numpy,scipy,astropy,camb,classy
          out=pathlib.Path('artifacts/output.json').read_bytes(); d=json.loads(out)
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          camb_so=sorted(glob.glob(str(pathlib.Path(camb.__file__).parent/'*.so')))
          r={'replica':os.environ['REPLICA'],'status':d.get('status'),'max_relative_component_difference':d['convergence']['max_relative_component_difference'],'output_sha256':hashlib.sha256(out).hexdigest(),'output_nbytes':len(out),'python':sys.version,'platform':platform.platform(),'numpy':numpy.__version__,'scipy':scipy.__version__,'astropy':astropy.__version__,'camb_source_sha':subprocess.check_output(['git','-C','external/camb','rev-parse','HEAD'],text=True).strip(),'class_iv_source_sha':subprocess.check_output(['git','-C','external/class_iv','rev-parse','HEAD'],text=True).strip(),'classy_module':str(classy.__file__),'classy_module_sha256':sha(classy.__file__),'camb_shared_objects':[{'path':p,'sha256':sha(p)} for p in camb_so],'covariance_restriction_authorized':d.get('covariance_restriction_authorized',False)}
          pathlib.Path('artifacts/provenance.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('EXP073IY_REPLICA',json.dumps(r,sort_keys=True))
          assert r['status']=='NUMERICALLY_UNRESOLVED_EXP073IR' and r['covariance_restriction_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073iy-replica-${{ matrix.replica }}
          path: |
            artifacts/output.json
            artifacts/provenance.json
          retention-days: 90

  verify:
    needs: rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exp073iy-replica-*
          path: replicas
      - name: Fetch authoritative parent and verify exact cross-build equality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authoritative artifacts
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10134905199/zip" > authoritative.zip
          test "$(sha256sum authoritative.zip|awk '{print $1}')" = '165a85c8348fc4fc4c52f3926aa1a46989179efc8413a059f9fc2d6aa9dfbb21'
          unzip -q authoritative.zip -d authoritative
          python - <<'PY'
          import hashlib,json,pathlib
          P=0.9998247463807295
          pa=pathlib.Path('replicas/exp073iy-replica-A/output.json'); pb=pathlib.Path('replicas/exp073iy-replica-B/output.json')
          parent=next(pathlib.Path('authoritative').glob('*.json'))
          ba,bb,bp=pa.read_bytes(),pb.read_bytes(),parent.read_bytes()
          da,db,dp=map(json.loads,(ba,bb,bp))
          valid=all(d.get('status')=='NUMERICALLY_UNRESOLVED_EXP073IR' and d.get('covariance_restriction_authorized',False) is False for d in (da,db,dp))
          ma=float(da['convergence']['max_relative_component_difference']); mb=float(db['convergence']['max_relative_component_difference']); mp=float(dp['convergence']['max_relative_component_difference'])
          exact=valid and ba==bb==bp and ma==mb==mp==P
          cls='CROSS_BUILD_EXACT_PLUS_0_PLUS_0' if exact else ('CROSS_BUILD_DRIFT_PLUS_0_PLUS_0' if valid else 'INVALID_INFRA_PLUS_0_PLUS_0')
          tok={'CROSS_BUILD_EXACT_PLUS_0_PLUS_0':'PASS_EXP073IY_CROSS_BUILD_EXACT_V0_1','CROSS_BUILD_DRIFT_PLUS_0_PLUS_0':'CROSS_BUILD_DRIFT_EXP073IY_V0_1','INVALID_INFRA_PLUS_0_PLUS_0':'INVALID_EXP073IY_CROSS_BUILD_REPRODUCIBILITY_V0_1'}[cls]
          r={'experiment':'Exp073IY','classification':cls,'token':tok,'replica_A_sha256':hashlib.sha256(ba).hexdigest(),'replica_B_sha256':hashlib.sha256(bb).hexdigest(),'authoritative_parent_sha256':hashlib.sha256(bp).hexdigest(),'A_B_byte_identical':ba==bb,'A_parent_byte_identical':ba==bp,'B_parent_byte_identical':bb==bp,'maxima':[ma,mb,mp],'scientific_authority_created':False,'covariance_restriction_authorized':False}
          pathlib.Path('artifacts/exp073iy_verdict.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(tok); print(json.dumps(r,sort_keys=True)); raise SystemExit(2 if cls=='INVALID_INFRA_PLUS_0_PLUS_0' else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073iy-cross-build-verdict-v0-1
          path: artifacts/exp073iy_verdict.json
          retention-days: 90
