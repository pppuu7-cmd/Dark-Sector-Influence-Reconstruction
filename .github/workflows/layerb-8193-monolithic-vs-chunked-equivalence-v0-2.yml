name: layerb-8193-monolithic-vs-chunked-equivalence-v0-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-8193-monolithic-vs-chunked-equivalence-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  CONTRACT_PATH: docs/dsir4/contracts/LAYERB_8193_MONOLITHIC_VS_CHUNKED_REQUEST_EQUIVALENCE_CONTRACT_V0_1.json
  REPAIR_PATH: docs/dsir4/contracts/LAYERB_8193_MONOLITHIC_VS_CHUNKED_RUNTIME_ISOLATION_REPAIR_CONTRACT_V0_2.json
  CANONICAL_PATH: docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt
  BASELINE: configs/dsir4/c2/ide0_reference_v0_1.ini
  PRECISION: configs/dsir4/c2/dsir_ide_p8_v0_1.pre

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify repair changes runtime isolation only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open('docs/dsir4/contracts/LAYERB_8193_MONOLITHIC_VS_CHUNKED_REQUEST_EQUIVALENCE_CONTRACT_V0_1.json'))
          r=json.load(open('docs/dsir4/contracts/LAYERB_8193_MONOLITHIC_VS_CHUNKED_RUNTIME_ISOLATION_REPAIR_CONTRACT_V0_2.json'))
          assert c['acceptance']['lookup_relative_tolerance']==1e-12
          assert c['acceptance']['max_normalized_response_difference']==1e-12
          assert c['frozen_model']['roles']==r['unchanged_frozen_semantics']['roles']
          assert c['frozen_model']['z_probes']==r['unchanged_frozen_semantics']['z_probes']
          assert c['chunked_build']['request_slices']==r['unchanged_frozen_semantics']['chunk_slices']
          assert r['failed_v0_1_execution']['run_id']==34665499936
          assert r['failed_v0_1_execution']['comparison_reached'] is False
          assert r['only_authorized_repair']['monolithic_virtualenv']=='.venv_mono'
          assert r['only_authorized_repair']['chunk_virtualenv']=='.venv_chunk'
          assert r['scientific_authority'] is False
          assert r['successor_32769_chunked_execution_authorized'] is False
          w=Path('.github/workflows/layerb-8193-monolithic-vs-chunked-equivalence-v0-2.yml').read_text()
          assert 'python3 -m venv .venv_mono' in w and 'python3 -m venv .venv_chunk' in w
          assert '.venv_mono/bin/python ci/layerb_8193_chunk_equivalence_response_dump_v0_1.py' in w
          assert '.venv_chunk/bin/python ci/layerb_8193_chunk_equivalence_response_dump_v0_1.py' in w
          assert "--slice-start 0 --slice-end 8193" in w
          for s in ['0 2049 0','2049 4097 1','4097 6145 2','6145 8193 3']: assert s in w
          print('RUNTIME_ISOLATION_REPAIR_STATIC_PASS_PLUS_0_PLUS_0')
          PY

  role-equivalence:
    needs: [static-audit]
    strategy:
      fail-fast: false
      matrix:
        role: [reference, alpha_minus, beta_plus, beta_minus]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites and isolated Python stacks
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libgsl-dev >/dev/null
          python3 -m venv .venv_mono
          python3 -m venv .venv_chunk
          for v in .venv_mono .venv_chunk; do
            "$v/bin/python" -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
            "$v/bin/python" -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
          done
      - name: Build monolithic 8193-capacity CLASS in mono environment
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.venv_mono/bin:$PATH"
          git clone -q https://github.com/kaeonikc/class_iv.git external_mono
          git -C external_mono checkout -q "$CLASS_COMMIT"
          python - <<'PY'
          from pathlib import Path
          p=Path('external_mono/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 8193',1))
          q=Path('external_mono/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 262144',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external_mono
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external_mono
          python - <<'PY'
          from pathlib import Path
          p=Path('external_mono/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external_mono -j2 all >/dev/null
      - name: Build chunk 2304-capacity CLASS in chunk environment
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.venv_chunk/bin:$PATH"
          git clone -q https://github.com/kaeonikc/class_iv.git external_chunk
          git -C external_chunk checkout -q "$CLASS_COMMIT"
          python - <<'PY'
          from pathlib import Path
          p=Path('external_chunk/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 2304',1))
          q=Path('external_chunk/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 65536',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external_chunk
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external_chunk
          python - <<'PY'
          from pathlib import Path
          p=Path('external_chunk/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external_chunk -j2 all >/dev/null
      - name: Prove runtime binding before any response computation
        run: |
          set -euo pipefail
          mkdir -p artifacts
          MONO_FILE=$(.venv_mono/bin/python -c 'import classy; print(classy.__file__)')
          CHUNK_FILE=$(.venv_chunk/bin/python -c 'import classy; print(classy.__file__)')
          case "$MONO_FILE" in "$GITHUB_WORKSPACE/.venv_mono"/*) ;; *) echo "bad mono binding $MONO_FILE"; exit 71;; esac
          case "$CHUNK_FILE" in "$GITHUB_WORKSPACE/.venv_chunk"/*) ;; *) echo "bad chunk binding $CHUNK_FILE"; exit 72;; esac
          test "$MONO_FILE" != "$CHUNK_FILE"
          grep -qx '#define _MAX_NUMBER_OF_K_FILES_ 8193' external_mono/include/perturbations.h
          grep -qx '#define _ARGUMENT_LENGTH_MAX_ 262144' external_mono/include/parser.h
          grep -qx '#define _MAX_NUMBER_OF_K_FILES_ 2304' external_chunk/include/perturbations.h
          grep -qx '#define _ARGUMENT_LENGTH_MAX_ 65536' external_chunk/include/parser.h
          MONO_SHA=$(sha256sum "$MONO_FILE" | awk '{print $1}')
          CHUNK_SHA=$(sha256sum "$CHUNK_FILE" | awk '{print $1}')
          python3 - "$MONO_FILE" "$CHUNK_FILE" "$MONO_SHA" "$CHUNK_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          d={'schema':'LAYERB_8193_CHUNK_EQUIVALENCE_RUNTIME_BINDING_V0_2','effect':'+0/+0','monolithic_classy_file':sys.argv[1],'chunk_classy_file':sys.argv[2],'monolithic_classy_sha256':sys.argv[3],'chunk_classy_sha256':sys.argv[4],'monolithic_point_capacity':8193,'monolithic_parser_capacity':262144,'chunk_point_capacity':2304,'chunk_parser_capacity':65536,'environments_distinct':sys.argv[1]!=sys.argv[2],'scientific_authority':False,'successor_32769_chunked_execution_authorized':False}
          Path('artifacts/runtime_binding.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Compute monolithic and four frozen chunks
        id: compute
        continue-on-error: true
        run: |
          set +e
          .venv_mono/bin/python ci/layerb_8193_chunk_equivalence_response_dump_v0_1.py --role '${{ matrix.role }}' --canonical "$CANONICAL_PATH" --baseline "$BASELINE" --precision "$PRECISION" --slice-start 0 --slice-end 8193 --expected-point-capacity 8193 --expected-parser-capacity 262144 --out artifacts/mono.json
          rc=$?
          if [ "$rc" -eq 0 ]; then
            for spec in '0 2049 0' '2049 4097 1' '4097 6145 2' '6145 8193 3'; do
              set -- $spec
              .venv_chunk/bin/python ci/layerb_8193_chunk_equivalence_response_dump_v0_1.py --role '${{ matrix.role }}' --canonical "$CANONICAL_PATH" --baseline "$BASELINE" --precision "$PRECISION" --slice-start "$1" --slice-end "$2" --expected-point-capacity 2304 --expected-parser-capacity 65536 --out "artifacts/chunk_$3.json" || { rc=$?; break; }
            done
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compare against unchanged frozen 1e-12 gate
        id: compare
        if: steps.compute.outputs.rc == '0'
        continue-on-error: true
        run: |
          set +e
          .venv_mono/bin/python ci/layerb_8193_chunk_equivalence_compare_v0_1.py --contract "$CONTRACT_PATH" --monolithic artifacts/mono.json --chunks artifacts/chunk_0.json artifacts/chunk_1.json artifacts/chunk_2.json artifacts/chunk_3.json --out artifacts/result.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-8193-chunk-equivalence-v02-${{ matrix.role }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce terminal status after evidence upload
        if: always()
        run: |
          test '${{ steps.compute.outputs.rc }}' = '0'
          test '${{ steps.compare.outputs.rc }}' = '0'

  independent-finalizer:
    needs: [static-audit, role-equivalence]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-8193-chunk-equivalence-v02-*
          path: gathered
      - name: Independently consume all role artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          roles=['reference','alpha_minus','beta_plus','beta_minus']
          vals={}; binds={}; missing=[]
          for r in roles:
              root=Path('gathered')/f'layerb-8193-chunk-equivalence-v02-{r}'
              rp=root/'result.json'; bp=root/'runtime_binding.json'
              if not rp.exists() or not bp.exists(): missing.append(r); continue
              d=json.load(open(rp)); b=json.load(open(bp))
              assert b['environments_distinct'] is True
              assert b['monolithic_point_capacity']==8193 and b['chunk_point_capacity']==2304
              assert b['monolithic_parser_capacity']==262144 and b['chunk_parser_capacity']==65536
              assert b['scientific_authority'] is False and b['successor_32769_chunked_execution_authorized'] is False
              vals[r]=d; binds[r]=b
          if missing:
              classification='LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_V02_INFRASTRUCTURE_FAIL_PLUS_0_PLUS_0'
          elif all(vals[r].get('classification')=='LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_PASS_PLUS_0_PLUS_0' for r in roles):
              classification='LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_V02_ALL_ROLES_PASS_PLUS_0_PLUS_0'
          else:
              classification='LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_V02_ONE_OR_MORE_ROLES_FAIL_PLUS_0_PLUS_0'
          out={'schema':'LAYERB_8193_MONOLITHIC_VS_CHUNKED_EQUIVALENCE_AGGREGATE_V0_2','classification':classification,'effect':'+0/+0','missing_roles':missing,'roles':{r:{'classification':vals[r].get('classification'),'max_normalized_response_difference':vals[r].get('max_normalized_response_difference'),'exact_binary64_fraction':vals[r].get('exact_binary64_fraction'),'worst':vals[r].get('worst'),'runtime_binding_distinct':binds[r].get('environments_distinct')} for r in vals},'scientific_authority':False,'scientific_execution_authorized':False,'successor_32769_chunked_execution_authorized':False,'convergence_metric_computed':False,'Wm_S3_opened':False}
          Path('artifacts/aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(classification)
          if classification.endswith('INFRASTRUCTURE_FAIL_PLUS_0_PLUS_0'): raise SystemExit(41)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-8193-monolithic-vs-chunked-equivalence-aggregate-v0-2
          path: artifacts/aggregate.json
          if-no-files-found: error
          retention-days: 90
