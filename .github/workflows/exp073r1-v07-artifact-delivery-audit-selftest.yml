name: Exp073R1 v0.7 artifact-delivery audit self-test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073r1-desy1-transport-stabilized-replay-v0-7.yml'
      - '.github/workflows/exp073r1-v07-artifact-delivery-audit-selftest.yml'
      - 'ci/exp073r1_v0_7_artifact_delivery_audit.py'
      - 'data/derived/g7/exp073r1_v07_artifact_delivery_risk_audit_v0_1.json'
  pull_request:
    paths:
      - '.github/workflows/exp073r1-desy1-transport-stabilized-replay-v0-7.yml'
      - '.github/workflows/exp073r1-v07-artifact-delivery-audit-selftest.yml'
      - 'ci/exp073r1_v0_7_artifact_delivery_audit.py'
      - 'data/derived/g7/exp073r1_v07_artifact_delivery_risk_audit_v0_1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-delivery-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce frozen-snapshot audit and sensitivity checks
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073r1_v0_7_artifact_delivery_audit.py \
            --workflow .github/workflows/exp073r1-desy1-transport-stabilized-replay-v0-7.yml \
            --out /tmp/exp073r1_v07_artifact_delivery_risk_audit_v0_1.json
          cmp /tmp/exp073r1_v07_artifact_delivery_risk_audit_v0_1.json \
            data/derived/g7/exp073r1_v07_artifact_delivery_risk_audit_v0_1.json

      - name: Assert infrastructure-only fail-closed boundary
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json

          path='data/derived/g7/exp073r1_v07_artifact_delivery_risk_audit_v0_1.json'
          with open(path,encoding='utf-8') as handle:
              d=json.load(handle)
          assert d['status']=='PASS_EXP073R1_V07_ARTIFACT_DELIVERY_RISK_AUDIT'
          assert d['scientific_classification'] is None
          assert d['observed_structure']['future_rerun_duplicate_name_risk'] is True
          assert d['sensitivity_check_count']==3
          assert d['active_run_modified'] is False
          assert d['new_heavy_run_authorized'] is False
          assert d['result_artifact_authorized'] is False
          assert d['support_executor_authorized'] is False
          for key in (
              'support_fraction_evaluated','f_invalid_computed',
              'retained_dimension_evaluated','covariance_read','whitening_read',
              'nuisance_svd_read','relation_null_read','heldout_read','G8_read',
          ):
              assert d[key] is False,key
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('PASS_EXP073R1_V07_ARTIFACT_DELIVERY_AUDIT_NO_LEAKAGE')
          PY
