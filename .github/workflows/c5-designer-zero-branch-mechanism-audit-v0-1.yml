name: C5 designer-zero branch mechanism audit v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c5-designer-zero-branch-mechanism-audit-v0-1.yml'
      - 'ci/c5_designer_zero_branch_mechanism_audit_v0_1.py'
      - 'experiments/069d_c5_designer_zero_branch_mechanism_audit_v0_1.md'
      - 'docs/C5_DESIGNER_ZERO_SOURCE_MECHANISM_AUDIT_2026-08-27.md'

jobs:
  designer-zero-branch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install H-EFTCAMB Python toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git gfortran gcc make liblapack-dev libblas-dev python3 python3-dev python3-pip
          python3 -m pip install --user numpy scipy sympy packaging

      - name: Build pinned H-EFTCAMB Python backend
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/EFTCAMB/EFTCAMB.git eftcamb
          git -C eftcamb checkout 16d9c4e9f85751e30efd0a53b177941713078904
          git -C eftcamb submodule update --init --recursive
          test "$(git -C eftcamb rev-parse HEAD)" = '16d9c4e9f85751e30efd0a53b177941713078904'
          # Source-boundary controls frozen by Exp069D preregistration.
          # The first two runs failed before science because these guards were
          # text/case brittle; the scientific source requirements are unchanged.
          grep -Ei 'dlsoda' eftcamb/fortran/eftcamb/07f_designer_models/007p3_Designer_fR.f90
          grep -Ei 'rtol[^0-9]*1[.]d-12' eftcamb/fortran/eftcamb/07f_designer_models/007p3_Designer_fR.f90
          grep -Ei 'atol[^0-9]*1[.]d-16' eftcamb/fortran/eftcamb/07f_designer_models/007p3_Designer_fR.f90
          grep -F 'model_background_num_points' eftcamb/fortran/eftcamb/07f_designer_models/007p3_Designer_fR.f90
          grep -F 'EFTCAMB_skip_RGR' eftcamb/fortran/eftcamb/09_EFTCAMB_main.f90
          make -C eftcamb/fortran python
          test "$(git -C eftcamb rev-parse HEAD)" = '16d9c4e9f85751e30efd0a53b177941713078904'

      - name: Write Exp069B-matched ordinary baseline
        run: |
          set -euxo pipefail
          mkdir -p exp069d_configs
          cp eftcamb/fortran/eftcamb_test/parameters/base_params.ini exp069d_configs/base.ini
          sed -i 's/^get_scalar_cls[[:space:]]*=.*/get_scalar_cls = F/' exp069d_configs/base.ini
          sed -i 's/^get_tensor_cls[[:space:]]*=.*/get_tensor_cls = F/' exp069d_configs/base.ini
          sed -i 's/^do_lensing[[:space:]]*=.*/do_lensing = F/' exp069d_configs/base.ini
          sed -i 's/^do_nonlinear[[:space:]]*=.*/do_nonlinear = 0/' exp069d_configs/base.ini
          sed -i 's/^hubble[[:space:]]*=.*/hubble = 67/' exp069d_configs/base.ini
          sed -i 's/^ombh2[[:space:]]*=.*/ombh2 = 0.0224/' exp069d_configs/base.ini
          sed -i 's/^omch2[[:space:]]*=.*/omch2 = 0.1200/' exp069d_configs/base.ini
          sed -i 's/^omnuh2[[:space:]]*=.*/omnuh2 = 0/' exp069d_configs/base.ini
          sed -i 's/^massless_neutrinos[[:space:]]*=.*/massless_neutrinos = 3.046/' exp069d_configs/base.ini
          sed -i 's/^nu_mass_eigenstates[[:space:]]*=.*/nu_mass_eigenstates = 0/' exp069d_configs/base.ini
          sed -i 's/^massive_neutrinos[[:space:]]*=.*/massive_neutrinos = 0/' exp069d_configs/base.ini
          sed -i 's/^helium_fraction[[:space:]]*=.*/helium_fraction = 0.2404/' exp069d_configs/base.ini
          sed -i 's/^scalar_amp(1)[[:space:]]*=.*/scalar_amp(1) = 2.10e-9/' exp069d_configs/base.ini
          sed -i 's/^scalar_spectral_index(1)[[:space:]]*=.*/scalar_spectral_index(1) = 0.965/' exp069d_configs/base.ini
          sed -i 's/^reionization[[:space:]]*=.*/reionization = F/' exp069d_configs/base.ini
          sed -i 's/^transfer_kmax[[:space:]]*=.*/transfer_kmax = 0.30/' exp069d_configs/base.ini
          sed -i 's/^feedback_level[[:space:]]*=.*/feedback_level = 3/' exp069d_configs/base.ini
          for key in EFTflag DesignerEFTmodel EFTwDE EFTB0 EFT_ghost_math_stability EFT_mass_math_stability EFT_ghost_stability EFT_gradient_stability EFT_mass_stability EFT_mass_stability_rate EFT_additional_priors EFTCAMB_turn_on_time EFTCAMB_stability_time EFTCAMB_stability_threshold model_background_num_points EFTCAMB_skip_RGR EFTCAMB_GR_threshold; do
            sed -i "/^[[:space:]]*${key}[[:space:]]*=/d" exp069d_configs/base.ini
          done

      - name: Run frozen descriptive Exp069D branch scan
        run: |
          set -euxo pipefail
          python3 ci/c5_designer_zero_branch_mechanism_audit_v0_1.py \
            --eft-root eftcamb \
            --config exp069d_configs/base.ini \
            --output data/derived/g7/exp069d_c5_designer_zero_branch_mechanism_audit_v0_1_summary.json

      - name: Assert mechanism-only boundary
        run: |
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp069d_c5_designer_zero_branch_mechanism_audit_v0_1_summary.json'
          d=json.load(open(p))
          assert d['status']=='DESCRIPTIVE_C5_DESIGNER_ZERO_BRANCH_MECHANISM_AUDIT_V0_1'
          assert d['primary_classification'] in {
              'DESIGNER_BACKGROUND_GRID_LIMITED',
              'RETURN_TO_GR_PATH_SENSITIVE',
              'BACKGROUND_GEOMETRY_MISMATCH',
              'PERTURBATION_EFT_BRANCH_FLOOR',
              'MIXED_OR_UNRESOLVED_DESIGNER_ZERO_MECHANISM',
          }
          assert d['exp069b_preserved_status']=='FAIL_C5_EXPLICIT_EFT_PYTHON_POWER_BRIDGE_V0_1'
          assert d['exp069c_labels']==['RAW_POWER_ZERO_LIMIT_RESIDUAL','KGRID_NONCONVERGENCE']
          assert d['solver_commit']=='16d9c4e9f85751e30efd0a53b177941713078904'
          assert d['frozen']['k_per_logint']==320
          assert d['frozen']['background_points']==[3000,6000,12000,24000]
          assert d['frozen']['geometry_tolerance']==1e-9
          assert d['frozen']['attribution_factor']==2.0
          assert d['frozen']['perturbation_floor']==1e-6
          assert d['frozen']['DLSODA_source_rtol']==1e-12
          assert d['frozen']['DLSODA_source_atol']==1e-16
          assert d['controls']['complete'] is True
          assert d['controls']['explicit_branch_readback_all'] is True
          assert d['controls']['linear_all'] is True
          assert d['controls']['pinned_solver'] is True
          assert d['controls']['upstream_source_modified'] is False
          assert d['c5_provider_certified'] is False
          assert d['support_validity_mask_authorized'] is False
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP069D_PRIMARY',d['primary_classification'])
          print('LABELS',d['labels'])
          print('SCAN_A',d['scan_A_background_grid'])
          print('SCAN_B',d['scan_B_RGR'])
          print('GEOMETRY',d['background_geometry'])
          print('BASELINE_POWER_M',d['baseline_power_M'])
          PY

      - name: Upload immutable Exp069D mechanism record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp069d-c5-designer-zero-branch-${{ github.sha }}
          path: |
            data/derived/g7/exp069d_c5_designer_zero_branch_mechanism_audit_v0_1_summary.json
            data/derived/g7/exp069d_cases/*.json
            data/derived/g7/exp069d_cases/*.log
            exp069d_configs/base.ini
          if-no-files-found: warn
