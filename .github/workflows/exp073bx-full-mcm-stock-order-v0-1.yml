name: Exp073BX full-MCM stock-order exact equivalence v0.1

on:
  push:
    branches: [main]
    paths:
      - 'activations/exp073bx_full_mcm_stock_order_v0_1.activate'

permissions:
  contents: read

jobs:
  hosted-static-and-full-mcm-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Freeze preregistration and helper identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073bx_support_full_mcm_stock_order_equivalence_v0_1_prereg.md)" = "a52c7cba9c8b7f5b248f88a0fc7b1c7e2e21d6b3"
          test "$(git hash-object ci/exp073bx_full_mcm_stock_order_v0_1.py)" = "ae0282cbbcdd298f00765d8de68545fe214cec0e"
          test "$(git hash-object ci/exp073bx_full_mcm_stock_order_v0_1.c)" = "bdfc756e83baa27319090f6aab20272f4144177e"
          grep -Fq 'F1_EXACT_FULL_STOCK_ORDER_EQUIVALENCE' experiments/073bx_support_full_mcm_stock_order_equivalence_v0_1_prereg.md
          grep -Fq 'No closeness threshold is an acceptance criterion.' experiments/073bx_support_full_mcm_stock_order_equivalence_v0_1_prereg.md
          echo 'EXP073BX_SUPPORT_ONLY=1'
          echo 'EXP073BU_SCIENCE_AUTHORITY_FORBIDDEN=1'
          echo 'PASS_EXP073BX_V0_1_HOSTED_STATIC_FREEZE_AUDIT'

      - name: Install exact NaMaster 2.7 plus GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "${GITHUB_ENV}"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"

      - name: Verify runtime source and GSL 2.7
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib, importlib.metadata, inspect
          import pymaster as nmt
          version=importlib.metadata.version('pymaster')
          assert version=='2.7' or version.startswith('2.7.'),version
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          got=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert got=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f',(p,got)
          assert hasattr(nmt.NmtWorkspace,'get_coupling_matrix')
          print('PASS_EXP073BX_V0_1_NAMASTER27_RUNTIME_LINEAGE')
          PY
          grep -Eq '#define GSL_VERSION "2\.7' "${NMT_PREFIX}/include/gsl/gsl_version.h"
          grep '#define GSL_VERSION' "${NMT_PREFIX}/include/gsl/gsl_version.h"

      - name: Compile frozen full-MCM emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/exp073bx-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 \
            -I"${NMT_PREFIX}/include" ci/exp073bx_full_mcm_stock_order_v0_1.c \
            -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm \
            -o "${RUNNER_TEMP}/exp073bx-bin/full_mcm_emulator"
          test -x "${RUNNER_TEMP}/exp073bx-bin/full_mcm_emulator"
          echo "FULL_MCM_EMULATOR=${RUNNER_TEMP}/exp073bx-bin/full_mcm_emulator" >> "${GITHUB_ENV}"
          echo 'PASS_EXP073BX_V0_1_FULL_MCM_EMULATOR_COMPILED'

      - name: Execute frozen three-case full-MCM QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/exp073bx
          "${NMT_PY}" ci/exp073bx_full_mcm_stock_order_v0_1.py \
            --emulator "${FULL_MCM_EMULATOR}" \
            --out data/derived/exp073bx/exp073bx_full_mcm_stock_order_v0_1.json
          echo 'PASS_EXP073BX_V0_1_SYNTHETIC_QA_EXECUTED'

      - name: Upload complete receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073bx-full-mcm-stock-order-${{ github.sha }}
          path: data/derived/exp073bx/exp073bx_full_mcm_stock_order_v0_1.json
          if-no-files-found: warn
