name: GDM zero-limit high-precision calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gdm-high-precision.yml'
      - 'ci/gdm_calibration_trigger.txt'

jobs:
  gdm-high-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout DSIR
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip
          python3 -m pip install --user numpy

      - name: Clone and build pinned GDM_CLASS
        run: |
          git clone https://github.com/s-ilic/gdm_class_public.git external_gdm
          cd external_gdm
          git checkout 4c87916aab5ca124a68f1dd16f31846fc13d1829
          git rev-parse HEAD | tee ../gdm_upstream_sha.txt
          make -j2 class

      - name: Write shared high-precision file
        run: |
          cat > external_gdm/dsir_high.pre <<'EOF'
          k_step_sub = 0.015
          k_step_super = 0.0001
          k_step_super_reduction = 0.1
          start_small_k_at_tau_c_over_tau_h = 1e-6
          start_large_k_at_tau_h_over_tau_k = 0.05
          tight_coupling_trigger_tau_c_over_tau_h = 0.005
          tight_coupling_trigger_tau_c_over_tau_k = 0.008
          start_sources_at_tau_c_over_tau_h = 0.006
          l_max_g = 50
          l_max_pol_g = 25
          l_max_ur = 150
          tol_perturb_integration = 1e-6
          perturb_sampling_stepsize = 0.01
          radiation_streaming_approximation = 2
          radiation_streaming_trigger_tau_over_tau_k = 240.
          radiation_streaming_trigger_tau_c_over_tau = 100.
          ur_fluid_approximation = 2
          ur_fluid_trigger_tau_over_tau_k = 50.
          l_logstep = 1.026
          l_linstep = 25
          neglect_CMB_sources_below_visibility = 1e-30
          transfer_neglect_late_source = 3000.
          l_switch_limber = 40
          accurate_lensing = 1
          num_mu_minus_lmax = 1000.
          delta_l_max = 1000.
          EOF

      - name: Write matched cosmologies
        run: |
          mkdir -p external_gdm/dsir_high_outputs
          cat > external_gdm/dsir_baseline_high.ini <<'EOF'
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          omega_gdm = 0.0
          Omega_Lambda = 0.684
          A_s = 2.10e-9
          n_s = 0.965
          tau_reio = 0.054
          gauge = newtonian
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 800
          P_k_max_h/Mpc = 2.0
          z_pk = 0,1
          write background = yes
          root = dsir_high_outputs/baseline_
          EOF

          cat > external_gdm/dsir_gdm0_high.ini <<'EOF'
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.0
          omega_gdm = 0.1200
          Omega_Lambda = 0.684
          A_s = 2.10e-9
          n_s = 0.965
          tau_reio = 0.054
          gauge = newtonian
          type_gdm = time_only_bins
          smooth_bins_gdm = yes
          time_transition_width_gdm = 8.
          time_values_gdm = 0.00001, 0.0001, 0.001, 0.01, 0.1
          w_values_gdm = 0., 0., 0., 0., 0., 0.
          cs2_values_gdm = 0., 0., 0., 0., 0., 0.
          cv2_values_gdm = 0., 0., 0., 0., 0., 0.
          dynamic_shear_gdm = yes
          output = tCl,pCl,lCl,mPk
          lensing = yes
          l_max_scalars = 800
          P_k_max_h/Mpc = 2.0
          z_pk = 0,1
          write background = yes
          root = dsir_high_outputs/gdm0_
          EOF

      - name: Run high-precision matched calculations
        working-directory: external_gdm
        run: |
          ./class dsir_baseline_high.ini dsir_high.pre 2>&1 | tee dsir_high_outputs/baseline.log
          ./class dsir_gdm0_high.ini dsir_high.pre 2>&1 | tee dsir_high_outputs/gdm0.log

      - name: Compare high-precision products
        run: |
          python3 ci/compare_class_outputs.py \
            --directory external_gdm/dsir_high_outputs \
            --root-a baseline_ \
            --root-b gdm0_ \
            --json external_gdm/dsir_high_outputs/comparison.json

      - name: Record environment
        run: |
          {
            echo "DSIR GDM high-precision zero-limit calibration"
            echo "DSIR commit: $GITHUB_SHA"
            echo -n "GDM upstream: "
            cat gdm_upstream_sha.txt
            uname -a
            python3 --version
            gcc --version | head -1
          } > external_gdm/dsir_high_outputs/environment.txt

      - name: Upload high-precision artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdm-high-precision-${{ github.sha }}
          path: |
            external_gdm/dsir_high_outputs/
            external_gdm/dsir_baseline_high.ini
            external_gdm/dsir_gdm0_high.ini
            external_gdm/dsir_high.pre
            gdm_upstream_sha.txt
          if-no-files-found: error
