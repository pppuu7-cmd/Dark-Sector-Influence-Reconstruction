name: Exp073FG WW_S0_S3 audited home science v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/activations/exp073fg-ww-s0-s3-home-science-v0-1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: dsir-exp073fg-ww-s0-s3-home-science-v0-1
  cancel-in-progress: false

env:
  FG_PREREG_BLOB: '50c64a3f7e341f0a180b9c8dbc83a074f6cae150'
  FG_DRIVER_V01_BLOB: '91b31f7f6e7b4312fab554363700ee0521dc904c'
  FG_DRIVER_V02_BLOB: '8749c20f41e5259787307bbd5d556cb772ceba18'
  FG_HOME_BLOB: '1ca77b18ab9c463b061f0556677ae666fcbac639'
  FA_DRIVER_V01_BLOB: '5c5d6aff574b8ed2679e345903d5f4447e5d5c18'
  FA_DRIVER_V02_BLOB: '9bde1f5de584e3378a1fe365e7a9771146fe08b5'
  FA_HOME_BLOB: '309c464bbfbe4896bd560165985ee7f643d9ee22'
  TASKRUNNER_BLOB: '050ed7dd3387c4fb031f877825e6b3f4d4ce3ef2'
  PATCH_BLOB: 'd534b698f9131688d263eedcef27260386c58641'
  EM_GENERATOR_BLOB: 'bd1795f2a2c2cf80341f212996eb8278e0be53d9'
  EM_COMPARE_BLOB: 'f0de92f3f121592b6d139eb7d948426946d901d1'
  FROZEN_SOURCE_HEAD: 'de83e20a68f79ccf25b89b0d33eb4206e294c757'
  CONTRACT_FP: 'b7845df5ce4bc2bd730461476b7ff0831512003ceb5b3558436005c9876bd251'
  R1_ARTIFACT_ID: '9720335366'
  R1_DIGEST: 'sha256:ff87d8fc7d53b16b786a4eb3d6ffeb103676efb8a548223a187b9f59689f8abd'
  R1_RUN_ID: '33270843577'
  R1_JOB_ID: '99148916507'
  FF_RUN_ID: '34032384956'
  FF_JOB_ID: '101484177968'
  NAMASTER_HEAD: '24365fa59a38c15732f4f37e8b29265b75c442d5'

jobs:
  hosted-code-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Freeze Exp073FG code and exact semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073fg_ww_s0_s3_filebacked_full_resolution_ab_science_v0_1_prereg.md)" = "$FG_PREREG_BLOB"
          test "$(git rev-parse HEAD:ci/exp073fg_ww_s0_s3_durable_ab_production_v0_1.py)" = "$FG_DRIVER_V01_BLOB"
          test "$(git rev-parse HEAD:ci/exp073fg_ww_s0_s3_durable_ab_production_v0_2.py)" = "$FG_DRIVER_V02_BLOB"
          test "$(git rev-parse HEAD:ci/exp073fg_home_filebacked_fullres_v0_1.sh)" = "$FG_HOME_BLOB"
          test "$(git rev-parse HEAD:ci/exp073fa_ww_s0_s2_durable_ab_production_v0_1.py)" = "$FA_DRIVER_V01_BLOB"
          test "$(git rev-parse HEAD:ci/exp073fa_ww_s0_s2_durable_ab_production_v0_2.py)" = "$FA_DRIVER_V02_BLOB"
          test "$(git rev-parse HEAD:ci/exp073fa_home_filebacked_fullres_v0_1.sh)" = "$FA_HOME_BLOB"
          test "$(git rev-parse HEAD:ci/exp073aa_article3_des_angular_task_runner_v0_1.py)" = "$TASKRUNNER_BLOB"
          test "$(git rev-parse HEAD:patches/namaster-v2.7-dsir-filebacked-mcm-read-v0.2.patch)" = "$PATCH_BLOB"
          test "$(git rev-parse HEAD:ci/exp073em_generate_namaster27_storage_reference_v0_1.py)" = "$EM_GENERATOR_BLOB"
          test "$(git rev-parse HEAD:ci/exp073em_compare_namaster27_storage_exact_v0_1.py)" = "$EM_COMPARE_BLOB"
          python3 -m py_compile ci/exp073fg_ww_s0_s3_durable_ab_production_v0_1.py ci/exp073fg_ww_s0_s3_durable_ab_production_v0_2.py
          grep -F "('source_count_map(r1_root,2)', 'source_count_map(r1_root,3)')" ci/exp073fg_ww_s0_s3_durable_ab_production_v0_1.py >/dev/null
          grep -F "('[0,2]', '[0,3]')" ci/exp073fg_ww_s0_s3_durable_ab_production_v0_1.py >/dev/null
          grep -F "('S0->S2', 'S0->S3')" ci/exp073fg_ww_s0_s3_durable_ab_production_v0_1.py >/dev/null
          grep -F 'PASS_EXP073FG_WW_S0_S3_FILEBACKED_AB_EXACT_REPEATABILITY_V0_1' ci/exp073fg_ww_s0_s3_durable_ab_production_v0_1.py >/dev/null
          grep -F 'read_from(str(wp), read_unbinned_MCM=True)' ci/exp073fg_ww_s0_s3_durable_ab_production_v0_2.py >/dev/null
          grep -F 'get_bandpower_windows()' ci/exp073fg_ww_s0_s3_durable_ab_production_v0_2.py >/dev/null
          grep -F 'EXPECTED_MCM_BYTES = 19327352832' ci/exp073fg_ww_s0_s3_durable_ab_production_v0_2.py >/dev/null
          grep -F "3:{'selected':4_196_641" ci/exp073aa_article3_des_angular_task_runner_v0_1.py >/dev/null
          grep -F "'WW_S0_S3'" ci/exp073aa_article3_des_angular_task_runner_v0_1.py >/dev/null
          grep -F 'test "$cpus" = 8' ci/exp073fa_home_filebacked_fullres_v0_1.sh >/dev/null
          grep -F '50*1024*1024*1024' ci/exp073fa_home_filebacked_fullres_v0_1.sh >/dev/null
          ! grep -Eqi 'np\.(allclose|isclose)|rounding_rescue|smoothing_rescue|averaging_rescue' ci/exp073fg_ww_s0_s3_durable_ab_production_v0_1.py ci/exp073fg_ww_s0_s3_durable_ab_production_v0_2.py
          echo PASS_EXP073FG_HOSTED_CODE_AUDIT_V0_1
          echo classification=SUPPORT_PLUS_0_PLUS_0

  hosted-lineage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify R1 S3 authority and admitted S0-S2 predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/runs/$R1_RUN_ID" -o r1-run.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/runs/$R1_RUN_ID/jobs?per_page=100" -o r1-jobs.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/runs/$R1_RUN_ID/artifacts?per_page=100" -o r1-artifacts.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/runs/$FF_RUN_ID" -o ff-run.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/runs/$FF_RUN_ID/jobs?per_page=100" -o ff-jobs.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${hdr[@]}" "$api/actions/jobs/$FF_JOB_ID/logs" -o ff.log
          python3 - <<'PY'
          import json,os
          r=json.load(open('r1-run.json')); jobs=json.load(open('r1-jobs.json'))['jobs']; arts=json.load(open('r1-artifacts.json'))['artifacts']
          assert r['id']==int(os.environ['R1_RUN_ID']) and r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='ef783ca941fb9b9b5f5eae537986c56ff06e6536'
          j=next(x for x in jobs if x['id']==int(os.environ['R1_JOB_ID'])); assert j['status']=='completed' and j['conclusion']=='success'
          a=next(x for x in arts if x['id']==int(os.environ['R1_ARTIFACT_ID'])); assert a['digest']==os.environ['R1_DIGEST'] and not a['expired']
          f=json.load(open('ff-run.json')); fj=json.load(open('ff-jobs.json'))['jobs']
          assert f['id']==int(os.environ['FF_RUN_ID']) and f['status']=='completed' and f['conclusion']=='success'
          q=next(x for x in fj if x['id']==int(os.environ['FF_JOB_ID'])); assert q['status']=='completed' and q['conclusion']=='success'
          PY
          grep -aF 'PASS_EXP073FF_WW_S0_S2_FILEBACKED_PROVENANCE_ADMISSION_V0_1' ff.log >/dev/null
          grep -aF 'classification=SCIENTIFIC_AUTHORITY_ADMITTED' ff.log >/dev/null
          grep -F "3:{'selected':4_196_641,'bytes':16_786_564,'record_sha':'3996f2bacf29d46278773530058d4f5666c0d590bf6cebc06459659166bc60ec'" ci/exp073aa_article3_des_angular_task_runner_v0_1.py >/dev/null
          grep -F "'WW_S0_S3'" ci/exp073aa_article3_des_angular_task_runner_v0_1.py >/dev/null
          echo PASS_EXP073FG_HOSTED_LINEAGE_AUDIT_V0_1
          echo classification=SUPPORT_PLUS_0_PLUS_0

  home-science:
    needs: [hosted-code-audit, hosted-lineage-audit]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      DRIVER_V01_BLOB: '91b31f7f6e7b4312fab554363700ee0521dc904c'
      DRIVER_V02_BLOB: '8749c20f41e5259787307bbd5d556cb772ceba18'
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen ordered S0-to-S3 A/B gate with durable checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/exp073fg_home_filebacked_fullres_v0_1.sh
      - name: Collect compact terminal or partial evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/.cache/dsir/exp073fg-ww-s0-s3-filebacked-ab-v0-1"
          OUT="$RUNNER_TEMP/exp073fg-artifact"
          rm -rf "$OUT"; mkdir -p "$OUT"
          ROOT="$ROOT" OUT="$OUT" python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['ROOT']); out=Path(os.environ['OUT'])
          if root.exists():
              for p in root.rglob('*.json'):
                  try:
                      q=out/p.relative_to(root); q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
                  except OSError:
                      pass
              for rep in ('A','B'):
                  p=root/'checkpoints'/rep/'exact_route'/'selected_ee.bin'
                  if p.exists():
                      q=out/'checkpoints'/rep/'exact_route'/'selected_ee.bin'; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
              for n in ('A_driver.log','B_driver.log','ab_compare_stdout.txt','resource_telemetry.log','terminal_receipt.json'):
                  p=root/n
                  if p.exists(): shutil.copy2(p,out/n)
          PY
      - name: Upload Exp073FG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073fg-ww-s0-s3-filebacked-ab-v0-1
          path: ${{ runner.temp }}/exp073fg-artifact
          if-no-files-found: warn
          retention-days: 30
