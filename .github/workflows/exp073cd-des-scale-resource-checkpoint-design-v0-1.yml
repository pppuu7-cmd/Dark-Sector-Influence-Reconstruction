name: Exp073CD DES-scale resource checkpoint design v0.1

on:
  push:
    paths:
      - 'activations/exp073cd_v0_1.activate'

permissions:
  contents: read

jobs:
  hosted-static-design-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Freeze preregistration identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073cd_exp073bu_des_scale_resource_checkpoint_design_v0_1_prereg.md)" = '3cd435642fd7972d4e932e4098e94e818c6d0282'
          grep -Fq 'D1_DES_SCALE_RESOURCE_CHECKPOINT_DESIGN_PASS' experiments/073cd_exp073bu_des_scale_resource_checkpoint_design_v0_1_prereg.md
          echo PASS_EXP073CD_V0_1_PREREG_FREEZE
      - name: Evaluate exact deterministic sizing and checkpoint contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/073cd_exp073bu_des_scale_resource_checkpoint_design_v0_1_prereg.md').read_text()
          nell=12288
          ncls=2
          dim=ncls*nell
          elems=dim*dim
          raw=elems*8
          row=dim*8
          full=2*39*2*nell*8
          te=39*nell*8
          expected=(24576,603979776,4831838208,196608,15335424,3833856)
          got=(dim,elems,raw,row,full,te)
          if got != expected:
              print('D2_SIZING_IDENTITY_FAIL', got, expected)
              raise SystemExit(2)
          required=[
            'fresh_masks_complete','fresh_workspace_mcm_complete','mcm_fits_verified',
            'full_window_complete','selected_te_complete','replica_receipt_complete',
            'checkpoints/exp073bu-wm-s3-a-v0-1','checkpoints/exp073bu-wm-s3-b-v0-1',
            'No `get_coupling_matrix()` materialization','no cross-replica numerical restore',
            'fail closed','source-head identity','canonical SHA256','resource telemetry',
            'no second full MCM heap copy'
          ]
          missing=[x for x in required if x not in p]
          if missing:
              print('D3_CHECKPOINT_CONTRACT_INCOMPLETE', missing)
              raise SystemExit(3)
          print('D1_DES_SCALE_RESOURCE_CHECKPOINT_DESIGN_PASS')
          print({'dimension':dim,'elements':elems,'raw_bytes':raw,'raw_GiB':raw/2**30,'row_bytes':row,'full_window_bytes':full,'selected_te_bytes':te})
          PY
      - name: Emit support accounting
        shell: bash
        run: |
          echo 'ACCOUNTING=+0/+0'
          echo 'WM_S3_AUTHORITY_CREATED=false'
          echo 'EXP073BU_ACTIVATED=false'
