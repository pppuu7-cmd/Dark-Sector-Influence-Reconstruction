name: Exp073AW Article3 nuisance SVD rank resolution v0.1

on:
  push:
    paths:
      - 'ci/exp073aw_article3_nuisance_svd_rank_resolution_rule_v0_1.trigger'

permissions:
  contents: read

jobs:
  synthetic-nuisance-rank-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical dependency
        run: python -m pip install 'numpy==2.1.3'
      - name: Enforce prospective Exp073AW freeze
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/073aw_article3_nuisance_svd_rank_resolution_rule_v0_1_prereg.md
          test -f experiments/073aw_article3_nuisance_svd_rank_resolution_rule_v0_1_workflow_freeze.md
          test -f ci/exp073aw_article3_nuisance_svd_rank_resolution_rule_v0_1.py
      - name: Run frozen synthetic nuisance rank-resolution matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/g7
          python ci/exp073aw_article3_nuisance_svd_rank_resolution_rule_v0_1.py > data/derived/g7/exp073aw_nuisance_svd_rank_resolution_synthetic_v0_1.json
      - name: Enforce non-scientific accounting
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='data/derived/g7/exp073aw_nuisance_svd_rank_resolution_synthetic_v0_1.json'
          d=json.load(open(p))
          assert d['token']=='PASS_EXP073AW_NUISANCE_SVD_RANK_RESOLUTION_SYNTHETIC_V0_1'
          assert d['classification']=='HOSTED_SYNTHETIC_PASS_NON_SCIENTIFIC_PLUS_0_READINESS'
          assert d['tests_passed']==20
          assert d['article3_scientific_readiness_percent']==52 and d['readiness_increment']==0
          assert d['real_covariance_read'] is False and d['real_nuisance_read'] is False
          assert d['target_response_read'] is False and d['G8_read'] is False and d['scientific_pass_claimed'] is False
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073aw-nuisance-rank-resolution-${{ github.sha }}
          path: data/derived/g7/exp073aw_nuisance_svd_rank_resolution_synthetic_v0_1.json
          if-no-files-found: error
          retention-days: 90
