name: DSIR IDM-DR source-only selector v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/idm-dr-source-selector-v0-1.yml'
      - 'ci/idm_dr_source_selector_v0_1.py'
      - 'experiments/054b_idm_dr_source_selector_v0_1.md'

permissions:
  contents: read

jobs:
  source-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependency
        run: python3 -m pip install --user numpy

      - name: Audit pinned CLASS IDM-DR source contract without building spectra
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/lesgourg/class_public.git class_source
          cd class_source
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git rev-parse HEAD | tee ../exp054b_class_upstream_sha.txt
          grep -n 'a_idm_dr.*pow((1.+z)/1.e7' source/thermodynamics.c | tee ../exp054b_rate_source.txt
          grep -n '4./3. .*Omega0_idr.*Omega0_idm' source/thermodynamics.c | head -n 5 | tee ../exp054b_drag_source.txt
          grep -n 'Omega0_idr = stat_f_idr' source/input.c | tee ../exp054b_idr_density_source.txt
          test -s ../exp054b_rate_source.txt
          test -s ../exp054b_drag_source.txt
          test -s ../exp054b_idr_density_source.txt

      - name: Select coupling grid from source equations only
        run: |
          set -euxo pipefail
          python3 ci/idm_dr_source_selector_v0_1.py --json idm_dr_source_selector_v0_1.json
          cat idm_dr_source_selector_v0_1.json

      - name: Enforce no generated C7 response products in DSIR work area
        run: |
          set -euxo pipefail
          # The pinned upstream clone contains its own shipped example/reference
          # data. Exclude that read-only audit tree and reject response products
          # created anywhere else in this workflow.
          generated="$(find . -path './class_source' -prune -o -type f \( -name '*pk.dat' -o -name '*matterpower*' -o -name '*tk.dat' \) -print)"
          printf '%s\n' "$generated"
          test -z "$generated"

      - name: Record source-only provenance
        if: always()
        run: |
          {
            echo 'Experiment 054B source-only IDM-DR selector'
            echo 'No C7 P(k,z), transfer, or perturbation response generated.'
            echo 'Target source k nodes copied from C3 calibration before C7 response.'
            echo 'Inherited prospective C band: [0.0022992620786061375,0.09951219222831723].'
            echo "DSIR head: $GITHUB_SHA"
            echo -n 'CLASS upstream: '; cat exp054b_class_upstream_sha.txt 2>/dev/null || true
          } > exp054b_environment.txt

      - name: Upload source-selector record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-dr-source-selector-v0-1-${{ github.sha }}
          path: |
            idm_dr_source_selector_v0_1.json
            exp054b_environment.txt
            exp054b_class_upstream_sha.txt
            exp054b_rate_source.txt
            exp054b_drag_source.txt
            exp054b_idr_density_source.txt
          if-no-files-found: warn
