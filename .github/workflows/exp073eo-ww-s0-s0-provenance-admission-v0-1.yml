name: Exp073EO WW_S0_S0 provenance admission v0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/activations/exp073eo-real-en-v0-3.txt'

permissions:
  contents: read
  actions: read

jobs:
  hosted-provenance-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EN_ARTIFACT_ID: '9980311204'
      EN_ARTIFACT_DIGEST: 'sha256:54db5c1c213a041616111071c23ce2710e88c0f085efc9e625dd51538e71dd49'
      EO_AUDITOR_V02_BLOB: '62e71d2541f0e94677b4ecaf3f3184fca15fe3c0'
      EO_PREREG_V02_BLOB: '2f8e615d75d1b920c6d2f2d5c831fed08a7b2a22'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Bind frozen EO v0.2 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073eo_ww_s0_s0_filebacked_checkpoint_provenance_admission_v0_2_prereg.md)" = "$EO_PREREG_V02_BLOB"
          test "$(git rev-parse HEAD:ci/exp073eo_ww_s0_s0_provenance_admission_v0_2.py)" = "$EO_AUDITOR_V02_BLOB"
          test "$(git rev-parse HEAD:ci/exp073eo_consume_real_en_artifact_v0_2.sh)" = 'd28aa333767866d1c0c3a7230e246ca29b1bd1cc'
          test "$(git rev-parse HEAD:ci/exp073eo_ww_s0_s0_provenance_admission_v0_1.py)" = '4403d3e140acd14f0b95a31a8b2851f3229c1da3'
      - name: Install exact auditor runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy==2.3.3'
          python3 - <<'PY'
          import numpy as np
          assert np.__version__ == '2.3.3'
          print('PASS_EXP073EO_NUMPY_RUNTIME_2_3_3')
          PY
      - name: Consume real Exp073EN artifact and audit v0.2 authority admission
        shell: bash
        run: bash ci/exp073eo_consume_real_en_artifact_v0_2.sh
      - name: Upload EO v0.2 admission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073eo-ww-s0-s0-provenance-admission-v0-2
          path: |
            ${{ runner.temp }}/exp073eo-real-v02/eo_admission_receipt.json
            ${{ runner.temp }}/exp073eo-real-v02/eo_stdout.txt
            ${{ runner.temp }}/exp073eo-real-v02/en_run.json
            ${{ runner.temp }}/exp073eo-real-v02/en_artifact.json
          if-no-files-found: warn
          retention-days: 30
