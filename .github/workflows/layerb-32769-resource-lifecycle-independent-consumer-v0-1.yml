name: layerb-32769-resource-lifecycle-independent-consumer-v0-1

on:
  workflow_run:
    workflows:
      - layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: layerb-32769-resource-lifecycle-independent-consumer-v0-1-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  RESOURCE_CONSUMER_BLOB: 'cb9e83377f7f7c0498f0b2bfc3b8b06c2683d9ab'
  SOURCE_WORKFLOW_BLOB: 'e55c0ab05c6b7eb0d622eadba25d7e20cdc4ce16'
  SOURCE_PILOT_BLOB: '100f871822e69cfde7730aba4f6a9ff59c6ad9aa'
  ISOLATION_CONTRACT_BLOB: 'd9d910d89889f6d3a27461a73c3dd72c2a9d2096'
  SOURCE_ARTIFACT_NAME: 'layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3'

jobs:
  independent-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record triggering V0.3 source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,os
          w=json.load(open(os.environ['GITHUB_EVENT_PATH']))['workflow_run']
          out={'source_run_id':w['id'],'source_name':w['name'],'source_path':w.get('path'),'source_head_sha':w['head_sha'],'source_conclusion':w.get('conclusion'),'source_run_attempt':w.get('run_attempt')}
          assert out['source_name']=='layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3',out
          assert out['source_path']=='.github/workflows/layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3.yml',out
          open('evidence/source_workflow_run.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Enforce parser-corrected frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_32769_resource_lifecycle_independent_consumer_v0_3.py)" = "$RESOURCE_CONSUMER_BLOB"
          test "$(git hash-object .github/workflows/layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3.yml)" = "$SOURCE_WORKFLOW_BLOB"
          test "$(git hash-object ci/layerb_32769_response_blind_resource_lifecycle_pilot_v0_2.py)" = "$SOURCE_PILOT_BLOB"
          test "$(git hash-object docs/dsir4/contracts/LAYERB_32769_HIGH_MEMORY_RUNNER_ISOLATION_CONTRACT_V0_1.json)" = "$ISOLATION_CONTRACT_BLOB"

      - name: Download exact triggering V0.3 resource artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Classify V0.3 artifact independently
        id: classify
        shell: bash
        run: |
          set -u
          set +e
          python3 ci/layerb_32769_resource_lifecycle_independent_consumer_v0_3.py --artifact-dir source --out evidence/independent_validation.json
          rc=$?
          set -e
          python3 - "$rc" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          rc=int(sys.argv[1]); p=Path('evidence/independent_validation.json'); d=json.loads(p.read_text())
          PASS='LAYERB_32769_HIGH_MEMORY_RESOURCE_LIFECYCLE_INDEPENDENT_VALIDATION_PASS_PLUS_0_PLUS_0'; FAIL='LAYERB_32769_HIGH_MEMORY_RESOURCE_LIFECYCLE_INDEPENDENT_VALIDATION_FAIL_PLUS_0_PLUS_0'
          assert d['classification'] in {PASS,FAIL}
          ok=d['classification']==PASS
          assert (ok and rc==0 and d['valid'] is True and d['errors']==[]) or ((not ok) and rc==31 and d['valid'] is False and d['errors'])
          src=json.load(open('evidence/source_workflow_run.json'))
          out={'schema':'LAYERB_32769_RESOURCE_LIFECYCLE_EVENT_CHAIN_CONSUMER_RECEIPT_V0_3','classification':d['classification'],'effect':'+0/+0','source_run_id':src['source_run_id'],'source_head_sha':src['source_head_sha'],'source_conclusion':src['source_conclusion'],'independent_validation_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'independent_valid':d['valid'],'independent_errors':d['errors'],'runner_agent_id':d.get('runner_agent_id'),'runner_name':d.get('runner_name'),'parser_capacity':d.get('parser_capacity'),'candidate_memtotal_kb':d.get('candidate_memtotal_kb'),'consumer_execution_completed':True,'scientific_response_read':False,'scientific_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          out['token']=out['classification']; Path('evidence/chain_receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('valid='+('true' if ok else 'false')+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-resource-lifecycle-independent-consumer-v0-1-${{ github.event.workflow_run.id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed if independent V0.3 validation did not pass
        if: steps.classify.outputs.valid != 'true'
        shell: bash
        run: exit 31
