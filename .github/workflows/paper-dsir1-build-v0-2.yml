name: DSIR-I paper build v0.2

on:
  push:
    branches:
      - paper/dsir-i-observable-response-geometry
    paths:
      - 'papers/dsir1/**'
      - 'data/derived/comparison_readiness/**'
      - 'data/derived/g7/**'
      - 'data/derived/retrospective/exp071d_matter_response_geometry_taxonomy_key_metrics_v0_1.json'
      - 'docs/SCIENTIFIC_FINDING_F27_COMMON_RESPONSE_CENTROID_WITHHELD_FAILURE.md'
      - 'docs/CHANNEL_CONDITIONAL_EQUIVALENCE_QUOTIENT_THEOREMS_2026-08-27.md'
      - 'recovery/exp070c_provider_checkpoint_2026-08-27.md'
      - 'recovery/exp069h_c5_provider_certification_checkpoint_2026-08-27.md'
      - '.github/workflows/paper-dsir1-build-v0-2.yml'
  workflow_dispatch:

concurrency:
  group: dsir1-paper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout paper branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install paper build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib

      - name: Run deterministic manuscript audit and v0.2 assembly
        run: |
          python papers/dsir1/audit_paper_v0_2.py

      - name: Audit JCAP front matter
        run: |
          python papers/dsir1/audit_jcap_front_matter.py

      - name: Build JCAP-facing manuscript candidate
        run: |
          python papers/dsir1/build_jcap_candidate.py

      - name: Audit bibliography key integrity
        run: |
          python papers/dsir1/audit_bibliography_integrity.py

      - name: Render deterministic JCAP LaTeX source
        run: |
          python papers/dsir1/build_jcap_latex.py

      - name: Audit retrospective known-sector specificity control
        run: |
          python papers/dsir1/audit_retrospective_specificity_control.py

      - name: Audit retrospective moving-scale nonseparability bridge
        run: |
          python papers/dsir1/audit_moving_scale_nonseparability_bridge.py

      - name: Audit observation-space support closure
        run: |
          python papers/dsir1/audit_observation_space_support_closure.py

      - name: Audit late support-operator eligibility
        run: |
          python papers/dsir1/audit_support_operator_eligibility.py

      - name: Audit observation-route ledger semantics
        run: |
          python papers/dsir1/audit_observation_route_ledger.py

      - name: Build Figure 1 operator architecture
        run: |
          python papers/dsir1/figures/fig01_operator_architecture.py

      - name: Build Figure 2 additive-core failure
        run: |
          python papers/dsir1/figures/fig02_additive_core_failure.py

      - name: Build Figure 3 finite-amplitude hierarchy
        run: |
          python papers/dsir1/figures/fig03_chiI_hierarchy.py

      - name: Build Figure 4 channel-conditional degeneracy
        run: |
          python papers/dsir1/figures/fig04_channel_conditional_degeneracy.py

      - name: Build Figure 5 curvature and localization
        run: |
          python papers/dsir1/figures/fig05_curvature_and_localization.py

      - name: Build Figure 6 failure-resistant science
        run: |
          python papers/dsir1/figures/fig06_failure_resistant_science.py

      - name: Build Figure 7 observation-space support closure
        run: |
          python papers/dsir1/figures/fig07_observation_space_support_closure.py

      - name: Record build checksums
        run: |
          mkdir -p papers/dsir1/build
          sha256sum papers/dsir1/manuscript_v0_2.md > papers/dsir1/build/SHA256SUMS.txt
          sha256sum papers/dsir1/manuscript_jcap_candidate.md >> papers/dsir1/build/SHA256SUMS.txt
          sha256sum papers/dsir1/jcap/dsir1_jcap.tex >> papers/dsir1/build/SHA256SUMS.txt
          sha256sum papers/dsir1/MOVING_SCALE_NONSEPARABILITY_BRIDGE.md >> papers/dsir1/build/SHA256SUMS.txt
          sha256sum papers/dsir1/evidence/moving_scale_nonseparability_bridge_v0_1.json >> papers/dsir1/build/SHA256SUMS.txt
          sha256sum papers/dsir1/audit_moving_scale_nonseparability_bridge.py >> papers/dsir1/build/SHA256SUMS.txt
          find papers/dsir1/figures/generated -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum >> papers/dsir1/build/SHA256SUMS.txt
          {
            echo "git_commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "python=$(python --version 2>&1)"
          } > papers/dsir1/build/BUILD_ENVIRONMENT.txt
          cat papers/dsir1/build/SHA256SUMS.txt

      - name: Upload paper build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsir1-paper-v0-2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/dsir1/manuscript_v0_2.md
            papers/dsir1/manuscript_jcap_candidate.md
            papers/dsir1/jcap/dsir1_jcap.tex
            papers/dsir1/JCAP_FRONT_MATTER_DRAFT.md
            papers/dsir1/JCAP_SUBMISSION_CHECKLIST.md
            papers/dsir1/ACKNOWLEDGMENTS_AND_DISCLOSURES.md
            papers/dsir1/ABSTRACT_CONCLUSIONS_CLAIM_AUDIT.md
            papers/dsir1/PROVENANCE_MATRIX.md
            papers/dsir1/SUPPORT_OPERATOR_PROVENANCE.md
            papers/dsir1/OBSERVATION_ROUTE_LEDGER.md
            papers/dsir1/NUMERICAL_METHODS_APPENDIX.md
            papers/dsir1/REFEREE_ADVERSARIAL_AUDIT.md
            papers/dsir1/TABLES_DRAFT.md
            papers/dsir1/CLAIMS_LEDGER.md
            papers/dsir1/AUTHOR_METADATA.yml
            papers/dsir1/LITERATURE_POSITIONING.md
            papers/dsir1/FIGURE_MANIFEST.md
            papers/dsir1/FIGURE_CAPTIONS.md
            papers/dsir1/FIGURE_PLACEMENT.md
            papers/dsir1/MOVING_SCALE_NONSEPARABILITY_BRIDGE.md
            papers/dsir1/references.bib
            papers/dsir1/evidence/*.json
            papers/dsir1/figures/generated/*.pdf
            papers/dsir1/figures/generated/*.png
            papers/dsir1/figures/generated/*.svg
            papers/dsir1/figures/generated/*_provenance.json
            papers/dsir1/build/SHA256SUMS.txt
            papers/dsir1/build/BUILD_ENVIRONMENT.txt
