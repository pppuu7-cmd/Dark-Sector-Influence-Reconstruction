name: DSIR V0.26 R1 response-blind artifact transport qualification v0.1

# One-shot infrastructure/provenance qualification only.
# No CLASS, scientific response, covariance, diagnostic producer, or downstream science.

on:
  push:
    branches:
      - main
    paths:
      - docs/dsir4/launch/LAYERB_BETA_V0_26_R1_RESPONSE_BLIND_ARTIFACT_TRANSPORT_QUALIFICATION_V0_1.launch.json

permissions:
  contents: read
  actions: read

concurrency:
  group: dsir-v026-r1-response-blind-artifact-transport-qualification-v0-1
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify Actions artifact auth and redirect transport
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering main head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective authority, Critic, implementation and frozen target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path('docs/dsir4/launch/LAYERB_BETA_V0_26_R1_RESPONSE_BLIND_ARTIFACT_TRANSPORT_QUALIFICATION_V0_1.launch.json')
          authority_path = Path('docs/dsir4/authority/LAYERB_BETA_V0_26_R1_RESPONSE_BLIND_ARTIFACT_TRANSPORT_QUALIFICATION_AUTHORITY_V0_1.json')
          critic_path = Path('docs/dsir4/authority/LAYERB_BETA_V0_26_R1_RESPONSE_BLIND_ARTIFACT_TRANSPORT_QUALIFICATION_STATIC_CRITIC_V0_1.json')
          script_path = Path('ci/layerb_beta_v026_r1_response_blind_artifact_transport_qualification_v0_1.py')
          workflow_path = Path('.github/workflows/dsir-v026-r1-response-blind-artifact-transport-qualification-v0-1.yml')
          parent_terminal_path = Path('docs/dsir4/authority/LAYERB_BETA_V0_26_R1_GRID896_V0_8_REPAIR_PRIMITIVE_QUALIFICATION_TERMINAL_V0_1.json')

          def blob(path: Path) -> str:
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          marker = json.loads(marker_path.read_text(encoding='utf-8'))
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          critic = json.loads(critic_path.read_text(encoding='utf-8'))

          assert blob(parent_terminal_path) == '6dd77a82f8eae2db23fd7b8dd1913289918c5b44'
          assert marker['qualification_script_git_blob_sha1'] == blob(script_path)
          assert marker['qualification_workflow_git_blob_sha1'] == blob(workflow_path)
          assert marker['qualification_authority_git_blob_sha1'] == blob(authority_path)
          assert marker['static_critic_git_blob_sha1'] == blob(critic_path)
          assert authority['qualification_script_git_blob_sha1'] == blob(script_path)
          assert authority['qualification_workflow_git_blob_sha1'] == blob(workflow_path)
          assert critic['reviewed_qualification_script_git_blob_sha1'] == blob(script_path)
          assert critic['reviewed_qualification_workflow_git_blob_sha1'] == blob(workflow_path)
          assert critic['verdict'] == 'PASS_SCOPED'
          assert marker['authorized_run_number'] == 1
          assert marker['authorized_run_attempt'] == 1
          assert marker['artifact_id'] == 10508904186
          assert marker['expected_outer_zip_sha256'] == 'b8897d2b5ff336be7f472bca740f1bc4b82e301b7b6ca0381127627a71050ffd'
          assert marker['expected_sole_member'] == 'R01.json'
          assert marker['class_solver_invocation_authorized'] is False
          assert marker['scientific_response_read_authorized'] is False
          assert marker['covariance_read_authorized'] is False
          assert marker['scientific_classifier_authorized'] is False
          PY

      - name: Run response-blind artifact transport qualification
        id: qualify
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ci/layerb_beta_v026_r1_response_blind_artifact_transport_qualification_v0_1.py \
            --output results/dsir4/response_blind_artifact_transport_qualification_v0_1/result.json

      - name: Upload immutable transport qualification result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-v026-r1-response-blind-artifact-transport-qualification-v0-1
          path: results/dsir4/response_blind_artifact_transport_qualification_v0_1/result.json
          if-no-files-found: error
          retention-days: 90

      - name: Reflect frozen transport classification
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/dsir4/response_blind_artifact_transport_qualification_v0_1/result.json')
          if not p.is_file():
              raise SystemExit('missing transport qualification result')
          d = json.loads(p.read_text(encoding='utf-8'))
          print(d['classification'])
          raise SystemExit(0 if d['classification'] == 'PASS_HISTORICAL_ACTIONS_ARTIFACT_TRANSPORT_PRIMITIVE_QUALIFIED' else 1)
          PY
