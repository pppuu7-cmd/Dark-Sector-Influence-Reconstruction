name: Exp073FM canonical FR autoqueue static audit v0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/activations/exp073fm-canonical-autoqueue-static-audit-v0-2.txt'

permissions:
  contents: read

jobs:
  hosted-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical post-terminal generation and S1S2 handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073fr_ww_s1_s1_filebacked_checkpoint_provenance_admission_v0_1_prereg.md)" = 'aa08636426dd48142c3a3da7c032f1075a1be1f9'
          test "$(git rev-parse HEAD:ci/exp073fr_verify_fm_terminal_evidence_v0_1.py)" = '127beca2392e6b093d08330828a764a3108b646b'
          test "$(git rev-parse HEAD:ci/exp073fr_generate_canonical_admission_workflow_v0_1.py)" = '47a96ab38674d0997a73205312c4a41be86a8218'
          test "$(git rev-parse HEAD:.github/workflows/exp073fm-terminal-autoqueue-consumer-v0-1.yml)" = 'a5a72a23cc5067aeb1131cda936a6b6d4cfa1098'
          test "$(git rev-parse HEAD:.github/workflows/exp073fs-ww-s1-s2-home-science-v0-1.yml)" = '157850a2ae01b7c58c0bfac20df6360525f3a198'
          test "$(git rev-parse HEAD:experiments/073fs_ww_s1_s2_filebacked_full_resolution_ab_science_v0_1_prereg.md)" = '80c6af017b47d51db3f588221749fb152577b0e5'
          test "$(git rev-parse HEAD:experiments/073ft_ww_s1_s2_provenance_admission_v0_1_prereg.md)" = '072bdeae68e86312142e980fe2015f979e7b117f'
          test "$(git rev-parse HEAD:ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py)" = '030f64f4d1b5bb233ad977b6a6971ebb197d45bf'
          test "$(git rev-parse HEAD:ci/exp073fs_ww_s1_s2_durable_ab_production_v0_2.py)" = 'a02370a5d9d588a813026dee6355c8a1c58a380d'
          test "$(git rev-parse HEAD:ci/exp073fs_verify_and_prune_replica_v0_1.py)" = '92bf5eaa047d97adeddad240784dcc5176c9459e'
          test "$(git rev-parse HEAD:ci/exp073fs_compare_terminal_receipts_v0_1.py)" = '826fcefc8ce64a26e8c8205b1898f63c42ffc0f0'
          test "$(git rev-parse HEAD:ci/exp073fs_home_filebacked_fullres_v0_1.sh)" = 'a9f1777c68db522c02068828bc9e47a78b065681'
          test ! -e experiments/073fr_ww_s1_s1_provenance_admission_and_successor_dispatch_v0_1_prereg.md
          test ! -e .github/workflows/exp073fr-ww-s1-s1-provenance-admission-and-dispatch-v0-1.yml
          test ! -e .github/workflows/exp073fr-ww-s1-s1-canonical-admission-v0-1.yml
          python3 -m py_compile ci/exp073fr_verify_fm_terminal_evidence_v0_1.py ci/exp073fr_generate_canonical_admission_workflow_v0_1.py ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py ci/exp073fs_ww_s1_s2_durable_ab_production_v0_2.py ci/exp073fs_verify_and_prune_replica_v0_1.py ci/exp073fs_compare_terminal_receipts_v0_1.py
          bash -n ci/exp073fs_home_filebacked_fullres_v0_1.sh
          grep -F "workflows: ['Exp073FM WW_S1_S1 audited home science v0.1']" .github/workflows/exp073fm-terminal-autoqueue-consumer-v0-1.yml >/dev/null
          grep -F 'PASS_EXP073FM_TERMINAL_EVIDENCE_CONSUMED_FOR_CANONICAL_FR_V0_1' .github/workflows/exp073fm-terminal-autoqueue-consumer-v0-1.yml >/dev/null
          grep -F "CANONICAL_WORKFLOW: '.github/workflows/exp073fr-ww-s1-s1-canonical-admission-v0-1.yml'" .github/workflows/exp073fm-terminal-autoqueue-consumer-v0-1.yml >/dev/null
          D="sha256:$(printf '%064d' 0)"
          python3 ci/exp073fr_generate_canonical_admission_workflow_v0_1.py --candidate-run 34050657030 --candidate-job 101533574294 --candidate-head f0caca0c3e812710e5958ee13348a150d045a7d8 --artifact-id 9999999999 --artifact-name exp073fm-ww-s1-s1-filebacked-ab-v0-1 --artifact-size 1 --artifact-digest "$D" --consumer-run 88888888888 --out dryrun-fr.yml
          grep -F 'name: Exp073FR WW_S1_S1 provenance admission and successor dispatch v0.1' dryrun-fr.yml >/dev/null
          grep -F "PREREG_BLOB: 'aa08636426dd48142c3a3da7c032f1075a1be1f9'" dryrun-fr.yml >/dev/null
          grep -F "VERIFIER_BLOB: '127beca2392e6b093d08330828a764a3108b646b'" dryrun-fr.yml >/dev/null
          grep -F "SUCCESSOR_WORKFLOW: 'exp073fs-ww-s1-s2-home-science-v0-1.yml'" dryrun-fr.yml >/dev/null
          grep -F 'PASS_EXP073FR_WW_S1_S1_FILEBACKED_PROVENANCE_ADMISSION_V0_1' dryrun-fr.yml >/dev/null
          grep -F 'ww_s1_s1_authority_created=true' dryrun-fr.yml >/dev/null
          grep -F "assert r['name']=='Exp073FR WW_S1_S1 provenance admission and successor dispatch v0.1'" .github/workflows/exp073fs-ww-s1-s2-home-science-v0-1.yml >/dev/null
          grep -F 'compute_coupling_matrix(f1,f2,b)' ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F "'ordered_source_indices':[1,2]" ci/exp073fs_ww_s1_s2_durable_ab_production_v0_1.py >/dev/null
          grep -F 'EXPECTED_MCM_BYTES = 19327352832' ci/exp073fs_ww_s1_s2_durable_ab_production_v0_2.py >/dev/null
          ! grep -Eqi 'np\.(allclose|isclose)|rounding_rescue|smoothing_rescue|averaging_rescue' ci/exp073fr_*.py ci/exp073fs_*.py experiments/073fr_ww_s1_s1_filebacked_checkpoint_provenance_admission_v0_1_prereg.md experiments/073f[st]_*.md
          echo PASS_EXP073FM_CANONICAL_FR_AUTOQUEUE_STATIC_AUDIT_V0_2
          echo classification=SUPPORT_PLUS_0_PLUS_0
          echo self_hosted_science_started=false
