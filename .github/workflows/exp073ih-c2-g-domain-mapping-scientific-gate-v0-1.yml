name: Exp073IH C2 G_DOMAIN_MAPPING Scientific Gate v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073ih-c2-g-domain-mapping-scientific-gate-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  domain-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen gate and contract identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073IH_C2_G_DOMAIN_MAPPING_SCIENTIFIC_GATE_V0_1.md)" = '63ea9e9c11b1f77353af613eb8236b5c5961b1fd'
          test "$(git hash-object docs/dsir4/DSIR4_MODEL_FUNNEL_MATRIX_CONTRACT_V0_1.md)" = '2ad6d26381119442ccd3811b29f24522f5f6eeff'
          test "$(git hash-object docs/dsir4/DSIR4_MODEL_MAPPING_ARTIFACT_CONTRACT_V0_1.md)" = '03fd11d8536b9743eb82f92f9a0d5386444079ed'
          test "$(git hash-object docs/dsir4/DSIR4_COMMON_RESIDUAL_CONVENTION_V0_1.md)" = '9ab68fe254891a076e24757de724e32e2190bfb6'
          test "$(git hash-object docs/dsir4/mappings/C2_IDE_LOCAL_TANGENT_CONE_MAPPING_V0_1.md)" = '5f2b690e4f56fc0fd3109ff2bcdb53dd0eb806cc'
          test "$(sha256sum docs/dsir4/mappings/C2_IDE_LOCAL_TANGENT_CONE_MAPPING_V0_1.md | awk '{print $1}')" = '7f660b6806494b00d17caed50b7cc66d01d9d02bc4cb1d66f333c1c12e1386df'
          test "$(git hash-object docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_V0_1.md)" = '7e244010ca65050d0c8edff8fe90a9583845a568'
          test "$(git hash-object docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_BASIS_V0_1.jsonl)" = 'b3c5dc5ec6aefb79f215c5e01d7baef566cc5251'
          test "$(sha256sum docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_BASIS_V0_1.jsonl | awk '{print $1}')" = '2836a3665e6bab75587957228fbd3b9e152ef7d6e667966c308d81bf666c7c56'
      - name: Verify raw upstream IF and IG authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/102144147469/logs" -o /tmp/if.log
          grep -Fq 'PASS_EXP073IF_C2_RESIDUAL_MAPPING_ARTIFACT_ADMISSION_V0_1' /tmp/if.log
          grep -Fq 'mapping_ready=true' /tmp/if.log
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/102147045097/logs" -o /tmp/ig.log
          grep -Fq 'PASS_EXP073IG_C2_LOCAL_TANGENT_PREDICTION_ARTIFACT_ADMISSION_V0_1' /tmp/ig.log
          grep -Fq 'prediction_ready=true' /tmp/ig.log
          grep -Fq 'scientific_model_authority_created=false' /tmp/ig.log
      - name: Evaluate frozen G_DOMAIN_MAPPING rule
        shell: bash
        run: |
          set -euo pipefail
          m=docs/dsir4/mappings/C2_IDE_LOCAL_TANGENT_CONE_MAPPING_V0_1.md
          p=docs/dsir4/predictions/C2_IDE_LOCAL_TANGENT_CONE_PREDICTION_V0_1.md
          grep -Fq 'rho_X = rho_idm_iv + rho_iv' "$m"
          grep -Fq 'p_X = -rho_iv' "$m"
          grep -Fq 'delta_rho_X = rho_idm_iv * delta_idm_iv' "$m"
          grep -Fq 'q_X = 0' "$m"
          grep -Fq 'delta_p_X = 0' "$m"
          grep -Fq 'pi_X = 0' "$m"
          grep -Fq 'Q = alpha_idm_iv * H * rho_idm_iv + beta_idm_iv * H * rho_iv' "$m"
          grep -Fq 'z_min = 0.295' "$m"
          grep -Fq 'z_max = 2.33' "$m"
          grep -Fq 'k_min_exclusive_mpc_inv = 0' "$m"
          grep -Fq 'k_max_mpc_inv = 0.06664762008318016' "$m"
          grep -Fq 'No effective `z`, effective `k`, interpolation rescue or extrapolation is allowed.' "$m"
          grep -Fq 'linear scalar perturbation regime' "$m"
          grep -Fq 'no quasi-static, sub-horizon, smoothing, rounding, averaging or fiducial-P approximation' "$m"
          grep -Fq 'Delta_pred(alpha,beta;z,k) = Delta_ref(z,k) + alpha*dDelta_dalpha(z,k) + beta*dDelta_dbeta(z,k)' "$p"
          grep -Fq 'first-order local tangent approximation at `(0,0)` only' "$p"
          grep -Fq 'No interpolation or extrapolation is admitted by this artifact.' "$p"
          echo 'PASS_EXP073IH_C2_G_DOMAIN_MAPPING_V0_1'
          echo 'hypothesis_id=C2_IDE_LOCAL_TANGENT_CONE'
          echo 'G_DOMAIN_MAPPING=PASS'
          echo 'mapping_ready=true'
          echo 'prediction_ready=true'
          echo 'numerically_evaluated=true'
          echo 'numerically_evaluated_scope=G_DOMAIN_MAPPING_ONLY'
          echo 'G_ANGULAR_AUTHORITY=NOT_YET_TESTABLE'
          echo 'overall_status=NOT_YET_TESTABLE'
          echo 'scientific_model_authority_created=false'
