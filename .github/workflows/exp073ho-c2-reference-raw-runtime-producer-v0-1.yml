name: Exp073HO C2 reference raw runtime producer v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/dsir4/contracts/EXP073HO_RUNTIME_BINDING_V0_1.txt'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  hosted-reference-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen runtime binding
        shell: bash
        run: |
          set -euo pipefail
          M=docs/dsir4/contracts/EXP073HO_RUNTIME_BINDING_V0_1.txt
          get(){ awk -F= -v k="$1" '$1==k{print $2}' "$M"; }
          test "$(git hash-object docs/dsir4/prereg/EXP073HO_C2_REFERENCE_RAW_RUNTIME_PRODUCER_V0_1.md)" = "$(get PREREG_BLOB)"
          test "$(git hash-object scripts/dsir4/exp073hn_c2_reference_runtime_driver_v0_1.py)" = "$(get DRIVER_BLOB)"
          test "$(git hash-object scripts/dsir4/exp073hn_c2_endpoint_serializer_v0_1.c)" = "$(get SERIALIZER_BLOB)"
          test "$(git hash-object .github/workflows/exp073ho-c2-reference-raw-runtime-producer-v0-1.yml)" = "$(get WORKFLOW_BLOB)"
          test "$(sha256sum configs/dsir4/c2/ide0_reference_v0_1.ini | awk '{print $1}')" = "0a68f4af6ead7ee69c75f1867f60914a40d4f7ff1219b965a0ae38186ca5c65c"
          test "$(sha256sum configs/dsir4/c2/dsir_ide_p8_v0_1.pre | awk '{print $1}')" = "463a3960d6a955c1e2a561e988562a1fc5486b0b79f120eb634ccca6f86002f9"
      - name: Build exact post-HM producer and HN serializer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgsl-dev
          git clone --quiet https://github.com/kaeonikc/class_iv.git /tmp/class_iv
          git -C /tmp/class_iv checkout --quiet ac627d54e9ce196a08878d1ba33999819925d19c
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py /tmp/class_iv
          python scripts/dsir4/exp073hb_c2_exact_endpoint_producer_patch_v0_1.py /tmp/class_iv
          python scripts/dsir4/exp073hj_c2_complete_native_record_observation_patch_v0_1.py /tmp/class_iv
          python scripts/dsir4/exp073hm_c2_mpk_native_theta_observer_guard_patch_v0_1.py /tmp/class_iv
          test "$(sha256sum /tmp/class_iv/source/perturbations.c | awk '{print $1}')" = "8c76c0b0ba8de6c0528980569ae748b24ff1b790a9f752ac11e90ca71d5b63de"
          test "$(sha256sum /tmp/class_iv/tools/evolver_ndf15.c | awk '{print $1}')" = "b3967efaf7a45a3ec6c0144e892caab54f91c595bc726dc1704cfb812f9c0df6"
          make -C /tmp/class_iv -j2 class
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iscripts/dsir4 scripts/dsir4/exp073hn_c2_endpoint_serializer_v0_1.c -lm -o /tmp/exp073hn_serializer
      - name: Execute frozen 28-request raw producer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ho/packets /tmp/ho/raw /tmp/ho/work
          python scripts/dsir4/exp073hn_c2_reference_runtime_driver_v0_1.py --plan-only > /tmp/ho/plan.jsonl
          test "$(wc -l < /tmp/ho/plan.jsonl)" -eq 28
          python - <<'PY' > /tmp/ho/requests.tsv
          import json
          for line in open('/tmp/ho/plan.jsonl'):
              r=json.loads(line); print(r['request_id'],r['z_literal'],r['k_mpc_literal'],sep='\t')
          PY
          while IFS=$'\t' read -r rid z k; do
            d="/tmp/ho/work/$rid"; mkdir -p "$d/ide_outputs"
            cp configs/dsir4/c2/ide0_reference_v0_1.ini "$d/ide0.ini"
            printf '\nk_output_values = %s\n' "$k" >> "$d/ide0.ini"
            cp configs/dsir4/c2/dsir_ide_p8_v0_1.pre "$d/dsir_ide_p8.pre"
            (cd "$d" && DSIR_C2_EXACT_Z="$z" /tmp/class_iv/class ide0.ini dsir_ide_p8.pre >stdout.txt 2>stderr.txt)
            cat "$d/stdout.txt" "$d/stderr.txt" > "/tmp/ho/raw/$rid.log"
            grep '^DSIR_C2_EXACT_ENDPOINT ' "/tmp/ho/raw/$rid.log" > "/tmp/ho/raw/$rid.endpoint"
            test "$(wc -l < /tmp/ho/raw/$rid.endpoint)" -eq 1
            grep -q "^DSIR_C2_EXACT_ENDPOINT z=$z " "/tmp/ho/raw/$rid.endpoint"
            line="$(cat /tmp/ho/raw/$rid.endpoint)"
            /tmp/exp073hn_serializer "/tmp/ho/packets/$rid.bin" "$line" 2>>"/tmp/ho/raw/$rid.serializer.log"
            test "$(stat -c%s /tmp/ho/packets/$rid.bin)" -eq 64
          done < /tmp/ho/requests.tsv
          : > /tmp/ho/dsir_c2_reference_raw_v0_1.bin
          while IFS=$'\t' read -r rid z k; do cat "/tmp/ho/packets/$rid.bin" >> /tmp/ho/dsir_c2_reference_raw_v0_1.bin; done < /tmp/ho/requests.tsv
          test "$(stat -c%s /tmp/ho/dsir_c2_reference_raw_v0_1.bin)" -eq 1792
          test "$(find /tmp/ho/packets -name '*.bin' -type f | wc -l)" -eq 28
          sha256sum /tmp/ho/dsir_c2_reference_raw_v0_1.bin | awk '{print $1}' > /tmp/ho/aggregate.sha256
      - name: Freeze producer provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          AGG="$(cat /tmp/ho/aggregate.sha256)"
          cat > /tmp/ho/RECEIPT.txt <<EOF
          hypothesis_id=C2_IDE_LOCAL_TANGENT_CONE
          model_point=reference_alpha0_beta0
          solver_repo=kaeonikc/class_iv
          solver_commit=ac627d54e9ce196a08878d1ba33999819925d19c
          producer_head=${GITHUB_SHA}
          producer_run_id=${GITHUB_RUN_ID}
          producer_run_attempt=${GITHUB_RUN_ATTEMPT}
          post_hm_perturbations_sha256=8c76c0b0ba8de6c0528980569ae748b24ff1b790a9f752ac11e90ca71d5b63de
          ndf15_sha256=b3967efaf7a45a3ec6c0144e892caab54f91c595bc726dc1704cfb812f9c0df6
          baseline_sha256=0a68f4af6ead7ee69c75f1867f60914a40d4f7ff1219b965a0ae38186ca5c65c
          precision_sha256=463a3960d6a955c1e2a561e988562a1fc5486b0b79f120eb634ccca6f86002f9
          packet_count=28
          packet_bytes=64
          aggregate_bytes=1792
          coordinate_order=z-major/k-minor
          aggregate_sha256=$AGG
          raw_record_set_admitted=false
          decoded=false
          mapped=false
          prediction_ready=false
          scientific_model_authority_created=false
          EOF
          cp docs/dsir4/contracts/EXP073HN_IMPLEMENTATION_BINDING_V0_1.txt /tmp/ho/HN_BINDING.txt
          cp docs/dsir4/contracts/EXP073HO_RUNTIME_BINDING_V0_1.txt /tmp/ho/HO_BINDING.txt
      - name: Upload terminal raw candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp073ho-c2-reference-raw-runtime-v0-1
          path: |
            /tmp/ho/dsir_c2_reference_raw_v0_1.bin
            /tmp/ho/aggregate.sha256
            /tmp/ho/RECEIPT.txt
            /tmp/ho/plan.jsonl
            /tmp/ho/requests.tsv
            /tmp/ho/packets/*.bin
            /tmp/ho/raw/*.endpoint
            /tmp/ho/HN_BINDING.txt
            /tmp/ho/HO_BINDING.txt
          if-no-files-found: error
          retention-days: 30
      - name: Emit raw-candidate-only boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'classification=RAW_RUNTIME_CANDIDATE_PLUS_0_PLUS_0'
          echo 'packet_count=28'
          echo 'aggregate_bytes=1792'
          echo "aggregate_sha256=$(cat /tmp/ho/aggregate.sha256)"
          echo 'raw_record_set_admitted=false'
          echo 'decoded=false'
          echo 'mapped=false'
          echo 'prediction_ready=false'
          echo 'scientific_model_authority_created=false'
          echo 'G_DOMAIN_MAPPING=NOT_YET_TESTABLE'
          echo 'PASS_EXP073HO_C2_REFERENCE_RAW_RUNTIME_PRODUCER_V0_1'
