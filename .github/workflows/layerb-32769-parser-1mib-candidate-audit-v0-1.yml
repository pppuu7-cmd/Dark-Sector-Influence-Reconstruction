name: layerb-32769-parser-1mib-candidate-audit-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-32769-parser-1mib-candidate-audit-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  CANDIDATE_PROBE_BLOB: '9536b6eaa1b51ca05541e9a955d10c5cf984ad71'
  OLD_PARSER_CAPACITY: '524288'
  NEW_PARSER_CAPACITY: '1048576'
  POINT_CAPACITY: '32769'

jobs:
  static-parser-source-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove candidate changes only parser capacity line
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence external
          git clone -q https://github.com/kaeonikc/class_iv.git external/old
          git -C external/old checkout -q "$CLASS_COMMIT"
          cp -a external/old external/new
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          old=Path('external/old'); new=Path('external/new')
          def patch(root,pcap):
              p=root/'include/perturbations.h'; s=p.read_text(); a='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(a)==1; p.write_text(s.replace(a,'#define _MAX_NUMBER_OF_K_FILES_ 32769',1))
              q=root/'include/parser.h'; s=q.read_text(); a='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(a)==1; q.write_text(s.replace(a,f'#define _ARGUMENT_LENGTH_MAX_ {pcap}',1))
          patch(old,int(os.environ['OLD_PARSER_CAPACITY'])); patch(new,int(os.environ['NEW_PARSER_CAPACITY']))
          def files(root): return {str(p.relative_to(root)):p.read_bytes() for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          a,b=files(old),files(new); assert set(a)==set(b)
          changed=sorted(k for k in a if a[k]!=b[k]); assert changed==['include/parser.h'],changed
          ao=a['include/parser.h'].decode(); bn=b['include/parser.h'].decode(); oldline='#define _ARGUMENT_LENGTH_MAX_ 524288'; newline='#define _ARGUMENT_LENGTH_MAX_ 1048576'; assert ao.count(oldline)==1 and bn.count(newline)==1 and ao.replace(oldline,newline,1)==bn
          out={'schema':'LAYERB_32769_PARSER_1MIB_STATIC_SOURCE_DIFF_V0_1','classification':'LAYERB_32769_PARSER_1MIB_STATIC_SOURCE_DIFF_PASS_PLUS_0_PLUS_0','effect':'+0/+0','class_commit':os.environ['CLASS_COMMIT'],'point_capacity':32769,'old_parser_capacity':524288,'new_parser_capacity':1048576,'changed_files':changed,'only_change_is_parser_capacity_constant':True,'old_parser_sha256':hashlib.sha256(a['include/parser.h']).hexdigest(),'new_parser_sha256':hashlib.sha256(b['include/parser.h']).hexdigest(),'scientific_response_read':False,'class_solver_invoked':False,'scientific_authority_created':False,'successor_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          out['token']=out['classification']; Path('evidence/static.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-32769-parser-1mib-static-source-diff-v0-1
          path: evidence/static.json
          retention-days: 90

  candidate-role-probe:
    strategy:
      fail-fast: false
      matrix:
        role: [reference, alpha_minus, beta_plus, beta_minus]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enforce candidate probe identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_32769_parser_1mib_single_role_candidate_probe_v0_1.py)" = "$CANDIDATE_PROBE_BLOB"
      - name: Build exact 32769 / 1MiB parser candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q "$CLASS_COMMIT"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); a='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(a)==1; p.write_text(s.replace(a,'#define _MAX_NUMBER_OF_K_FILES_ 32769',1)); ppost=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); s=qb.decode(); a='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(a)==1; q.write_text(s.replace(a,'#define _ARGUMENT_LENGTH_MAX_ 1048576',1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          rec={'schema':'LAYERB_32769_PARSER_1MIB_CANDIDATE_PATCH_V0_1','class_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','point_capacity':32769,'parser_capacity':1048576,'point_pre_sha256':hashlib.sha256(b).hexdigest(),'point_post_sha256':ppost,'parser_pre_sha256':hashlib.sha256(qb).hexdigest(),'parser_post_sha256':qpost}
          Path('evidence/patch.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Run response-blind candidate role with telemetry
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -u
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo > evidence/host_before.txt
          (
            while true; do
              printf 'TELEMETRY ts=%s ' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/telemetry.log
              awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ {printf "%s%s=%s%s ",$1,$2,$3,$4} END {print ""}' /proc/meminfo >> evidence/telemetry.log
              ps -eo pid,ppid,rss,vsz,%cpu,%mem,etime,comm --sort=-rss | head -n 8 >> evidence/telemetry.log || true
              sleep 5
            done
          ) &
          MON=$!; cleanup(){ kill "$MON" 2>/dev/null || true; wait "$MON" 2>/dev/null || true; }; trap cleanup EXIT INT TERM
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" PYTHONFAULTHANDLER=1 .venv/bin/python -u ci/layerb_32769_parser_1mib_single_role_candidate_probe_v0_1.py \
            --role "$ROLE" \
            --canonical-authority docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_32769_V0_1.json \
            --build-authority docs/dsir4/authority/LAYERB_32769_CLASS_CAPACITY_BUILD_ENVELOPE_V0_1.json \
            --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt \
            --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --out evidence/result.json > evidence/stdout.log 2> evidence/stderr.log
          rc=$?
          set -e; cleanup; trap - EXIT INT TERM
          echo "$rc" > evidence/process_rc.txt
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo > evidence/host_after.txt
          python3 - "$ROLE" "$rc" <<'PY'
          import json,sys
          from pathlib import Path
          role=sys.argv[1]; rc=int(sys.argv[2]); p=Path('evidence/result.json'); d=json.load(open(p)) if p.is_file() else None
          out={'schema':'LAYERB_32769_PARSER_1MIB_CANDIDATE_WRAPPER_V0_1','classification':'LAYERB_32769_PARSER_1MIB_CANDIDATE_WRAPPER_CAPTURED_PLUS_0_PLUS_0','effect':'+0/+0','role':role,'process_rc':rc,'result_present':d is not None,'source_classification':None if d is None else d.get('classification'),'compute_completed':False if d is None else bool(d.get('compute_completed')),'candidate_parser_capacity':1048576,'scientific_response_read':False,'scientific_authority_created':False,'high_memory_resource_lifecycle_preflight_pass_created':False,'successor_execution_authorized':False}
          out['token']=out['classification']; Path('evidence/wrapper.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-parser-1mib-${{ matrix.role }}-v0-1
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [static-parser-source-diff, candidate-role-probe]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-32769-parser-1mib-*-v0-1
          path: inputs
      - name: Aggregate candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          static=json.load(open(next(Path('inputs').rglob('static.json'))))
          roles=[]
          for role in ['reference','alpha_minus','beta_plus','beta_minus']:
              root=Path('inputs')/f'layerb-32769-parser-1mib-{role}-v0-1'
              w=json.load(open(root/'evidence/wrapper.json')); p=root/'evidence/result.json'; d=json.load(open(p)) if p.is_file() else None
              roles.append({'role':role,'process_rc':w['process_rc'],'result_present':w['result_present'],'compute_completed':w['compute_completed'],'source_classification':w['source_classification'],'ru_maxrss_kb_after_compute':None if d is None else d.get('ru_maxrss_kb_after_compute'),'payload_bytes':None if d is None else d.get('k_output_values_bytes_including_nul'),'parser_margin_bytes':None if d is None else d.get('candidate_parser_margin_bytes'),'result_sha256':None if d is None else hashlib.sha256(p.read_bytes()).hexdigest()})
          allpass=all(x['compute_completed'] for x in roles) and static['only_change_is_parser_capacity_constant'] is True
          out={'schema':'LAYERB_32769_PARSER_1MIB_CANDIDATE_AGGREGATE_V0_1','classification':'LAYERB_32769_PARSER_1MIB_CANDIDATE_ALL_ROLES_PASS_PLUS_0_PLUS_0' if allpass else 'LAYERB_32769_PARSER_1MIB_CANDIDATE_NOT_ALL_ROLES_PASS_PLUS_0_PLUS_0','effect':'+0/+0','candidate_parser_capacity':1048576,'static_source_diff_pass':static['classification']=='LAYERB_32769_PARSER_1MIB_STATIC_SOURCE_DIFF_PASS_PLUS_0_PLUS_0','roles':roles,'all_four_roles_compute_completed':allpass,'scientific_transfer_values_read':False,'scientific_response_read':False,'scientific_response_computed':False,'scientific_authority_created':False,'high_memory_resource_lifecycle_preflight_pass_created':False,'successor_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          out['token']=out['classification']; Path('aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(out['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-32769-parser-1mib-candidate-aggregate-v0-1
          path: aggregate.json
          retention-days: 90

  independent-verifier:
    needs: aggregate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: layerb-32769-parser-1mib-candidate-aggregate-v0-1
          path: aggregate
      - name: Independently verify candidate semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.load(open('aggregate/aggregate.json'))
          assert a['candidate_parser_capacity']==1048576
          assert a['static_source_diff_pass'] is True
          assert [x['role'] for x in a['roles']]==['reference','alpha_minus','beta_plus','beta_minus']
          for k in ['scientific_transfer_values_read','scientific_response_read','scientific_response_computed','scientific_authority_created','high_memory_resource_lifecycle_preflight_pass_created','successor_execution_authorized','covariance_restriction_authorized','Wm_S3_opened']:
              assert a[k] is False,k
          out={'schema':'LAYERB_32769_PARSER_1MIB_CANDIDATE_INDEPENDENT_VERIFICATION_V0_1','classification':'LAYERB_32769_PARSER_1MIB_CANDIDATE_INDEPENDENT_VERIFICATION_PASS_PLUS_0_PLUS_0','effect':'+0/+0','candidate_classification':a['classification'],'all_four_roles_compute_completed':a['all_four_roles_compute_completed'],'scientific_execution_authorized':False,'scientific_response_read':False,'high_memory_resource_lifecycle_preflight_pass_created':False}
          out['token']=out['classification']; Path('verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(out['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-32769-parser-1mib-candidate-independent-verification-v0-1
          path: verification.json
          retention-days: 90
