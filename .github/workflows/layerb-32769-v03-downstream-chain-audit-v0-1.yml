          import hashlib,json
          from pathlib import Path
          r=Path('mx'); roles=['reference','alpha_minus','beta_plus','beta_minus']; life={'total_solver_constructions':4,'max_live_instances':1,'final_live_instances':0,'cross_process_scientific_operand_combination':False}
          def dump(n,d): (r/n).write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          src={'classification':'LAYERB_32769_HIGH_MEMORY_RESOURCE_LIFECYCLE_PREFLIGHT_PASS_PLUS_0_PLUS_0','canonical_32769_node_sha256':'82c48c17dba812bd08a3437f7e48376208a8c506f4a63087191608793fba4599','canonical_32769_text_sha256':'7422d00aab2b32a060878224e81834277a67d42016595a0e9088db05b14166e2','capacity':32769,'parser_capacity':1048576,'build_authority_classification':'LAYERB_32769_CLASS_CAPACITY_BUILD_ENVELOPE_V0_2_PASS_PLUS_0_PLUS_0','runner_isolation_contract_git_blob':'d9d910d89889f6d3a27461a73c3dd72c2a9d2096','required_custom_label':'dsir-32769-highmem','runner_registration_evidence_valid':True,'runner_agent_id':4242,'runner_name':'fixture-highmem','candidate_memtotal_kb':33554432,'candidate_strictly_higher_memory_than_exhausted_hosted':True,'execution_lifecycle':life,'role_order':roles,'role_receipts':[{'role':x,'compute_completed':True,'ru_maxrss_kb_after_compute':12000000+i,'scientific_transfer_values_read':False,'scientific_response_computed':False,'scientific_response_serialized':False} for i,x in enumerate(roles)],'scientific_transfer_values_read':False,'scientific_response_read':False,'scientific_response_computed':False,'convergence_metric_computed':False,'convergence_classification_created':False,'scientific_authority_created':False,'successor_execution_authorized':False}
          dump('source.json',src); ssha=hashlib.sha256((r/'source.json').read_bytes()).hexdigest()
          ind={'classification':'LAYERB_32769_HIGH_MEMORY_RESOURCE_LIFECYCLE_INDEPENDENT_VALIDATION_PASS_PLUS_0_PLUS_0','valid':True,'errors':[],'source_result_sha256':ssha,'candidate_memtotal_kb':33554432,'execution_lifecycle':life,'parser_capacity':1048576,'runner_agent_id':4242,'runner_name':'fixture-highmem','telemetry_summary':{'sample_count':10},'scientific_response_read':False,'scientific_authority_created':False,'successor_execution_authorized':False}
          dump('ind.json',ind); isha=hashlib.sha256((r/'ind.json').read_bytes()).hexdigest()
          prov={'classification':'LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_PASS_PLUS_0_PLUS_0','valid':True,'errors':[],'packaging_contract_git_blob':'71d77aa4d074bba1a2f53e7f9299a9db32e93ffc','source_run_id':7001,'source_job_id':7101,'source_head_sha':'a'*40,'source_artifact_id':7201,'source_artifact_zip_sha256':'1'*64,'source_result_sha256':ssha,'independent_run_id':7002,'independent_job_id':7102,'independent_head_sha':'a'*40,'independent_artifact_id':7202,'independent_artifact_zip_sha256':'2'*64,'independent_validation_sha256':isha,'parser_capacity':1048576,'class_build_authority_git_blob':'b5cd7304c110962dc3baef8d04ef67d5a8042e5f','candidate_memtotal_kb':33554432}
          dump('prov.json',prov)
          PY
      - name: Require valid materialization PASS and stale/tampered variants FAIL
        shell: bash
        run: |
          set -euo pipefail
          base=(--contract docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_MATERIALIZATION_CONTRACT_V0_2.json --source-result mx/source.json --independent-validation mx/ind.json --provenance mx/prov.json)
          python3 ci/layerb_32769_resource_authority_materializer_v0_2.py "${base[@]}" --out mx/out/pass.json
          test "$(jq -r .parser_capacity mx/out/pass.json)" -eq 1048576; test "$(jq -r .class_build_authority_git_blob mx/out/pass.json)" = b5cd7304c110962dc3baef8d04ef67d5a8042e5f
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name,srcfile,mut in [('oldparser','source.json',lambda d:d.update(parser_capacity=524288)),('threshold','source.json',lambda d:d.update(candidate_memtotal_kb=16373452)),('synthetic','source.json',lambda d:d.update(synthetic_fixture=True)),('badprov','prov.json',lambda d:d.update(classification='LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_FAIL_PLUS_0_PLUS_0'))]:
              d=json.load(open('mx/'+srcfile)); mut(d); Path('mx/'+name+'.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          for case in oldparser threshold synthetic; do set +e; python3 ci/layerb_32769_resource_authority_materializer_v0_2.py --contract docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_MATERIALIZATION_CONTRACT_V0_2.json --source-result "mx/$case.json" --independent-validation mx/ind.json --provenance mx/prov.json --out "mx/out/$case.json"; rc=$?; set -e; test "$rc" -eq 31; done
          set +e; python3 ci/layerb_32769_resource_authority_materializer_v0_2.py --contract docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_MATERIALIZATION_CONTRACT_V0_2.json --source-result mx/source.json --independent-validation mx/ind.json --provenance mx/badprov.json --out mx/out/badprov.json; rc=$?; set -e; test "$rc" -eq 31
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('mx/out/pass.json'); d={'schema':'LAYERB_32769_V03_MATERIALIZER_SYNTHETIC_AUDIT_V0_1','classification':'LAYERB_32769_V03_MATERIALIZER_SYNTHETIC_AUDIT_PASS_PLUS_0_PLUS_0','valid_fixture_passed':True,'old_parser_rejected':True,'hosted_threshold_rejected':True,'synthetic_input_rejected':True,'invalid_provenance_rejected':True,'pass_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'scientific_execution_authorized':False}; d['token']=d['classification']; Path('mx/out/summary.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: v03-materializer-synthetic, path: mx/out/}

  independent-verifier:
    needs: [event-chain-static, candidate-workflow-static, packager-synthetic, materializer-synthetic]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: v03-event-chain-static, path: a}
      - uses: actions/download-artifact@v4
        with: {name: v03-candidate-workflow-static, path: b}
      - uses: actions/download-artifact@v4
        with: {name: v03-packager-synthetic, path: c}
      - uses: actions/download-artifact@v4
        with: {name: v03-materializer-synthetic, path: d}
      - name: Independently verify all four downstream repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          checks=[('a/event.json','LAYERB_32769_V03_EVENT_CHAIN_STATIC_AUDIT_PASS_PLUS_0_PLUS_0'),('b/candidate_static.json','LAYERB_32769_V03_CANDIDATE_WORKFLOW_STATIC_AUDIT_PASS_PLUS_0_PLUS_0'),('c/summary.json','LAYERB_32769_V03_PACKAGER_SYNTHETIC_AUDIT_PASS_PLUS_0_PLUS_0'),('d/summary.json','LAYERB_32769_V03_MATERIALIZER_SYNTHETIC_AUDIT_PASS_PLUS_0_PLUS_0')]
          for p,c in checks: assert json.load(open(p))['classification']==c,(p,c)
          print('LAYERB_32769_V03_DOWNSTREAM_CHAIN_INDEPENDENT_AUDIT_PASS')
          PY
