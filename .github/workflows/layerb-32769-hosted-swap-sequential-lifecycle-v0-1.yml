name: layerb-32769-hosted-swap-sequential-lifecycle-v0-1

on:
  workflow_run:
    workflows: ["layerb-32769-hosted-extra-swap-resource-feasibility-v0-2"]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_REF: '55a0302edd8da352d2baef7d9fb12903c8beca77'
  SOURCE_RUN_ID: '34659953959'
  GATE_CONTRACT_BLOB: '53c26f82d821ecb39f3be97c3942134ec8452150'
  PILOT_BLOB: '100f871822e69cfde7730aba4f6a9ff59c6ad9aa'
  BUILD_AUTH_BLOB: 'b5cd7304c110962dc3baef8d04ef67d5a8042e5f'
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_REF }}
      - name: Consume exact frozen feasibility result fail-closed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate src
          test "$(git hash-object docs/dsir4/contracts/LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_GATE_V0_1.json)" = "$GATE_CONTRACT_BLOB"
          event_run="${{ github.event.workflow_run.id }}"
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [ "$event_run" != "$SOURCE_RUN_ID" ]; then
            python3 - <<'PY'
          import json,pathlib,os
          pathlib.Path('gate/gate.json').write_text(json.dumps({'schema':'LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_GATE_RECEIPT_V0_1','classification':'IGNORED_NONFROZEN_SOURCE_RUN_PLUS_0_PLUS_0','source_run_id':int(os.environ.get('SOURCE_RUN_ID','0')),'authorized':False,'scientific_execution_authorized':False},indent=2,sort_keys=True)+'\n')
          PY
            exit 0
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > src/run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > src/artifacts.json
          python3 - <<'PY' > src/artifact_id.txt
          import json
          d=json.load(open('src/artifacts.json')); name='layerb-32769-hosted-extra-swap-resource-feasibility-final-v0-2'; m=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]; assert len(m)==1,m; print(m[0]['id'])
          PY
          aid=$(cat src/artifact_id.txt)
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > src/final.zip
          unzip -q src/final.zip -d src/final
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          c=json.load(open('docs/dsir4/contracts/LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_GATE_V0_1.json'))
          r=json.load(open('src/run.json')); f=json.load(open('src/final/feasibility.json'))
          assert r['id']==c['source_run_id']
          assert r['name']==c['source_workflow_name'] and r['path']==c['source_workflow_path']
          assert r['head_sha']=='eb1273af37024b839326141b389e002330c2499d'
          assert f['classification']==c['required_source_classification']
          assert f['all_four_roles_pass_at_extra_swap_8gib'] is True
          for k in ('scientific_transfer_values_read','scientific_response_read','scientific_response_computed','scientific_execution_authorized'): assert f[k] is False
          out={'schema':'LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_GATE_RECEIPT_V0_1','classification':'LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_AUTHORIZED_PLUS_0_PLUS_0','source_run_id':r['id'],'source_head_sha':r['head_sha'],'source_result_sha256':hashlib.sha256(pathlib.Path('src/final/feasibility.json').read_bytes()).hexdigest(),'authorized':True,'authorized_lifecycle_run_count':1,'scientific_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          pathlib.Path('gate/gate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          echo "authorized=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-hosted-swap-lifecycle-gate-v0-1
          path: gate/gate.json
          if-no-files-found: warn
          retention-days: 90

  sequential-lifecycle:
    needs: source-gate
    if: needs.source-gate.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_REF }}
      - name: Verify frozen identities and enable exact +8 GiB swap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts external
          test "$(git hash-object docs/dsir4/contracts/LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_GATE_V0_1.json)" = "$GATE_CONTRACT_BLOB"
          test "$(git hash-object ci/layerb_32769_response_blind_resource_lifecycle_pilot_v0_2.py)" = "$PILOT_BLOB"
          test "$(git hash-object docs/dsir4/authority/LAYERB_32769_CLASS_CAPACITY_BUILD_ENVELOPE_V0_2.json)" = "$BUILD_AUTH_BLOB"
          SWAPFILE=/mnt/dsir-lifecycle-extra-8g.swap
          sudo fallocate -l 8G "$SWAPFILE"; sudo chmod 600 "$SWAPFILE"; sudo mkswap "$SWAPFILE" > artifacts/swap_setup.txt 2>&1; sudo swapon "$SWAPFILE" >> artifacts/swap_setup.txt 2>&1
          { grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo; sudo swapon --show --bytes; } >> artifacts/swap_setup.txt
      - name: Build exact parser-corrected CLASS source tree
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null; sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python3 -m venv .venv; .venv/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null; .venv/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv; git -C external/class_iv checkout -q "$CLASS_COMMIT"; test "$(git -C external/class_iv rev-parse HEAD)" = "$CLASS_COMMIT"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); a='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(a)==1; assert hashlib.sha256(b).hexdigest()=='c83749338e435d85caf8f0cfb713aa9a77782a91072de93633187d9dc53a0876'; p.write_text(s.replace(a,'#define _MAX_NUMBER_OF_K_FILES_ 32769',1)); assert hashlib.sha256(p.read_bytes()).hexdigest()=='e6221887e19c0a576f77bbfcb2a030ff9cf8d84c62a2193ce52b8e3b541a8f0a'
          q=Path('external/class_iv/include/parser.h'); b=q.read_bytes(); s=b.decode(); a='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(a)==1; assert hashlib.sha256(b).hexdigest()=='2c17690a5549e12c8fac485281ca214a20c376e1e3beba714af0e1b84cdbb0eb'; q.write_text(s.replace(a,'#define _ARGUMENT_LENGTH_MAX_ 1048576',1)); assert hashlib.sha256(q.read_bytes()).hexdigest()=='2d775ca12da2c79b3700672fa66d290d5a06458a5253ea1e2c51b44ac2374092'
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv; python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
          { gcc --version | head -1; gfortran --version | head -1; echo -n class_sha256=; sha256sum external/class_iv/class | awk '{print $1}'; } > artifacts/build_identity.txt
      - name: Execute response-blind four-role sequential lifecycle
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"; : > artifacts/telemetry.log
          ( while true; do printf 'TELEMETRY ts=%s ' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> artifacts/telemetry.log; awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ {printf "%s%s=%s%s ",$1,$2,$3,$4} END {print ""}' /proc/meminfo >> artifacts/telemetry.log; ps -eo pid,ppid,rss,vsz,%cpu,%mem,etime,comm --sort=-rss | head -n 8 >> artifacts/telemetry.log || true; sleep 10; done ) & MON=$!
          cleanup(){ kill "$MON" 2>/dev/null || true; wait "$MON" 2>/dev/null || true; }; trap cleanup EXIT INT TERM
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" .venv/bin/python ci/layerb_32769_response_blind_resource_lifecycle_pilot_v0_2.py --canonical-authority docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_32769_V0_1.json --build-authority docs/dsir4/authority/LAYERB_32769_CLASS_CAPACITY_BUILD_ENVELOPE_V0_2.json --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py --baseline configs/dsir4/c2/ide0_reference_v0_1.ini --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre --out artifacts/result.json
          rc=$?; cleanup; trap - EXIT INT TERM; grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo > artifacts/final_meminfo.txt || true; exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-hosted-swap-sequential-lifecycle-raw-v0-1
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

  independent-verifier:
    needs: [source-gate, sequential-lifecycle]
    if: always() && needs.source-gate.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: layerb-32769-hosted-swap-lifecycle-gate-v0-1, path: gate}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: layerb-32769-hosted-swap-sequential-lifecycle-raw-v0-1, path: raw}
      - name: Independently validate response-blind lifecycle receipt
        shell: bash
        run: |
          set -euo pipefail; mkdir -p verified
          python3 - <<'PY'
          import hashlib,json,pathlib
          g=json.load(open('gate/gate.json')); assert g['authorized'] is True and g['classification']=='LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_AUTHORIZED_PLUS_0_PLUS_0'
          p=pathlib.Path('raw/result.json'); assert p.is_file(); d=json.load(open(p))
          assert d['classification']=='LAYERB_32769_HIGH_MEMORY_RESOURCE_LIFECYCLE_PREFLIGHT_PASS_PLUS_0_PLUS_0'
          assert d['parser_capacity']==1048576 and d['capacity']==32769
          assert d['role_order']==['reference','alpha_minus','beta_plus','beta_minus']
          assert len(d['role_receipts'])==4 and all(x['compute_completed'] is True and x['scientific_transfer_values_read'] is False for x in d['role_receipts'])
          assert d['execution_lifecycle']=={'total_solver_constructions':4,'max_live_instances':1,'final_live_instances':0,'cross_process_scientific_operand_combination':False}
          for k in ('scientific_transfer_values_read','scientific_response_read','scientific_response_computed','convergence_metric_computed','convergence_classification_created','scientific_authority_created','successor_execution_authorized','covariance_restriction_authorized','Wm_S3_opened'): assert d[k] is False
          out={'schema':'LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_INDEPENDENT_VERIFICATION_V0_1','classification':'LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_PASS_PLUS_0_PLUS_0','effect':'+0/+0','source_gate_sha256':hashlib.sha256(pathlib.Path('gate/gate.json').read_bytes()).hexdigest(),'raw_result_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'artifact_verified_independently':True,'hosted_extra_swap_gib':8,'total_solver_constructions':4,'max_live_instances':1,'scientific_transfer_values_read':False,'scientific_response_read':False,'scientific_response_computed':False,'convergence_metric_computed':False,'scientific_authority_created':False,'scientific_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'token':'LAYERB_32769_HOSTED_SWAP_SEQUENTIAL_LIFECYCLE_PASS_PLUS_0_PLUS_0'}
          pathlib.Path('verified/verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(out['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-32769-hosted-swap-sequential-lifecycle-independent-v0-1
          path: verified/verification.json
          retention-days: 90
