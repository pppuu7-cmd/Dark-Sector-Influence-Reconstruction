name: Exp073FR WW_S1_S1 provenance admission and successor dispatch v0.1

on:
  workflow_run:
    workflows: ['Exp073FM WW_S1_S1 audited home science v0.1']
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exp073FM candidate run id; used only for manual recovery
        required: false
        default: '34050657030'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: dsir-exp073fr-ww-s1-s1-admission-v0-1
  cancel-in-progress: false

env:
  PREREG_BLOB: '384410ba6d557f5a7ae4b711be362496109fc78f'
  EXPECTED_CANDIDATE_RUN: '34050657030'
  EXPECTED_CANDIDATE_HEAD: 'f0caca0c3e812710e5958ee13348a150d045a7d8'
  ARTIFACT_NAME: 'exp073fm-ww-s1-s1-filebacked-ab-v0-1'
  CANDIDATE_TOKEN: 'PASS_EXP073FM_WW_S1_S1_FILEBACKED_AB_EXACT_REPEATABILITY_V0_1'
  SOURCE_HEAD: 'de83e20a68f79ccf25b89b0d33eb4206e294c757'
  CONTRACT_FP: 'b7845df5ce4bc2bd730461476b7ff0831512003ceb5b3558436005c9876bd251'
  SUCCESSOR_WORKFLOW: 'exp073fs-ww-s1-s2-home-science-v0-1.yml'

jobs:
  hosted-provenance-admission-and-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and verify frozen Exp073FM candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          INPUT_RUN: ${{ inputs.candidate_run }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/073fr_ww_s1_s1_provenance_admission_and_successor_dispatch_v0_1_prereg.md)" = "$PREREG_BLOB"
          CANDIDATE_RUN="${EVENT_RUN:-${INPUT_RUN:-}}"
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          test "$CANDIDATE_RUN" = "$EXPECTED_CANDIDATE_RUN"
          echo "$CANDIDATE_RUN" > candidate_run_id.txt
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}" > run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/jobs?per_page=100" > jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/artifacts?per_page=100" > artifacts.json
          HOME_JOB="$(python3 - <<'PY'
          import json,os
          r=json.load(open('run.json'))
          assert r['id']==int(open('candidate_run_id.txt').read())
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']==os.environ['EXPECTED_CANDIDATE_HEAD']
          assert r['name']=='Exp073FM WW_S1_S1 audited home science v0.1'
          jobs=json.load(open('jobs.json'))['jobs']; x=[j for j in jobs if j['name']=='home-science']
          assert len(x)==1 and x[0]['status']=='completed' and x[0]['conclusion']=='success'
          print(x[0]['id'])
          PY
          )"
          gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${HOME_JOB}/logs" > candidate.log
          grep -aF 'PASS_EXP073FM_REPLICA_A_FULL_CHAIN_VERIFIED_BEFORE_PRUNE_V0_1' candidate.log >/dev/null
          grep -aF 'PASS_EXP073FM_REPLICA_B_FULL_CHAIN_VERIFIED_BEFORE_PRUNE_V0_1' candidate.log >/dev/null
          grep -aF "$CANDIDATE_TOKEN" candidate.log >/dev/null
          grep -aF 'PASS_EXP073FM_LIVE_EXCLUSIVITY' candidate.log >/dev/null
          python3 - <<'PY' > artifact.env
          import json,os,shlex
          arts=json.load(open('artifacts.json'))['artifacts']; x=[a for a in arts if a['name']==os.environ['ARTIFACT_NAME']]
          assert len(x)==1; a=x[0]; assert a['expired'] is False and a.get('digest','').startswith('sha256:')
          assert a['workflow_run']['id']==int(open('candidate_run_id.txt').read()) and a['workflow_run']['head_sha']==os.environ['EXPECTED_CANDIDATE_HEAD']
          print('ARTIFACT_ID='+shlex.quote(str(a['id']))); print('ARTIFACT_DIGEST='+shlex.quote(a['digest']))
          PY
          source artifact.env
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o candidate.zip
          test "sha256:$(sha256sum candidate.zip | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          mkdir candidate; unzip -q candidate.zip -d candidate
      - name: Fail-closed scientific provenance admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,math,os,struct
          from pathlib import Path
          root=Path('candidate'); term=json.loads((root/'terminal_receipt.json').read_text())
          expected={'classification':'SCIENTIFIC_CANDIDATE_PASS_PENDING_PROVENANCE_ADMISSION','token':os.environ['CANDIDATE_TOKEN'],'science_gate_scored':True,'ww_s1_s1_authority_created':False,'source_pair':'S1->S1','ordered_source_indices':[1,1],'same_field_object_handoff':True,'selected_semantics':'EE<-EE','selected_shape':[39,12288],'selected_dtype':'<f8','sha256_equal':True,'numpy_array_equal':True,'all_finite':True,'source_head':os.environ['SOURCE_HEAD'],'contract_fingerprint':os.environ['CONTRACT_FP'],'bpw_route':'public_get_bandpower_windows_after_filebacked_fits_read','no_tolerance_rescue':True,'terminal_compare_restored_replica':False,'full_chain_verified_before_prune':True}
          for k,v in expected.items(): assert term.get(k)==v,(k,term.get(k),v)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(8<<20),b''): h.update(b)
              return h.hexdigest()
          stages=['fresh_sources_complete','fresh_workspace_mcm_complete','mcm_fits_verified','full_window_complete','selected_ee_complete','replica_receipt_complete']; eps=[]
          for rep in ('A','B'):
              rr=root/'checkpoints'/rep; rp=rr/'replica_receipt.json'; pp=rr/'post_receipt_prune.json'; cp=rr/'replica_receipt_complete.json'; ep=rr/'exact_route'/'selected_ee.bin'
              rec=json.loads(rp.read_text()); prune=json.loads(pp.read_text()); comp=json.loads(cp.read_text()); src=json.loads((rr/'fresh_sources_complete.json').read_text())['payloads']; ws=json.loads((rr/'fresh_workspace_mcm_complete.json').read_text())['payloads']; ad=rec['adapter_receipt']
              assert rec['source_pair']=='S1->S1' and rec['ordered_source_indices']==[1,1] and rec['same_field_object_handoff'] is True and rec['historical_ww_numerical_import'] is False and rec['other_replica_output_read'] is False
              assert src['ordered_source_indices']==[1,1] and src['reconstruction_counts']=={'s1':1} and src['same_source_map_both_sides'] is True
              ids=ws['field_object_ids']; assert ws['field_construction_count']==1 and ws['same_field_object_handoff'] is True and len(ids)==2 and ids[0]==ids[1]
              assert ad['mcm_backing_bytes']==19327352832 and ad['mcm_filebacked'] is True and ad['mcm_proc_maps'] is True and ad['read_unbinned_MCM'] is True and ad['route']=='public_get_bandpower_windows_after_filebacked_fits_read'
              assert ad['public_full_shape']==[4,39,4,12288] and ad['selected_semantics']=='wins[0,:,0,:] = EE<-EE' and ad['no_tolerance_rescue'] is True
              assert prune['complete_chain_verified_before_prune'] is True and prune['pruned_only_after_receipt'] is True and prune['same_field_object_handoff'] is True and set(prune['stage_manifest_sha256'])==set(stages)
              for st in stages:
                  sp=rr/(st+'.json'); assert sha(sp)==prune['stage_manifest_sha256'][st]
              he=sha(ep); assert he==rec['selected_ee_sha256']==prune['selected_ee_sha256']==comp['payloads']['selected_ee']['sha256']; assert ep.stat().st_size==39*12288*8
              eps.append((ep,he))
          assert eps[0][1]==eps[1][1]==term['a_sha256']==term['b_sha256']
          ba=eps[0][0].read_bytes(); bb=eps[1][0].read_bytes(); assert ba==bb and all(math.isfinite(x[0]) for x in struct.iter_unpack('<d',ba))
          PY
          ! grep -Eqi 'np\.(allclose|isclose)|rounding_rescue|smoothing_rescue|averaging_rescue' experiments/073fr_ww_s1_s1_provenance_admission_and_successor_dispatch_v0_1_prereg.md
          echo PASS_EXP073FR_WW_S1_S1_FILEBACKED_PROVENANCE_ADMISSION_V0_1
          echo classification=SCIENTIFIC_AUTHORITY_ADMITTED
          echo ww_s1_s1_authority_created=true
      - name: Dispatch frozen WW_S1_S2 successor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${SUCCESSOR_WORKFLOW}" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${SUCCESSOR_WORKFLOW}/dispatches" -f ref=main -f 'inputs[predecessor_admission_run]'="${GITHUB_RUN_ID}"
          echo "DISPATCHED_SUCCESSOR=${SUCCESSOR_WORKFLOW}"
