name: Exp073HK C2 HJ output fingerprint derivation v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exp073hk-c2-hj-output-fingerprint-derivation-v0-1.yml'

permissions:
  contents: read

jobs:
  hosted-fingerprint-derivation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen repository identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073HK_C2_HJ_OUTPUT_FINGERPRINT_DERIVATION_V0_1.md)" = "2fa86e71ab01810914a2f869b7420be5f7fccdfe"
          test "$(git hash-object scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py)" = "b7fe663154519b605699c1fd622d0079a5f76772"
          test "$(git hash-object scripts/dsir4/exp073hb_c2_exact_endpoint_producer_patch_v0_1.py)" = "f3d3d80cda2f937f544722e684a44c649e771487"
          test "$(git hash-object scripts/dsir4/exp073hj_c2_complete_native_record_observation_patch_v0_1.py)" = "9096eddfb592703ef6a2adc82bf27db05bee9ee0"

      - name: Reconstruct exact admitted derivative and producer source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/kaeonikc/class_iv.git /tmp/class_iv
          git -C /tmp/class_iv checkout --quiet ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C /tmp/class_iv rev-parse HEAD)" = "ac627d54e9ce196a08878d1ba33999819925d19c"
          test "$(git -C /tmp/class_iv hash-object source/background.c)" = "310e0f5764ab41da3a886ed239db3fff2aac32ec"
          test "$(git -C /tmp/class_iv hash-object Makefile)" = "45f912a2b8b2849998affb6857f49f5950fe9be5"
          test "$(git -C /tmp/class_iv hash-object source/perturbations.c)" = "92a48331658c5941ed4eb43b0e98ee78e39b8385"
          test "$(git -C /tmp/class_iv hash-object tools/evolver_ndf15.c)" = "790ced55f2eaa08e805d467734ad1435954bc5b7"
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py /tmp/class_iv
          test "$(sha256sum /tmp/class_iv/source/background.c | awk '{print $1}')" = "bc4053922ae984652f5858b2869e7bbbe8682ea502b88e485709e6828e059ce0"
          test "$(sha256sum /tmp/class_iv/Makefile | awk '{print $1}')" = "2bb326590b3d0c3a23e984fc17cafce680674aa5234db15d35d72a06e1bfa87e"
          python scripts/dsir4/exp073hb_c2_exact_endpoint_producer_patch_v0_1.py /tmp/class_iv
          test "$(sha256sum /tmp/class_iv/source/perturbations.c | awk '{print $1}')" = "da7c427e383f1e9b83d7ff75ef82784c2fe89d91f9681e21e7805b7f354e7e79"
          test "$(sha256sum /tmp/class_iv/tools/evolver_ndf15.c | awk '{print $1}')" = "b3967efaf7a45a3ec6c0144e892caab54f91c595bc726dc1704cfb812f9c0df6"

      - name: Derive HJ deterministic output fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dsir4/exp073hj_c2_complete_native_record_observation_patch_v0_1.py /tmp/class_iv | tee /tmp/hj.txt
          grep -Fx 'EXP073HJ_COMPLETE_NATIVE_RECORD_OBSERVATION_PATCH_APPLIED' /tmp/hj.txt
          git -C /tmp/class_iv diff --check
          final_sha="$(sha256sum /tmp/class_iv/source/perturbations.c | awk '{print $1}')"
          test "${#final_sha}" -eq 64
          printf 'exp073hj_final_perturbations_sha256=%s\n' "$final_sha"
          echo 'classification=SUPPORT_PLUS_0_PLUS_0'
          echo 'cosmological_run_started=false'
          echo 'record_payload_created=false'
          echo 'prediction_ready=false'
          echo 'scientific_model_authority_created=false'
          echo 'PASS_EXP073HK_C2_HJ_OUTPUT_FINGERPRINT_DERIVATION_V0_1'
