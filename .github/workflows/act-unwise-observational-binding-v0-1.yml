name: ACT x unWISE observational binding v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/act-unwise-observational-binding-v0-1.yml'
      - 'ci/act_unwise_observational_binding_v0_1.py'
      - 'experiments/065a_act_unwise_observational_binding_v0_1.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: python3 -m pip install --user numpy pyyaml
      - name: Fetch pinned official likelihood source
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/ACTCollaboration/unWISExLens_lklh.git external/unWISExLens_lklh
          git -C external/unWISExLens_lklh checkout 6302c30d9e70f8e4ff2d4a84a9977b4471705179
          test "$(git -C external/unWISExLens_lklh rev-parse HEAD)" = "6302c30d9e70f8e4ff2d4a84a9977b4471705179"
      - name: Fetch official data archive
        run: |
          set -euxo pipefail
          mkdir -p external/unwise_data
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://portal.nersc.gov/project/act/act_x_unWISE_xcorr+3x2pt/data_unWISExLens.tar.gz' \
            -o external/data_unWISExLens.tar.gz
          sha256sum external/data_unWISExLens.tar.gz
          tar -xzf external/data_unWISExLens.tar.gz -C external/unwise_data
      - name: Run Exp065A eligibility audit
        run: |
          set -euxo pipefail
          python3 ci/act_unwise_observational_binding_v0_1.py \
            --external-repo external/unWISExLens_lklh \
            --extracted-root external/unwise_data \
            --archive external/data_unWISExLens.tar.gz \
            --output data/derived/g7/exp065a_act_unwise_observational_binding_v0_1.json
      - name: Preserve scientific eligibility result
        run: |
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp065a_act_unwise_observational_binding_v0_1.json'
          d=json.load(open(p))
          assert d['status'] in {
              'PASS_ACT_UNWISE_OBSERVATIONAL_BINDING_ELIGIBLE_V0_1',
              'FAIL_ACT_UNWISE_OBSERVATIONAL_BINDING_ELIGIBILITY_V0_1',
          }
          assert d['pinned_commit']=='6302c30d9e70f8e4ff2d4a84a9977b4471705179'
          assert len(d['archive_sha256'])==64
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP065A_RESULT', d['status'])
          print('FAILURES', d['failures'])
          PY
      - name: Upload audit summary
        uses: actions/upload-artifact@v4
        with:
          name: exp065a-act-unwise-binding-${{ github.sha }}
          path: data/derived/g7/exp065a_act_unwise_observational_binding_v0_1.json
          if-no-files-found: error
