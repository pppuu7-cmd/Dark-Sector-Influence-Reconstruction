name: layerb-32769-parser-1mib-live-memory-telemetry-v0-1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layerb-32769-parser-1mib-live-memory-telemetry-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  CANDIDATE_PROBE_BLOB: '9536b6eaa1b51ca05541e9a955d10c5cf984ad71'

jobs:
  live-memory-probe:
    strategy:
      fail-fast: false
      matrix:
        role: [reference, beta_plus]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build exact 32769 / 1MiB parser candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/layerb_32769_parser_1mib_single_role_candidate_probe_v0_1.py)" = "$CANDIDATE_PROBE_BLOB"
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q "$CLASS_COMMIT"
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/include/perturbations.h'); s=p.read_text(); a='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(a)==1; p.write_text(s.replace(a,'#define _MAX_NUMBER_OF_K_FILES_ 32769',1))
          q=Path('external/class_iv/include/parser.h'); s=q.read_text(); a='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(a)==1; q.write_text(s.replace(a,'#define _ARGUMENT_LENGTH_MAX_ 1048576',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null

      - name: Run with live OS/cgroup memory telemetry
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -u
          mkdir -p evidence
          export PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}"
          echo "LIVE_TELEMETRY_BEGIN role=$ROLE ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo || true
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.events.local; do
            if [ -r "$f" ]; then echo "CGROUP_INITIAL $f"; cat "$f"; fi
          done

          PYTHONFAULTHANDLER=1 .venv/bin/python -u ci/layerb_32769_parser_1mib_single_role_candidate_probe_v0_1.py \
            --role "$ROLE" \
            --canonical-authority docs/dsir4/authority/LAYERB_RESPONSE_BLIND_CANONICAL_FINE_32769_V0_1.json \
            --build-authority docs/dsir4/authority/LAYERB_32769_CLASS_CAPACITY_BUILD_ENVELOPE_V0_1.json \
            --fine docs/dsir4/canonical/LAYERB_CANONICAL_FINE_32769_NODES_U64HEX_V0_1.txt \
            --jo-script ci/exp073jo_article3_jm_canonical_8193_one_live_resource_pilot_v0_1.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --out evidence/result.json > evidence/probe.stdout 2> evidence/probe.stderr &
          CHILD=$!

          emit_sample() {
            ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            mem=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo NA)
            swap=$(awk '/^SwapFree:/ {print $2}' /proc/meminfo 2>/dev/null || echo NA)
            rss=$(ps -o rss= -p "$CHILD" 2>/dev/null | tr -d ' ' || true); [ -n "$rss" ] || rss=NA
            ccur=NA; cmax=NA; [ -r /sys/fs/cgroup/memory.current ] && ccur=$(cat /sys/fs/cgroup/memory.current); [ -r /sys/fs/cgroup/memory.max ] && cmax=$(cat /sys/fs/cgroup/memory.max)
            events=''; [ -r /sys/fs/cgroup/memory.events ] && events=$(tr '\n' ',' < /sys/fs/cgroup/memory.events)
            echo "LIVE_TELEMETRY role=$ROLE ts=$ts child=$CHILD rss_kb=$rss memavailable_kb=$mem swapfree_kb=$swap cgroup_current=$ccur cgroup_max=$cmax events=$events"
          }
          dump_final() {
            echo "LIVE_TELEMETRY_SIGNAL role=$ROLE ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            emit_sample || true
            [ -r /sys/fs/cgroup/memory.events ] && { echo CGROUP_FINAL_EVENTS; cat /sys/fs/cgroup/memory.events; } || true
          }
          trap dump_final TERM INT
          while kill -0 "$CHILD" 2>/dev/null; do emit_sample; sleep 5; done
          wait "$CHILD"; rc=$?
          echo "$rc" > evidence/process_rc.txt
          dump_final
          echo "LIVE_TELEMETRY_END role=$ROLE rc=$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-parser-1mib-live-memory-${{ matrix.role }}-v0-1
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
