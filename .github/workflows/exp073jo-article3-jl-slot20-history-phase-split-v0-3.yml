name: exp073jo-article3-jl-slot20-history-phase-split-v0-3

on:
  push:
    paths:
      - '.github/workflows/exp073jo-article3-jl-slot20-history-phase-split-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: exp073jo-article3-jl-slot20-history-phase-split-v0-3
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  WRAPPER_BLOB_SHA: aa4c544c1e3e81137010fcdbd34f20567e1eb894
  PHASE_HELPER_BLOB_SHA: 24b1e5e87f6560cda145275072639eafaf097881

jobs:
  phase:
    strategy:
      fail-fast: false
      matrix:
        phase: [slot20_after_history, slot20_fresh_tail]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce frozen v0.3 contract and implementation identities
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/dsir4/prereg/EXP073JO_ARTICLE3_JL_DURABLE_RESPONSE_CHECKPOINT_RECOVERY_V0_1.md
          test -f docs/dsir4/prereg/EXP073JO_ARTICLE3_JL_CHECKPOINT_PREFLIGHT_SPLIT_RECOVERY_V0_2.md
          test -f docs/dsir4/prereg/EXP073JO_ARTICLE3_JL_SLOT20_HISTORY_PHASE_SPLIT_RECOVERY_V0_3.md
          test "$(git hash-object ci/exp073jo_article3_jl_durable_response_checkpoint_recovery_v0_1.py)" = "$WRAPPER_BLOB_SHA"
          test "$(git hash-object ci/exp073jo_slot20_phase_split_v0_3.py)" = "$PHASE_HELPER_BLOB_SHA"
          python -m py_compile ci/exp073jo_slot20_phase_split_v0_3.py ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/dsir4/prereg/EXP073JO_ARTICLE3_JL_SLOT20_HISTORY_PHASE_SPLIT_RECOVERY_V0_3.md').read_text()
          for x in ['slot20_after_history','slot20_fresh_tail','4097','np.array_equal','10164136352','10164156389','aa4c544c1e3e81137010fcdbd34f20567e1eb894']:
              assert x in s, x
          print('PASS_EXP073JO_SLOT20_PHASE_SPLIT_STATIC_GUARD_V0_3')
          PY

      - name: Install frozen numerical and build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git
          python -m pip install --upgrade pip wheel 'setuptools<76'
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy

      - name: Checkout capacity-patch and build exact pinned CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          grep -F '#define _MAX_NUMBER_OF_K_FILES_ 30' external/class_iv/include/perturbations.h >/dev/null
          grep -F '#define _ARGUMENT_LENGTH_MAX_ 1024' external/class_iv/include/parser.h >/dev/null
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 4608'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 131072'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          rec={'schema':'EXP073JO_CLASSIV_INPUT_CAPACITY_PATCH_V0_3','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','old_capacity':30,'new_capacity':4608,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_old_argument_capacity':1024,'parser_new_argument_capacity':131072,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost}
          Path('artifacts/capacity_patch.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; new="extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          make -C external/class_iv -j2 all

      - name: Execute exact frozen slot20 phase
        shell: bash
        run: |
          set -euo pipefail
          python ci/exp073jo_slot20_phase_split_v0_3.py \
            --phase '${{ matrix.phase }}' \
            --wrapper-script ci/exp073jo_article3_jl_durable_response_checkpoint_recovery_v0_1.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --out-json artifacts/phase_result.json \
            --out-bin artifacts/tail_response.f64
          python - <<'PY'
          import hashlib,json,os,pathlib
          d=json.load(open('artifacts/phase_result.json'))
          raw=pathlib.Path('artifacts/tail_response.f64').read_bytes()
          assert d['phase']==os.environ['MATRIX_PHASE']
          assert d['classification']=='SLOT20_HISTORY_PHASE_RECEIPT_PLUS_0_PLUS_0'
          assert d['effect']=='+0/+0' and d['scientific_authority_created'] is False and d['covariance_restriction_authorized'] is False
          assert d['wrapper_blob_sha']==os.environ['WRAPPER_BLOB_SHA']
          assert d['slot']==20 and d['requested_node_count']==4097 and d['response_shape']==[4,2] and d['response_dtype']=='<f8' and d['response_nbytes']==64
          assert hashlib.sha256(raw).hexdigest()==d['response_sha256']
          assert d['pre_query_executed'] is (os.environ['MATRIX_PHASE']=='slot20_after_history')
          print(d['token'])
          PY
        env:
          MATRIX_PHASE: ${{ matrix.phase }}

      - uses: actions/upload-artifact@v4
        with:
          name: exp073jo-slot20-phase-${{ matrix.phase }}-v0-3
          path: |
            artifacts/phase_result.json
            artifacts/tail_response.f64
            artifacts/capacity_patch.json
          retention-days: 90

  aggregate:
    needs: phase
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PRESERVED_HISTORY10_ARTIFACT: '10164136352'
      PRESERVED_HISTORY10_ZIP_SHA: '0a06f375ba59f4da33172d3d9f742af7b29c82263c600c2e7696fd6676af41cc'
      PRESERVED_HISTORY10_JSON_SHA: 'a85061de4d6b1d0953b60fdc083389a7fc6851100fc8e1b3a310fc7b5c8a1c55'
      PRESERVED_ROUNDTRIP10_ARTIFACT: '10164156389'
      PRESERVED_ROUNDTRIP10_ZIP_SHA: '5facd22fbf6edca62b0ff37e7457d411d232525aeead20738de8cb68c9bca735'
      PRESERVED_ROUNDTRIP10_JSON_SHA: '275683c8f3c03eda9656e96f1b8124a91c5d25291b1940002b075e61f2ae5046'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: exp073jo-slot20-phase-*-v0-3
          path: newparts

      - name: Download and hash-bind preserved v0.2 PASS receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preserved
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRESERVED_HISTORY10_ARTIFACT}/zip" > preserved/history10.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRESERVED_ROUNDTRIP10_ARTIFACT}/zip" > preserved/roundtrip10.zip
          test "$(sha256sum preserved/history10.zip | awk '{print $1}')" = "$PRESERVED_HISTORY10_ZIP_SHA"
          test "$(sha256sum preserved/roundtrip10.zip | awk '{print $1}')" = "$PRESERVED_ROUNDTRIP10_ZIP_SHA"

      - name: Aggregate exact preserved and reconstructed controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==1.26.4'
          mkdir -p artifacts
          python - <<'PY'
          import glob,hashlib,json,os,pathlib,zipfile
          import numpy as np

          def sha(b): return hashlib.sha256(b).hexdigest()
          def read_preserved(zip_path, expected_json_sha):
              with zipfile.ZipFile(zip_path,'r') as z:
                  raw=z.read('part_result.json')
              if sha(raw)!=expected_json_sha: raise SystemExit(f'preserved inner JSON hash mismatch {zip_path}')
              return json.loads(raw), raw

          h10,h10raw=read_preserved('preserved/history10.zip',os.environ['PRESERVED_HISTORY10_JSON_SHA'])
          r10,r10raw=read_preserved('preserved/roundtrip10.zip',os.environ['PRESERVED_ROUNDTRIP10_JSON_SHA'])
          if h10.get('part')!='history_slot10' or h10.get('classification')!='HISTORY_INDEPENDENCE_PART_PASS_PLUS_0_PLUS_0': raise SystemExit('preserved history10 identity/status mismatch')
          if not (h10.get('exact_array_equal') is True and h10.get('exact_finite_pattern_equal') is True and h10.get('exact_positive_pattern_equal') is True): raise SystemExit('preserved history10 equality mismatch')
          if r10.get('part')!='cache_roundtrip_slot10' or r10.get('classification')!='CACHE_ROUNDTRIP_PART_PASS_PLUS_0_PLUS_0': raise SystemExit('preserved roundtrip10 identity/status mismatch')
          if not (r10.get('exact_response_bytes_equal') is True and r10.get('exact_audit_restoration') is True): raise SystemExit('preserved roundtrip10 mismatch')
          for d in (h10,r10):
              if d.get('contract_id')!='EXP073JO_ARTICLE3_JL_DURABLE_RESPONSE_CHECKPOINT_RECOVERY_V0_1': raise SystemExit('preserved contract mismatch')
              if d.get('scientific_authority_created') is not False or d.get('covariance_restriction_authorized') is not False: raise SystemExit('preserved authority leakage')

          phase_dirs=glob.glob('newparts/exp073jo-slot20-phase-*-v0-3')
          if len(phase_dirs)!=2: raise SystemExit(f'expected two phase dirs, got {phase_dirs}')
          phases={}
          for dpath in phase_dirs:
              dpath=pathlib.Path(dpath)
              jraw=(dpath/'phase_result.json').read_bytes(); d=json.loads(jraw)
              b=(dpath/'tail_response.f64').read_bytes()
              phase=d.get('phase')
              if phase in phases: raise SystemExit('duplicate phase')
              if d.get('schema')!='EXP073JO_SLOT20_HISTORY_PHASE_RECEIPT_V0_3': raise SystemExit('phase schema mismatch')
              if d.get('phase_split_version')!='EXP073JO_SLOT20_HISTORY_PHASE_SPLIT_V0_3': raise SystemExit('phase version mismatch')
              if d.get('contract_id')!='EXP073JO_ARTICLE3_JL_DURABLE_RESPONSE_CHECKPOINT_RECOVERY_V0_1': raise SystemExit('phase contract mismatch')
              if d.get('wrapper_blob_sha')!='aa4c544c1e3e81137010fcdbd34f20567e1eb894': raise SystemExit('wrapper identity mismatch')
              if d.get('slot')!=20 or d.get('native_kpd')!=20.0 or d.get('h')!=1e-4 or d.get('rel_tol')!=1e-3: raise SystemExit('phase numerical identity mismatch')
              if d.get('base_n')!=4096 or d.get('requested_node_count')!=4097 or d.get('lower_guard_count')!=0 or d.get('upper_guard_count')!=1: raise SystemExit('phase lattice mismatch')
              if d.get('response_shape')!=[4,2] or d.get('response_dtype')!='<f8' or d.get('response_nbytes')!=64 or len(b)!=64: raise SystemExit('phase response identity mismatch')
              if sha(b)!=d.get('response_sha256'): raise SystemExit('phase response digest mismatch')
              phases[phase]={'meta':d,'json_sha256':sha(jraw),'response':b,'response_sha256':sha(b)}
          if set(phases)!={'slot20_after_history','slot20_fresh_tail'}: raise SystemExit(f'phase set mismatch {set(phases)}')
          a=phases['slot20_after_history']['meta']; f=phases['slot20_fresh_tail']['meta']
          identity_keys=['node_sha256','pre_z_hex','tail_z_hex','pre_targets_hex','tail_targets_hex','response_shape','response_dtype','response_nbytes']
          for k in identity_keys:
              if a.get(k)!=f.get(k): raise SystemExit(f'phase identity mismatch {k}')
          if a.get('pre_query_executed') is not True or f.get('pre_query_executed') is not False: raise SystemExit('phase history semantics mismatch')

          arr_a=np.frombuffer(phases['slot20_after_history']['response'],dtype='<f8').reshape(4,2)
          arr_f=np.frombuffer(phases['slot20_fresh_tail']['response'],dtype='<f8').reshape(4,2)
          exact_array=bool(np.array_equal(arr_a,arr_f))
          exact_finite=bool(np.array_equal(np.isfinite(arr_a),np.isfinite(arr_f)))
          exact_positive=bool(np.array_equal(arr_a>0.0,arr_f>0.0))
          raw_equal=bool(phases['slot20_after_history']['response']==phases['slot20_fresh_tail']['response'])
          if not (exact_array and exact_finite and exact_positive): raise SystemExit('VALID_NEGATIVE: reconstructed slot20 history-independence exact equality failed')

          out={
            'schema':'EXP073JO_ARTICLE3_JL_DURABLE_RESPONSE_CHECKPOINT_PREFLIGHT_RESULT_V0_3',
            'experiment':'Exp073JO',
            'phase_split_version':'EXP073JO_SLOT20_HISTORY_PHASE_SPLIT_V0_3',
            'contract_id':'EXP073JO_ARTICLE3_JL_DURABLE_RESPONSE_CHECKPOINT_RECOVERY_V0_1',
            'classification':'DURABLE_RESPONSE_CHECKPOINT_PREFLIGHT_PASS_PLUS_0_PLUS_0',
            'effect':'+0/+0',
            'scientific_authority_created':False,
            'covariance_restriction_authorized':False,
            'wrapper_blob_sha':'aa4c544c1e3e81137010fcdbd34f20567e1eb894',
            'flush_every_new_calls':16,
            'capacity':4608,
            'parser_capacity':131072,
            'native_kpd':20.0,
            'h':1e-4,
            'rel_tol':1e-3,
            'workflow_head_sha':os.environ['GITHUB_SHA'],
            'preserved_v0_2':{
              'history_slot10':{'artifact_id':int(os.environ['PRESERVED_HISTORY10_ARTIFACT']),'zip_sha256':os.environ['PRESERVED_HISTORY10_ZIP_SHA'],'json_sha256':os.environ['PRESERVED_HISTORY10_JSON_SHA'],'result':h10},
              'cache_roundtrip_slot10':{'artifact_id':int(os.environ['PRESERVED_ROUNDTRIP10_ARTIFACT']),'zip_sha256':os.environ['PRESERVED_ROUNDTRIP10_ZIP_SHA'],'json_sha256':os.environ['PRESERVED_ROUNDTRIP10_JSON_SHA'],'result':r10},
            },
            'history_slot20_reconstructed':{
              'exact_array_equal':exact_array,
              'exact_finite_pattern_equal':exact_finite,
              'exact_positive_pattern_equal':exact_positive,
              'raw_response_bytes_equal':raw_equal,
              'node_sha256':a['node_sha256'],
              'tail_response_sha256':phases['slot20_after_history']['response_sha256'],
              'phases':{k:{kk:vv for kk,vv in v.items() if kk!='response'} for k,v in phases.items()},
            },
            'token':'PASS_EXP073JO_DURABLE_RESPONSE_CHECKPOINT_PREFLIGHT_V0_3'
          }
          pathlib.Path('artifacts/exp073jo_preflight_result_v0_3.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token'])
          print('SLOT20_EXACT_ARRAY_EQUAL',exact_array,'RAW_BYTES_EQUAL',raw_equal)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp073jo-durable-response-checkpoint-preflight-v0-3
          path: artifacts/exp073jo_preflight_result_v0_3.json
          retention-days: 90
