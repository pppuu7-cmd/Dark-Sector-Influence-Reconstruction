name: dsir-v026-r1-first-attempt-failure-funnel-v05-one-shot-launcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-v05-one-shot-launcher.yml

permissions:
  contents: read
  actions: write

env:
  TARGET_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-hosted-v0-5.yml
  TERMINAL_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-terminal-history-v0-5.yml
  ORCHESTRATOR_WORKFLOW_PATH: .github/workflows/dsir-v026-r1-first-attempt-failure-funnel-orchestrator-v0-5.yml
  STATIC_AUTHORITY_PATH: docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_HOSTED_STATIC_AUDIT_AUTHORITY_V0_5.json
  EXECUTION_AUTHORITY_PATH: docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_HOSTED_EXECUTION_AUTHORITY_V0_5.json
  REVIEW_PATH: docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_HOSTED_EXECUTION_AUTHORITY_REVIEW_CONFIRMATION_V0_5.json
  TERMINAL_GATE_PATH: docs/dsir4/authority/LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_V0_5_TERMINAL_EXECUTION_GATE_AUTHORITY_V0_1.json
  TARGET_BLOB: 6844ff90d251f31097b359486df80774883800f1
  TERMINAL_BLOB: 27ac9ed1131f0443968307c2181d9a2fd97ccbe8
  ORCHESTRATOR_BLOB: 3373b44582c7cfdd040a50cc1ade3b060c9c132e
  STATIC_AUTHORITY_BLOB: 961490275981c7312e4b1c4aed95bbe63fb10987
  EXECUTION_AUTHORITY_BLOB: fee0ea62b0fa465643b9bfe5cafae01666680631
  REVIEW_BLOB: ee644f633d011021f0d4437fc8e096a7b16e5c91
  TERMINAL_GATE_BLOB: 55bef5691eb27f8c886d5157058e9991fdba49c5
  EXECUTION_NONCE: DSIR-V026R1-FFHOSTED-V0-5-728EC746-60286B97-20260916-A1
  GH_TOKEN: ${{ github.token }}

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout promoted main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact promoted v0.5 authority set
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git hash-object "$TARGET_WORKFLOW_PATH")" = "$TARGET_BLOB"
          test "$(git hash-object "$TERMINAL_WORKFLOW_PATH")" = "$TERMINAL_BLOB"
          test "$(git hash-object "$ORCHESTRATOR_WORKFLOW_PATH")" = "$ORCHESTRATOR_BLOB"
          test "$(git hash-object "$STATIC_AUTHORITY_PATH")" = "$STATIC_AUTHORITY_BLOB"
          test "$(git hash-object "$EXECUTION_AUTHORITY_PATH")" = "$EXECUTION_AUTHORITY_BLOB"
          test "$(git hash-object "$REVIEW_PATH")" = "$REVIEW_BLOB"
          test "$(git hash-object "$TERMINAL_GATE_PATH")" = "$TERMINAL_GATE_BLOB"
          python3 - <<'PY'
          import json,os
          a=json.load(open(os.environ['EXECUTION_AUTHORITY_PATH'])); g=json.load(open(os.environ['TERMINAL_GATE_PATH']))
          assert a['execution_nonce']==os.environ['EXECUTION_NONCE']
          assert a['authorized_ref']=='refs/heads/main' and a['authorized_event']=='workflow_dispatch'
          assert a['authorized_run_number']==1 and a['authorized_run_attempt']==1
          assert a['authorized_orchestrator_dispatch_count']==1 and a['authorized_target_dispatch_count']==1 and a['authorized_terminal_history_dispatch_count']==1
          assert g['status']=='TERMINAL_EXECUTION_GATE_AUTHORITY' and g['verdict']=='QUALIFIED'
          assert g['execution_nonce']==os.environ['EXECUTION_NONCE']
          assert g['exact_one_orchestrator_dispatch_authorized_after_exact_promotion'] is True
          assert g['atomic_zero_history_recheck_immediately_before_dispatch_required'] is True
          assert g['direct_target_dispatch_authorized'] is False and g['direct_terminal_history_dispatch_authorized'] is False
          assert g['science_run_35033268924_rerun_authorized'] is False
          assert g['successor_sentinel_science_authorized'] is False and g['full_107_row_execution_authorized'] is False
          PY
      - name: Atomic zero-history recheck immediately before dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          runs=[]; url=f'https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=100'
          while url:
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req) as r:
                  p=json.load(r); runs.extend(p.get('workflow_runs',[])); link=r.headers.get('Link','')
              url=next((z.split(';',1)[0].strip()[1:-1] for z in link.split(',') if 'rel="next"' in z),None)
          out={}
          for k,p in [('target',os.environ['TARGET_WORKFLOW_PATH']),('terminal',os.environ['TERMINAL_WORKFLOW_PATH']),('orchestrator',os.environ['ORCHESTRATOR_WORKFLOW_PATH'])]:
              xs=[x for x in runs if x.get('path')==p]; assert len(xs)==0,(k,[(x.get('id'),x.get('status'),x.get('run_number'),x.get('run_attempt')) for x in xs]); out[k]={'total_count':0,'workflow_runs':[]}
          json.dump(out,open('safe/atomic_pre_dispatch_history.json','w'),indent=2,sort_keys=True)
          PY
      - name: Dispatch exactly one authorized orchestrator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; wid=os.path.basename(os.environ['ORCHESTRATOR_WORKFLOW_PATH'])
          url=f'https://api.github.com/repos/{repo}/actions/workflows/{wid}/dispatches'
          body=json.dumps({'ref':'main','inputs':{'execution_nonce':os.environ['EXECUTION_NONCE'],'execution_authority_blob_sha1':os.environ['EXECUTION_AUTHORITY_BLOB'],'execution_authority_review_blob_sha1':os.environ['REVIEW_BLOB'],'terminal_static_audit_authority_blob_sha1':os.environ['STATIC_AUTHORITY_BLOB']}}).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: assert r.status==204
          PY
      - name: Persist launcher evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          out={'schema':'LAYERB_BETA_V0_26_R1_SENTINEL_FIRST_ATTEMPT_FAILURE_FUNNEL_V0_5_ONE_SHOT_LAUNCHER_RECEIPT_V0_1','status':'DISPATCH_EMITTED','execution_nonce':os.environ['EXECUTION_NONCE'],'launcher_run_id':int(os.environ['GITHUB_RUN_ID']),'launcher_run_number':int(os.environ['GITHUB_RUN_NUMBER']),'launcher_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'orchestrator_dispatch_http_status':204,'direct_target_dispatch_emitted':False,'direct_terminal_history_dispatch_emitted':False,'science_authorized':False}
          json.dump(out,open('safe/v05_launcher_receipt.json','w'),indent=2,sort_keys=True);open('safe/v05_launcher_receipt.json','a').write('\n')
          PY
          sha256sum safe/v05_launcher_receipt.json > safe/v05_launcher_receipt.sha256
      - name: Upload launcher evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsir-v026-r1-first-attempt-failure-funnel-v05-one-shot-launcher
          path: |
            safe/atomic_pre_dispatch_history.json
            safe/v05_launcher_receipt.json
            safe/v05_launcher_receipt.sha256
          if-no-files-found: error
          retention-days: 90
