name: CAMB native coherence localization v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/camb-native-coherence-localization-v0-1.yml'
      - 'ci/camb_native_coherence_localization_v0_1.py'
      - 'experiments/067c_camb_native_coherence_localization_v0_1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/camb-native-coherence-localization-v0-1.yml'
      - 'ci/camb_native_coherence_localization_v0_1.py'
      - 'experiments/067c_camb_native_coherence_localization_v0_1.md'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install CAMB build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran git python3-dev
          python3 -m pip install --user numpy cython setuptools wheel packaging

      - name: Fetch and install pinned CAMB
        run: |
          set -euxo pipefail
          mkdir -p external
          git clone https://github.com/cmbant/CAMB.git external/CAMB
          git -C external/CAMB checkout fa3f097343fbbe427cc04b4f5f0041c22c6ec764
          test "$(git -C external/CAMB rev-parse HEAD)" = 'fa3f097343fbbe427cc04b4f5f0041c22c6ec764'
          grep -Fq 'Weyl                    10' external/CAMB/docs/source/transfer_variables.rst
          grep -Fq 'divided by :math:`k^2`' external/CAMB/docs/source/transfer_variables.rst
          python3 -m pip install --user ./external/CAMB

      - name: Run frozen Exp067C diagnostic
        run: |
          set -euxo pipefail
          python3 ci/camb_native_coherence_localization_v0_1.py \
            --camb-repo external/CAMB \
            --output data/derived/g7/exp067c_camb_native_coherence_localization_v0_1.json

      - name: Preserve diagnostic classification
        run: |
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp067c_camb_native_coherence_localization_v0_1.json'
          d=json.load(open(p))
          assert d['diagnosis'] in {
              'EXP067B_TARGET_FAIL_NOT_REPRODUCED_V0_1',
              'NATIVE_CAMB_COHERENCE_DEFECT_V0_1',
              'KNOT_RECONSTRUCTION_DEFECT_V0_1',
              'INTERIOR_INTERPOLATION_LOCALIZED_V0_1',
          }
          assert d['coherence_threshold_inherited_from_Exp067B'] == 5e-8
          assert d['support']['z'] == [0.0,0.5,1.0,2.0]
          assert d['support']['target_k_Mpc^-1'] == [0.005,0.02,0.05,0.1,0.2]
          assert d['support']['native_interval_Mpc^-1'] == [0.005,0.2]
          assert d['Exp067B_state'] == 'HARD_FAIL_UNCHANGED'
          assert d['gate_state'] == {'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('EXP067C_DIAGNOSIS', d['diagnosis'])
          print('NATIVE', d['native_raw'])
          print('KNOTS', d['interpolator_on_native_knots'])
          print('TARGET', d['interpolator_on_Exp067B_targets'])
          PY

      - name: Upload diagnostic record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp067c-camb-native-coherence-${{ github.sha }}
          path: data/derived/g7/exp067c_camb_native_coherence_localization_v0_1.json
          if-no-files-found: warn
