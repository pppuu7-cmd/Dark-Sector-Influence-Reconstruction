name: exp073js-article3-fine4097-cross-model-lifecycle-isolation-v0-1

on:
  push:
    paths:
      - '.github/workflows/exp073js-article3-fine4097-cross-model-lifecycle-isolation-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp073js-article3-fine4097-cross-model-lifecycle-isolation-v0-1
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PREREG_BLOB: '73bac6764a62f3de6cbf2c7fec3fa987fb648ecc'
  HELPER_BLOB: '70a38a45d6d743878e1b5d8a8c2d14630bf3ee80'
  SOURCE_AUDIT_BLOB: 'f4c9b7b241f22985b2c38bc3dcae8f9fda07267a'

jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        model: [reference, alpha_minus, beta_plus, beta_minus]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen JS identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/prereg/EXP073JS_ARTICLE3_FINE4097_CROSS_MODEL_LIFECYCLE_ISOLATION_V0_1.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073js_article3_fine4097_cross_model_lifecycle_isolation_v0_1.py)" = "$HELPER_BLOB"
          test "$(git hash-object docs/dsir4/audits/CLASSIV_C2_INSTANCE_LOCALITY_SOURCE_AUDIT_V0_1.md)" = "$SOURCE_AUDIT_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JR_COARSE_2049_SEQUENTIAL_EXACT_EQUIVALENCE_RECEIPT_V0_1.json)" = 'ee6526bd80daeac7990b2244b8ec2c8061a534c4'
          test "$(git hash-object docs/dsir4/authority/EXP073JQ_ARTICLE3_SLOT20_SAME_RUN_HISTORY_INDEPENDENCE_V0_1.json)" = 'd712410f524dd6f2d47c43fc78e72ff5d4b43c95'
          python -m py_compile ci/exp073js_article3_fine4097_cross_model_lifecycle_isolation_v0_1.py
      - name: Install frozen stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null
      - name: Build exact pinned capacity-patched CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 4608',1))
          q=Path('external/class_iv/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 131072',1))
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null
      - name: Execute frozen one-live lifecycle control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python ci/exp073js_article3_fine4097_cross_model_lifecycle_isolation_v0_1.py \
            --model '${{ matrix.model }}' \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --out artifacts/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp073js-${{ matrix.model }}
          path: artifacts/result.json
          retention-days: 90

  aggregate:
    if: always()
    needs: model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: exp073js-*
          path: parts
      - name: Aggregate exact lifecycle classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import glob,json,pathlib
          rows=[]
          for p in glob.glob('parts/exp073js-*'):
              q=pathlib.Path(p)/'result.json'
              if q.exists(): rows.append(json.load(open(q)))
          roles={d.get('model') for d in rows}; complete=len(rows)==4 and roles=={'reference','alpha_minus','beta_plus','beta_minus'} and all(d.get('schema')=='EXP073JS_ARTICLE3_FINE4097_CROSS_MODEL_LIFECYCLE_ISOLATION_RESULT_V0_1' for d in rows)
          pc='FINE4097_CROSS_MODEL_LIFECYCLE_ISOLATION_PASS_PLUS_0_PLUS_0'; fc='FINE4097_CROSS_MODEL_LIFECYCLE_ISOLATION_FAIL_PLUS_0_PLUS_0'
          if not complete: cls='INVALID_INFRA_PLUS_0_PLUS_0'
          elif any(d.get('classification')==fc for d in rows): cls='FINE4097_ALL_MODEL_LIFECYCLE_ISOLATION_FAIL_PLUS_0_PLUS_0'
          elif all(d.get('classification')==pc for d in rows): cls='FINE4097_ALL_MODEL_LIFECYCLE_ISOLATION_PASS_PLUS_0_PLUS_0'
          else: cls='INVALID_INFRA_PLUS_0_PLUS_0'
          out={'schema':'EXP073JS_ARTICLE3_FINE4097_CROSS_MODEL_LIFECYCLE_ISOLATION_AGGREGATE_V0_1','experiment':'Exp073JS','classification':cls,'effect':'+0/+0','receipt_count':len(rows),'model_classifications':{d.get('model'):d.get('classification') for d in rows},'sequential_authorization_audit_permitted':cls=='FINE4097_ALL_MODEL_LIFECYCLE_ISOLATION_PASS_PLUS_0_PLUS_0','scientific_authority_created':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False,'article3_readiness_percent':68,'funnel_freeze_readiness_percent':67,'token':('PASS_EXP073JS_' if cls=='FINE4097_ALL_MODEL_LIFECYCLE_ISOLATION_PASS_PLUS_0_PLUS_0' else 'FAIL_EXP073JS_')+cls}
          pathlib.Path('artifacts/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(out['token']); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp073js-aggregate
          path: artifacts/result.json
          retention-days: 90
