name: Exp073DV WW cross-field FITS orientation diagnostic v0.1
on:
  push:
    branches: [main]
    paths: ['control/activate_exp073dv_v0_1.txt']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: dsir-exp073dv-ww-crossfield-fits-orientation-v0-1
  cancel-in-progress: false

env:
  PREREG_BLOB: '08ead7b327357806a9dd4371fd15b98435202d8c'
  DIAG_BLOB: '818d69cc76a927599b4eac7e19bea82cfd322640'
  DOWNSTREAM_BLOB: 'be4f381de4c5c043a9c0fcd107e63ef3f2079578'
  OMP_NUM_THREADS: '2'
  OMP_DYNAMIC: 'FALSE'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  hosted-orientation-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Freeze diagnostic identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073dv_ww_crossfield_fits_orientation_diagnostic_v0_1_prereg.md)" = "$PREREG_BLOB"
          test "$(git hash-object ci/exp073dv_ww_crossfield_fits_orientation_diagnostic_v0_1.py)" = "$DIAG_BLOB"
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c)" = "$DOWNSTREAM_BLOB"
          echo PASS_EXP073DV_STATIC_FREEZE
      - name: Install exact NaMaster 2.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "$GITHUB_ENV"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "$GITHUB_ENV"
      - name: Verify runtime lineage and compile frozen downstream
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib,importlib.metadata,inspect,pymaster as nmt
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f'
          print('PASS_EXP073DV_NAMASTER27_LINEAGE')
          PY
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -fopenmp -DDSIR_WORKERS=2 \
            -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_omp10_v0_2.c \
            -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073dv_downstream"
      - name: Execute diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT=data/derived/exp073dv/v0_1
          mkdir -p "$OUT"
          "${NMT_PY}" ci/exp073dv_ww_crossfield_fits_orientation_diagnostic_v0_1.py \
            --emulator "${RUNNER_TEMP}/exp073dv_downstream" --out-dir "$OUT/runtime" \
            --source-head "$GITHUB_SHA" --prereg-blob "$PREREG_BLOB" | tee "$OUT/stdout.txt"
          cp "$OUT/runtime/terminal_diagnostic_receipt.json" "$OUT/terminal_diagnostic_receipt.json"
          "${NMT_PY}" - <<'PY'
          import json
          r=json.load(open('data/derived/exp073dv/v0_1/terminal_diagnostic_receipt.json'))
          assert r['science_gate_scored'] is False and r['ww_authority_created'] is False
          assert r['no_tolerance_rescue'] is True and r['nside']==16 and r['nl']==48 and r['ncls']==4
          allowed={'DIAG_EXP073DV_FITS_AS_IS_EXACT','DIAG_EXP073DV_FITS_TRANSPOSE_REQUIRED','DIAG_EXP073DV_DOWNSTREAM_ARITHMETIC_MISMATCH','DIAG_EXP073DV_UNRESOLVED_INTERFACE_MISMATCH'}
          assert r['token'] in allowed,r['token']
          print(r['token'])
          PY
          sha256sum "$OUT/terminal_diagnostic_receipt.json" "$OUT/stdout.txt" > "$OUT/payload_sha256.txt"
      - name: Upload immutable diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073dv-ww-crossfield-fits-orientation-v0-1-${{ github.sha }}
          path: data/derived/exp073dv/v0_1/
          if-no-files-found: error
