name: Exp073GM C2 IDE observation hook build audit v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exp073gm-c2-ide-observation-hook-build-audit-v0-1.yml'
      - 'scripts/dsir4/make_exp073gm_c2_observation_hook.py'
      - 'docs/dsir4/prereg/EXP073GM_C2_IDE_OBSERVATION_HOOK_BUILD_AUDIT_V0_1.md'

jobs:
  hosted-build-no-mutation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compile dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgsl-dev

      - name: Clone pinned class_iv lineage
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/kaeonikc/class_iv.git /tmp/class_iv
          git -C /tmp/class_iv checkout --detach ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C /tmp/class_iv rev-parse HEAD)" = "ac627d54e9ce196a08878d1ba33999819925d19c"

      - name: Dry-run exact diagnostic patch contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dsir4/make_exp073gm_c2_observation_hook.py /tmp/class_iv/source/perturbations.c

      - name: Apply diagnostic-only patch and prove structural equivalence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/class_iv/source/perturbations.c /tmp/perturbations.original.c
          python3 scripts/dsir4/make_exp073gm_c2_observation_hook.py --apply /tmp/class_iv/source/perturbations.c | tee /tmp/exp073gm_patch_audit.txt
          python3 - <<'PY'
          from importlib.util import spec_from_file_location, module_from_spec
          from pathlib import Path
          original = Path('/tmp/perturbations.original.c').read_text()
          patched = Path('/tmp/class_iv/source/perturbations.c').read_text()
          spec = spec_from_file_location('exp073gm_hook', 'scripts/dsir4/make_exp073gm_c2_observation_hook.py')
          mod = module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert patched.count(mod.BLOCK) == 1, 'exact diagnostic block absent or non-unique'
          restored = patched.replace(mod.BLOCK, '', 1)
          assert restored == original, 'source equivalence modulo exact diagnostic block failed'
          block = mod.BLOCK
          forbidden = [
              'background_at_tau(', 'thermodynamics_at_z(',
              'ppw->delta_m =', 'ppw->theta_m =',
              'pvecmetric[', 'y[', 'ppr->'
          ]
          for token in forbidden:
              assert token not in block, f'forbidden token in diagnostic block: {token}'
          assert 'fprintf(stderr' in block
          assert 'rho_idm_iv' in block and 'rho_iv' in block
          print('EXP073GM_STRUCTURAL_SOURCE_EQUIVALENCE=PASS')
          print('EXP073GM_STATIC_NO_MUTATION_AUDIT=PASS')
          PY

      - name: Compile patched source with diagnostics disabled
        shell: bash
        working-directory: /tmp/class_iv
        run: |
          set -euo pipefail
          make clean >/dev/null 2>&1 || true
          make -j2 perturbations.o

      - name: Compile patched source with diagnostics enabled
        shell: bash
        working-directory: /tmp/class_iv
        run: |
          set -euo pipefail
          make clean >/dev/null 2>&1 || true
          make -j2 OPTFLAG='-O2 -DDSIR_EXP073GM_DIAGNOSTICS' perturbations.o
          echo 'EXP073GM_HOOK_BUILD_NO_MUTATION=PASS_SUPPORT_ONLY'
          echo 'EXP073GM_SCIENTIFIC_CONTRIBUTION=+0/+0'
          echo 'EXP073GM_G_DOMAIN_MAPPING=NOT_YET_TESTABLE'
