name: Exp073R1 one-shot v0.3 launcher after v0.2 terminal
on:
  workflow_run:
    workflows: ["Exp073R1 sharded deterministic full weak-lensing mask v0.2"]
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: ${{ github.event.workflow_run.id == 33135622749 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PARENT_RUN: '33135622749'
      EXPECTED_PARENT_PATH: '.github/workflows/exp073r1-desy1-sharded-mask-v0-2.yml'
      TARGET_WORKFLOW: 'exp073r1-desy1-low-concurrency-microshards-v0-3.yml'
      TARGET_WORKFLOW_BLOB: '12e15177bd389d603af04c89ec815ba6c94c749c'
      TARGET_MERGER_BLOB: '0fb99998ad1a15acaa4223ea7d6d47fbd8d93080'
    steps:
      - name: Verify terminal parent and immutable v0.3 implementation
        run: |
          set -euxo pipefail
          test "${{ github.event.workflow_run.id }}" = "${EXPECTED_PARENT_RUN}"
          test "${{ github.event.workflow_run.status }}" = "completed"
          test "${{ github.event.workflow_run.path }}" = "${EXPECTED_PARENT_PATH}"
          test "${{ github.event.workflow_run.head_sha }}" = "70be4d35199d4132a2ca9da912689519e40bcc84"

          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/${TARGET_WORKFLOW}?ref=main" > /tmp/wf.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/ci/exp073r1_desy1_merge_v0_3.py?ref=main" > /tmp/merge.json
          python3 - <<'PY'
          import json, os
          wf=json.load(open('/tmp/wf.json'))
          mg=json.load(open('/tmp/merge.json'))
          assert wf['sha']==os.environ['TARGET_WORKFLOW_BLOB'], (wf['sha'], os.environ['TARGET_WORKFLOW_BLOB'])
          assert mg['sha']==os.environ['TARGET_MERGER_BLOB'], (mg['sha'], os.environ['TARGET_MERGER_BLOB'])
          PY

      - name: Refuse duplicate v0.3 dispatch
        run: |
          set -euxo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&per_page=100" > /tmp/v03runs.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v03runs.json'))
          runs=d.get('workflow_runs', [])
          assert len(runs)==0, f'v0.3 already dispatched: {[r["id"] for r in runs]}'
          PY

      - name: Dispatch preregistered low-concurrency v0.3 exactly once
        run: |
          set -euxo pipefail
          gh workflow run "${TARGET_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref main

      - name: Record orchestration boundary
        run: |
          echo 'R1 v0.3 dispatch is transport/reproduction orchestration only.'
          echo 'No f_invalid, covariance, whitening, nuisance SVD, relation/null or G8 quantity is read here.'
