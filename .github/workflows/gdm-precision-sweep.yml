name: GDM zero-limit linear-core precision tail

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gdm-precision-sweep.yml'
      - 'ci/physics_window_metrics.py'
      - 'ci/gdm_calibration_trigger.txt'

jobs:
  gdm-linear-core-precision-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        level: [p5, p6]

    steps:
      - name: Checkout DSIR
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip
          python3 -m pip install --user numpy

      - name: Clone and build pinned GDM_CLASS
        run: |
          git clone https://github.com/s-ilic/gdm_class_public.git external_gdm
          cd external_gdm
          git checkout 4c87916aab5ca124a68f1dd16f31846fc13d1829
          git rev-parse HEAD | tee ../gdm_upstream_sha.txt
          make -j2 class

      - name: Select monotone perturbation precision level
        env:
          LEVEL: ${{ matrix.level }}
        run: |
          case "$LEVEL" in
            p5) KSUB=0.0020; KSUPER=0.000010; TOL=1e-8; SAMPLE=0.0010 ;;
            p6) KSUB=0.0015; KSUPER=0.000007; TOL=3e-9; SAMPLE=0.0007 ;;
          esac
          cat > external_gdm/dsir_precision.pre <<EOF
          k_step_sub = $KSUB
          k_step_super = $KSUPER
          k_step_super_reduction = 0.1
          start_small_k_at_tau_c_over_tau_h = 1e-6
          start_large_k_at_tau_h_over_tau_k = 0.05
          tight_coupling_trigger_tau_c_over_tau_h = 0.005
          tight_coupling_trigger_tau_c_over_tau_k = 0.008
          start_sources_at_tau_c_over_tau_h = 0.006
          tol_perturb_integration = $TOL
          perturb_sampling_stepsize = $SAMPLE
          radiation_streaming_approximation = 2
          radiation_streaming_trigger_tau_over_tau_k = 240.
          radiation_streaming_trigger_tau_c_over_tau = 100.
          ur_fluid_approximation = 2
          ur_fluid_trigger_tau_over_tau_k = 50.
          EOF

      - name: Write matched linear-core cosmologies
        run: |
          mkdir -p external_gdm/dsir_precision_outputs
          cat > external_gdm/dsir_baseline.ini <<'EOF'
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          omega_gdm = 0.0
          Omega_Lambda = 0.684
          A_s = 2.10e-9
          n_s = 0.965
          tau_reio = 0.054
          gauge = newtonian
          output = mPk
          P_k_max_h/Mpc = 0.25
          z_pk = 0,1
          write background = yes
          root = dsir_precision_outputs/baseline_
          EOF

          cat > external_gdm/dsir_gdm0.ini <<'EOF'
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.0
          omega_gdm = 0.1200
          Omega_Lambda = 0.684
          A_s = 2.10e-9
          n_s = 0.965
          tau_reio = 0.054
          gauge = newtonian
          type_gdm = time_only_bins
          smooth_bins_gdm = yes
          time_transition_width_gdm = 8.
          time_values_gdm = 0.00001, 0.0001, 0.001, 0.01, 0.1
          w_values_gdm = 0., 0., 0., 0., 0., 0.
          cs2_values_gdm = 0., 0., 0., 0., 0., 0.
          cv2_values_gdm = 0., 0., 0., 0., 0., 0.
          dynamic_shear_gdm = yes
          output = mPk
          P_k_max_h/Mpc = 0.25
          z_pk = 0,1
          write background = yes
          root = dsir_precision_outputs/gdm0_
          EOF

      - name: Run matched linear-core calculations
        working-directory: external_gdm
        run: |
          ./class dsir_baseline.ini dsir_precision.pre 2>&1 | tee dsir_precision_outputs/baseline.log
          ./class dsir_gdm0.ini dsir_precision.pre 2>&1 | tee dsir_precision_outputs/gdm0.log

      - name: Compute scale-aware and frozen-node P(k) metrics
        run: |
          python3 ci/physics_window_metrics.py \
            --directory external_gdm/dsir_precision_outputs \
            --root-a baseline_ \
            --root-b gdm0_ \
            --json external_gdm/dsir_precision_outputs/physics_windows.json

      - name: Record provenance
        env:
          LEVEL: ${{ matrix.level }}
        run: |
          {
            echo "DSIR GDM zero-limit linear-core precision tail"
            echo "precision level: $LEVEL"
            echo "scope: background + linear P(k), k_max=0.25 h/Mpc; CMB calibrated separately"
            echo "frozen core nodes: 0.001,0.003,0.01,0.03,0.1 h/Mpc"
            echo "DSIR commit: $GITHUB_SHA"
            echo -n "GDM upstream: "
            cat gdm_upstream_sha.txt
            uname -a
            python3 --version
            gcc --version | head -1
          } > external_gdm/dsir_precision_outputs/environment.txt

      - name: Upload precision-level artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdm-linear-core-${{ matrix.level }}-${{ github.sha }}
          path: |
            external_gdm/dsir_precision_outputs/
            external_gdm/dsir_baseline.ini
            external_gdm/dsir_gdm0.ini
            external_gdm/dsir_precision.pre
            gdm_upstream_sha.txt
          if-no-files-found: error
