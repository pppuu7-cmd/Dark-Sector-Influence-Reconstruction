name: Exp073P v0.4 production route firewall

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073p-aggregate-prerequisite-join-actual-v0-4.yml'
      - 'ci/exp073p_v04_production_route_firewall_v0_1.py'
      - '.github/workflows/ci-exp073p-v04-production-route-firewall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-route-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Freeze validator and validate manual-only production route
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object ci/exp073p_v04_production_route_firewall_v0_1.py)" = '4e89aeaa1f6e593494116d4e3892b2d6fca58061'
          test "$(git hash-object experiments/073p_aggregate_prerequisite_join_v07_r1_authority_prereg_v0_4.md)" = '2f371c8be6c8b33585b8ab99f7cb59e5cc65abe6'
          test "$(git hash-object ci/exp073p_attempt3_authority_overlay_v0_4.py)" = '8493ef0ac3aef21f26f5960356811c3a8abe0c11'
          python3 -m py_compile ci/exp073p_v04_production_route_firewall_v0_1.py
          python3 ci/exp073p_v04_production_route_firewall_v0_1.py \
            .github/workflows/exp073p-aggregate-prerequisite-join-actual-v0-4.yml
          echo 'support_executor_authorized=false (CI guard only)'
          echo 'gate_state=G7:OPEN,G8:OPEN,G9:OPEN'
