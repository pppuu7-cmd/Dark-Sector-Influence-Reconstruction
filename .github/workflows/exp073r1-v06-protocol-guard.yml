name: Exp073R1 v0.6 frozen protocol guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073r1-desy1-selfhosted-longrun-stageb-v0-6.yml'
      - '.github/workflows/exp073r1-desy1-selfhosted-longrun-v0-6.yml'
      - '.github/workflows/exp073r1-v06-protocol-guard.yml'
      - 'ci/exp073r1_v0_6_protocol_guard.py'
      - 'ci/exp073r1_v0_6_selfhosted_longrun.trigger'
      - 'ci/exp073r1_sequential_wholestream_v0_5.py'
      - 'experiments/073r1_v0_6_selfhosted_longrun_stageb_prereg.md'

permissions:
  contents: read

jobs:
  protocol-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert single canonical frozen v0.6 Stage-B route
        run: |
          set -euxo pipefail
          python3 ci/exp073r1_v0_6_protocol_guard.py
