name: exp073jm-article3-recovered-canonical-one-live-fourth-refinement-v0-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073jm-article3-recovered-canonical-one-live-fourth-refinement-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: exp073jm-article3-recovered-canonical-one-live-fourth-refinement-v0-2
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  JM_HELPER_BLOB: '4ba4868d751b95b97b2ac7f18701f5349e70c950'
  JM_ALIGNMENT_BLOB: '19f648a9a99dfbb1cb7a36f067becc431adabb5b'
  JM_PREREG_BLOB: 'c429891bcd949ffbc3fc13e02fa66656ac16ea11'
  JM_STATIC_AUTH_BLOB: '98e5d43686500ff8044f3197e646364afbf50006'
  JO_AUTH_BLOB: '68b3e3a3274e6e55a9bc1e6949ff23ec41e7b25a'
  JL_AUTH_BLOB: 'aca79d6596f49ced9fe9d965059a2352447f13b4'
  CANON8193_AUTH_BLOB: 'ab25bdc60aa1538ffd5383ce8c43372b2e402406'
  ENGINE_BLOB: '5f8475b961db20bef5f4b8a2eb7c99d9f7c722e2'
  PLAN_AUTH_BLOB: '5992faa10b6d25d1503b287c19456fb36756caa4'
  PLAN_SCRIPT_BLOB: '7180b74641acfa602c34db07ad6cc916c17ebd4f'
  IR_BLOB: '6ef2516dfcae8a8ae92f5b7dbe792274138c0f6f'
  JJ_BLOB: 'ee8fd0650a2a1322fab83a86bb06a219e84ca434'
  COARSE_BLOB: 'f5acd4a25068af22fbaca5fb35adf2afbf3a4be3'
  FINE_BLOB: 'bc9a6e59fb27d7510796c1cb2d5470dfe8a5294b'
  MANIFEST: docs/dsir4/authority/EXP073IM_C2_REAL_INPUT_MANIFEST_V0_4.json
  WM_S3_OVERRIDE: docs/dsir4/authority/EXP073IP_C2_WM_S3_TRANSPORT_OVERRIDE_V0_2.json

jobs:
  recovered-fourth-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce frozen JM authorities and identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/exp073jm_article3_recovered_canonical_one_live_fourth_refinement_v0_2.py)" = "$JM_HELPER_BLOB"
          test "$(git hash-object docs/dsir4/prereg/EXP073JM_RECOVERED_CANONICAL_ONE_LIVE_EXECUTION_ALIGNMENT_V0_2.md)" = "$JM_ALIGNMENT_BLOB"
          test "$(git hash-object docs/dsir4/prereg/EXP073JM_ARTICLE3_LAYERB_COMMON_GRID_FOURTH_REFINEMENT_CONVERGENCE_V0_1.md)" = "$JM_PREREG_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_V0_2.json)" = "$JM_STATIC_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JO_ARTICLE3_JM_CANONICAL_8193_ONE_LIVE_RESOURCE_PILOT_V0_1.json)" = "$JO_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json)" = "$JL_AUTH_BLOB"
          test "$(git hash-object docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json)" = "$CANON8193_AUTH_BLOB"
          test "$(git hash-object ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py)" = "$ENGINE_BLOB"
          test "$(git hash-object docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json)" = "$PLAN_AUTH_BLOB"
          test "$(git hash-object ci/recovered_exp073jl_response_blind_request_plan_audit_v0_1.py)" = "$PLAN_SCRIPT_BLOB"
          test "$(git hash-object ci/exp073ir_article3_real_layerb_common_response_v0_1.py)" = "$IR_BLOB"
          test "$(git hash-object ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py)" = "$JJ_BLOB"
          test "$(git hash-object docs/dsir4/canonical/EXP073JL_CANONICAL_FINE_4097_NODES_U64HEX_V0_1.txt)" = "$COARSE_BLOB"
          test "$(git hash-object docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt)" = "$FINE_BLOB"
          test "$(sha256sum configs/dsir4/c2/ide0_reference_v0_1.ini | awk '{print $1}')" = '0a68f4af6ead7ee69c75f1867f60914a40d4f7ff1219b965a0ae38186ca5c65c'
          python3 -m py_compile \
            ci/exp073jm_article3_recovered_canonical_one_live_fourth_refinement_v0_2.py \
            ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py \
            ci/exp073ir_article3_real_layerb_common_response_v0_1.py \
            ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            ci/recovered_exp073jl_response_blind_request_plan_audit_v0_1.py
          python3 - <<'PY'
          import json
          st=json.load(open('docs/dsir4/authority/EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_V0_2.json'))
          assert st['artifact_verified_independently'] is True
          assert st['classification']=='EXP073JM_RECOVERED_STATIC_IMPLEMENTATION_AUDIT_PASS_PLUS_0_PLUS_0'
          assert st['checks_all_pass'] is True and st['check_count']==41
          assert st['scientific_response_read'] is False and st['class_solver_invoked'] is False
          assert st['helper_git_blob']=='4ba4868d751b95b97b2ac7f18701f5349e70c950'

          jo=json.load(open('docs/dsir4/authority/EXP073JO_ARTICLE3_JM_CANONICAL_8193_ONE_LIVE_RESOURCE_PILOT_V0_1.json'))
          assert jo['artifact_verified_independently'] is True
          assert jo['classification']=='CANONICAL_8193_ONE_LIVE_FOUR_BUILD_RESOURCE_PILOT_PASS_PLUS_0_PLUS_0'
          assert jo['full_jm_production_permitted'] is True
          assert jo['total_solver_constructions']==4 and jo['max_live_instances']==1 and jo['final_live_instances']==0
          assert jo['unsupported_target_evaluations']==0 and jo['max_requested_node_coordinate_rel_mismatch']<=1e-12
          assert jo['canonical_8193_node_sha256']=='6d35a9d79aa8826554e8e39315ab12a8be1675d32d25a86ec04c978c7723a515'
          assert jo['canonical_8193_text_sha256']=='90b9aee9e01784a4af89ab0aa1bd5cbf1e95061f2d412d7a0e1b8ee5332ba7d6'
          assert jo['capacity']==9216 and jo['parser_capacity']==262144
          assert jo['scientific_authority_created'] is False and jo['jm_convergence_classification_created'] is False

          jl=json.load(open('docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json'))
          assert jl['artifact_verified_independently'] is True
          assert jl['classification']=='COMMON_GRID_THIRD_REFINEMENT_NOT_CONVERGED_PLUS_0_PLUS_0'
          assert jl['jm_branch_activated'] is True and jl['jn_branch_activated'] is False

          ca=json.load(open('docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json'))
          assert ca['artifact_verified_independently'] is True
          assert ca['classification']=='CANONICAL_8193_ANCHOR_SELECTED_QUORUM_PASS_PLUS_0_PLUS_0'
          assert ca['requested_node_count']==8193 and ca['guard_counts']==[0,1]
          assert ca['node_payload_sha256']=='6d35a9d79aa8826554e8e39315ab12a8be1675d32d25a86ec04c978c7723a515'
          assert ca['u64hex_sha256']=='90b9aee9e01784a4af89ab0aa1bd5cbf1e95061f2d412d7a0e1b8ee5332ba7d6'

          p=json.load(open('docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json'))
          assert p['artifact_verified_independently'] is True
          assert p['classification']=='RESPONSE_BLIND_REQUEST_PLAN_AUDITED_PLUS_0_PLUS_0'
          assert p['scientific_response_read'] is False and p['class_solver_invoked'] is False
          assert p['coarse_common_plan_sha256']=='505716116cc385d5700e455017d8e541c5bba7774fa6647298392495c83ecfe0'
          assert p['fine_plan_with_gl128_sha256']=='0f7ce2e5fa459e15954268dfd46045eaa0ab6356dfdab5a2e282514e7a34ae4e'
          assert p['execution_shape_if_recovered_one_live']['total_get_transfer_calls_all_roles']==4040
          assert p['execution_shape_if_recovered_one_live']['total_solver_constructions']==8
          assert p['execution_shape_if_recovered_one_live']['max_live_instances']==1
          PY

      - name: Install frozen numerical/build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git unzip >/dev/null
          python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy >/dev/null

      - name: Checkout exact frozen CAMB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/camb
          git -C external/camb init -q
          git -C external/camb remote add origin https://github.com/cmbant/CAMB.git
          git -C external/camb fetch -q --depth 1 origin fa3f097343fbbe427cc04b4f5f0041c22c6ec764
          git -C external/camb checkout -q --detach FETCH_HEAD
          test "$(git -C external/camb rev-parse HEAD)" = fa3f097343fbbe427cc04b4f5f0041c22c6ec764
          python -m pip install ./external/camb >/dev/null

      - name: Checkout, capacity-patch and build exact pinned CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone -q https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout -q ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 9216'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 262144'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          rec={'schema':'EXP073JM_RECOVERED_CLASSIV_INPUT_CAPACITY_PATCH_V0_2','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','path':'include/perturbations.h','old_capacity':30,'new_capacity':9216,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_path':'include/parser.h','parser_old_argument_capacity':1024,'parser_new_argument_capacity':262144,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost}
          Path('artifacts/capacity_patch.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          make -C external/class_iv -j2 all >/dev/null

      - name: Download exact DES-Y1 radial payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/des_nz
          curl --fail --location --retry 3 -sS -o external/des_nz/source.fits 'https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/redshift_bins/y1_redshift_distributions_v1.fits'
          curl --fail --location --retry 3 -sS -o external/des_nz/lens.fits 'https://desdr-server.ncsa.illinois.edu/despublic/y1a1_files/chains/2pt_NG_mcal_1110.fits'
          echo 'b5d87138c35ae8bb4ecd02491972f544648398e606b3617039e6e54cb8ea943b  external/des_nz/source.fits' | sha256sum -c -
          echo '114035179b5a8e41090751e9a6478536d185128581d37b5a510eff5722f417ca  external/des_nz/lens.fits' | sha256sum -c -

      - name: Download exact Layer-A parent, angular and Exp073IM authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/parent inputs/angular inputs/expim
          get_artifact () {
            local id="$1" digest="$2" dest="$3"; local zip="${dest}.zip"; mkdir -p "$dest"
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"
            local actual expected; actual="$(sha256sum "$zip" | awk '{print $1}')"; expected="${digest#sha256:}"
            test "$actual" = "$expected" || { echo "artifact $id digest mismatch $actual != $expected"; exit 31; }
            unzip -q "$zip" -d "$dest"
          }
          get_artifact 10131794281 'sha256:ac959926639d3b46ecfe114e396ce03cb20a0763ef2781db454408d8ad0759df' inputs/parent
          while IFS=$'\t' read -r slot id digest; do get_artifact "$id" "$digest" "inputs/angular/$slot"; done < <(jq -r '.angular[] | [.slot, (.artifact_id|tostring), .artifact_digest] | @tsv' "$MANIFEST")
          id="$(jq -r '.artifact_id' "$WM_S3_OVERRIDE")"; mkdir -p inputs/angular/Wm_S3/transport_override
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > inputs/angular/Wm_S3/transport_override.zip
          unzip -q inputs/angular/Wm_S3/transport_override.zip -d inputs/angular/Wm_S3/transport_override
          expected="$(jq -r '.required_each_canonical_sha256' "$WM_S3_OVERRIDE")"; nbytes="$(jq -r '.required_each_nbytes' "$WM_S3_OVERRIDE")"
          for f in inputs/angular/Wm_S3/transport_override/A/selected_te.bin inputs/angular/Wm_S3/transport_override/B/selected_te.bin; do test "$(stat -c%s "$f")" = "$nbytes"; test "$(sha256sum "$f" | awk '{print $1}')" = "$expected"; done
          cmp -s inputs/angular/Wm_S3/transport_override/A/selected_te.bin inputs/angular/Wm_S3/transport_override/B/selected_te.bin
          get_artifact 10130241439 'sha256:3325bab0faa821c5ca3b13b4cd64d3d58c323e56a6f3e44952be84bfbc477156' inputs/expim

      - name: Download exact frozen BOSS z3 operators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/exp073w_boss; base='https://fbeutler.github.io/hub'
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/W_NGC_z3.gz "$base/W_BOSS_DR12_NGC_z3_V6C_1_1_1_1_1_10_200_2000_averaged_v1.matrix.gz"
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/W_SGC_z3.gz "$base/W_BOSS_DR12_SGC_z3_V6C_1_1_1_1_1_10_200_2000_averaged_v1.matrix.gz"
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/M_NGC_z3.gz "$base/M_BOSS_DR12_NGC_z3_V6C_1_1_1_1_1_1200_2000.matrix.gz"
          curl --fail --location --retry 3 -sS -o external/exp073w_boss/M_SGC_z3.gz "$base/M_BOSS_DR12_SGC_z3_V6C_1_1_1_1_1_1200_2000.matrix.gz"
          for f in external/exp073w_boss/*.gz; do gzip -t "$f"; gzip -dc "$f" > "${f%.gz}"; done
          echo 'a308dc562d1a7224cefcf91d32580877929e0daa33806517e0d2d53710236827  external/exp073w_boss/W_NGC_z3' | sha256sum -c -
          echo '2a542a2d48f3e8c8299f58a885d5273238e4ade32c0f0de020d8b9f23afe7759  external/exp073w_boss/W_SGC_z3' | sha256sum -c -
          echo '3ac30e68f79deee59963c5c52f7585e0cde495393963210a3922c1c62513a042  external/exp073w_boss/M_NGC_z3' | sha256sum -c -
          echo '3ac30e68f79deee59963c5c52f7585e0cde495393963210a3922c1c62513a042  external/exp073w_boss/M_SGC_z3' | sha256sum -c -

      - name: Execute frozen recovered Exp073JM 4097 to 8193
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch artifacts
          PYTHONPATH="$GITHUB_WORKSPACE/external/class_iv/python:${PYTHONPATH:-}" python ci/exp073jm_article3_recovered_canonical_one_live_fourth_refinement_v0_2.py \
            --jl-authority docs/dsir4/authority/EXP073JL_ARTICLE3_RECOVERED_CANONICAL_ONE_LIVE_THIRD_REFINEMENT_NOT_CONVERGED_V0_2.json \
            --canonical-8193-authority docs/dsir4/authority/EXP073JM_RESPONSE_BLIND_CANONICAL_FINE_8193_V0_1.json \
            --recovered-jl-script ci/exp073jl_article3_canonical_one_live_recovered_third_refinement_convergence_v0_2.py \
            --ir-script ci/exp073ir_article3_real_layerb_common_response_v0_1.py \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --request-plan-script ci/recovered_exp073jl_response_blind_request_plan_audit_v0_1.py \
            --request-plan-authority docs/dsir4/authority/RECOVERED_EXP073JL_RESPONSE_BLIND_REQUEST_PLAN_V0_2.json \
            --parent-root inputs/parent \
            --parent-authority docs/dsir4/authority/EXP073IQ_ARTICLE3_REAL_LAYERA_SUPPORT_PASS_V0_1.json \
            --manifest "$MANIFEST" \
            --angular-root inputs/angular \
            --expim-root inputs/expim \
            --boss-root external/exp073w_boss \
            --source external/des_nz/source.fits \
            --lens external/des_nz/lens.fits \
            --camb-root external/camb \
            --expz2-script ci/exp073z2_article3_des_radial_kernel_stable_direct_v0_2.py \
            --exp073iq-script ci/exp073iq_article3_real_layera_support_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --coarse docs/dsir4/canonical/EXP073JL_CANONICAL_FINE_4097_NODES_U64HEX_V0_1.txt \
            --fine docs/dsir4/canonical/EXP073JM_CANONICAL_FINE_8193_NODES_U64HEX_V0_1.txt \
            --capacity-patch-record artifacts/capacity_patch.json \
            --scratch scratch \
            --out artifacts/result.json
          python - <<'PY'
          import json,math,sys
          d=json.load(open('artifacts/result.json'))
          valid={'COMMON_GRID_FOURTH_REFINEMENT_CONVERGED_PLUS_0_PLUS_0','COMMON_GRID_FOURTH_REFINEMENT_NOT_CONVERGED_PLUS_0_PLUS_0'}
          if d.get('classification') not in valid:
              print('RECOVERED_JM_INVALID',d.get('classification'),d.get('error')); sys.exit(31)
          assert d['scientific_authority_created'] is False
          assert d['covariance_restriction_authorized'] is False and d['Wm_S3_opened'] is False
          assert d['execution_lifecycle']['total_solver_constructions']==8
          assert d['execution_lifecycle']['max_live_instances']==1 and d['execution_lifecycle']['final_live_instances']==0
          assert d['execution_lifecycle']['cross_process_raw_operand_combination'] is False
          assert d['unsupported_target_evaluations']==0
          assert d['max_requested_node_coordinate_rel_mismatch']<=1e-12
          assert d['parent_identity_preserved'] is True
          assert d['canonical_lattices']['coarse']['requested_node_count']==4097
          assert d['canonical_lattices']['fine']['requested_node_count']==8193
          assert d['canonical_lattices']['coarse']['node_sha256']=='f30556be2547732ed0b87b56368e01e46504a975f94fcbbc5e7bc8cfc525e5eb'
          assert d['canonical_lattices']['fine']['node_sha256']=='6d35a9d79aa8826554e8e39315ab12a8be1675d32d25a86ec04c978c7723a515'
          assert d['request_plan_authority']['coarse_common_plan_sha256']=='505716116cc385d5700e455017d8e541c5bba7774fa6647298392495c83ecfe0'
          assert d['request_plan_authority']['fine_plan_with_gl128_sha256']=='0f7ce2e5fa459e15954268dfd46045eaa0ab6356dfdab5a2e282514e7a34ae4e'
          assert d['request_plan_authority']['total_get_transfer_calls']==4040
          mx=d['convergence']['max_relative_component_difference']; assert isinstance(mx,(int,float)) and math.isfinite(mx)
          assert d['layer_b']['retained_after_layer_b']>=15 and d['layer_b']['invalid_row_fraction']<=0.05
          print('RECOVERED_JM_VALID_TERMINAL_CLASSIFICATION',d['classification'])
          print('RECOVERED_JM_MAX_RELATIVE_COMPONENT_DIFFERENCE',mx)
          PY

      - name: Upload recovered JM terminal receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073jm-recovered-canonical-one-live-fourth-refinement-v0-2
          path: |
            artifacts/result.json
            artifacts/capacity_patch.json
          if-no-files-found: warn
          retention-days: 90
