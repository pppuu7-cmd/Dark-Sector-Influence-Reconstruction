name: Exp073P aggregate prerequisite join actual v0.4

on:
  workflow_dispatch:
    inputs:
      r1_artifact_id:
        description: Exact v0.7 attempt-3 R1 artifact ID after terminal completion
        required: true
        type: string
      r1_artifact_digest:
        description: Exact v0.7 attempt-3 R1 artifact sha256 digest
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: exp073p-aggregate-prerequisite-join-actual-v0-4
  cancel-in-progress: false

env:
  R1_RUN_ID: '33240490287'
  R1_RUN_ATTEMPT: '3'
  R1_JOB_ID: '99142692261'
  R1_ARTIFACT_NAME: exp073r1-v07-transport-stabilized-9a4606fb37d5aaa071aa57322ebb7c05eca905d7

jobs:
  real-prerequisite-join-v04:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      R1_ARTIFACT_ID: ${{ inputs.r1_artifact_id }}
      R1_ARTIFACT_DIGEST: ${{ inputs.r1_artifact_digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert prospectively frozen v0.4 authority firewall
        id: firewall
        shell: bash
        run: |
          set -euxo pipefail
          test "${GITHUB_REPOSITORY}" = 'pppuu7-cmd/Dark-Sector-Influence-Reconstruction'
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${R1_RUN_ID}" = '33240490287'
          test "${R1_RUN_ATTEMPT}" = '3'
          test "${R1_JOB_ID}" = '99142692261'
          test "$(git hash-object experiments/073p_aggregate_prerequisite_join_v07_r1_authority_prereg_v0_4.md)" = '2f371c8be6c8b33585b8ab99f7cb59e5cc65abe6'
          test "$(git hash-object ci/exp073p_attempt3_authority_overlay_v0_4.py)" = '8493ef0ac3aef21f26f5960356811c3a8abe0c11'
          test "$(git hash-object ci/exp073p_aggregate_prerequisite_join_v0_3.py)" = '078130d456a905f70f24316ac55aea322e9bcee8'
          test "$(git hash-object ci/exp073p_actions_metadata_bundle_v0_3.py)" = 'c66883ed78eb5edb0beda8acc2e300b480bfcefb'
          test "$(git hash-object ci/exp073p_v07_r1_payload_bundle_v0_3.py)" = 'bb45c5954b9b6fc5d6753b9d2182716ceb74a571'
          test "$(git hash-object ci/exp073p_v03_artifact_zip_download_v0_1.py)" = '3ff986d7ebb7df6b4d86e58d07d234b66dc00e31'
          test "$(git hash-object ci/exp073r1_sequential_wholestream_v0_5.py)" = '46fe1271d97ddd9e2164d24e7d79cf27bfda805d'
          python3 -m py_compile ci/exp073p_attempt3_authority_overlay_v0_4.py
          python3 - <<'PY'
          import os,re
          assert os.environ['R1_RUN_ID']=='33240490287'
          assert os.environ['R1_RUN_ATTEMPT']=='3'
          assert os.environ['R1_JOB_ID']=='99142692261'
          assert re.fullmatch(r'[1-9][0-9]*',os.environ['R1_ARTIFACT_ID'])
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',os.environ['R1_ARTIFACT_DIGEST'])
          print('PASS_EXP073P_ACTUAL_JOIN_ROUTE_FIREWALL_V0_4')
          PY

      - name: Collect attempt-3 live metadata for all frozen parents
        id: metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p join_inputs
          python3 ci/exp073p_attempt3_authority_overlay_v0_4.py \
            --collect-metadata \
            --repository "${GITHUB_REPOSITORY}" \
            --r1-artifact-id "${R1_ARTIFACT_ID}" \
            --r1-artifact-digest "${R1_ARTIFACT_DIGEST}" \
            --out join_inputs/actions_metadata_v0_4.json \
            --error-out join_inputs/actions_metadata_collection_failure_v0_4.json

      - name: Download exact large-source identity record
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp073p-source-bin-full-sha256-372997bf1240a224c2a915fd0d1a5ae50476ba7a
          path: join_inputs/large_source
          github-token: ${{ github.token }}
          run-id: 33081571259

      - name: Download exact large-metacal identity record
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp073p-metacal-full-sha256-372997bf1240a224c2a915fd0d1a5ae50476ba7a
          path: join_inputs/large_metacal
          github-token: ${{ github.token }}
          run-id: 33081571259

      - name: Download exact remaining-object P2 record
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp073p2-remaining-des-checksums-fbcd8eb0a46a566b2510081f7f90714b534e7252
          path: join_inputs/p2
          github-token: ${{ github.token }}
          run-id: 33086291753

      - name: Download sole v0.7 attempt-3 R1 result artifact
        id: r1zip
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_v03_artifact_zip_download_v0_1.py \
            --repository "${GITHUB_REPOSITORY}" \
            --artifact-id "${R1_ARTIFACT_ID}" \
            --expected-digest "${R1_ARTIFACT_DIGEST}" \
            --out join_inputs/r1_artifact_v0_4.zip

      - name: Normalize unchanged parent records
        id: parents
        if: ${{ steps.metadata.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          expected={
              'large_source':(Path('join_inputs/large_source'),'exp073p_y1_source_redshift_binning_v1_streaming_sha256_v0_1.json'),
              'large_metacal':(Path('join_inputs/large_metacal'),'exp073p_mcal_y1a1_streaming_sha256_v0_1.json'),
              'p2':(Path('join_inputs/p2'),'exp073p2_remaining_desy1_checksums_v0_1.json'),
          }
          out=Path('join_inputs/normalized_parents')
          out.mkdir(parents=True,exist_ok=True)
          for key,(root,name) in expected.items():
              matches=list(root.rglob(name))
              assert len(matches)==1,(key,matches)
              shutil.copyfile(matches[0],out/f'{key}.json')
          print('PASS_EXP073P_EXACT_PARENT_PATH_NORMALIZATION_V0_4')
          PY

      - name: Validate complete R1 payload and preserve exact bytes
        id: payload
        if: ${{ steps.metadata.outcome == 'success' && steps.r1zip.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_v07_r1_payload_bundle_v0_3.py \
            --zip join_inputs/r1_artifact_v0_4.zip \
            --out-dir join_inputs/normalized_r1_v0_4 \
            --manifest-out join_inputs/r1_payload_manifest_v0_4.json

      - name: Execute real fail-closed aggregate prerequisite join v0.4
        id: join
        if: ${{ steps.metadata.outcome == 'success' && steps.r1zip.outcome == 'success' && steps.parents.outcome == 'success' && steps.payload.outcome == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/exp073p_attempt3_authority_overlay_v0_4.py \
            --evaluate \
            --metadata join_inputs/actions_metadata_v0_4.json \
            --preflight data/derived/g7/exp073p_des_public_input_checksum_preflight_v0_1.json \
            --large-source join_inputs/normalized_parents/large_source.json \
            --large-metacal join_inputs/normalized_parents/large_metacal.json \
            --p2 join_inputs/normalized_parents/p2.json \
            --s0 data/derived/g7/exp073s0_redmagic_mask_nz_v0_1_key_metrics.json \
            --r1 join_inputs/normalized_r1_v0_4/exp073r1_desy1_transport_stabilized_replay_v0_7_summary.json \
            --r1-acquisition join_inputs/normalized_r1_v0_4/exp073r1_v0_7_remote_acquisition_provenance.json \
            --r1-payload-manifest join_inputs/r1_payload_manifest_v0_4.json \
            --boss data/derived/g7/exp073j_boss_finite_matrix_component_support_v0_1_key_metrics.json \
            --out data/derived/g7/exp073p_aggregate_prerequisite_join_actual_v0_4.json

      - name: Assert genuine v0.4 PASS and no downstream leakage
        if: ${{ steps.join.outcome == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          p='data/derived/g7/exp073p_aggregate_prerequisite_join_actual_v0_4.json'
          d=json.load(open(p))
          assert d['status']=='PASS_EXP073P_PREREQUISITE_BINDING_V0_4'
          assert d['synthetic'] is False and d['scientific_classification'] is None
          assert d['r1_authority']['run_id']==33240490287
          assert d['r1_authority']['run_attempt']==3
          assert d['r1_authority']['job_id']==99142692261
          assert d['support_executor_authorized'] is True
          for key in ('support_fraction_evaluated','f_invalid_computed','retained_dimension_evaluated','covariance_read','whitening_read','nuisance_svd_read','relation_null_read','heldout_read','G8_read'):
              assert d[key] is False,key
          assert d['gate_state']=={'G7':'OPEN','G8':'OPEN','G9':'OPEN'}
          print('PASS_EXP073P_ACTUAL_AGGREGATE_JOIN_V0_4')
          PY

      - name: Fail closed if prerequisite evidence was not fully admissible
        if: ${{ always() && steps.firewall.outcome == 'success' && steps.join.outcome != 'success' }}
        shell: bash
        run: |
          echo 'Exp073P v0.4 prerequisite evidence is incomplete or rejected; support execution remains unauthorized.'
          exit 1

      - name: Upload immutable v0.4 receipt and compact provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073p-aggregate-prerequisite-join-actual-v0-4-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            data/derived/g7/exp073p_aggregate_prerequisite_join_actual_v0_4.json
            join_inputs/actions_metadata_v0_4.json
            join_inputs/actions_metadata_collection_failure_v0_4.json
            join_inputs/r1_payload_manifest_v0_4.json
          if-no-files-found: warn
          retention-days: 90
