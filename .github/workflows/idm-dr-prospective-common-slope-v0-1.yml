name: DSIR IDM-DR prospective common-slope v0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/idm-dr-prospective-common-slope-v0-1.yml'
      - 'ci/idm_dr_prospective_common_slope_v0_1.py'
      - 'experiments/054c_idm_dr_prospective_common_slope_v0_1.md'

permissions:
  contents: read

jobs:
  c7-prospective-common-slope:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install CLASS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip
          python3 -m pip install --user numpy

      - name: Clone, audit and build pinned official CLASS
        run: |
          set -euxo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          git rev-parse HEAD | tee ../exp054c_class_upstream_sha.txt
          test "$(git rev-parse HEAD)" = 'e85808324f51fc694d12e3ed7439552a3c3f9540'
          grep -Fq 'a_idm_dr = 0.' explanatory.ini
          grep -Fq 'nindex_idm_dr' explanatory.ini
          grep -Fq 'N_idr' explanatory.ini
          grep -Fq 'Gamma_DM-DR = - 4/3' explanatory.ini
          grep -Fq 'index_th_dmu_idm_dr' source/thermodynamics.c
          make -j2 class

      - name: Freeze matched reference and exact C7 configurations
        working-directory: class_public
        run: |
          set -euxo pipefail
          mkdir -p outputs
          cat > dsir_c7_base.ini <<'EOF'
          h = 0.67
          T_cmb = 2.7255
          omega_b = 0.0224
          omega_cdm = 0.0
          omega_idm = 0.1200
          m_idm = 1e9
          N_ur = 3.046
          N_idr = 0.2
          nindex_idm_dr = 4
          idr_nature = free_streaming
          stat_f_idr = 0.875
          b_idr = 0.
          alpha_idm_dr = 1.5
          beta_idr = 1.5
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0
          Omega_scf = 0
          YHe = 0.2404
          recombination = RECFAST
          reio_parametrization = reio_none
          output = mPk
          modes = s
          ic = ad
          gauge = synchronous
          P_k_ini type = analytic_Pk
          k_pivot = 0.05
          A_s = 2.10e-9
          n_s = 0.965
          alpha_s = 0.
          P_k_max_h/Mpc = 0.25
          primordial_P_k_max_h/Mpc = 0.25
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          headers = yes
          write background = yes
          write thermodynamics = yes
          overwrite_root = yes
          EOF

          cat > dsir_c7_ref.ini <<'EOF'
          a_idm_dr = 0.
          root = outputs/c7_ref_
          EOF
          cat dsir_c7_base.ini >> dsir_c7_ref.ini

          python3 - <<'PY'
          from pathlib import Path
          frozen=[
            ('a1',43913804613.585236),
            ('a2',82005193007.92964),
            ('a3',200366331342.04977),
            ('a4',634135393232.7471),
            ('a5',1381558672367.1924),
          ]
          base=Path('dsir_c7_base.ini').read_text()
          for tok,a in frozen:
              Path(f'dsir_c7_{tok}.ini').write_text(
                  f'a_idm_dr = {a:.17g}\nroot = outputs/c7_{tok}_\n'+base)
              print(tok,format(a,'.17g'))
          PY

      - name: Verify the preregistered couplings and matched backgrounds before spectra
        working-directory: class_public
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          expected={
            'a1':43913804613.585236,
            'a2':82005193007.92964,
            'a3':200366331342.04977,
            'a4':634135393232.7471,
            'a5':1381558672367.1924,
          }
          common=['omega_idm = 0.1200','omega_cdm = 0.0','N_idr = 0.2','N_ur = 3.046','nindex_idm_dr = 4','idr_nature = free_streaming']
          ref=Path('dsir_c7_ref.ini').read_text()
          assert 'a_idm_dr = 0.' in ref
          for needle in common: assert needle in ref
          for tok,a in expected.items():
              s=Path(f'dsir_c7_{tok}.ini').read_text()
              m=re.search(r'^a_idm_dr\s*=\s*([^\n]+)',s,re.M); assert m
              got=float(m.group(1)); assert abs(got/a-1)<1e-14,(tok,got,a)
              for needle in common: assert needle in s
          PY

      - name: Run first C7 matched reference and preregistered family spectra
        working-directory: class_public
        run: |
          set -euxo pipefail
          ./class dsir_c7_ref.ini pk_ref.pre 2>&1 | tee ../exp054c_ref.log
          for tok in a1 a2 a3 a4 a5; do
            ./class "dsir_c7_${tok}.ini" pk_ref.pre 2>&1 | tee "../exp054c_${tok}.log"
          done

      - name: Require stable explicit solver outputs
        run: |
          set -euxo pipefail
          for prefix in c7_ref_ c7_a1_ c7_a2_ c7_a3_ c7_a4_ c7_a5_; do
            n=$(find class_public/outputs -maxdepth 1 -type f -name "${prefix}*pk.dat" | wc -l)
            test "$n" -eq 7
            for f in class_public/outputs/${prefix}*pk.dat; do
              grep -Eiq 'redshift[[:space:]]+z[[:space:]]*=' "$f"
              test "$(grep -vc '^#' "$f")" -gt 20
            done
            bg=(class_public/outputs/${prefix}*background.dat)
            test "${#bg[@]}" -eq 1
            test -f "${bg[0]}"
          done
          for prefix in c7_a1_ c7_a2_ c7_a3_ c7_a4_ c7_a5_; do
            th=(class_public/outputs/${prefix}*thermodynamics.dat)
            test "${#th[@]}" -eq 1
            test -f "${th[0]}"
            grep -Fq 'dmu_idm_dr' "${th[0]}"
            bg=(class_public/outputs/${prefix}*background.dat)
            grep -Fq 'rho_idm' "${bg[0]}"
            grep -Fq 'rho_idr' "${bg[0]}"
          done

      - name: Apply the pre-frozen prospective common-slope gate
        run: |
          set -euxo pipefail
          python3 ci/idm_dr_prospective_common_slope_v0_1.py \
            --directory class_public/outputs \
            --reference-prefix c7_ref_ \
            --models \
              43913804613.585236:c7_a1_ \
              82005193007.92964:c7_a2_ \
              200366331342.04977:c7_a3_ \
              634135393232.7471:c7_a4_ \
              1381558672367.1924:c7_a5_ \
            --json idm_dr_prospective_common_slope_v0_1.json
          cat idm_dr_prospective_common_slope_v0_1.json

      - name: Record immutable prospective provenance
        if: always()
        run: |
          {
            echo 'Experiment 054C prospective C7 IDM-DR common source-response slope test'
            echo 'Exp054A calibration existed before C7 response and froze C band [0.0022992620786061375,0.09951219222831723].'
            echo 'Exp054B source-only selector existed before C7 response and froze all five a_idm_dr values and source k nodes.'
            echo 'No widening, recentring, point dropping or reordering is allowed after C7 outputs.'
            echo 'Matched reference has identical omega_idm, N_idr and radiation background with a_idm_dr=0.'
            echo "DSIR head: $GITHUB_SHA"
            echo -n 'CLASS upstream: '; cat exp054c_class_upstream_sha.txt
          } > exp054c_environment.txt

      - name: Upload repository-side science record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-dr-prospective-common-slope-v0-1-${{ github.sha }}
          path: |
            idm_dr_prospective_common_slope_v0_1.json
            exp054c_environment.txt
            exp054c_class_upstream_sha.txt
            exp054c_*.log
            class_public/dsir_c7_*.ini
            class_public/pk_ref.pre
            class_public/outputs/c7_*pk.dat
            class_public/outputs/c7_*background.dat
            class_public/outputs/c7_*thermodynamics.dat
          if-no-files-found: warn
