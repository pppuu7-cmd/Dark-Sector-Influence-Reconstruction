name: layerb-32769-resource-authority-candidate-packaging-v0-1

on:
  workflow_run:
    workflows:
      - layerb-32769-resource-lifecycle-independent-consumer-v0-1
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: layerb-32769-resource-authority-candidate-packaging-v0-1-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PACKAGING_CONTRACT_BLOB: '71d77aa4d074bba1a2f53e7f9299a9db32e93ffc'
  PACKAGER_BLOB: 'c38bf9a0108ab3ef50f1abec513fa2f6ff0373a4'
  MATERIALIZATION_CONTRACT_BLOB: '3e53992864ad10f23752df03a653f8073cc18ffa'
  MATERIALIZER_BLOB: '8a4e03848694a59550460e9866d0aeaec747780e'
  INDEPENDENT_WORKFLOW_NAME: 'layerb-32769-resource-lifecycle-independent-consumer-v0-1'
  SOURCE_WORKFLOW_NAME: 'layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3'
  SOURCE_ARTIFACT_NAME: 'layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3'

jobs:
  package-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Enforce parser-corrected candidate-chain identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metadata downloads source independent candidate
          test "$(git hash-object docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_CONTRACT_V0_2.json)" = "$PACKAGING_CONTRACT_BLOB"
          test "$(git hash-object ci/layerb_32769_resource_authority_candidate_packager_v0_2.py)" = "$PACKAGER_BLOB"
          test "$(git hash-object docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_MATERIALIZATION_CONTRACT_V0_2.json)" = "$MATERIALIZATION_CONTRACT_BLOB"
          test "$(git hash-object ci/layerb_32769_resource_authority_materializer_v0_2.py)" = "$MATERIALIZER_BLOB"

      - name: Retrieve exact successful independent-consumer evidence
        shell: bash
        run: |
          set -euo pipefail
          jq '.workflow_run' "$GITHUB_EVENT_PATH" > metadata/independent_run.json
          IID="$(jq -r .id metadata/independent_run.json)"
          test "$(jq -r .name metadata/independent_run.json)" = "$INDEPENDENT_WORKFLOW_NAME"
          test "$(jq -r .path metadata/independent_run.json)" = '.github/workflows/layerb-32769-resource-lifecycle-independent-consumer-v0-1.yml'
          test "$(jq -r .status metadata/independent_run.json)" = completed
          test "$(jq -r .conclusion metadata/independent_run.json)" = success
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${IID}/jobs?per_page=100" > metadata/independent_jobs.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${IID}/artifacts?per_page=100" > metadata/independent_artifacts.json
          python3 - <<'PY'
          import json
          d=json.load(open('metadata/independent_artifacts.json')); xs=[x for x in d.get('artifacts',[]) if str(x.get('name','')).startswith('layerb-32769-resource-lifecycle-independent-consumer-v0-1-')]
          assert len(xs)==1 and xs[0].get('expired') is False,xs
          open('metadata/independent_artifact_id.txt','w').write(str(xs[0]['id']))
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$(cat metadata/independent_artifact_id.txt)/zip" > downloads/independent.zip
          unzip -q downloads/independent.zip -d independent
          mapfile -t S < <(find independent -type f -name source_workflow_run.json); mapfile -t V < <(find independent -type f -name independent_validation.json); mapfile -t C < <(find independent -type f -name chain_receipt.json)
          test "${#S[@]}" -eq 1; test "${#V[@]}" -eq 1; test "${#C[@]}" -eq 1
          cp "${S[0]}" metadata/source_workflow_run_receipt.json; cp "${V[0]}" independent/independent_validation.bound.json; cp "${C[0]}" independent/chain_receipt.bound.json

      - name: Retrieve exact successful V0.3 source evidence
        shell: bash
        run: |
          set -euo pipefail
          SID="$(jq -r .source_run_id metadata/source_workflow_run_receipt.json)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SID}" > metadata/source_run.json
          test "$(jq -r .name metadata/source_run.json)" = "$SOURCE_WORKFLOW_NAME"
          test "$(jq -r .path metadata/source_run.json)" = '.github/workflows/layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3.yml'
          test "$(jq -r .status metadata/source_run.json)" = completed
          test "$(jq -r .conclusion metadata/source_run.json)" = success
          test "$(jq -r .head_sha metadata/source_run.json)" = "$(jq -r .source_head_sha metadata/source_workflow_run_receipt.json)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SID}/jobs?per_page=100" > metadata/source_jobs.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SID}/artifacts?per_page=100" > metadata/source_artifacts.json
          python3 - <<'PY'
          import json
          d=json.load(open('metadata/source_artifacts.json')); xs=[x for x in d.get('artifacts',[]) if x.get('name')=='layerb-32769-isolated-highmem-resource-lifecycle-pilot-v0-3']
          assert len(xs)==1 and xs[0].get('expired') is False,xs
          open('metadata/source_artifact_id.txt','w').write(str(xs[0]['id']))
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$(cat metadata/source_artifact_id.txt)/zip" > downloads/source.zip
          unzip -q downloads/source.zip -d source
          mapfile -t R < <(find source -type f -name result.json); test "${#R[@]}" -eq 1; cp "${R[0]}" source/result.bound.json

      - name: Freeze API-backed parser-corrected candidate provenance
        id: package
        shell: bash
        run: |
          set -uo pipefail; set +e
          python3 ci/layerb_32769_resource_authority_candidate_packager_v0_2.py \
            --contract docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_CONTRACT_V0_2.json \
            --source-run metadata/source_run.json --source-jobs metadata/source_jobs.json --source-artifacts metadata/source_artifacts.json --source-artifact-zip downloads/source.zip --source-result source/result.bound.json \
            --independent-run metadata/independent_run.json --independent-jobs metadata/independent_jobs.json --independent-artifacts metadata/independent_artifacts.json --independent-artifact-zip downloads/independent.zip --independent-validation independent/independent_validation.bound.json --chain-receipt independent/chain_receipt.bound.json \
            --out candidate/provenance.json
          rc=$?; set -e; cls="$(jq -r .classification candidate/provenance.json)"
          if [ "$cls" = LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_PASS_PLUS_0_PLUS_0 ]; then test "$rc" -eq 0; echo candidate_ready=true >> "$GITHUB_OUTPUT"; else test "$rc" -eq 31; echo candidate_ready=false >> "$GITHUB_OUTPUT"; fi

      - name: Materialize read-only parser-corrected authority candidate
        if: steps.package.outputs.candidate_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/layerb_32769_resource_authority_materializer_v0_2.py \
            --contract docs/dsir4/contracts/LAYERB_32769_RESOURCE_AUTHORITY_MATERIALIZATION_CONTRACT_V0_2.json \
            --source-result source/result.bound.json --independent-validation independent/independent_validation.bound.json --provenance candidate/provenance.json --out candidate/resource_authority_candidate.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=Path('candidate/resource_authority_candidate.json'); p=Path('candidate/provenance.json'); d=json.loads(a.read_text())
          assert d['classification']=='LAYERB_32769_HIGH_MEMORY_RESOURCE_LIFECYCLE_PREFLIGHT_PASS_PLUS_0_PLUS_0' and d['artifact_verified_independently'] is True and d['parser_capacity']==1048576 and d['class_build_authority_git_blob']=='b5cd7304c110962dc3baef8d04ef67d5a8042e5f'
          r={'schema':'LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_RECEIPT_V0_1','classification':'LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_READY_PLUS_0_PLUS_0','effect':'+0/+0','candidate_only':True,'durable_repository_authority_created':False,'provenance_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'resource_authority_candidate_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'candidate_classification':d['classification'],'parser_capacity':d['parser_capacity'],'class_build_authority_git_blob':d['class_build_authority_git_blob'],'scientific_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}
          r['token']=r['classification']; Path('candidate/candidate_receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - name: Emit not-ready receipt
        if: steps.package.outputs.candidate_ready != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('candidate/provenance.json')); r={'schema':'LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_PACKAGING_RECEIPT_V0_1','classification':'LAYERB_32769_RESOURCE_AUTHORITY_CANDIDATE_NOT_READY_PLUS_0_PLUS_0','effect':'+0/+0','candidate_only':True,'durable_repository_authority_created':False,'packager_classification':p.get('classification'),'packager_errors':p.get('errors'),'scientific_execution_authorized':False,'covariance_restriction_authorized':False,'Wm_S3_opened':False}; r['token']=r['classification']; Path('candidate/candidate_receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layerb-32769-resource-authority-candidate-packaging-v0-1-${{ github.run_id }}
          path: |
            candidate/
            metadata/source_run.json
            metadata/source_jobs.json
            metadata/source_artifacts.json
            metadata/independent_run.json
            metadata/independent_jobs.json
            metadata/independent_artifacts.json
            metadata/source_workflow_run_receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail closed if candidate not ready
        if: steps.package.outputs.candidate_ready != 'true'
        shell: bash
        run: exit 31
