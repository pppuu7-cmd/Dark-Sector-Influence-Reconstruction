name: Exp073CM Wm_S3 universal-checkpoint direct-8 resource v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/exp073cm_wm_s3_resource_launch_v0_1.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: dsir-home-exp073cm-wm-s3-resource
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  PYTHONUNBUFFERED: '1'
  CHECKPOINT_BRANCH: checkpoints/exp073cm-wm-s3-resource-v0-1

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed prospective authorization and coordination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- preregistration/2026-09-03_exp073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1.md)" = '914a57e45ee98b6ebbb8830a524ec59bfef0c78b'
          test "$(git log -1 --format=%H -- ci/exp073cm_memory_stable_wm_s3_pcl_v0_1.py)" = '8a5f9f5e0341d24ee843f3097199075c50ab2d02'
          test "$(git log -1 --format=%H -- ci/exp073cm_wm_s3_eightband_direct8_resource_v0_1.py)" = '0d41a904eeb1411442ece0afeb774c961621cb54'
          test "$(git log -1 --format=%H -- ci/exp073cm_stage_checkpoint_v0_1.py)" = '733683ec71e973e82ab8cff091439887d3c0a888'
          test "$(git log -1 --format=%H -- ci/dsir_checkpoint_git_sync_v0_2.sh)" = 'bc468ca73a3c4e281bd2b1ee46d6f7704bb54bb1'
          test "$(git log -1 --format=%H -- ci/exp073ca_stream_general_coupling_range_v0_1.c)" = 'fa971eb4ef8c47e81eb0bb4e13eeb76f7cf42e22'
          test -f experiments/073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1_binding.json
          test -f ci/exp073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1.activation.json
          WF="$(git log -1 --format=%H -- .github/workflows/exp073cm-wm-s3-universal-checkpoint-direct8-resource-v0-1.yml)"
          BD="$(git log -1 --format=%H -- experiments/073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1_binding.json)"
          export WF BD
          python3 - <<'PY'
          import json, os
          b=json.load(open('experiments/073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1_binding.json'))
          a=json.load(open('ci/exp073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1.activation.json'))
          assert b['experiment']=='Exp073CM' and b['task']=='Wm_S3'
          assert b['state']=='PREPARED_NOT_AUTHORIZED'
          assert b['source_bin']==3 and b['signature']==[0,2,0,2]
          assert b['band_range']==[0,8] and b['reference_threads']==1 and b['target_threads']==8
          assert b['checkpoint_branch']=='checkpoints/exp073cm-wm-s3-resource-v0-1'
          assert b['workflow_commit']==os.environ['WF']
          assert b['prereg_commit']=='914a57e45ee98b6ebbb8830a524ec59bfef0c78b'
          assert b['pcl_helper_commit']=='8a5f9f5e0341d24ee843f3097199075c50ab2d02'
          assert b['resource_helper_commit']=='0d41a904eeb1411442ece0afeb774c961621cb54'
          assert b['checkpoint_helper_commit']=='733683ec71e973e82ab8cff091439887d3c0a888'
          assert b['checkpoint_sync_commit']=='bc468ca73a3c4e281bd2b1ee46d6f7704bb54bb1'
          assert b['mask_artifact_id']==9867046699
          assert b['scientific_contract_changed'] is False
          assert a['experiment']=='Exp073CM' and a['task']=='Wm_S3'
          assert a['state']=='AUTHORIZED_UNIVERSAL_CHECKPOINT_DIRECT8_RESOURCE_V0_1'
          assert a['workflow_commit']==os.environ['WF'] and a['binding_commit']==os.environ['BD']
          PY
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']; current=int(os.environ['GITHUB_RUN_ID']); repo=os.environ['GITHUB_REPOSITORY']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def n(status):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100',headers=h)
              with urllib.request.urlopen(q,timeout=30) as r: d=json.load(r)
              return sum(1 for x in d.get('workflow_runs',[]) if int(x['id']) != current)
          queued=n('queued'); active=n('in_progress')
          print(f'other_queued={queued} other_in_progress={active}')
          assert queued==0 and active==0, (queued,active)
          PY

  checkpoint-qa:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hosted fail-closed checkpoint helper QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/input qa/cp qa/out
          python3 - <<'PY'
          import json, numpy as np
          np.save('qa/input/a.npy', np.arange(24,dtype='<f8').reshape(2,12), allow_pickle=False)
          open('qa/input/a.json','w').write(json.dumps({'ok':True},sort_keys=True)+'\n')
          spec={'format':'EXP073CM_STAGE_CHECKPOINT_V0_1','experiment':'Exp073CM','task':'Wm_S3','remote_branch':'checkpoints/exp073cm-wm-s3-resource-v0-1','qa':True}
          open('qa/spec.json','w').write(json.dumps(spec,sort_keys=True)+'\n')
          PY
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root qa/cp --contract-spec qa/spec.json init
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root qa/cp --contract-spec qa/spec.json add --stage pcl qa/input/a.npy qa/input/a.json
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root qa/cp --contract-spec qa/spec.json verify
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root qa/cp --contract-spec qa/spec.json materialize --stage pcl --dest qa/out
          cmp qa/input/a.npy qa/out/a.npy
          cp -a qa/cp qa/corrupt
          python3 - <<'PY'
          p='qa/corrupt/stages/pcl/a.npy'
          b=bytearray(open(p,'rb').read()); b[-1]^=1; open(p,'wb').write(b)
          PY
          if python3 ci/exp073cm_stage_checkpoint_v0_1.py --root qa/corrupt --contract-spec qa/spec.json verify; then
            echo 'corruption was not rejected' >&2; exit 1
          fi
          echo PASS_EXP073CM_CHECKPOINT_HELPER_FAIL_CLOSED_QA_V0_1

  direct8-resource:
    needs: [authorize, checkpoint-qa]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse or bootstrap proven NaMaster 2.7 environment
        shell: bash
        run: |
          set -euo pipefail
          MF="$HOME/.cache/dsir-miniforge"; ENV="$HOME/.cache/dsir-nmt27"
          if ! test -x "$MF/bin/conda"; then
            mkdir -p "$HOME/.cache"
            curl -fL --retry 5 --retry-delay 2 https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o "$RUNNER_TEMP/miniforge.sh"
            bash "$RUNNER_TEMP/miniforge.sh" -b -p "$MF"
          fi
          if ! test -x "$ENV/bin/python"; then
            "$MF/bin/conda" create -y -p "$ENV" -c conda-forge python=3.11 namaster=2.7 healpy astropy numpy
          fi
          "$ENV/bin/python" - <<'PY'
          import importlib.metadata
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          PY
          echo "NMT_PY=$ENV/bin/python" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: exp073r1-v08-hosted-wholestream-ef783ca941fb9b9b5f5eae537986c56ff06e6536
          path: external/r1
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33270843577
      - uses: actions/download-artifact@v4
        with:
          name: exp073cl-exact-des-mask-9a7b1c19aa130c5b11f68c2d9ea73ff9a2f6c105
          path: external/des
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Dark-Sector-Influence-Reconstruction
          run-id: 33683175039
      - name: Verify immutable inputs and build exact checkpoint contract
        shell: bash
        run: |
          set -euo pipefail
          mask='external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits'
          test "$(stat -c %s "$mask")" = '104595840'
          echo "a519b8522f899e4c33267bb0749f9734f8b7fa760d195636456d370f809a3d55  $mask" | sha256sum -c -
          WF="$(git log -1 --format=%H -- .github/workflows/exp073cm-wm-s3-universal-checkpoint-direct8-resource-v0-1.yml)"
          BD="$(git log -1 --format=%H -- experiments/073cm_wm_s3_universal_checkpoint_direct8_resource_v0_1_binding.json)"
          export WF BD
          mkdir -p "$RUNNER_TEMP/exp073cm-contract" "$RUNNER_TEMP/exp073cm-checkpoint" data/derived/g7
          python3 - <<'PY'
          import json, os
          spec={
            'format':'EXP073CM_STAGE_CHECKPOINT_V0_1','experiment':'Exp073CM','task':'Wm_S3',
            'remote_branch':'checkpoints/exp073cm-wm-s3-resource-v0-1','source_head':os.environ['GITHUB_SHA'],
            'prereg_commit':'914a57e45ee98b6ebbb8830a524ec59bfef0c78b',
            'pcl_helper_commit':'8a5f9f5e0341d24ee843f3097199075c50ab2d02',
            'resource_helper_commit':'0d41a904eeb1411442ece0afeb774c961621cb54',
            'checkpoint_helper_commit':'733683ec71e973e82ab8cff091439887d3c0a888',
            'checkpoint_sync_commit':'bc468ca73a3c4e281bd2b1ee46d6f7704bb54bb1',
            'range_helper_commit':'fa971eb4ef8c47e81eb0bb4e13eeb76f7cf42e22',
            'workflow_commit':os.environ['WF'],'binding_commit':os.environ['BD'],
            'mask_artifact_id':9867046699,'mask_artifact_digest':'sha256:e795118e73f6f98f1253a5e87b2f62cc5c5182ebfcfcc572b1cfb1c3ae87c915',
            'mask_file_sha256':'a519b8522f899e4c33267bb0749f9734f8b7fa760d195636456d370f809a3d55',
            'r1_run_id':33270843577,'source_bin':3,'signature':[0,2,0,2],
            'nside':4096,'lmax':12287,'row_length':12288,'nbands':39,'band_range':[0,8],
            'reference_threads':1,'target_threads':8,'dtype':'<f8','wm_semantics':'TE<-TE'
          }
          open(os.path.join(os.environ['RUNNER_TEMP'],'exp073cm-contract','spec.json'),'w').write(json.dumps(spec,indent=2,sort_keys=True)+'\n')
          PY
          bash ci/dsir_checkpoint_git_sync_v0_2.sh restore "$RUNNER_TEMP/exp073cm-checkpoint" "$CHECKPOINT_BRANCH" ALLOW_ABSENT
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$RUNNER_TEMP/exp073cm-checkpoint" --contract-spec "$RUNNER_TEMP/exp073cm-contract/spec.json" init
      - name: Spill-capacity preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exp073cm-spill"
          free_bytes="$(df -PB1 "$RUNNER_TEMP/exp073cm-spill" | awk 'NR==2 {print $4}')"
          test "$free_bytes" -ge 2684354560
          printf 'spill_free_bytes=%s\nspill_required_bytes=2684354560\n' "$free_bytes" > data/derived/g7/exp073cm_spill_preflight_v0_1.txt
      - name: Build or restore fresh real Wm_S3 PCL and checkpoint durably
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/exp073cm-checkpoint"; SPEC="$RUNNER_TEMP/exp073cm-contract/spec.json"
          if python3 -c "import json; d=json.load(open('$CP/state.json')); raise SystemExit(0 if 'pcl' in d['completed_stages'] else 1)"; then
            echo 'RESUME pcl already durable'
          else
            /usr/bin/time -v -o data/derived/g7/exp073cm_wm_s3_pcl_time_v0_1.txt \
              "$NMT_PY" ci/exp073cm_memory_stable_wm_s3_pcl_v0_1.py --task Wm_S3 --r1-root external/r1 \
              --lens-mask external/des/DES_Y1A1_3x2pt_redMaGiC_MASK_HPIX4096RING.fits \
              --spill-root "$RUNNER_TEMP/exp073cm-spill" --out-npy data/derived/g7/exp073cm_wm_s3_pcl_v0_1.npy \
              --out-json data/derived/g7/exp073cm_wm_s3_pcl_v0_1.json
            python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" add --stage pcl \
              data/derived/g7/exp073cm_wm_s3_pcl_v0_1.npy data/derived/g7/exp073cm_wm_s3_pcl_v0_1.json data/derived/g7/exp073cm_wm_s3_pcl_time_v0_1.txt
            bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$CHECKPOINT_BRANCH" pcl
          fi
          mkdir -p data/derived/g7/pcl_restore
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" materialize --stage pcl --dest data/derived/g7/pcl_restore
      - name: Compile frozen range helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          gcc -O2 -shared -fPIC -fopenmp -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize \
            ci/exp073ca_stream_general_coupling_range_v0_1.c -o build/exp073ca.so -ldl -lm
      - name: Compute or restore 1-thread reference and checkpoint durably
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/exp073cm-checkpoint"; SPEC="$RUNNER_TEMP/exp073cm-contract/spec.json"
          if python3 -c "import json; d=json.load(open('$CP/state.json')); raise SystemExit(0 if 'reference' in d['completed_stages'] else 1)"; then
            echo 'RESUME reference already durable'
          else
            /usr/bin/time -v -o data/derived/g7/exp073cm_reference_time_v0_1.txt \
              "$NMT_PY" ci/exp073cm_wm_s3_eightband_direct8_resource_v0_1.py reference \
              --pcl-npy data/derived/g7/pcl_restore/exp073cm_wm_s3_pcl_v0_1.npy --ca-so build/exp073ca.so \
              --out-npy data/derived/g7/exp073cm_wm_s3_bands0_7_reference_v0_1.npy \
              --out-json data/derived/g7/exp073cm_reference_v0_1.json
            python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" add --stage reference \
              data/derived/g7/exp073cm_wm_s3_bands0_7_reference_v0_1.npy data/derived/g7/exp073cm_reference_v0_1.json data/derived/g7/exp073cm_reference_time_v0_1.txt
            bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$CHECKPOINT_BRANCH" reference
          fi
          mkdir -p data/derived/g7/reference_restore
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" materialize --stage reference --dest data/derived/g7/reference_restore
      - name: Compute or restore 8-thread target and checkpoint durably
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/exp073cm-checkpoint"; SPEC="$RUNNER_TEMP/exp073cm-contract/spec.json"
          if python3 -c "import json; d=json.load(open('$CP/state.json')); raise SystemExit(0 if 'target' in d['completed_stages'] else 1)"; then
            echo 'RESUME target already durable'
          else
            /usr/bin/time -v -o data/derived/g7/exp073cm_target_time_v0_1.txt \
              "$NMT_PY" ci/exp073cm_wm_s3_eightband_direct8_resource_v0_1.py target \
              --pcl-npy data/derived/g7/pcl_restore/exp073cm_wm_s3_pcl_v0_1.npy --ca-so build/exp073ca.so \
              --out-npy data/derived/g7/exp073cm_wm_s3_bands0_7_direct8_v0_1.npy \
              --out-json data/derived/g7/exp073cm_target_v0_1.json
            python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" add --stage target \
              data/derived/g7/exp073cm_wm_s3_bands0_7_direct8_v0_1.npy data/derived/g7/exp073cm_target_v0_1.json data/derived/g7/exp073cm_target_time_v0_1.txt
            bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$CHECKPOINT_BRANCH" target
          fi
          mkdir -p data/derived/g7/target_restore
          python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" materialize --stage target --dest data/derived/g7/target_restore
      - name: Exact final resource classification and durable final checkpoint
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/exp073cm-checkpoint"; SPEC="$RUNNER_TEMP/exp073cm-contract/spec.json"
          if python3 -c "import json; d=json.load(open('$CP/state.json')); raise SystemExit(0 if 'final' in d['completed_stages'] else 1)"; then
            echo 'RESUME final already durable'
            python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" materialize --stage final --dest data/derived/g7/final_restore
            cp data/derived/g7/final_restore/exp073cm_final_v0_1.json data/derived/g7/exp073cm_final_v0_1.json
            python3 - <<'PY'
          import json
          s=json.load(open('data/derived/g7/exp073cm_final_v0_1.json'))['status']
          print(s)
          raise SystemExit(0 if s=='PASS_EXP073CM_WM_S3_EIGHTBAND_DIRECT8_RESOURCE_V0_1' else 42)
          PY
          else
            set +e
            "$NMT_PY" ci/exp073cm_wm_s3_eightband_direct8_resource_v0_1.py final \
              --reference-npy data/derived/g7/reference_restore/exp073cm_wm_s3_bands0_7_reference_v0_1.npy \
              --target-npy data/derived/g7/target_restore/exp073cm_wm_s3_bands0_7_direct8_v0_1.npy \
              --reference-json data/derived/g7/reference_restore/exp073cm_reference_v0_1.json \
              --target-json data/derived/g7/target_restore/exp073cm_target_v0_1.json \
              --out-json data/derived/g7/exp073cm_final_v0_1.json
            rc=$?
            set -e
            test -f data/derived/g7/exp073cm_final_v0_1.json
            python3 ci/exp073cm_stage_checkpoint_v0_1.py --root "$CP" --contract-spec "$SPEC" add --stage final data/derived/g7/exp073cm_final_v0_1.json
            bash ci/dsir_checkpoint_git_sync_v0_2.sh push "$CP" "$CHECKPOINT_BRANCH" final
            exit "$rc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073cm-wm-s3-resource-${{ github.sha }}
          path: |
            data/derived/g7/exp073cm_*
            ${{ runner.temp }}/exp073cm-checkpoint/**
            ${{ runner.temp }}/exp073cm-contract/spec.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
