name: layerb-beta-cross-host-fingerprint-v0-15

on:
  push:
    branches: [main]
    paths:
      - 'docs/dsir4/launch/LAYERB_BETA_CROSS_HOST_FINGERPRINT_V0_15_LAUNCH.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CLASS_COMMIT: 'ac627d54e9ce196a08878d1ba33999819925d19c'
  CONTRACT: 'docs/dsir4/contracts/LAYERB_BETA_CROSS_HOST_FINGERPRINT_V0_15.json'
  PARENT_AUTHORITY: 'docs/dsir4/authority/LAYERB_BETA_SAME_RUN_SOLVER_DETERMINISM_V0_14.json'
  EXECUTOR: 'ci/layerb_beta_cross_host_fingerprint_v0_15.py'
  V12_EXECUTOR: 'ci/layerb_beta_production_h_common_grid_interpolation_v0_12.py'
  JJ: 'ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py'
  BASELINE: 'configs/dsir4/c2/ide0_reference_v0_1.ini'
  PRECISION: 'configs/dsir4/c2/dsir_ide_p8_v0_1.pre'
  V014_RUN_ID: '34787822995'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  invariant-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen V0.15 identities and boundaries
        run: |
          set -euo pipefail
          mkdir -p safe
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def blobsha(path):
              b=Path(path).read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          C=json.load(open('docs/dsir4/contracts/LAYERB_BETA_CROSS_HOST_FINGERPRINT_V0_15.json'))
          A=json.load(open('docs/dsir4/authority/LAYERB_BETA_SAME_RUN_SOLVER_DETERMINISM_V0_14.json'))
          assert C['status']=='PROSPECTIVELY_FROZEN_BEFORE_V0_15_EXECUTION'
          assert A['classification']==C['parent_classification']=='SAME_RUN_REPEATED_SOLVER_DETERMINISM_SUPPORTED'
          assert A['authorized_next_stage']==C['authorized_parent_next_stage']=='PROSPECTIVELY_FROZEN_CROSS_HOST_ENVIRONMENT_FINGERPRINT_REPRODUCIBILITY_AUDIT'
          assert C['profile']=='PURE_PAIR'
          assert C['replicates']==['R1','R2','R3','R4','R5','R6','R7','R8']
          assert list(C['grids'])==['GRID768','GRID1024']
          assert len(C['parallel_partitions'])==16 and len(C['diagnostic_cells'])==5
          assert sum(x['role']=='REPLAY_FAILURE' for x in C['diagnostic_cells'])==3
          assert sum(x['role']=='ANCHOR' for x in C['diagnostic_cells'])==2
          assert C['production_h']==1e-4 and C['scientific_response_relative_tolerance']==1e-3
          assert C['replay_relative_tolerance']==1e-5 and C['exact_target_binding_tolerance']==1e-12
          assert C['tol300']==1e-12 and C['production_perturb_sampling_stepsize']==0.00035
          assert C['scientific_fingerprint']['ephemeral_provenance_may_be_recorded_but_not_used_for_classification'] is True
          assert C['scientific_fingerprint']['excluded_ephemeral_fields']==['runner_name','github_run_id','github_job','github_run_attempt','dynamic_cpu_frequency','timestamps']
          assert all(C['forbidden'].values())
          assert blobsha(C['parent_authority'])==C['parent_authority_git_blob_sha1']
          assert blobsha(C['baseline'])==C['baseline_git_blob_sha1']
          assert blobsha(C['production_precision'])==C['production_precision_git_blob_sha1']
          assert blobsha(C['jj_source'])==C['jj_git_blob_sha1']
          assert blobsha(C['v12_executor'])==C['v12_executor_git_blob_sha1']
          assert blobsha(C['executor'])==C['executor_git_blob_sha1']
          out={
              'schema':'LAYERB_BETA_CROSS_HOST_FINGERPRINT_INVARIANT_V0_15',
              'pass':True,'effect':'+0/+0','parallel_lane_count':16,
              'ephemeral_fields_used_in_scientific_fingerprint':False,
              'covariance_read':False,'whitening_read':False,'nuisance_read':False,
              'relation_null_read':False,'Wm_S3_opened':False,'science_gate_opened':False,
              'token':'PASS_LAYERB_BETA_CROSS_HOST_FINGERPRINT_INVARIANTS_V0_15'
          }
          Path('safe/invariant.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['token'])
          PY
          python3 -m py_compile "$EXECUTOR"
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-cross-host-fingerprint-invariant-v0-15
          path: safe/invariant.json
          retention-days: 90

  host-lane:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        grid: [GRID768, GRID1024]
        replicate: [R1, R2, R3, R4, R5, R6, R7, R8]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install exact production numerical stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libgsl-dev >/dev/null
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel 'setuptools<76' >/dev/null
          .venv/bin/python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy >/dev/null
          git clone -q https://github.com/kaeonikc/class_iv.git external_class
          git -C external_class checkout -q "$CLASS_COMMIT"
      - name: Reproduce pinned CLASS exposure and common-grid capacity patches
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('external_class/include/perturbations.h'); s=p.read_text(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; assert s.count(old)==1; p.write_text(s.replace(old,'#define _MAX_NUMBER_OF_K_FILES_ 1152',1))
          q=Path('external_class/include/parser.h'); s=q.read_text(); old='#define _ARGUMENT_LENGTH_MAX_ 1024'; assert s.count(old)==1; q.write_text(s.replace(old,'#define _ARGUMENT_LENGTH_MAX_ 32768',1))
          r=Path('external_class/source/perturbations.c'); s=r.read_text(); old='perhaps_print_variables = perturb_print_variables;'; assert s.count(old)==1; r.write_text(s.replace(old,'perhaps_print_variables = NULL;',1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" .venv/bin/python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external_class
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" .venv/bin/python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external_class
          .venv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('external_class/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,"extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']",1))
          PY
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" make -C external_class -j2 all >/dev/null
      - name: Run frozen cross-host fingerprint lane
        run: |
          set -euo pipefail
          mkdir -p safe
          .venv/bin/python "$EXECUTOR" --mode lane --grid '${{ matrix.grid }}' --replicate '${{ matrix.replicate }}' --contract "$CONTRACT" --v12-executor "$V12_EXECUTOR" --jj-script "$JJ" --baseline "$BASELINE" --precision "$PRECISION" --out safe/lane_${{ matrix.grid }}_${{ matrix.replicate }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-cross-host-fingerprint-${{ matrix.grid }}-${{ matrix.replicate }}-v0-15
          path: safe/lane_${{ matrix.grid }}_${{ matrix.replicate }}.json
          retention-days: 90

  decision:
    needs: [invariant-audit, host-lane]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install decision dependency
        run: |
          set -euo pipefail
          python3 -m venv .decision-venv
          .decision-venv/bin/python -m pip install --upgrade pip >/dev/null
          .decision-venv/bin/python -m pip install 'numpy==1.26.4' scipy >/dev/null
      - uses: actions/download-artifact@v4
        with:
          pattern: layerb-beta-cross-host-fingerprint-*-v0-15
          path: new
          merge-multiple: true
      - name: Verify parent provenance and apply frozen V0.15 classifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p safe
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GH_REPO/actions/runs/$V014_RUN_ID/artifacts?per_page=100" > /tmp/v014.json
          python3 - <<'PY'
          import json
          C=json.load(open('docs/dsir4/contracts/LAYERB_BETA_CROSS_HOST_FINGERPRINT_V0_15.json'))
          by={x['name']:x for x in json.load(open('/tmp/v014.json'))['artifacts']}
          x=by['layerb-beta-same-run-determinism-decision-v0-14']
          d=x.get('digest') or ''; d=d[7:] if d.startswith('sha256:') else d
          assert x['id']==C['parent_decision_artifact_id'] and d==C['parent_decision_artifact_zip_sha256'] and not x['expired']
          inv=json.load(open('new/invariant.json'))
          assert inv['pass'] is True and inv['parallel_lane_count']==16
          assert inv['ephemeral_fields_used_in_scientific_fingerprint'] is False
          assert inv['token']=='PASS_LAYERB_BETA_CROSS_HOST_FINGERPRINT_INVARIANTS_V0_15'
          PY
          .decision-venv/bin/python "$EXECUTOR" --mode decision --contract "$CONTRACT" --inputs new/lane_*.json --out safe/decision.json
      - uses: actions/upload-artifact@v4
        with:
          name: layerb-beta-cross-host-fingerprint-decision-v0-15
          path: safe/decision.json
          retention-days: 90
