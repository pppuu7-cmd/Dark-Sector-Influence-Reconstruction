name: Exp073CV Wm_S3 production exact integration v0.2
on:
  push:
    paths:
      - 'control/activate_exp073cv_v0_2.txt'
permissions:
  contents: read
jobs:
  hosted-production-exact-integration-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Freeze v0.2 repair contract and inherited component identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/073cv_wm_s3_production_exact_integration_v0_2_prereg.md)" = '22e2b1de27fb11b48352e2ddc68248dfc5fad68d'
          test "$(git hash-object ci/exp073cv_scoped_verifier_repair_v0_2.py)" = '640205ab9f21fd3b3ada6cb0b3a3e7c5e461f704'
          test "$(git hash-object ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py)" = 'dafe86086a470c852106f0d4ecccbda1d389e397'
          test "$(git hash-object ci/exp073cv_component_blobs_v0_1.json)" = '0d6d6e882d1a4cf1ff79fbe8227a4f2b460c7e40'
          test "$(git hash-object ci/exp073by_mmap_full_mcm_downstream_v0_1.c)" = 'acafb095deafae7602101d8305e239341010ba79'
          grep -Fq 'I1_PRODUCTION_INTERFACE_EXACT_INTEGRATION_PASS' experiments/073cv_wm_s3_production_exact_integration_v0_2_prereg.md
          echo PASS_EXP073CV_V0_2_HOSTED_STATIC_FREEZE_AUDIT
      - name: Build scoped-verifier runtime copy
        shell: bash
        run: |
          set -euo pipefail
          python ci/exp073cv_scoped_verifier_repair_v0_2.py ci/exp073cv_wm_s3_production_exact_adapter_v0_1.py "${RUNNER_TEMP}/exp073cv_adapter_v0_2_runtime.py"
          test -s "${RUNNER_TEMP}/exp073cv_adapter_v0_2_runtime.py"
      - name: Install exact NaMaster 2.7 plus GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          conda create -y -p "${RUNNER_TEMP}/nmt27" -c conda-forge python=3.11 namaster=2.7 healpy astropy compilers
          echo "NMT_PREFIX=${RUNNER_TEMP}/nmt27" >> "${GITHUB_ENV}"
          echo "NMT_PY=${RUNNER_TEMP}/nmt27/bin/python" >> "${GITHUB_ENV}"
      - name: Verify runtime NaMaster and GSL lineage
        shell: bash
        run: |
          set -euo pipefail
          "${NMT_PY}" - <<'PY'
          import hashlib,importlib.metadata,inspect,pymaster as nmt
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          p=inspect.getsourcefile(nmt.NmtWorkspace.get_bandpower_windows); assert p
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='442e23eb542087566689271ad1c897d5da45f5b76e39def05b37d93b0098178f'
          print('PASS_EXP073CV_V0_2_NAMASTER27_RUNTIME_LINEAGE')
          PY
          grep -Eq '#define GSL_VERSION "2\.7' "${NMT_PREFIX}/include/gsl/gsl_version.h"
      - name: Compile frozen exact full-stock mmap downstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/exp073cv-bin"
          "${NMT_PREFIX}/bin/x86_64-conda-linux-gnu-cc" -O0 -std=c11 -I"${NMT_PREFIX}/include" ci/exp073by_mmap_full_mcm_downstream_v0_1.c -L"${NMT_PREFIX}/lib" -Wl,-rpath,"${NMT_PREFIX}/lib" -lgsl -lgslcblas -lm -o "${RUNNER_TEMP}/exp073cv-bin/mmap_full_mcm"
          echo "MMAP_EMULATOR=${RUNNER_TEMP}/exp073cv-bin/mmap_full_mcm" >> "${GITHUB_ENV}"
      - name: Execute prospectively repaired exact regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/derived/exp073cv
          "${NMT_PY}" "${RUNNER_TEMP}/exp073cv_adapter_v0_2_runtime.py" audit \
            --emulator "${MMAP_EMULATOR}" \
            --audit-out data/derived/exp073cv/exp073cv_hosted_exact_integration_v0_2.json \
            --source-head "${GITHUB_SHA}" \
            --contract-fingerprint '22e2b1de27fb11b48352e2ddc68248dfc5fad68d' \
            --component-blobs-json ci/exp073cv_component_blobs_v0_1.json
          grep -Fq '"status": "I1_PRODUCTION_INTERFACE_EXACT_INTEGRATION_PASS"' data/derived/exp073cv/exp073cv_hosted_exact_integration_v0_2.json
          echo PASS_EXP073CV_V0_2_EXECUTABLE_INTEGRATION_AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp073cv-v0-2-production-exact-integration-${{ github.sha }}
          path: data/derived/exp073cv/exp073cv_hosted_exact_integration_v0_2.json
