name: exp073jo-article3-jl-durable-response-checkpoint-preflight-v0-1

on:
  push:
    paths:
      - '.github/workflows/exp073jo-article3-jl-durable-response-checkpoint-preflight-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp073jo-article3-jl-durable-response-checkpoint-preflight-v0-1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce frozen JO and JL lineage
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/dsir4/prereg/EXP073JO_ARTICLE3_JL_DURABLE_RESPONSE_CHECKPOINT_RECOVERY_V0_1.md
          test -f docs/dsir4/prereg/EXP073JL_ARTICLE3_LAYERB_COMMON_GRID_THIRD_REFINEMENT_CONVERGENCE_V0_1.md
          test -f ci/exp073jo_article3_jl_durable_response_checkpoint_recovery_v0_1.py
          test -f ci/exp073jl_article3_layerb_common_grid_third_refinement_convergence_v0_1.py
          test -f ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py
          python -m py_compile ci/exp073jo_article3_jl_durable_response_checkpoint_recovery_v0_1.py ci/exp073jl_article3_layerb_common_grid_third_refinement_convergence_v0_1.py ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/dsir4/prereg/EXP073JO_ARTICLE3_JL_DURABLE_RESPONSE_CHECKPOINT_RECOVERY_V0_1.md').read_text()
          for x in ['REL_TOL=1e-3','h=1e-4','2049','4097','checkpoints/exp073jo-jl-response-v0-1','16 newly computed response calls']:
              assert x in s, x
          print('PASS_EXP073JO_PREREG_STATIC_GUARD_V0_1')
          PY

      - name: Install frozen numerical and build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libgsl-dev python3-dev git
          python -m pip install --upgrade pip wheel 'setuptools<76'
          python -m pip install 'numpy==1.26.4' 'Cython<3' six scipy astropy

      - name: Checkout capacity-patch and build exact pinned CLASS-IV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone https://github.com/kaeonikc/class_iv.git external/class_iv
          git -C external/class_iv checkout ac627d54e9ce196a08878d1ba33999819925d19c
          test "$(git -C external/class_iv rev-parse HEAD)" = ac627d54e9ce196a08878d1ba33999819925d19c
          grep -F '#define _MAX_NUMBER_OF_K_FILES_ 30' external/class_iv/include/perturbations.h >/dev/null
          grep -F '#define _ARGUMENT_LENGTH_MAX_ 1024' external/class_iv/include/parser.h >/dev/null
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('external/class_iv/include/perturbations.h'); b=p.read_bytes(); s=b.decode(); old='#define _MAX_NUMBER_OF_K_FILES_ 30'; new='#define _MAX_NUMBER_OF_K_FILES_ 4608'; assert s.count(old)==1
          pre=hashlib.sha256(b).hexdigest(); p.write_text(s.replace(old,new,1)); post=hashlib.sha256(p.read_bytes()).hexdigest()
          q=Path('external/class_iv/include/parser.h'); qb=q.read_bytes(); qs=qb.decode(); qold='#define _ARGUMENT_LENGTH_MAX_ 1024'; qnew='#define _ARGUMENT_LENGTH_MAX_ 131072'; assert qs.count(qold)==1
          qpre=hashlib.sha256(qb).hexdigest(); q.write_text(qs.replace(qold,qnew,1)); qpost=hashlib.sha256(q.read_bytes()).hexdigest()
          rec={'schema':'EXP073JO_CLASSIV_INPUT_CAPACITY_PATCH_V0_1','source_commit':'ac627d54e9ce196a08878d1ba33999819925d19c','old_capacity':30,'new_capacity':4608,'replacement_count':1,'pre_sha256':pre,'post_sha256':post,'parser_old_argument_capacity':1024,'parser_new_argument_capacity':131072,'parser_replacement_count':1,'parser_pre_sha256':qpre,'parser_post_sha256':qpost}
          Path('artifacts/capacity_patch.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/dsir4/exp073hb_pinned_class_iv_build_compat_v0_1.py external/class_iv
          python scripts/dsir4/exp073iu_classiv_dm_public_exposure_patch_v0_1.py external/class_iv
          python - <<'PY'
          from pathlib import Path
          p=Path('external/class_iv/python/setup.py'); s=p.read_text(); old="extra_link_args=['-lgomp','-liomp5','-lpthread','-lgsl','-lgslcblas']"; new="extra_link_args=['-lgomp','-lpthread','-lgsl','-lgslcblas']"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          make -C external/class_iv -j2 all

      - name: Execute exact history-independence and cache round-trip controls
        shell: bash
        run: |
          set -euo pipefail
          python ci/exp073jo_article3_jl_durable_response_checkpoint_recovery_v0_1.py preflight \
            --jj-script ci/exp073jj_article3_layerb_common_grid_resolution_refinement_convergence_v0_1.py \
            --baseline configs/dsir4/c2/ide0_reference_v0_1.ini \
            --precision configs/dsir4/c2/dsir_ide_p8_v0_1.pre \
            --out artifacts/exp073jo_preflight_result.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/exp073jo_preflight_result.json'))
          assert d['classification']=='DURABLE_RESPONSE_CHECKPOINT_PREFLIGHT_PASS_PLUS_0_PLUS_0'
          assert d['token']=='PASS_EXP073JO_DURABLE_RESPONSE_CHECKPOINT_PREFLIGHT_V0_1'
          assert d['scientific_authority_created'] is False and d['covariance_restriction_authorized'] is False
          assert d['flush_every_new_calls']==16 and d['capacity']==4608 and d['parser_capacity']==131072
          assert all(v['exact_array_equal'] is True for v in d['history_independence']['slots'].values())
          assert d['cache_roundtrip']['exact_response_bytes_equal'] is True
          assert d['cache_roundtrip']['exact_audit_restoration'] is True
          print(d['token'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp073jo-durable-response-checkpoint-preflight-v0-1
          path: |
            artifacts/exp073jo_preflight_result.json
            artifacts/capacity_patch.json
          retention-days: 90
