name: Exp073FU replica-A pruner read-only diagnostic v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exp073fu-replica-a-pruner-readonly-diagnostic-v0-1.yml'

permissions:
  contents: read

env:
  EXPECTED_RUNNER_NAME: 'DSIR-HOME-PC-2'
  FU_PRUNER_BLOB: '9ab0838ea27fcb5dddbf2ecc761ed29f8894da63'

jobs:
  diagnose-pruner:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce exact FU A-pruner on nonmutating symlink mirror
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$(git rev-parse HEAD:ci/exp073fu_verify_and_prune_replica_v0_1.py)" = "$FU_PRUNER_BLOB"
          ROOT="$HOME/.cache/dsir/exp073fu-ww-s1-s3-filebacked-ab-v0-1"
          test -d "$ROOT/checkpoints/A"
          MIRROR="$RUNNER_TEMP/exp073fu-pruner-mirror"
          OUT="$RUNNER_TEMP/exp073fu-pruner-diagnostic"
          rm -rf "$MIRROR" "$OUT"; mkdir -p "$MIRROR/checkpoints/A" "$OUT"
          ROOT="$ROOT" MIRROR="$MIRROR" python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['ROOT'])/'checkpoints'/'A'
          dst=Path(os.environ['MIRROR'])/'checkpoints'/'A'
          for p in src.rglob('*'):
              rel=p.relative_to(src); q=dst/rel
              if p.is_dir(): q.mkdir(parents=True,exist_ok=True)
              elif p.is_file():
                  q.parent.mkdir(parents=True,exist_ok=True)
                  q.symlink_to(p)
          PY
          set +e
          python3 ci/exp073fu_verify_and_prune_replica_v0_1.py --checkpoint-root "$MIRROR/checkpoints" --replica A >"$OUT/pruner_stdout.log" 2>"$OUT/pruner_stderr.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/exit_code.txt"
          MIRROR="$MIRROR" OUT="$OUT" ROOT="$ROOT" RC="$rc" python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=Path(os.environ['MIRROR'])/'checkpoints'/'A'; root=Path(os.environ['ROOT'])/'checkpoints'/'A'; out=Path(os.environ['OUT'])
          info={
            'classification':'READONLY_DIAGNOSTIC_PLUS_0_PLUS_0',
            'runner_name':os.environ.get('RUNNER_NAME'),
            'exit_code':int(os.environ['RC']),
            'original_checkpoint_mutated':False,
            'mirror_post_receipt_prune_created':(m/'post_receipt_prune.json').is_file(),
            'original_post_receipt_prune_exists':(root/'post_receipt_prune.json').is_file(),
            'mirror_remaining_symlink_count':sum(1 for p in m.rglob('*') if p.is_symlink()),
          }
          (out/'diagnostic_manifest.json').write_text(json.dumps(info,indent=2,sort_keys=True)+'\n')
          PY
          cat "$OUT/pruner_stdout.log" || true
          cat "$OUT/pruner_stderr.log" >&2 || true
          echo "DIAGNOSTIC_EXIT_CODE=$rc"
          if [ "$rc" -eq 0 ]; then echo PASS_EXP073FU_REPLICA_A_PRUNER_READONLY_REPRO_V0_1; fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp073fu-replica-a-pruner-readonly-diagnostic-v0-1
          path: ${{ runner.temp }}/exp073fu-pruner-diagnostic
          if-no-files-found: error
          retention-days: 30
