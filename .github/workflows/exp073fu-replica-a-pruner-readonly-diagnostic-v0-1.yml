name: Exp073FU replica-A repaired-pruner read-only validation v0.6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exp073fu-replica-a-pruner-readonly-diagnostic-v0-1.yml'

permissions:
  contents: read

env:
  EXPECTED_RUNNER_NAME: 'DSIR-HOME-PC-2'
  FU_PRUNER_V03_BLOB: 'b9ed7d7178424fb656b4a7c7bfb2ee370c751cb0'

jobs:
  validate-repaired-pruner:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema-repaired FU A-pruner on nonmutating symlink mirror
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$(git rev-parse HEAD:ci/exp073fu_verify_and_prune_replica_v0_2.py)" = "$FU_PRUNER_V03_BLOB"
          PATCH_PY="$HOME/.cache/dsir-nmt27-filebacked-read-v0-2/bin/python"
          test -x "$PATCH_PY"
          "$PATCH_PY" - <<'PY'
          import numpy,importlib.metadata
          v=importlib.metadata.version('pymaster'); assert v=='2.7' or v.startswith('2.7.'),v
          PY
          ROOT="$HOME/.cache/dsir/exp073fu-ww-s1-s3-filebacked-ab-v0-1"
          test -d "$ROOT/checkpoints/A"
          test ! -e "$ROOT/checkpoints/A/post_receipt_prune.json"
          ROOT="$ROOT" python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['ROOT'])/'checkpoints'/'A'/'fresh_sources_complete.json'
          o=json.loads(p.read_text())
          keys=('schema','stage','complete','replica','checkpoint_namespace','source_head','contract_fingerprint','historical_ww_numerical_import','other_replica_output_read')
          print('fresh_sources_identity='+json.dumps({k:o.get(k) for k in keys},sort_keys=True))
          PY
          MIRROR="$RUNNER_TEMP/exp073fu-pruner-v03-mirror"
          rm -rf "$MIRROR"; mkdir -p "$MIRROR/checkpoints/A"
          ROOT="$ROOT" MIRROR="$MIRROR" python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['ROOT'])/'checkpoints'/'A'; dst=Path(os.environ['MIRROR'])/'checkpoints'/'A'
          for p in src.rglob('*'):
              rel=p.relative_to(src); q=dst/rel
              if p.is_dir(): q.mkdir(parents=True,exist_ok=True)
              elif p.is_file(): q.parent.mkdir(parents=True,exist_ok=True); q.symlink_to(p)
          print('mirror_file_links='+str(sum(1 for p in dst.rglob('*') if p.is_symlink())))
          PY
          "$PATCH_PY" ci/exp073fu_verify_and_prune_replica_v0_2.py --checkpoint-root "$MIRROR/checkpoints" --replica A
          test -f "$MIRROR/checkpoints/A/post_receipt_prune.json"
          test ! -e "$ROOT/checkpoints/A/post_receipt_prune.json"
          echo original_checkpoint_mutated=false
          echo PASS_EXP073FU_REPLICA_A_REPAIRED_PRUNER_READONLY_VALIDATION_V0_6
