name: Exp073IJ C2 WW Angular Authority Admission v0.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp073ij-c2-ww-angular-authority-admission-v0-2.yml'
permissions:
  contents: read
  actions: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/dsir4/DSIR4_ANGULAR_AUTHORITY_BINDING_CONTRACT_V0_1.md)" = 'af2cdbfa03e0a68c24df8d1009c723d411d2d0a2'
          test "$(git hash-object docs/dsir4/authority/C2_WW_ANGULAR_AUTHORITY_RECEIPT_V0_3.json)" = '681503a7ac8376801e997f0e2e4ba2ebdace87da'
          test "$(git hash-object docs/dsir4/prereg/EXP073IJ_C2_WW_ANGULAR_AUTHORITY_ADMISSION_V0_2.md)" = '119369e38465f101b2ff04dafd1fe933beeacaf7'
      - name: Exact ten-pair authority and artifact admission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,tempfile,urllib.request,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; tok=os.environ['GH_TOKEN']
          R=json.loads(Path('docs/dsir4/authority/C2_WW_ANGULAR_AUTHORITY_RECEIPT_V0_3.json').read_text())
          assert R['schema']=='C2_WW_ANGULAR_AUTHORITY_RECEIPT_V0_3'
          assert R['angular_contract_blob']=='af2cdbfa03e0a68c24df8d1009c723d411d2d0a2'
          assert R['common']=={'semantics':'EE<-EE','dtype':'<f8','shape':[39,12288],'des_nside':4096,'ell_min':0,'ell_max':12287,'bands':39,'mcm_bytes':19327352832,'exact_equality_only':True}
          expected=['S0_S0','S0_S1','S0_S2','S0_S3','S1_S1','S1_S2','S1_S3','S2_S2','S2_S3','S3_S3']
          assert [a['pair'] for a in R['authorities']]==expected
          def api(url):
            q=urllib.request.Request(url,headers={'Authorization':f'Bearer {tok}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(q,timeout=60) as r:return r.read().decode()
          def curl(url):
            return subprocess.check_output(['curl','-fsSL','--retry','5','--retry-all-errors','-H',f'Authorization: Bearer {tok}','-H','Accept: application/vnd.github+json',url],timeout=180)
          def log(job):return curl(f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs').decode('utf-8','replace')
          ih=log(102147505217)
          assert 'PASS_EXP073IH_C2_G_DOMAIN_MAPPING_V0_1' in ih and 'G_DOMAIN_MAPPING=PASS' in ih
          for a in R['authorities']:
            p=a['pair']; low=p.lower(); left,right=p.split('_')
            assert a['relation']==('same_object' if left==right else 'ordered_distinct'),(p,'relation')
            run=json.loads(api(f"https://api.github.com/repos/{repo}/actions/runs/{a['run']}")); assert run['head_sha']==a['head'],(p,'head')
            jobs=json.loads(api(f"https://api.github.com/repos/{repo}/actions/runs/{a['run']}/jobs?per_page=100"))['jobs']
            assert any(j['id']==a['job'] and j['status']=='completed' and j['conclusion']=='success' for j in jobs),(p,'job')
            L=log(a['job'])
            assert a['token'] in L,(p,'token')
            assert 'SCIENTIFIC_AUTHORITY_ADMITTED' in L,(p,'classification')
            assert re.search(rf'["\s]*ww_{re.escape(low)}_authority_created["\s]*[:=][\s]*true',L,re.I),(p,'authority-created marker')
            meta=json.loads(api(f"https://api.github.com/repos/{repo}/actions/artifacts/{a['source_artifact']}"))
            assert meta['id']==a['source_artifact'] and meta['digest']==a['source_artifact_digest'] and meta['expired'] is False,(p,'artifact metadata')
            raw=curl(f"https://api.github.com/repos/{repo}/actions/artifacts/{a['source_artifact']}/zip")
            assert 'sha256:'+hashlib.sha256(raw).hexdigest()==a['source_artifact_digest'],(p,'zip digest')
            with tempfile.NamedTemporaryFile(suffix='.zip') as f:
              f.write(raw); f.flush()
              with zipfile.ZipFile(f.name) as z:
                hits=[]; evidence=b''
                for n in z.namelist():
                  if n.endswith('/'):continue
                  info=z.getinfo(n)
                  if info.file_size==39*12288*8 and n.endswith('selected_ee.bin'): hits.append(hashlib.sha256(z.read(n)).hexdigest())
                  if n.endswith('.json') and info.file_size<2000000: evidence += b'\n'+z.read(n)
                assert hits and all(h==a['canonical_sha256'] for h in hits),(p,'canonical',hits,a['canonical_sha256'])
                assert len(set(hits))==1,(p,'A/B canonical mismatch')
                E=(L.encode('utf-8','replace')+b'\n'+evidence).decode('utf-8','replace')
                assert '19327352832' in E,(p,'exact file-backed MCM bytes')
                assert ('mcm_filebacked' in E or 'filebacked' in E.lower()),(p,'file-backed MCM marker')
                assert 'EE<-EE' in E,(p,'EE semantics')
                assert '<f8' in E,(p,'dtype')
                assert '39' in E and '12288' in E,(p,'canonical shape')
            print('BOUND',p,a['run'],a['job'],a['source_artifact'],a['canonical_sha256'],len(hits))
          print('PASS_EXP073IJ_C2_G_ANGULAR_AUTHORITY_V0_2')
          print('classification=SCIENTIFIC_GATE_PASS')
          print('G_DOMAIN_MAPPING=PASS')
          print('G_ANGULAR_AUTHORITY=PASS')
          print('angular_authority_receipt_created=true')
          print('scientific_model_authority_created=false')
          print('overall_status=NOT_YET_TESTABLE')
          PY
